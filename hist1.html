<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">

<title>歷史 序章＋L1 國家與社會</title>
<meta name="theme-color" content="#4f46e5">

<style>
/* 設計基準同英文站：8px 網格｜灰階分層｜Indigo 唯一強調色 */
:root{
  --accent:#4f46e5; --accent-ink:#4338ca; --accent-soft:#eef2ff; --accent-line:rgba(79,70,229,.18);
  --bg:#f7f7f8; --surface:#ffffff; --surface-2:#f4f4f5; --line:#e4e4e7;
  --ink:#18181b; --ink-2:#52525b; --ink-3:#a1a1aa;
  --ok:#15803d; --ok-soft:#f0fdf4; --ng:#b91c1c; --ng-soft:#fef2f2; --warn:#a16207; --warn-soft:#fefce8;
  --r-sm:8px; --r-md:12px; --r-lg:16px;
  --sh-1:0 1px 2px rgba(24,24,27,.04),0 1px 3px rgba(24,24,27,.06);
  --sh-2:0 8px 24px rgba(24,24,27,.08),0 2px 6px rgba(24,24,27,.04);
  --ease:cubic-bezier(.2,.8,.2,1); --pad:16px;
}
@media (prefers-color-scheme: dark){
  :root{ --accent:#818cf8; --accent-ink:#a5b4fc; --accent-soft:rgba(129,140,248,.14); --accent-line:rgba(129,140,248,.28);
    --bg:#0c0c0e; --surface:#18181b; --surface-2:#232328; --line:#2e2e34;
    --ink:#f4f4f5; --ink-2:#a1a1aa; --ink-3:#71717a;
    --ok:#4ade80; --ok-soft:rgba(74,222,128,.10); --ng:#f87171; --ng-soft:rgba(248,113,113,.10); --warn:#facc15; --warn-soft:rgba(250,204,21,.10);
    --sh-1:0 1px 2px rgba(0,0,0,.4); --sh-2:0 8px 24px rgba(0,0,0,.5); }
}
@media (min-width:600px){ :root{ --pad:24px; } }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;-webkit-font-smoothing:antialiased}
#app{max-width:720px;margin:0 auto;padding:0 16px 96px}
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;margin:0 -16px 8px;padding:16px;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
header.top h1{font-size:20px;font-weight:700;letter-spacing:-.01em;margin:0;flex:1;line-height:1.3}
header.top .back{width:40px;height:40px;flex:none;border:0;border-radius:50%;background:var(--surface);color:var(--ink);font-size:18px;cursor:pointer;box-shadow:var(--sh-1)}
header.top .back:active{transform:scale(.92)}
h2{font-size:13px;font-weight:600;letter-spacing:.06em;color:var(--ink-3);margin:32px 0 16px}
h3{font-size:16px;font-weight:600;margin:24px 0 8px}
p{margin:8px 0 16px}
.sub{color:var(--ink-2);font-size:14px}
.muted{color:var(--ink-3);font-size:14px}
b{font-weight:600}
.card{background:var(--surface);border-radius:var(--r-lg);padding:var(--pad);margin:16px 0;box-shadow:var(--sh-1)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;border:0;border-radius:var(--r-lg);padding:16px;background:var(--surface);color:var(--ink);box-shadow:var(--sh-1);cursor:pointer;font:inherit;min-height:112px;transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
.tile:active{transform:scale(.97)}
.tile .ic{font-size:24px}
.tile b{font-size:15px;line-height:1.3}
.tile small{color:var(--ink-3);font-size:12px;line-height:1.4}
.tile.done{border:2px solid var(--ok)}
.btn{display:inline-block;width:100%;margin:8px 0 0;padding:14px 16px;border:0;border-radius:var(--r-md);background:var(--accent);color:#fff;font:inherit;font-weight:600;font-size:16px;cursor:pointer;transition:transform .15s var(--ease)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:var(--surface);color:var(--accent);border:1px solid var(--accent-line)}
.btn.sm{width:auto;padding:8px 14px;font-size:14px;margin:4px 8px 4px 0}
.row{display:flex;gap:8px;align-items:center}
.prog{height:4px;background:var(--line);border-radius:2px;margin:8px 0 16px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent)}
.steps{display:flex;gap:6px;margin:8px 0 16px;flex-wrap:wrap}
.steps span{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--ink-3)}
.steps span.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.steps span.ok{background:var(--ok-soft);color:var(--ok)}
/* 重點卡 */
.flash{min-height:260px;display:flex;flex-direction:column;justify-content:center}
.flash .t{font-size:22px;font-weight:700;margin:0 0 12px;color:var(--accent-ink)}
.flash .zh{font-size:17px;margin:0 0 16px}
.flash .why{font-size:14px;color:var(--ink-2);background:var(--warn-soft);border-radius:var(--r-sm);padding:10px 12px}
.flash .why::before{content:"考什麼：";font-weight:600;color:var(--warn)}
/* 選項與排序／配對 */
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);color:var(--ink);font:inherit;font-size:16px;cursor:pointer;line-height:1.5}
.opt:active{transform:scale(.99)}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ng{border-color:var(--ng);background:var(--ng-soft)}
.opt:disabled{cursor:default;opacity:.85}
.chips{display:flex;flex-wrap:wrap;gap:8px;min-height:48px;padding:8px;border:1px dashed var(--line);border-radius:var(--r-md);margin:8px 0}
.chip{padding:10px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font:inherit;font-size:15px;cursor:pointer;color:var(--ink)}
.chip.on{border-color:var(--accent);background:var(--accent-soft)}
.chip.ok{border-color:var(--ok);background:var(--ok-soft)}
.chip.ng{border-color:var(--ng);background:var(--ng-soft)}
.chip .n{display:inline-block;min-width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;text-align:center;line-height:20px;margin-right:6px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cols .chip{display:block;width:100%;text-align:left;border-radius:var(--r-md)}
.pairs .chip{display:block;width:100%;text-align:left;border-radius:var(--r-md);margin:6px 0}
.verdict{font-size:22px;font-weight:700;margin:16px 0 8px}
.verdict.ok{color:var(--ok)} .verdict.ng{color:var(--ng)}
.ex{background:var(--surface-2);border-radius:var(--r-sm);padding:12px;font-size:15px;margin:8px 0}
.ex .src{display:block;font-size:12px;color:var(--ink-3);margin-top:6px}
.cardref{border-left:3px solid var(--accent);padding:8px 12px;margin:8px 0;background:var(--accent-soft);border-radius:0 var(--r-sm) var(--r-sm) 0;font-size:15px}
.cardref b{display:block;color:var(--accent-ink)}
.big{font-size:40px;font-weight:700;text-align:center;margin:8px 0}
.list{padding-left:20px;margin:8px 0}
.list li{margin:6px 0}
</style>
</head>

<script>
const D = {"app": "n8v5", "days": [{"id": 1, "title": "第 1 天｜史前到商周：從部落到國家", "page": "講義 p.1–3、課本 p.72–76", "intro": "沒有文字的史前時代怎麼分期、傳說裡的三皇五帝、第一個王朝夏，然後是商的甲骨文、西周的封建。今天把「誰先誰後」和三個制度名詞弄清楚。", "cards": [{"t": "史前 vs 歷史時代", "zh": "用「有沒有文字」分：沒有文字＝史前時代，有文字＝歷史時代。用「器物」分：舊石器 → 新石器 → 金屬器時代。", "why": "考「甲骨文證明商代進入什麼時代」→ 有文字的歷史時代。"}, {"t": "舊石器時代", "zh": "打製石器、採集和捕獵、會用火、沒有陶器、常常搬家。代表：北京人、山頂洞人。", "why": "考「鑽木取火的燧人氏在哪個時代」→ 舊石器；考「北京人」→ 舊石器。"}, {"t": "新石器時代＝新石器革命", "zh": "距今約一萬年前。磨製石器、有陶器、畜牧和農耕、開始定居。代表：仰韶、龍山（黃河流域）、河姆渡（長江流域）。意義：進入「產食時代」，人有空做文化創造；中國文明「多元並立」。", "why": "考「神農氏教種田最早出現在哪個時代」→ 新石器；考「新石器革命的意義」→ 進入產食時代。"}, {"t": "三皇五帝（傳說）", "zh": "三皇：燧人氏鑽木取火、伏羲氏養家畜、神農氏種田嘗百草。五帝：黃帝（打敗蚩尤、部落聯盟共主、後代自稱炎黃子孫）、顓頊、帝嚳、堯、舜。部落散居 → 聯盟 → 國家。", "why": "考傳說人物對應生活方式：穴居→巢居、生食→熟食、漁獵→畜牧農耕。"}, {"t": "夏：第一個王朝", "zh": "禹定都安邑（今山西）建夏，禹死後兒子啟繼位，王位從此「世襲」＝家天下。傳到桀，被東方的商滅掉。河南二里頭文化可能是夏晚期遺址，但還沒有出土文字可以證明。", "why": "考「中國史上第一個王朝」→ 夏；考「夏存在的證據」→ 尚無文字。"}, {"t": "商：甲骨文、青銅器", "zh": "西元前 16 世紀商湯滅桀（商湯革命），用分封承認舊勢力、維持共主地位。盤庚定都殷（今河南安陽）後不再搬家，所以叫殷商。甲骨文（刻在龜甲獸骨上的占卜文字）證明商已有文字；用青銅器祭祀祖先。最後紂王征戰不斷，被西方的周滅掉。", "why": "考「甲骨文的意義」→ 發展成今天的漢字；考「祭祀祖先、青銅器的『他們』」→ 商周的貴族。"}, {"t": "西周：封建", "zh": "周武王滅商，定都鎬京（今西安）。武王死後周公攝政、東征平亂、營建東都洛邑。封建＝周王把土地和人民分給諸侯建國：宗族親戚（魯）、功臣姻親（齊）、殷商後裔（宋）。諸侯在封國內很自主，但要聽周王的命令、保衛王室。", "why": "最常考！毛公鼎冊封 → 給爵位也給「土地」；「周朝用什麼制度管理新得到的土地」→ 分封授土地人民。"}, {"t": "宗法：嫡長子繼承", "zh": "用血緣親疏決定尊卑：正妻生的長子（嫡長子）繼承，是大宗；其他兒子是小宗。社會階級：貴族（天子、諸侯、大夫、士）、平民、奴隸，身分世襲不變。", "why": "考「冊封繼承人確立世襲身分」→ 宗法；考「封建要靠什麼配合才運作」→ 宗法血緣＋禮樂。"}, {"t": "禮樂：規範貴族", "zh": "祭祀、宴飲、喪葬等禮儀配上音樂舞蹈，規範貴族的行為和生活方式，穩定封建秩序。鼎是儀式的重要器物：天子九鼎、諸侯七鼎、大夫五鼎。", "why": "考「青銅鼎是封建體制的哪一層面」→ 禮樂規範；考「貴族可以不守禮樂」→ 錯。"}, {"t": "西周滅亡 → 東周", "zh": "西周末年周幽王破壞宗法（改立繼承人），諸侯聯合犬戎攻進鎬京，幽王被殺。平王把首都遷到洛邑，史稱東周，王室從此沒力量。", "why": "順序題：犬戎之禍、平王東遷是西周→東周的分界（西元前 770 年）。"}], "order": {"title": "把這 8 件事排出先後", "hint": "從最早的開始點，點錯可以點答案區的卡片退回去。", "items": ["北京人打製石器、採集漁獵", "仰韶、龍山人磨製石器、種田定居", "黃帝打敗蚩尤成為部落共主", "禹建夏，啟繼位，家天下", "商湯滅桀", "盤庚定都殷（安陽）", "周武王滅商，定都鎬京", "犬戎殺幽王，平王東遷洛邑"]}, "match": {"title": "名詞配對：這是哪個制度／哪個時代", "hint": "左邊一個、右邊一個，點兩下就配成一組。", "pairs": [["封建", "把土地、人民分給諸侯建國"], ["宗法", "嫡長子繼承，血緣定尊卑"], ["禮樂", "規範貴族行為，天子九鼎"], ["舊石器時代", "打製石器，北京人"], ["新石器時代", "磨製石器、農耕定居，仰韶龍山"], ["甲骨文", "商代刻在龜甲獸骨上的占卜文字"]]}, "main": ["h1_1", "h1_2", "h1_3", "h1_4", "h1_5", "h1_6", "h1_7", "e112_18", "e112_19", "e113_18"], "pool": ["e114_18", "c_4"]}, {"id": 2, "title": "第 2 天｜東周到秦：封建瓦解、帝國建立", "page": "講義 p.3–5、課本 p.77–79", "intro": "周天子沒力了，諸侯打成一團，平民反而有機會出頭；最後秦王嬴政統一天下，用郡縣制把權力全收到皇帝手上。今天的重點是「封建 vs 郡縣」。", "cards": [{"t": "東周＝春秋＋戰國", "zh": "平王東遷後王室衰微、諸侯坐大，封建秩序瓦解。前期叫春秋：周天子有名無實，諸侯稱霸（齊桓公靠管仲「尊王攘夷」成第一個霸主）。後期叫戰國：諸侯直接稱王，戰國七雄＝韓、趙、魏、齊、楚、燕、秦。", "why": "考「諸侯紛紛稱霸」→ 春秋；考「出身決定一切的局面轉變」→ 東周。"}, {"t": "商鞅變法", "zh": "戰國時秦孝公用商鞅變法：厲行法治、按軍功授爵（不看出身）、編列戶籍（以家戶為單位把人民登記起來，方便收稅、徵兵、徵勞役）、獎勵耕織、法令貴族平民一體遵守。秦因此富強，為統一打底。", "why": "最常考！「戶籍的目的」→ 掌握人口以徵稅徵兵；「東周想當官該怎麼做」→ 追隨商鞅、讀書遊說、建軍功，不是幫貴族。"}, {"t": "私人講學、平民崛起", "zh": "西周只有貴族能受教育。東周有些貴族流落民間，靠辦學維生（孔子是第一位，有教無類、因材施教），平民受教育的機會增加。各國國君用人唯才，布衣可以當卿相（蘇秦、張儀、范雎），平民崛起、貴族沒落，社會流動變頻繁。", "why": "考「研究人民的歷史」；考「平民參政、社會階層流動開始於何時」→ 東周。"}, {"t": "諸子百家四家", "zh": "儒家：孔子講「仁」、孟子性善「民貴君輕」、荀子性惡用「禮」。道家：老子清靜無為、莊子用寓言。墨家：墨子兼愛、非攻、節用。法家：韓非用法律、權術、威勢，站在君主立場，秦採用。", "why": "考「百家爭鳴 → 焚書坑儒 → 獨尊儒術」的歷史意義 → 思想趨向統一。"}, {"t": "秦統一、始皇帝", "zh": "西元前 221 年秦王嬴政滅六國，定都咸陽，首創「皇帝」稱號，自稱始皇帝。以法家思想治國。這是中國史上第一個中央集權的帝國。", "why": "考「西元前 221 年統一有何重要性」→ 建立中央集權的帝國；考「改用皇帝稱號、嚴法、大工程、走向滅亡的君主」→ 秦始皇。"}, {"t": "郡縣制＝中央集權", "zh": "廢掉封建，全國分郡、縣，長官由皇帝直接任免、不能世襲。對照：封建＝周王是名義上的共主，分封諸侯間接管地方，官吏世襲；郡縣＝皇帝中央集權，派官直接管地方，官吏中央派任。", "why": "最常考對照！「地方長官怎麼產生」→ 封建：天子分封、諸侯世襲；郡縣：皇帝派任、不世襲。"}, {"t": "統一文字貨幣度量衡", "zh": "統一文字（小篆）、貨幣（半兩錢）、車軌、度量衡，修馳道，方便各地經濟文化交流。焚書坑儒控制思想（只留醫藥、占卜、種樹的書）。把燕、趙、秦的舊長城連起來，西起臨洮、東到遼東，擋匈奴。", "why": "考「縣官中央派任、用小篆寫字、被派去修長城」→ 秦；關係圖「郡縣＋度量衡＋皇帝＋文字＋馳道」→ 中央集權的奠基。"}, {"t": "秦的滅亡、楚漢相爭", "zh": "嚴刑峻法、勞役人民（長城、陵墓、馳道）大失民心。秦二世時陳勝吳廣起義，各地反秦，項羽的楚軍和劉邦的漢軍最強。楚漢相爭四年多，劉邦勝＝漢高祖，史上第一位平民皇帝。秦的中央集權體制被漢沿用。", "why": "考「秦為何速亡」→ 嚴苛、勞民傷財；考「中央集權體制誰沿用」→ 漢。"}], "order": {"title": "把這 8 件事排出先後", "hint": "從最早的開始點。", "items": ["平王東遷洛邑，東周開始", "齊桓公尊王攘夷，春秋第一個霸主", "孔子辦學，有教無類", "戰國七雄並立，秦孝公用商鞅變法", "秦王嬴政滅六國，自稱始皇帝", "焚書坑儒、修長城", "陳勝吳廣起義", "楚漢相爭，劉邦勝"]}, "match": {"title": "人物配事蹟", "hint": "左邊一個人、右邊一件事。", "pairs": [["齊桓公", "管仲輔佐，尊王攘夷"], ["孔子", "第一位私人講學，有教無類"], ["商鞅", "編列戶籍、按軍功授爵"], ["韓非", "法、術、勢，集法家大成"], ["李斯", "建議推行郡縣，反對再封諸侯"], ["秦始皇", "首創皇帝稱號，統一文字度量衡"], ["劉邦", "楚漢相爭獲勝，第一位平民皇帝"]]}, "main": ["h1_8", "h1_9", "h12_1", "c_1", "c_2", "c_3", "c_5", "c_8", "e112_20", "e112_22"], "pool": ["h12_3", "r_1", "r_2", "r_3", "e112_21", "e112_23", "e113_19", "e113_21", "e114_19", "e114_28", "e114_29"]}, {"id": 3, "title": "第 3 天｜選才制度：察舉 → 九品 → 科舉 ＋ 總複習", "page": "講義 p.5–7、課本 p.80–83", "intro": "皇帝要靠官員治國，怎麼選官就變成大事：漢代推薦、魏晉看家世、隋唐考試。最後把前兩天錯的再練一次。", "cards": [{"t": "秦：法令人才", "zh": "秦代由政府指派地方官吏訓練學生讀寫，選用熟悉法令規章的人才。", "why": "考「秦漢到隋唐選才順序」→ 熟悉法令的人才 → 察舉 → 九品官人之法 → 科舉。"}, {"t": "漢代察舉", "zh": "漢武帝推崇儒家，實施察舉：要求地方長官定期向政府推舉「孝子」和「廉吏」（孝順、廉能），經朝廷考核後任官。", "why": "考「地方長官推舉人才」→ 察舉；考「漢武帝時當官的條件」→ 被推薦孝廉＋熟讀儒家經典。"}, {"t": "太學 → 世家大族", "zh": "漢武帝設太學，教儒家經典，優秀學生可以任官，是古代最高學府（隋代改叫國子監）。熟讀經典變成當官的門路，士人把經書見解傳給子弟，形成「經學傳家、累世當官」的世家大族（東漢）。", "why": "考「世族怎麼形成」→ 察舉、太學讓經學傳家；順序題：東漢世族形成。"}, {"t": "九品官人之法", "zh": "東漢末年戰亂，地方推不出人才。曹魏改由中央派官（中正官）到各地，按家世、才能、品德評成九品來任官。後來只看家世 → 「上品無寒門，下品無世族」。魏晉南北朝世族掌握政權、免賦稅免勞役、擁有大量土地，皇帝也要讓步。", "why": "最常考！「上品無寒門」的出處；「魏晉世族地位崇高的主因」→ 九品官人之法重家世；「九品實施三百年的影響」→ 鞏固世族、社會階層缺乏流動。"}, {"t": "隋唐科舉", "zh": "隋文帝為了削弱世族，廢九品官人之法，改科舉：士人自己報名考試，考上就任官。之後各朝沿用到清末（光緒年間廢除）。平民可以憑努力當官，促進社會階層流動，也帶動讀書風氣；世族逐漸沒落。", "why": "考「十年寒窗無人問，一舉成名天下知」→ 科舉；考「舊時王謝堂前燕」世族沒落 → 九品官人之法廢除；「科舉讓世族壟斷官職」是錯的。"}, {"t": "世族興衰三階段", "zh": "東漢：世族形成（經學傳家、累世當官）→ 魏晉南北朝：世族鼎盛（上品無寒門，下品無世族）→ 隋到唐末：世族沒落（科舉實施，逐漸退出政治舞臺）。", "why": "考曲線圖（東漢上升、魏晉最高、隋唐下降）→ 世族興衰趨勢示意圖；考「鼎盛與沒落各因哪個制度」→ 九品官人之法、科舉。"}, {"t": "東晉的世族", "zh": "西晉亡後司馬睿在南方建東晉，靠世族王導支持，當時說「王與馬，共天下」。從北方逃來的叫「僑姓」（王、謝、袁、蕭），東南本地的叫「吳姓」（朱、張、顧、陸）。世族通婚講究門當戶對；北魏孝文帝推動胡漢世族通婚；唐代以後世族影響力衰微。", "why": "課後閱讀：考「王與馬共天下」→ 東晉皇帝要靠世族；考劉禹錫詩「舊時王謝堂前燕」→ 世族沒落。"}], "order": {"title": "選才制度的先後", "hint": "從最早的開始點。", "items": ["秦：選用熟悉法令規章的人才", "漢武帝：察舉孝廉、設太學", "東漢：經學傳家，世族形成", "曹魏：九品官人之法", "魏晉南北朝：上品無寒門，下品無世族", "隋文帝：廢九品，改科舉", "清末光緒：廢除科舉"]}, "match": {"title": "制度配特色", "hint": "左邊一個、右邊一個。", "pairs": [["察舉", "地方長官定期推舉孝子、廉吏"], ["太學", "漢武帝設立，教儒家經典"], ["九品官人之法", "曹魏開始，中正官按家世、才能、品德評等"], ["科舉", "隋代開始，士人報名考試，用到清末"], ["世族形成（東漢）", "經學傳家、累世當官"], ["世族鼎盛（魏晉南北朝）", "上品無寒門，下品無世族"], ["世族沒落（隋唐）", "科舉實施後逐漸退出政治舞臺"]]}, "main": ["h12_2", "h12_4", "h12_6", "h12_7", "c_6", "c_7", "b_1", "b_3", "e112_27", "e114_20"], "pool": ["h12_5", "b_2", "e112_28", "e113_23", "e114_21", "e114_22", "e114_23"]}], "questions": [{"id": "h1_1", "src": "講義 L1 隨堂 1", "q": "每個民族都有屬於自己的傳說故事，相傳中國古代燧人氏教人鑽木取火，神農氏教人種植穀物。若對照歷史發展，上述神農氏的行為最早可能出現於下列哪一時代？", "o": ["舊石器時代", "新石器時代", "青銅器時代", "鐵器時代"], "a": 1, "ex": "種田（農耕）是新石器時代才開始的事；舊石器時代只會採集、捕獵。", "card": "新石器時代＝新石器革命"}, {"id": "h1_2", "src": "講義 L1 隨堂 2", "q": "人類進入新石器時代以後有許多重大的變革，而有「新石器革命」之稱，其主要意義為何？", "o": ["已知用火取暖、照明與熟食，使生命得以延長", "開始使用文字，明確記載當時人們的各種活動", "進入產食時代，人們開始有餘暇從事文化創造", "發展嚴密的軍事及國家組織，保障群體的安全"], "a": 2, "ex": "新石器革命＝從「找食物」變成「生產食物」（畜牧、農耕），有空才能創造文化。用火是舊石器就會的；文字要到商代。", "card": "新石器時代＝新石器革命"}, {"id": "h1_3", "src": "講義 L1 隨堂 3", "q": "國學大師錢穆曾說：「周朝偏於倫理，偏於政治，……然後始成治道。」根據你對歷史的知識，大師所說的最有可能是西周的哪一項制度？", "o": ["中央集權", "封建體制", "部落聯盟", "禮樂規範"], "a": 1, "ex": "「倫理」（宗法血緣）＋「政治」（分封諸侯）合在一起就是西周的封建體制。中央集權是秦以後的事。", "card": "西周：封建"}, {"id": "h1_4", "src": "講義 L1 隨堂 4", "q": "「他們認為神明、祖先時時刻刻操縱人的禍福安危，因此需要向他們祭享、祈求；他們大多使用青銅鑄造的祭器，用來象徵身分與地位。這種祭祀祖先的習俗也為後世所沿襲。」文中的「他們」最可能是下列何者？", "o": ["商周的貴族", "遠古的族長", "商周的平民", "遠古的平民"], "a": 0, "ex": "青銅祭器＋祭祀祖先＋象徵身分＝商周的貴族。平民用不起青銅器。", "card": "商：甲骨文、青銅器"}, {"id": "h1_5", "src": "講義 L1 隨堂 5", "q": "文字的發明與使用是人類社會進入文明的指標之一。中國文字中的甲骨文，在中國文字的發展具有下列哪一項重要的意義？", "o": ["是夏朝所使用的文字", "發展成為今天的漢字", "是中國最早出現的文字", "表現出原始的圖畫意義"], "a": 1, "ex": "甲骨文是商代的文字，一路演變成今天的漢字。夏朝還沒有出土文字。", "card": "商：甲骨文、青銅器"}, {"id": "h1_6", "src": "講義 L1 隨堂 6", "q": "歷史老師要四位同學說明西周政治社會制度的特色。甲：社會階級畫分嚴明。乙：透過血緣親疏確立尊卑關係。丙：貴族不用遵守禮樂的規範。丁：周代的分封以同姓和姻親諸侯為主。請問：哪一位同學說錯了？", "o": ["甲", "乙", "丙", "丁"], "a": 2, "ex": "禮樂就是用來規範「貴族」的行為，貴族當然要遵守。", "card": "禮樂：規範貴族"}, {"id": "h1_7", "src": "講義 L1 隨堂 7", "q": "周代的青銅器常為貴族身分的象徵，如「天子九鼎，諸侯七鼎，大夫五鼎」，這屬於封建體制中的哪一個層面？", "o": ["土地分封", "宗法血緣", "官職授予", "禮樂規範"], "a": 3, "ex": "用幾個鼎是禮儀的規定，屬於禮樂規範。", "card": "禮樂：規範貴族"}, {"id": "h1_8", "src": "講義 L1 隨堂 8", "q": "「西元前 221 年，秦王嬴政滅六國，統一天下。」以上這段史實對中國的國家型態演變有何重要性？", "o": ["形成封建王朝", "以共主身分統治各地", "建立中央集權的帝國", "以倫理道德治國"], "a": 2, "ex": "秦統一後廢封建、行郡縣，第一次把全國權力集中到皇帝手上。", "card": "秦統一、始皇帝"}, {"id": "h1_9", "src": "講義 L1 隨堂 9", "q": "小玉看電視，聽不懂民意代表以閩南語、客家語表達的意見，幸好能從電視螢幕上的文字了解他們發言的內容。這種以文字彌補語言分歧的障礙，應與哪一位歷史人物的措施有關？", "o": ["孔子", "商鞅", "蘇秦", "嬴政"], "a": 3, "ex": "秦始皇（嬴政）統一文字，各地語言不同也能用同樣的字溝通。", "card": "統一文字貨幣度量衡"}, {"id": "h12_1", "src": "講義 1-2 隨堂 1", "q": "春秋到漢初的學術發展，從「百家爭鳴」歷經「焚書坑儒」到「獨尊儒術」，呈現出何種歷史意義？", "o": ["平民地位提升", "學術獨立自由", "文化多元發展", "思想趨向統一"], "a": 3, "ex": "從很多家 → 燒書 → 只留儒家，思想越來越統一。", "card": "諸子百家四家"}, {"id": "h12_2", "src": "講義 1-2 隨堂 2", "q": "在臺灣，想成為政府官員必須經過高普考試或選舉。如果身在漢武帝時期，必須具備哪些條件才能成為國家的官員？甲、由地方長官向中央推薦孝子廉吏；乙、經過國家科舉考試通過；丙、必須精通佛家經典；丁、熟讀儒家經典。", "o": ["甲乙", "甲丙", "甲丁", "乙丁"], "a": 2, "ex": "漢武帝時靠察舉（推薦孝廉）和太學（讀儒家經典）。科舉是隋代才有；佛教西漢末才傳入。", "card": "漢代察舉"}, {"id": "h12_3", "src": "講義 1-2 隨堂 3", "q": "歷史課時，老師請同學想像自己身處該朝代，並說出生活經驗。甲：「我是新任的縣官，是由中央直接派任的。」乙：「我們統一使用一種文字『小篆』來寫作。」丙：「我被派遣到寒冷的北方去修建萬里長城。」請問：老師正在介紹哪一個時代？", "o": ["商", "周", "秦", "漢"], "a": 2, "ex": "縣官中央派任（郡縣制）＋小篆＋修長城＝秦。", "card": "統一文字貨幣度量衡"}, {"id": "h12_4", "src": "講義 1-2 隨堂 4", "q": "中國歷史上曾出現許多形容當代社會現象的語彙，如西晉時期的「上品無寒門，下品無世族」。請問：這個語彙的出現應該與哪個選才制度的施行有關？", "o": ["九品官人之法", "推舉孝廉", "科舉制度", "封建制度"], "a": 0, "ex": "九品官人之法後來只看家世，家世好的才拿到上品。", "card": "九品官人之法"}, {"id": "h12_5", "src": "講義 1-2 隨堂 5", "q": "唐朝劉禹錫詩：「朱雀橋邊野草花，烏衣巷口夕陽斜，舊時王謝堂前燕，飛入尋常百姓家。」類似王、謝這些世家大族的沒落，除與政治上的動亂有關外，亦與下列哪一項制度的廢除有關？", "o": ["封建體制", "察舉選才辦法", "九品官人之法", "科舉制度"], "a": 2, "ex": "九品官人之法是世族的靠山，隋代廢掉它改科舉，世族就慢慢沒落了。", "card": "東晉的世族"}, {"id": "h12_6", "src": "講義 1-2 隨堂 6", "q": "「十年寒窗無人問，一舉成名天下知。」此一諺語，是哪一種選才任官制度建立後，才可能開始流傳？", "o": ["西周的封建制度", "漢朝的察舉制度", "魏晉的九品官人法", "隋唐以來的科舉制度"], "a": 3, "ex": "苦讀十年然後考試成名，就是科舉。", "card": "隋唐科舉"}, {"id": "h12_7", "src": "講義 1-2 隨堂 7", "q": "中國史上曾有段時間出現世家大族掌握政權，且形成社會上的特殊階級，世族政治的「鼎盛」與「沒落」各導因於哪一制度？", "o": ["九品官人法、科舉制度", "科舉制度、九品官人法", "察舉制度、科舉制度", "察舉制度、九品官人法"], "a": 0, "ex": "九品官人法讓世族鼎盛，科舉讓世族沒落。", "card": "世族興衰三階段"}, {"id": "c_1", "src": "歷屆會考 1（111 會考，改）", "q": "一份中國歷史上的官方文件記載：「建初十二年（416 年）正月，某縣某里一戶人家的戶主、妻子、兒子、女兒的姓名與年齡。」根據內容判斷，當時政府製作此官方文件的主要目的最可能為下列何者？", "o": ["配合科舉選拔人才，促進社會的流動", "掌握人力作為徵集賦稅和勞役的依據", "推行封建制度並保障貴族世襲的權力", "根據儒家思想，實施以仁為政的措施"], "a": 1, "ex": "登記每家每口＝戶籍，目的是收稅、徵兵、徵勞役。原題附文件圖片，這裡改成文字。", "card": "商鞅變法"}, {"id": "c_2", "src": "歷屆會考 2（改）", "q": "小惠在筆記上畫了一幅關係圖，中間的「？」連著五件事：實施郡縣制、統一度量衡與貨幣、使用「皇帝」稱號、統一文字、興建馳道並統一車軌。「？」是筆記的主題，根據內容判斷，此主題應為下列何者？", "o": ["封建制度的推動", "科舉制度的建立", "中央集權的奠基", "九品官人之法的實施"], "a": 2, "ex": "這五件事都是秦始皇把權力收到中央的做法。", "card": "郡縣制＝中央集權"}, {"id": "c_3", "src": "歷屆會考 3", "q": "有位學者在演講稿中寫到：「在此以前的中國，只是一種封建的統一。直到此時，中央方面才有一個更正式的統一政府，其所轄各地，不再是封建性的諸侯列國並存，而是緊密隸屬於中央的郡縣制行政區分了。」他所說的「此時」最可能是指下列何時？", "o": ["隋唐", "魏晉南北朝", "商周", "秦代"], "a": 3, "ex": "諸侯列國 → 郡縣，就是秦統一的那一刻。", "card": "郡縣制＝中央集權"}, {"id": "c_4", "src": "歷屆會考 4", "q": "封建體制是鞏固周代政治社會秩序的主要力量，但當時仍須以禮樂配合下列何者，才得以維繫運作？", "o": ["九品官人之法", "察舉選才辦法", "郡縣制度", "宗法血緣"], "a": 3, "ex": "封建靠宗法（血緣）和禮樂（規範）撐著，三個一組。", "card": "宗法：嫡長子繼承"}, {"id": "c_5", "src": "歷屆會考 5（改）", "q": "上課時老師用兩張地圖的變化說明某位君主的改革：左圖上同一片土地分成好幾個諸侯國，右圖上這片土地已經統一，並畫上一個個「郡」。根據內容判斷，此君主最可能是下列何者？", "o": ["秦始皇", "唐太宗", "漢武帝", "清康熙帝"], "a": 0, "ex": "諸侯國變成郡＝秦始皇廢封建、行郡縣。原題是兩張地圖，這裡改成文字描述。", "card": "郡縣制＝中央集權"}, {"id": "c_6", "src": "歷屆會考 6", "q": "中國歷代選用人才的方式各有不同，九品官人之法在魏晉南北朝實施了三百多年，它對當時造成何種影響？", "o": ["出現布衣卿相，平民百姓獲得重用", "鞏固世族地位，社會階層缺乏流動", "建立書院制度，名儒講學蔚為風尚", "形成士紳階級，文人競相獵取功名"], "a": 1, "ex": "只看家世，世族越來越穩，平民上不去。", "card": "九品官人之法"}, {"id": "c_7", "src": "歷屆會考 7", "q": "魏晉南北朝時期政局雖然動盪不安，但是世族在社會上仍然維持崇高的地位，不受政局變動影響。下列哪一項是造成這種現象的主要原因？", "o": ["皇帝尊崇儒術，擴張書香世家勢力", "地方察舉孝廉，形成許多世族門閥", "九品官人之法，人才評選重視家世", "科舉考試公平，造成新的世族勢力"], "a": 2, "ex": "政權一直換，但九品官人之法一直看家世，世族就一直在。", "card": "九品官人之法"}, {"id": "c_8", "src": "歷屆會考 8", "q": "下列是一部歷史電影的部分劇情簡介：「一位好大喜功的君主，改用皇帝的稱號來榮耀自己偉大的功業，並採取嚴厲的法律措施以推行中央集權與文化統一政策，動用龐大的人力興建浩大的工程，然而卻因此走向滅亡之路。」這應是描述哪一位君主事蹟的電影？", "o": ["秦始皇", "漢武帝", "唐太宗", "清康熙帝"], "a": 0, "ex": "首創皇帝稱號＋嚴法＋大工程＋速亡＝秦始皇。", "card": "秦的滅亡、楚漢相爭"}, {"id": "r_1", "src": "講義 閱讀素養 1", "q": "秦滅六國後，朝廷討論是否重行封建。丞相王綰說：燕、齊、楚地處偏遠，如果不在此三地分封宗室，就無法真正被朝廷控制，建議分封諸子。廷尉李斯說：周王室分封不少姬姓公族，但後代因血緣疏遠紛紛割據，天子無力阻止；要使天下安寧只能推行郡縣制。秦始皇認同李斯，把天下分為三十六郡，每郡的長官由朝廷委任、不得世襲。請問：由兩位大臣的上奏內容判斷，他們在朝堂上所欲討論的應該是下列何者？", "o": ["中央集權的實施與發展", "社會階層的變動發展", "選才方式的差異比較", "統治制度的優劣比較"], "a": 3, "ex": "一個說封建好、一個說郡縣好，是在比較兩種統治制度。", "card": "郡縣制＝中央集權"}, {"id": "r_2", "src": "講義 閱讀素養 2", "q": "（承上文）由丞相王綰的建言「不在燕、齊、楚分封宗室就無法控制」，文中所提到的應該是仿照哪一個朝代的做法？", "o": ["商朝", "周朝", "秦朝", "隋朝"], "a": 1, "ex": "分封宗室到各地建國＝周朝的封建。", "card": "西周：封建"}, {"id": "r_3", "src": "講義 閱讀素養 3", "q": "（承上文）根據上文，秦始皇認同廷尉李斯是因為他提出什麼政策？", "o": ["世族社會的出現", "地方勢力的割據", "中央集權的形成", "君主立憲的實施"], "a": 2, "ex": "李斯主張郡縣、長官由中央派任＝中央集權。", "card": "郡縣制＝中央集權"}, {"id": "b_1", "src": "課本 學習會考 1", "q": "小軒整理三則資料：資料一「這種任官制度助長了世家大族勢力的發展，評選官員幾乎都被世族把持，只問門第不問才德，形成『上品無寒門，下品無世族』」；資料二「此制度有相對穩定的客觀標準，輕門第、重才學，任人唯賢，為寒門參加政權開闢道路」；資料三「這個制度是由地方長官進行推舉，經推舉的人員須經考核後任官」。此三則資料所敘述的制度，出現的先後次序為何？", "o": ["資料三 → 資料一 → 資料二", "資料二 → 資料三 → 資料一", "資料二 → 資料一 → 資料三", "資料三 → 資料二 → 資料一"], "a": 0, "ex": "資料三是察舉（漢）、資料一是九品官人之法（曹魏）、資料二是科舉（隋）。", "card": "世族興衰三階段"}, {"id": "b_2", "src": "課本 學習會考 2", "q": "（承上題）由資料一「評選官員被世族把持，只問門第」推斷，此制度出現的背景為何？", "o": ["由於對儒家思想的推崇，據此來選拔優秀人才入仕", "在國家統一後，為鞏固統治、加強中央集權而實施", "士人的創造性受束縛，阻礙了科技發展和社會進步", "東漢末年戰亂頻仍，知識分子四散遷徙，人才難覓"], "a": 3, "ex": "東漢末年天下大亂，地方推不出人，曹魏才改由中央派中正官去評。", "card": "九品官人之法"}, {"id": "b_3", "src": "課本 學習會考 3", "q": "（承上題）下列何者最符合資料二「輕門第、重才學，為寒門開闢道路」所述制度的特色？", "o": ["傳統的貴族階級制，僅出身名門的子弟才能參加", "此選才制度不論出身貧富，可通過考試取得官職", "其特點除了考試外，也是體能和軍事技能的測試", "起源於魏晉南北朝時期，一直延續到清中葉以後"], "a": 1, "ex": "科舉：不管出身，考試考過就能當官。科舉起於隋，用到清末。", "card": "隋唐科舉"}, {"id": "e112_18", "src": "112 段考 18", "q": "毛公鼎腹內刻有 500 字銘文，內容敘述周宣王冊封毛公的經過，毛公感念周王，因而鑄鼎紀事，傳給子孫永遠紀念。請問：周王在冊封毛公的儀式中，除了給予爵位封號以外，還一併給予毛公下列何者，為封建體制中的典型例子？", "o": ["樂器", "珠寶", "服飾", "土地"], "a": 3, "ex": "封建＝封土建國，冊封時給的是土地（和人民）。", "card": "西周：封建"}, {"id": "e112_19", "src": "112 段考 19", "q": "周人滅商之後，發展出「天命靡常，唯德是輔」的觀念：上天不會無條件支持某一個統治者，周王表現不好天命就會轉移。因此西周特別強調以制度來維繫統治。請問：該朝代透過冊封繼承人的儀式確立世襲的身分，使政權得以順利移轉的是下列哪一個制度？", "o": ["封建制度", "井田制度", "禮樂制度", "宗法制度"], "a": 3, "ex": "「誰來繼承」是宗法（嫡長子繼承）管的事。", "card": "宗法：嫡長子繼承"}, {"id": "e112_20", "src": "112 段考 20", "q": "湖北雲夢睡虎地出土的「秦墓竹簡」中，有一份資料記錄某平民的戶籍狀況，包括房屋、財產、人口、奴婢、牲畜等，鉅細靡遺。請問：由上述內容可以推論，當時政府推動戶籍制度的作用為何？（甲）建立封建制度（乙）民間講學資料（丙）作為徵兵依據（丁）作為課稅依據（戊）建立中央集權。", "o": ["甲丙丁", "丙丁戊", "乙丙丁", "乙丁戊"], "a": 1, "ex": "戶籍＝政府掌握每一戶的人和財產，用來徵兵、收稅，也讓中央直接管到每個人。", "card": "商鞅變法"}, {"id": "e112_21", "src": "112 段考 21（改）", "q": "圖 1 畫的是周王把土地分給諸侯的體制，圖 2 畫的是皇帝派任郡守、縣令的體制。請問：在這兩種不同的政治體制下，地方長官如何產生？", "o": ["圖 1 由天子分封，不得世襲；圖 2 是由地方選舉產生", "圖 1 是天子分封，諸侯世襲；圖 2 是皇帝分封，官位世襲", "圖 1 是諸侯派任，不得世襲；圖 2 是郡守派任，不得世襲", "圖 1 是天子分封，諸侯世襲；圖 2 是天子任命，不得世襲"], "a": 3, "ex": "封建：天子分封、諸侯世襲；郡縣：皇帝任命、不世襲。原題附兩張示意圖，這裡改成文字。", "card": "郡縣制＝中央集權"}, {"id": "e112_22", "src": "112 段考 22", "q": "「出身決定一切命運」的局面轉變了。由於封建的式微，部分貴族只能靠講學來維持生活，加上各國競爭激烈，爭相拉攏人才，開始重用有能力的、非權貴的平民百姓，平民終於可以展現自己的才能，為國君服務。請問：這種轉變主要是發生在哪一時代？", "o": ["西周", "東周", "漢代", "隋代"], "a": 1, "ex": "貴族流落民間講學、各國用人唯才＝東周（春秋戰國）。", "card": "私人講學、平民崛起"}, {"id": "e112_23", "src": "112 段考 23", "q": "經過春秋戰國數百年的征戰兼併之後，秦王政統一天下，成為中國歷史上第一個皇帝，自稱「始皇帝」。請問：下列敘述何者較符合秦始皇當時的實際狀況？", "o": ["名義上統一天下，但現實中並無相關配合的制度與措施", "由中央政府派任官員管理地方，並統一文字與度量衡", "為穩固國家權力，積極分封宗族子弟，以保衛國家", "因連年戰亂，實行道家思想，與民休息，避免過度擾民"], "a": 1, "ex": "秦用郡縣（中央派官）、統一文字度量衡；不封建、用法家不用道家。", "card": "統一文字貨幣度量衡"}, {"id": "e112_27", "src": "112 段考 27", "q": "資料一：政府授權中正官在地方上進行品評，依據士人的才能、德行與家世背景來區分品級，但之後只重家世，造成「上品無寒門、下品無世族」。資料二：政府透過開科取士選拔人才，有進士、明經等科，有能力者都可以報考。資料三：朝廷要求地方官員定期向中央推舉符合「孝順」和「廉能」標準的人才。依據三則資料出現時間的先後順序排列，順序應該為何？", "o": ["資料三 → 資料二 → 資料一", "資料二 → 資料三 → 資料一", "資料三 → 資料一 → 資料二", "資料一 → 資料三 → 資料二"], "a": 2, "ex": "察舉（漢）→ 九品官人之法（曹魏）→ 科舉（隋）。", "card": "世族興衰三階段"}, {"id": "e112_28", "src": "112 段考 28", "q": "（承上題）資料二「開科取士」的選才方式導致世族的勢力趨於沒落，無法長期掌握政治勢力。請問：資料二的選才方式開始於哪一個朝代？", "o": ["秦代", "漢代", "曹魏", "隋代"], "a": 3, "ex": "科舉從隋文帝開始。", "card": "隋唐科舉"}, {"id": "e113_18", "src": "113 段考 18", "q": "西元前 11 世紀周人滅商，勢力持續向外擴展，使得管轄的土地與人口在短時間內急速增加，為了長治久安，周朝統治者設計出一套有效的政治制度管理各地。請問：上述政治制度的內容，最有可能是下列何者？", "o": ["在領地內設置郡、縣，官員由國君直接任免", "實施科舉制度，促進社會各階層人才的流動", "將百姓編入戶籍，並以法律規範人民的義務", "透過分封儀式，依據身分等級，授予土地、人民、財物，以護衛王朝"], "a": 3, "ex": "周朝管理新土地的方法＝封建（分封）。郡縣是秦、戶籍是商鞅、科舉是隋。", "card": "西周：封建"}, {"id": "e113_19", "src": "113 段考 19", "q": "宇綸上課時不小心睡著了，一覺醒來發現自己跨越時空生活在東周，他希望自己有朝一日能獲得朝廷冊封、衣錦返鄉。請問：下列哪一項「不應該」是他努力的方式？", "o": ["鼓吹國君加強貴族勢力", "追隨商鞅變法成為推動者", "接受教育以學說打動國君", "參加軍隊建立軍功"], "a": 0, "ex": "東周是平民崛起、貴族沒落的時代，幫貴族沒有用；變法、讀書遊說、軍功才是出路。", "card": "私人講學、平民崛起"}, {"id": "e113_21", "src": "113 段考 21（改）", "q": "上歷史課時老師用兩張圖的變化來說明某位君主的改革：圖（一）這片土地上分成許多諸侯國並立，圖（二）同一片土地已經統一，並分成一個個郡。請根據圖的內容判斷，最有可能符合圖片描述的是下列哪位皇帝？", "o": ["唐太宗", "秦始皇", "漢武帝", "北魏孝文帝"], "a": 1, "ex": "列國 → 郡＝秦始皇行郡縣制。原題附兩張地圖，這裡改成文字。", "card": "郡縣制＝中央集權"}, {"id": "e113_23", "src": "113 段考 23", "q": "社會動盪不安的魏晉南北朝時期，世族仍然維持其崇高的地位，不受局勢變動的影響。請問主因為何？", "o": ["皇帝尊崇儒學，擴張書香世家勢力", "朝廷薦舉孝廉，形成許多世族門閥", "行九品官人之法，人才評選重視家世", "科舉考試公平，造成新的世族勢力"], "a": 2, "ex": "九品官人之法只看家世，世族地位就穩了。", "card": "九品官人之法"}, {"id": "e114_18", "src": "114 段考 18（非官方解答）", "q": "俊凱在博物館看到毛公鼎的簡介：「西周宣王年間毛公為紀念宣王對自己的任命、告誡子孫所鑄造的青銅鼎，腹內刻有 500 字銘文。」請問：以下有關西周的敘述何者是「錯誤」的？", "o": ["實行封建，將宗親與功臣分封到各地，拱衛王室", "強調宗法，依照血緣親疏，確立政治地位的尊卑", "禮樂制度下，鼎是祭祀、喪葬等儀式的重要器物", "周人首領曾受商王分封，隨著實力日益強盛，逐漸向西擴張，取代商朝成為黃河流域主要政權"], "a": 3, "ex": "周人原本在黃河「中游」（西邊），是向「東」擴張滅掉下游的商，不是向西。", "card": "西周：封建"}, {"id": "e114_19", "src": "114 段考 19（改，非官方解答）", "q": "圖一是封建制度示意圖（周王分封諸侯），圖二是郡縣制度示意圖（皇帝派任郡守、縣令）。下列有關圖中的說明，何者正確？", "o": ["圖一由周天子分封，將土地賜予諸侯；圖二是由地方選舉產生，並集中權力於中央", "圖一是周天子派諸侯擔任下屬，得以世襲；圖二是郡守派任下屬擔任，由中央直接統治地方", "圖一是天子分封土地給諸侯，身分得以世襲；圖二是秦始皇派任官員，與皇帝有血緣關係，不得世襲", "圖一是周天子分封諸侯，諸侯得以世襲；圖二是皇帝派任官員，將郡縣制推行到全國，強化中央集權"], "a": 3, "ex": "郡縣的官是皇帝派的、不世襲、也不用是皇帝親戚；「地方選舉」更是沒有的事。", "card": "郡縣制＝中央集權"}, {"id": "e114_20", "src": "114 段考 20（非官方解答）", "q": "現代求職網站用「智能履歷分析系統」辨識關鍵字推薦人才。古代中國也有各自任用官員的標準與方式。請問：從秦漢到隋唐選才方式的演變，下列何者正確？", "o": ["熟悉法令規章的人才 → 察舉 → 科舉考試 → 九品官人法", "熟悉法令規章的人才 → 察舉 → 九品官人法 → 科舉考試", "察舉 → 熟悉法令規章的人才 → 九品官人法 → 科舉考試", "熟悉法令規章的人才 → 九品官人法 → 科舉考試 → 察舉"], "a": 1, "ex": "秦（法令人才）→ 漢（察舉）→ 曹魏（九品）→ 隋唐（科舉）。", "card": "秦：法令人才"}, {"id": "e114_21", "src": "114 段考 21（非官方解答）", "q": "「十年寒窗無人問，一舉成名天下知」，中國的科舉制度實施了一千多年，不失為一種公平的選才方式。請問：關於科舉制度的實施與影響，下列何者「錯誤」？", "o": ["使世族得以長期壟斷官職，有土地和減免賦稅的特權", "實施的背景是為了抑制世家大族的政治社會利益", "隋朝開始實施科舉制度，成為選拔官員的重要管道", "平民因此得以參加政府運作，促進社會階級的流動"], "a": 0, "ex": "讓世族壟斷官職的是九品官人之法；科舉反而是用來打破它的。", "card": "隋唐科舉"}, {"id": "e114_22", "src": "114 段考 22（非官方解答）", "q": "東漢末年天下大亂，曹魏時期為了解決戰亂徵才困難的狀況，在各郡設置中正官，挑選各地賢能者，根據才學、德行與家世背景來拔擢人才，但也因此出現了許多特殊的社會現象。下列哪一段敘述最適合描述此時期的社會現象？", "o": ["貴族沒落，平民崛起，布衣可為卿相", "國際競爭激烈，各國富國強兵", "察舉孝子廉吏，由中央查核任官", "上品無寒門，下品無世族"], "a": 3, "ex": "中正官＝九品官人之法 → 上品無寒門。布衣卿相是東周，察舉是漢。", "card": "九品官人之法"}, {"id": "e114_23", "src": "114 段考 23（改，非官方解答）", "q": "附圖是一張歷史發展圖表：曲線在東漢開始上升、魏晉南北朝達到最高、隋到唐末逐漸下降，旁邊註記「經學傳家、累世當官」和「上品無寒門，下品無世族」。由表中的曲線分布判斷，此圖表的名稱應該是下列何者？", "o": ["封建制度興衰示意圖", "社會階層流動示意圖", "世族興衰趨勢示意圖", "科舉考試名額示意圖"], "a": 2, "ex": "東漢形成、魏晉鼎盛、隋唐沒落＝世族的興衰。原題附曲線圖，這裡改成文字。", "card": "世族興衰三階段"}, {"id": "e114_28", "src": "114 段考 28（非官方解答）", "q": "欣慧讀到一本傳記：「他是東周時期的改革家，受到君主重用後，積極為國家謀求富國強兵之法，試圖以家戶為單位將人民納入地方戶籍管理；此外獎勵耕織，又頒布法令，要求貴族與平民都應遵守。在他的改革下，國家日趨富強。」此本傳記最有可能為何？", "o": ["《劉邦傳》", "《商鞅傳》", "《嬴政傳》", "《孔子傳》"], "a": 1, "ex": "東周＋戶籍＋獎勵耕織＋法令一體遵守＝商鞅變法。", "card": "商鞅變法"}, {"id": "e114_29", "src": "114 段考 29（非官方解答）", "q": "（承上題）由傳記中提及的內容可知，這位改革家試圖將人民納入戶籍管理，其背後的目的可能為何？", "o": ["藉此打擊不法分子", "迫使人民失去人身自由", "擴大國家所屬版圖", "便於掌控賦稅及勞動力"], "a": 3, "ex": "戶籍登記人口，就是為了收稅、徵兵、徵勞役。", "card": "商鞅變法"}]};

let flushing = false;
async function flushLog(leaving){
  if (!LOG_URL || flushing || !LQ.length || navigator.onLine === false) return;
  flushing = true;
  const batch = LQ.slice(0, leaving ? 30 : 200);
  try {
    const r = await fetch(LOG_URL, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify({app:D.app, events:batch}), redirect:"follow", keepalive:!!leaving});
    const j = await r.json();
    if (j && j.ok){ const done = new Set(batch.map(e=>e.id)); LQ = LQ.filter(e=>!done.has(e.id)); saveLQ(); flushing=false; if (LQ.length && !leaving) return flushLog(); }
  } catch(e){}
  flushing = false;
}

function stepsOf(d){ const s=["cards"]; if(d.order) s.push("order"); if(d.match) s.push("match"); s.push("quiz"); if(d.id===D.days.length) s.push("mix"); return s; }

  const steps = stepsOf(d);
  if (!F || F.day!==d.id){ F = {day:d.id, i:0, card:0, doneSteps:{}}; }
  if (step!==undefined) F.i = Math.max(0, Math.min(steps.length-1, +step));
  const cur = steps[F.i];
  const head = `<div class="steps">${steps.map((s,i)=>`<span class="${i===F.i?"on":F.doneSteps[s]?"ok":""}">${i+1} ${STEP_NAME[s]}</span>`).join("")}</div>`;
  ({cards:vCards, order:vOrder, match:vMatch, quiz:vQuiz, mix:vMix})[cur](d, head);
}
function nextStep(){ const d=dayOf(F.day); const steps=stepsOf(d); F.doneSteps[steps[F.i]]=true; if (F.i+1<steps.length){ F.i++; vDay(d.id); } else { location.hash="#/"; } }
const nextBtn = () => `<button class="btn" onclick="nextStep()">這一步完成，下一步 →</button>`;

/* ── 1. 重點卡 ── */
function vCards(d, head){
  const n=d.cards.length; const i=Math.min(F.card, n-1); const c=d.cards[i];
  page(d.title, `${head}${F.i===0&&i===0?`<p class="sub">${esc(d.intro)}</p>`:""}
  <div class="sub">卡 ${i+1} / ${n}<span class="muted" style="float:right;font-size:12px">${esc(d.page)}</span></div><div class="prog"><i style="width:${(i+1)/n*100}%"></i></div>
  <div class="card flash"><div class="t">${esc(c.t)}</div><div class="zh">${esc(c.zh)}</div><div class="why">${esc(c.why)}</div></div>
  <div class="row"><button class="btn ghost" ${i===0?"disabled":""} onclick="F.card=${i-1};vDay(${d.id})">← 上一張</button>
  ${i<n-1?`<button class="btn" onclick="F.card=${i+1};vDay(${d.id})">下一張 →</button>`:`<button class="btn" onclick="nextStep()">讀完了，下一步 →</button>`}</div>
  <button class="btn ghost sm" style="margin-top:16px" onclick="location.hash='#/cards/${d.id}'">一次看這天全部的卡</button>`, "#/");
  logEv({k:"view", page:`hist1/d${d.id}/card${i+1}`});
}
function vAllCards(dayId){
  const ds = dayId? [dayOf(dayId)] : D.days;
  page("全部重點卡", ds.map(d=>`<h2>${esc(d.title)}</h2>`+d.cards.map(c=>`<div class="card"><div class="t" style="font-weight:700;color:var(--accent-ink);font-size:18px">${esc(c.t)}</div><p style="margin:8px 0">${esc(c.zh)}</p><div class="why" style="font-size:14px;color:var(--ink-2);background:var(--warn-soft);border-radius:8px;padding:8px 12px"><b style="color:var(--warn)">考什麼：</b>${esc(c.why)}</div></div>`).join("")).join(""), dayId?`#/d/${dayId}`:"#/");
}

/* ── 2. 排順序：點候選區的卡片依序放進答案區 ── */
let OD = null;
// 🔴 onclick 屬性裡不能塞字串內容（會把 HTML 弄壞），一律用索引叫全域函式
function odPush(i){ OD.ans.push(OD.left[i]); OD.render(); }
function odPop(i){ OD.ans.splice(i,1); OD.render(); }
function vOrder(d, head){
  const o=d.order;
  if (!OD || OD.day!==d.id){ OD={day:d.id, pool:shuffle(o.items), ans:[], sent:false}; }
  OD.render = () => {
    OD.left = OD.pool.filter(x=>!OD.ans.includes(x));
    let verdict="";
    if (OD.sent){
      const allOk = OD.ans.every((x,i)=>x===o.items[i]);
      verdict = `<div class="verdict ${allOk?"ok":"ng"}">${allOk?"✅ 全部排對！":"❌ 有幾個位置不對"}</div>
      ${allOk?"":`<div class="ex"><b>正確順序：</b><ol class="list">${o.items.map(x=>`<li>${esc(x)}</li>`).join("")}</ol></div>`}
      <div class="row"><button class="btn ghost" onclick="OD=null;vDay(${d.id})">再排一次</button>${nextBtn()}</div>`;
    }
    page(d.title, `${head}<h3>${esc(o.title)}</h3><p class="sub">${esc(o.hint)}</p>
    <div class="muted">答案區（由早到晚）</div>
    <div class="chips" id="ans">${OD.ans.map((x,i)=>`<button class="chip ${OD.sent?(x===o.items[i]?"ok":"ng"):""}" ${OD.sent?"disabled":""} onclick="odPop(${i})"><span class="n">${i+1}</span>${esc(x)}</button>`).join("")||`<span class="muted">還沒放東西，從下面點</span>`}</div>
    <div class="muted">候選區</div>
    <div class="chips" id="cand">${OD.left.map((x,i)=>`<button class="chip" onclick="odPush(${i})">${esc(x)}</button>`).join("")||`<span class="muted">都放上去了</span>`}</div>
    ${OD.sent?"":`<button class="btn" id="send" ${OD.left.length?"disabled":""}>送出答案</button>`}
    ${verdict}`, "#/");
    const b=$("#send"); if (b) b.onclick=()=>{ OD.sent=true; const ok=OD.ans.every((x,i)=>x===o.items[i]); logAns({sec:d.title, qid:`order${d.id}`, t:"order", q:o.title, given:OD.ans.join("→"), ans:o.items.join("→"), ok:ok?1:0}); OD.render(); };
  };
  OD.render();
}

/* ── 3. 配對：點左邊一個再點右邊一個 ── */
let MD = null;
function mdSel(i){ MD.sel = MD.lefts[i]; MD.render(); }
function mdPick(i){ if (MD.sel){ MD.pairs[MD.sel] = MD.rights[i]; MD.sel = null; } MD.render(); }
function mdDel(i){ delete MD.pairs[Object.keys(MD.pairs)[i]]; MD.render(); }
function vMatch(d, head){
  const m=d.match;
  if (!MD || MD.day!==d.id){ MD={day:d.id, right:shuffle(m.pairs.map(p=>p[1])), sel:null, pairs:{}, sent:false}; }
  const correct = Object.fromEntries(m.pairs);
  MD.render = () => {
    const used = new Set(Object.values(MD.pairs));
    MD.lefts = m.pairs.map(p=>p[0]).filter(l=>!(l in MD.pairs));
    MD.rights = MD.right.filter(r=>!used.has(r));
    let verdict="";
    if (MD.sent){
      const nOk = m.pairs.filter(p=>MD.pairs[p[0]]===p[1]).length;
      verdict = `<div class="verdict ${nOk===m.pairs.length?"ok":"ng"}">${nOk===m.pairs.length?"✅ 全部配對！":`❌ 對了 ${nOk} / ${m.pairs.length} 組`}</div>
      ${nOk===m.pairs.length?"":`<div class="ex"><b>正確配法：</b><ul class="list">${m.pairs.filter(p=>MD.pairs[p[0]]!==p[1]).map(p=>`<li>${esc(p[0])} ↔ ${esc(p[1])}</li>`).join("")}</ul></div>`}
      <div class="row"><button class="btn ghost" onclick="MD=null;vDay(${d.id})">再配一次</button>${nextBtn()}</div>`;
    }
    page(d.title, `${head}<h3>${esc(m.title)}</h3><p class="sub">${esc(m.hint)}</p>
    <div class="pairs" id="pairs">${Object.entries(MD.pairs).map(([l,r],i)=>`<button class="chip ${MD.sent?(correct[l]===r?"ok":"ng"):"on"}" ${MD.sent?"disabled":""} onclick="mdDel(${i})">${esc(l)} ↔ ${esc(r)}${MD.sent?"":" ×"}</button>`).join("")}</div>
    ${MD.lefts.length?`<div class="cols"><div id="lefts">${MD.lefts.map((l,i)=>`<button class="chip ${MD.sel===l?"on":""}" onclick="mdSel(${i})">${esc(l)}</button>`).join("")}</div>
    <div id="rights">${MD.rights.map((r,i)=>`<button class="chip" onclick="mdPick(${i})">${esc(r)}</button>`).join("")}</div></div>
    <p class="muted">${MD.sel?`已選「${esc(MD.sel)}」，再點右邊一個`:"先點左邊一個"}</p>`:""}
    ${MD.sent?"":`<button class="btn" id="send" ${MD.lefts.length?"disabled":""}>送出答案</button>`}
    ${verdict}`, "#/");
    const b=$("#send"); if (b) b.onclick=()=>{ MD.sent=true; const nOk=m.pairs.filter(p=>MD.pairs[p[0]]===p[1]).length; logAns({sec:d.title, qid:`match${d.id}`, t:"match", q:m.title, given:Object.entries(MD.pairs).map(x=>x.join("↔")).join("；"), ans:m.pairs.map(x=>x.join("↔")).join("；"), ok:nOk===m.pairs.length?1:0, n:m.pairs.length, nok:nOk}); MD.render(); };
  };
  MD.render();
}

/* ── 4. 寫題（選擇題，即答即回饋）── */
let QZ = null;
function startQuiz(opt){ QZ = Object.assign({i:0, ok:0, wrong:[], picked:null, qt:Date.now()}, opt); vQuizQ(); }
function vQuizQ(){
  const qs=QZ.qs, i=QZ.i, q=qs[i];
  if (i>=qs.length) return vQuizEnd();
  const picked = QZ.picked;
  page(QZ.title, `<div class="sub">${i+1} / ${qs.length}<span class="muted" style="float:right;font-size:12px">${esc(q.src)}</span></div><div class="prog"><i style="width:${i/qs.length*100}%"></i></div>
  <div class="card"><p style="margin:0 0 12px;font-size:17px">${esc(q.q)}</p>
  ${q.o.map((o,k)=>`<button class="opt ${picked===null?"":k===q.a?"ok":k===picked?"ng":""}" ${picked===null?"":"disabled"} onclick="pickOpt(${k})">(${"ABCD"[k]}) ${esc(o)}</button>`).join("")}
  ${picked===null?"":`<div class="verdict ${picked===q.a?"ok":"ng"}">${picked===q.a?"✅ 答對":"❌ 答錯，正確答案是 ("+"ABCD"[q.a]+")"}</div>
  <div class="ex">${esc(q.ex)}<span class="src">來源：${esc(q.src)}</span></div>${picked===q.a?"":cardRef(q.card)}
  <button class="btn" onclick="QZ.i++;QZ.picked=null;QZ.qt=Date.now();vQuizQ()">${i+1<qs.length?"下一題 →":"看結果"}</button>`}
  </div>`, QZ.back);
}
function pickOpt(k){
  const q=QZ.qs[QZ.i]; if (QZ.picked!==null) return;
  QZ.picked=k; const ok = k===q.a;
  if (ok){ QZ.ok++; S.right[q.id]=(S.right[q.id]||0)+1; if (S.wrong[q.id]) S.wrong[q.id]=0; }
  else { QZ.wrong.push(q.id); S.wrong[q.id]=(S.wrong[q.id]||0)+1; }
  save();
  logAns({sec:QZ.title, qid:q.id, t:"mc", q:q.q, given:"ABCD"[k]+" "+q.o[k], ans:"ABCD"[q.a]+" "+q.o[q.a], ok:ok?1:0, ms:Date.now()-QZ.qt, from:q.src});
  vQuizQ();
}
function vQuizEnd(){
  const n=QZ.qs.length;
  if (QZ.onDone) QZ.onDone(QZ.ok, n);
  page(QZ.title, `<div class="card"><div class="big">${QZ.ok} / ${n}</div><p class="sub" style="text-align:center">${QZ.ok===n?"全對！":QZ.ok>=n*0.7?"不錯，錯的再看一次就穩了":"沒關係，錯的題目都進錯題本了，明天再練"}</p></div>
  ${QZ.wrong.length?`<h2>這次錯的</h2>${QZ.wrong.map(id=>{const q=Q[id];return `<div class="card"><p style="margin:0 0 8px">${esc(q.q)}</p><div class="ex"><b>正確：(${"ABCD"[q.a]}) ${esc(q.o[q.a])}</b><br>${esc(q.ex)}</div>${cardRef(q.card)}</div>`;}).join("")}`:""}
  ${QZ.next?`<button class="btn" onclick="${QZ.next}">${QZ.nextLabel||"下一步 →"}</button>`:""}
  <button class="btn ghost" onclick="location.hash='${QZ.back}'">回上一頁</button>`, QZ.back);
}
function vQuiz(d, head){
  const qs = d.main.map(id=>Q[id]);
  page(d.title, `${head}<div class="card"><h3 style="margin-top:0">寫題：${qs.length} 題</h3><p class="sub">講義、課本和段考考過的題目。答錯會馬上看到解析，還會告訴你回哪張卡。</p>
  <button class="btn" id="go">開始寫題</button></div>`, "#/");
  $("#go").onclick=()=>startQuiz({title:d.title.replace(/｜.*/,"")+" 寫題", qs, back:`#/d/${d.id}`, next:"nextStep()", nextLabel: d.id===D.days.length?"去總複習 →":"完成今天的練習 →",
    onDone:(ok,n)=>{ S.done[d.id]={ok,n,ts:Date.now()}; save(); }});
}
/* ── 5. 最後一天總複習：先抽前兩天錯的，不夠再從段考題補 ── */
function mixQs(){
  const wrongIds = Object.keys(S.wrong).filter(id=>S.wrong[id]>0 && Q[id]);
  let qs = shuffle(wrongIds).slice(0,6).map(id=>Q[id]);
  if (qs.length<6){ const pool = D.days.flatMap(d=>d.pool).filter(id=>!wrongIds.includes(id)); qs = qs.concat(shuffle(pool).slice(0, 6-qs.length).map(id=>Q[id])); }
  return qs;
}
function vMix(d, head){
  page(d.title, `${head}<div class="card"><h3 style="margin-top:0">總複習 6 題</h3><p class="sub">先抽你前幾天答錯的題目，不夠再從段考題裡補。</p><button class="btn" id="go">開始</button></div>`, "#/");
  $("#go").onclick=()=>startQuiz({title:"總複習", qs:mixQs(), back:`#/d/${d.id}`, next:"nextStep()", nextLabel:"三天全部完成 🎉"});
}
/* ── 錯題本、段考題加練 ── */
function vWrong(){
  const ids = Object.keys(S.wrong).filter(id=>S.wrong[id]>0 && Q[id]);
  page("錯題本", `<div class="card"><p class="sub" style="margin-top:0">${ids.length?`現在有 ${ids.length} 題。答對一次就離開錯題本。`:"錯題本是空的，去寫題吧。"}</p>${ids.length?`<button class="btn" id="go">練這 ${ids.length} 題</button>`:""}</div>
  ${ids.map(id=>`<div class="card" style="padding:12px 16px"><div class="sub">${esc(Q[id].q)}</div><div class="muted" style="font-size:12px">錯 ${S.wrong[id]} 次・${esc(Q[id].src)}</div></div>`).join("")}`, "#/");
  const b=$("#go"); if (b) b.onclick=()=>startQuiz({title:"錯題本", qs:shuffle(ids).map(id=>Q[id]), back:"#/wrong"});
}
function vPool(){
  const all = D.days.flatMap(d=>d.pool.concat(d.main)).filter(id=>/^e1/.test(id));
  page("段考原題加練", `<div class="card"><p class="sub" style="margin-top:0">112、113、114 學年第一次段考考過的本課題目共 ${all.length} 題，隨機抽 10 題。有圖的題目已改成文字敘述；114 學年沒有公布解答，答案是 AI 判讀的。</p><button class="btn" id="go">抽 10 題</button></div>`, "#/");
  $("#go").onclick=()=>startQuiz({title:"段考原題加練", qs:shuffle(all).slice(0,10).map(id=>Q[id]), back:"#/pool"});
}

/* ═════════ 路由 ═════════ */
function route(h){
  if (h!==undefined && location.hash!==h){ location.hash=h; return; }
  const p=(location.hash||"#/").slice(2).split("/");
  logEv({k:"view", page:"hist1/"+((location.hash||"#/").slice(2)||"home")});
  if (p[0]==="d") return vDay(p[1], p[2]);
  if (p[0]==="wrong") return vWrong();
  if (p[0]==="pool") return vPool();
  if (p[0]==="cards") return vAllCards(p[1]?+p[1]:0);
  if (p[0]==="back") { location.href="./"; return; }
  vHome();
}
window.addEventListener("hashchange", ()=>route());
route();
</script>
