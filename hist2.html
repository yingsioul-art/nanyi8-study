<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>歷史 L2 民族與文化</title>
<meta name="theme-color" content="#4f46e5">
<link rel="icon" href="icon-192.png">
<style>
/* 設計基準同英文站：8px 網格｜灰階分層｜Indigo 唯一強調色 */
:root{
  --accent:#4f46e5; --accent-ink:#4338ca; --accent-soft:#eef2ff; --accent-line:rgba(79,70,229,.18);
  --bg:#f7f7f8; --surface:#ffffff; --surface-2:#f4f4f5; --line:#e4e4e7;
  --ink:#18181b; --ink-2:#52525b; --ink-3:#a1a1aa;
  --ok:#15803d; --ok-soft:#f0fdf4; --ng:#b91c1c; --ng-soft:#fef2f2; --warn:#a16207; --warn-soft:#fefce8;
  --r-sm:8px; --r-md:12px; --r-lg:16px;
  --sh-1:0 1px 2px rgba(24,24,27,.04),0 1px 3px rgba(24,24,27,.06);
  --sh-2:0 8px 24px rgba(24,24,27,.08),0 2px 6px rgba(24,24,27,.04);
  --ease:cubic-bezier(.2,.8,.2,1); --pad:16px;
}
@media (prefers-color-scheme: dark){
  :root{ --accent:#818cf8; --accent-ink:#a5b4fc; --accent-soft:rgba(129,140,248,.14); --accent-line:rgba(129,140,248,.28);
    --bg:#0c0c0e; --surface:#18181b; --surface-2:#232328; --line:#2e2e34;
    --ink:#f4f4f5; --ink-2:#a1a1aa; --ink-3:#71717a;
    --ok:#4ade80; --ok-soft:rgba(74,222,128,.10); --ng:#f87171; --ng-soft:rgba(248,113,113,.10); --warn:#facc15; --warn-soft:rgba(250,204,21,.10);
    --sh-1:0 1px 2px rgba(0,0,0,.4); --sh-2:0 8px 24px rgba(0,0,0,.5); }
}
@media (min-width:600px){ :root{ --pad:24px; } }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;-webkit-font-smoothing:antialiased}
#app{max-width:720px;margin:0 auto;padding:0 16px 96px}
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;margin:0 -16px 8px;padding:16px;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
header.top h1{font-size:20px;font-weight:700;letter-spacing:-.01em;margin:0;flex:1;line-height:1.3}
header.top .back{width:40px;height:40px;flex:none;border:0;border-radius:50%;background:var(--surface);color:var(--ink);font-size:18px;cursor:pointer;box-shadow:var(--sh-1)}
header.top .back:active{transform:scale(.92)}
header.top .home{flex:none;border:0;border-radius:999px;padding:8px 14px;background:var(--surface);color:var(--accent-ink);font:inherit;font-size:14px;font-weight:600;cursor:pointer;box-shadow:var(--sh-1);white-space:nowrap}
header.top .home:active{transform:scale(.95)}
h2{font-size:13px;font-weight:600;letter-spacing:.06em;color:var(--ink-3);margin:32px 0 16px}
h3{font-size:16px;font-weight:600;margin:24px 0 8px}
p{margin:8px 0 16px}
.sub{color:var(--ink-2);font-size:14px}
.muted{color:var(--ink-3);font-size:14px}
b{font-weight:600}
.card{background:var(--surface);border-radius:var(--r-lg);padding:var(--pad);margin:16px 0;box-shadow:var(--sh-1)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;border:0;border-radius:var(--r-lg);padding:16px;background:var(--surface);color:var(--ink);box-shadow:var(--sh-1);cursor:pointer;font:inherit;min-height:112px;transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
.tile:active{transform:scale(.97)}
.tile .ic{font-size:24px}
.tile b{font-size:15px;line-height:1.3}
.tile small{color:var(--ink-3);font-size:12px;line-height:1.4}
.tile.done{border:2px solid var(--ok)}
.btn{display:inline-block;width:100%;margin:8px 0 0;padding:14px 16px;border:0;border-radius:var(--r-md);background:var(--accent);color:#fff;font:inherit;font-weight:600;font-size:16px;cursor:pointer;transition:transform .15s var(--ease)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:var(--surface);color:var(--accent);border:1px solid var(--accent-line)}
.btn.sm{width:auto;padding:8px 14px;font-size:14px;margin:4px 8px 4px 0}
.row{display:flex;gap:8px;align-items:center}
.prog{height:4px;background:var(--line);border-radius:2px;margin:8px 0 16px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent)}
.steps{display:flex;gap:6px;margin:8px 0 16px;flex-wrap:wrap}
.steps span{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--ink-3)}
.steps span.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.steps span.ok{background:var(--ok-soft);color:var(--ok)}
/* 重點卡 */
.flash{min-height:260px;display:flex;flex-direction:column;justify-content:center}
.flash .t{font-size:22px;font-weight:700;margin:0 0 12px;color:var(--accent-ink)}
.flash .zh{font-size:17px;margin:0 0 16px}
.flash .why{font-size:14px;color:var(--ink-2);background:var(--warn-soft);border-radius:var(--r-sm);padding:10px 12px}
.flash .tl{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 10px}
.flash .tl span{font-size:11px;padding:2px 7px;border-radius:999px;background:var(--surface-2);color:var(--ink-3)}
.flash .tl span.on{background:var(--accent);color:#fff;font-weight:600}
.flash .meta{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink-2);margin:0 0 12px;line-height:1.5}
.flash .ctx{font-size:15px;line-height:1.65;background:var(--surface-2);border-radius:var(--r-sm);padding:10px 12px;margin:0 0 10px}
.flash .ctx b,.flash .ask b{display:block;font-size:12px;color:var(--ink-3);letter-spacing:.06em;margin-bottom:4px;font-weight:600}
.flash .ask{margin:0 0 10px;border:1px solid var(--accent-line);border-radius:var(--r-sm);padding:10px 12px;font-size:15px}
.flash .ask summary{cursor:pointer;font-weight:600;color:var(--accent-ink);list-style:none}
.flash .ask summary::-webkit-details-marker{display:none}
.flash .ask summary::after{content:"　點開看提示";font-size:12px;font-weight:400;color:var(--ink-3)}
.flash .ask[open] summary::after{content:""}
.flash .ask .hint{margin-top:8px;color:var(--ink-2);line-height:1.6}
.bigq{background:var(--accent-soft);border-radius:var(--r-md);padding:12px 14px;margin:0 0 16px;font-size:15px;color:var(--accent-ink);line-height:1.6}
.bigq b{display:block;font-size:12px;letter-spacing:.06em;color:var(--ink-3);margin-bottom:4px}
.flash .why::before{content:"考什麼：";font-weight:600;color:var(--warn)}
/* 選項與排序／配對 */
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);color:var(--ink);font:inherit;font-size:16px;cursor:pointer;line-height:1.5}
.opt:active{transform:scale(.99)}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ng{border-color:var(--ng);background:var(--ng-soft)}
.opt:disabled{cursor:default;opacity:.85}
.chips{display:flex;flex-wrap:wrap;gap:8px;min-height:48px;padding:8px;border:1px dashed var(--line);border-radius:var(--r-md);margin:8px 0}
.chip{padding:10px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font:inherit;font-size:15px;cursor:pointer;color:var(--ink)}
.chip.on{border-color:var(--accent);background:var(--accent-soft)}
.chip.ok{border-color:var(--ok);background:var(--ok-soft)}
.chip.ng{border-color:var(--ng);background:var(--ng-soft)}
.chip .n{display:inline-block;min-width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;text-align:center;line-height:20px;margin-right:6px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cols .chip{display:block;width:100%;text-align:left;border-radius:var(--r-md)}
.pairs .chip{display:block;width:100%;text-align:left;border-radius:var(--r-md);margin:6px 0}
.verdict{font-size:22px;font-weight:700;margin:16px 0 8px}
.verdict.ok{color:var(--ok)} .verdict.ng{color:var(--ng)}
.ex{background:var(--surface-2);border-radius:var(--r-sm);padding:12px;font-size:15px;margin:8px 0}
.ex .src{display:block;font-size:12px;color:var(--ink-3);margin-top:6px}
.cardref{border-left:3px solid var(--accent);padding:8px 12px;margin:8px 0;background:var(--accent-soft);border-radius:0 var(--r-sm) var(--r-sm) 0;font-size:15px}
.cardref b{display:block;color:var(--accent-ink)}
.big{font-size:40px;font-weight:700;text-align:center;margin:8px 0}
.list{padding-left:20px;margin:8px 0}
.list li{margin:6px 0}
</style>
</head>

<script>
const D = {"app": "n8v5", "eras": ["史前", "夏", "商", "西周", "東周", "秦", "漢", "魏晉南北朝", "隋", "唐"], "days": [{"id": 1, "title": "第 1 天｜民族互動：商周 → 隋唐", "page": "講義 p.9–10、課本 p.84–85", "intro": "農業民族（長城以南）和草原民族（長城以北）打打和和一千多年。今天把「誰、什麼時候、做了什麼」排清楚。", "big": "長城以北和以南的人打了一千年，為什麼最後混在一起？接納外來的人群，到底是好事還是壞事？", "cards": [{"t": "長城＝分界線", "zh": "東周各國先築城牆擋匈奴，秦統一後連成長城。長城從此是農業民族和草原民族的分界線。", "why": "考「長城最早何時修築完成」→ 秦朝；考「長城的意義」→ 防禦匈奴、農業／草原分界。", "era": ["東周", "秦"], "when": "東周各國築牆（前 4～3 世紀）；秦統一後連成長城（前 3 世紀末）", "where": "西起臨洮（今甘肅）東到遼東；大致沿著「能種田」和「只能放牧」的氣候界線", "ctx": "長城以南雨水夠能種田（農業民族），以北乾冷只能逐水草放牧（草原民族）。草原缺糧、缺鐵、缺布，天災時就南下搶；農業民族守不住就築牆。燕、趙、秦原本各築各的，秦統一後連起來擋匈奴。長城不是國界，是兩種生活方式的分界。", "ask": "草原民族為什麼「一定」會南下？", "hint": "不是因為壞，是因為草原生產不了糧食和手工業品，必須靠交易或搶奪取得。這個結構一千多年都沒變，所以胡漢關係一直在「和親／互市」和「戰爭」之間擺盪。"}, {"t": "張騫通西域", "zh": "漢武帝想聯合西域國家一起打匈奴，派張騫出使西域。從此東西商路活絡，就是「絲路」。", "why": "考絲路「為什麼開通」→ 聯絡西域打擊匈奴；考「誰派誰」→ 漢武帝派張騫。", "era": ["漢"], "when": "漢武帝時，西元前 2 世紀（前 139 年出發，被匈奴扣了十年，前 126 年才回來）", "where": "從長安經河西走廊到西域（今新疆）、中亞；目標是找大月氏", "ctx": "漢初打不過匈奴，只好和親（後來的王昭君也是這套）。漢武帝國力恢復後想反擊，聽說大月氏和匈奴有仇，派張騫去結盟。結盟沒談成，但張騫帶回西域的地理和各國情報，漢後來打通河西走廊、設西域都護，商路從此暢通＝絲路。", "ask": "張騫「任務失敗」，卻被說是最大貢獻，為什麼？", "hint": "因為他的情報讓漢朝第一次認識西域，打通了中西交通。歷史評價看的是後續影響，不是當初的目的。"}, {"t": "絲路", "zh": "長安 → 敦煌 → 西域（今新疆）→ 中亞、西亞 → 最遠到大秦（羅馬帝國）。絲織品往西賣；佛教、音樂（琵琶、胡琴）、葡萄、石榴往東傳。", "why": "考「最受西方喜愛的商品」→ 絲織品；考「終點甲地屬哪國」→ 大秦。", "era": ["漢", "唐"], "when": "漢武帝後開通；唐代最繁榮", "where": "長安 → 河西走廊 → 敦煌 → 西域（新疆）→ 中亞 → 西亞（安息）→ 大秦（羅馬）", "ctx": "商人不是一口氣走完，是一段一段接力，中間的西域和粟特商人最會做生意。往西賣絲綢（羅馬貴族搶著要），往東傳進佛教、琵琶、葡萄、石榴、玻璃。所以絲路不只是貿易路線，也是宗教、音樂、作物傳進中國的路。", "ask": "絲路上「往東傳的」比「往西傳的」多，說明什麼？", "hint": "說明中國不只是輸出者，也大量吸收外來文化。唐朝的胡風、佛教的興盛，都是從這條路來的。"}, {"t": "五胡", "zh": "漢代以來匈奴、鮮卑、羯、氐、羌陸續搬進中國北方，合稱「五胡」。胡漢風俗不同，常起衝突。", "why": "考「胡人內遷造成什麼」→ 後面的永嘉之禍、北方人南遷。", "era": ["漢", "魏晉南北朝"], "when": "東漢到西晉陸續內遷（1～3 世紀）", "where": "搬進長城以南的黃河流域（今山西、陝西、甘肅一帶）", "ctx": "東漢起朝廷讓歸順的匈奴等族遷進邊境當兵、種田，久了人口越來越多，卻受漢人官吏和豪族欺壓，身分低、常被當奴隸賣。胡漢風俗不同、仇恨一直累積，只等一個機會爆發。這個機會就是西晉的八王之亂。", "ask": "「讓外族搬進來」是好事還是壞事？", "hint": "大抓週第七課的問題。搬進來本身不是問題，問題在怎麼對待他們：西晉歧視欺壓 → 爆發永嘉之禍；唐朝平等開放 → 盛世。關鍵是「怎麼看待外來的人」。"}, {"t": "八王之亂 → 五胡十六國", "zh": "西晉皇族自己打自己（八王之亂），胡族趁機在黃河流域紛紛建國，叫「五胡十六國」。", "why": "順序題：八王之亂在前，永嘉之禍在後。", "era": ["魏晉南北朝"], "when": "八王之亂 291～306 年；五胡十六國 304～439 年", "where": "黃河流域（北方）", "ctx": "西晉統一（280 年）才十幾年，皇族八個王為了爭權互相打，還把內遷的胡人拉進來當兵。打到朝廷沒力，胡人將領發現「原來晉這麼弱」，紛紛自立建國，北方一百多年間出現十幾個政權。", "ask": "為什麼「自己人打自己人」比外族入侵更致命？", "hint": "內亂把中央的軍隊和威信耗光，外族只是趁虛而入。順序題要記：八王之亂（內）在前，永嘉之禍（外）在後。"}, {"t": "永嘉之禍（311 年＝4 世紀）", "zh": "匈奴攻進西晉首都洛陽，皇帝被俘，西晉滅亡。晉人逃到長江流域重建＝東晉。北方人大量南遷，帶去農耕技術，南方開發、經濟重心開始南移。", "why": "最常考！考年代（311 年）、考影響（南方開發、經濟重心南移、南北分裂）。「北魏孝文帝推動胡化」是錯的，他推的是漢化。", "era": ["魏晉南北朝"], "when": "311 年（西晉永嘉五年）；316 年西晉亡；317 年東晉建於建康", "where": "匈奴攻破洛陽 → 晉人越過淮河、長江，南逃到建康（今南京）", "ctx": "匈奴人趁八王之亂建國，311 年攻破洛陽、俘虜晉懷帝，西晉等於亡了。北方士族和百姓大批南遷（「衣冠南渡」），帶去人力和農耕技術，原本地廣人稀的江南開始大開發，經濟重心從此慢慢往南移。北方則進入胡人政權時代，南北分裂近三百年。", "ask": "一場亡國的災難，為什麼對「南方」反而是好事？", "hint": "因為人口和技術是跟著難民一起搬的。看歷史事件要分「對誰、在哪裡」：對北方是浩劫，對江南是開發的起點。"}, {"t": "北魏孝文帝漢化", "zh": "鮮卑人建的北魏統一北方。孝文帝把首都從平城（今山西大同）遷到洛陽，規定鮮卑人改漢姓（拓跋→元）、穿漢服、說漢語、和漢人通婚。胡漢融合，替隋唐盛世打底。", "why": "考「某君王遷都洛陽、改漢姓、禁胡服胡語」→ 北魏孝文帝；考「平城遷洛陽的圖」→ 北魏漢化。", "era": ["魏晉南北朝"], "when": "北魏 439 年統一北方；孝文帝 494 年遷都洛陽", "where": "平城（今山西大同，靠近草原）→ 洛陽（黃河邊，漢文化中心）", "ctx": "鮮卑人統一北方後面對難題：十幾萬鮮卑人要管幾百萬漢人，而且平城太北、太冷、農業差。孝文帝決定「變成漢人」：遷都洛陽，改漢姓（拓跋→元）、穿漢服、說漢語、和漢人世族通婚。鮮卑貴族反彈甚至叛亂，他強硬鎮壓。結果胡漢融合，為後來隋唐（皇室本身就是胡漢混血）打下基礎。", "ask": "孝文帝為什麼要「放棄自己的文化」？划算嗎？", "hint": "他算的是統治帳：要長久統治漢人，就得讓漢人接受。短期鮮卑內部分裂（北魏後來因此分成東西魏），長期卻讓北方胡漢融合，促成隋唐。"}, {"t": "六朝", "zh": "孫吳、東晉、宋、齊、梁、陳六個朝代都把首都設在今天的南京（長江流域以南）。", "why": "考「南方經濟發展的開發期（311–589 年）原因」→ 六朝的經營。", "era": ["魏晉南北朝"], "when": "孫吳 222～280；東晉 317～420；宋齊梁陳 420～589（隋滅陳）", "where": "都在建康（今南京），長江下游", "ctx": "三國的孫吳先在江南建國，開發的底子在這。永嘉之禍後東晉和宋、齊、梁、陳接著經營，六個朝代前後三百多年都以南京為中心。北方戰亂時江南相對安定，人口和農業持續成長，所以南方經濟的「開發期」就是 311～589 年。", "ask": "為什麼六朝都選南京當首都？", "hint": "長江是天然防線，擋得住北方騎兵；江南又有糧。地理條件決定了南北對峙的格局。"}, {"t": "唐太宗＝天可汗", "zh": "唐朝皇室有胡人血統，對外族平等開放。唐太宗滅東突厥後，西北各族尊他為「天可汗」，等於東亞的國際盟主。外族商人、僧侶、留學生大量來中國。", "why": "考「四夷君長請上為天可汗」→ 唐太宗；考隋唐對胡漢的態度 → 平等開放。", "era": ["唐"], "when": "630 年唐滅東突厥，西北各族尊唐太宗為「天可汗」", "where": "長安是中心；勢力到蒙古高原、西域", "ctx": "隋唐繼承北朝，皇室有鮮卑血統（唐高祖的母親獨孤氏是鮮卑人），本來就不分胡漢。唐太宗打敗東突厥後不是消滅他們，而是讓他們內附、當官當將領。草原各族於是尊他為「天可汗」（可汗＝草原的王），等於同時當農業民族的皇帝和草原民族的共主，是東亞的國際盟主。", "ask": "唐太宗和秦始皇都很強，對外族的態度差在哪？", "hint": "秦築長城「隔開」；唐太宗「納進來」用。開放帶來盛世，但也埋下安史之亂（安祿山是胡人將領）的種子，大抓週第七課問的就是這個。"}], "order": {"title": "把這 7 件事排出先後", "hint": "從最早的開始點，點錯可以點答案區的卡片退回去。", "items": ["東周各國築城牆擋匈奴", "秦連成長城", "漢武帝派張騫出使西域", "西晉八王之亂", "永嘉之禍，西晉滅亡", "北魏孝文帝遷都洛陽、漢化", "唐太宗被尊為天可汗"]}, "match": {"title": "草原民族 vs 農業民族", "hint": "左邊一個、右邊一個，點兩下就配成一組。", "pairs": [["草原民族住哪", "長城以北"], ["農業民族住哪", "長城以南"], ["草原民族怎麼過活", "畜牧，逐水草而居"], ["農業民族怎麼過活", "農業，大多定居"], ["草原民族的政治", "部落聯盟"], ["農業民族的政治", "中央政權"]]}, "main": ["h1_1", "h1_2", "h1_4", "h1_6", "h1_r1", "b_2", "b_3", "c_2", "c_6", "e114_26"], "pool": ["h1_5", "h1_r2", "h1_r3", "b_1", "e112_24", "e112_29", "e112_30", "e112_31", "e113_27", "e113_29", "e113_31", "e113_33", "e114_25", "e114_27"]}, {"id": 2, "title": "第 2 天｜外來文化傳進中國", "page": "講義 p.11–12、課本 p.86", "intro": "佛教、伊斯蘭教，還有胡人的吃穿玩樂，怎麼一步步變成唐朝的流行。", "big": "一個印度來的宗教怎麼變成中國人的信仰？唐朝人為什麼什麼都敢吃、敢穿、敢聽？", "cards": [{"t": "佛教的起源", "zh": "西元前 6 世紀創立於印度（古代中國叫「天竺」）。", "why": "段考考過「佛教起源於何處」→ 印度。", "era": ["東周"], "when": "西元前 6 世紀（和孔子差不多同時代）", "where": "印度（古稱天竺），釋迦牟尼在恆河流域創立", "ctx": "佛教講人生是苦，靠修行解脫輪迴。它先傳到中亞、西域，再順著絲路來中國。中國人叫印度「天竺」，玄奘去的「西天」就是那裡。", "ask": "中國主要的宗教裡，哪些是「外來」的？", "hint": "佛教（印度）、伊斯蘭教（阿拉伯）、景教、祆教、摩尼教（都來自西亞）是外來的；道教是本土的。"}, {"t": "佛教傳入：西漢末", "zh": "西漢末年（1 世紀前後）經由西域傳入中國，一開始沒什麼人信。東漢明帝派人求法，在洛陽建白馬寺（中國第一座佛寺）。", "why": "考「何時經西域傳入」→ 西漢末。", "era": ["漢"], "when": "西漢末（1 世紀前後）傳入；東漢明帝（1 世紀中）建白馬寺", "where": "經西域沿絲路而來；白馬寺在洛陽（東漢首都）", "ctx": "絲路開通後，西域商人和僧侶把佛教帶進來。東漢明帝派人去西域求法，用白馬馱經書回洛陽，建了中國第一座佛寺。但漢代儒家獨尊、社會安定，佛教只在少數人之間流傳。", "ask": "佛教在漢代為什麼「傳進來了卻不流行」？", "hint": "社會還算安穩、儒家又是主流，人不太需要一個講「苦」和來世的宗教。宗教流不流行，要看那個時代需要什麼。"}, {"t": "佛教興盛：魏晉南北朝", "zh": "政權一直換、天天打仗，人心想找寄託，佛教大流行。梁武帝四次出家。佛經大量翻譯。", "why": "考「佛教在戰亂時成為人民的寄託」→ 魏晉南北朝。", "era": ["魏晉南北朝"], "when": "4～6 世紀", "where": "南北都盛：北方胡人政權動用國力建石窟；南方梁武帝在建康大建佛寺（「南朝四百八十寺」）", "ctx": "政權天天換、戰爭不停，人活得沒把握，佛教講的因果、來世、解脫正好給人安慰。胡人君主不是儒家出身，更願意靠佛教建立正當性；南方士族則把佛理和玄學一起談。梁武帝四次出家，國家要花大錢把他贖回來，佛教盛到影響國力。", "ask": "同樣的宗教，漢代沒人理、南北朝大流行，差別在哪？", "hint": "差在時代：亂世人心需要寄託。大抓週第六課的說法是「戰亂頻繁，人們尋求心靈慰藉」。"}, {"t": "三大石窟", "zh": "莫高窟（甘肅敦煌）、雲岡石窟（山西大同）、龍門石窟（河南洛陽），都是魏晉南北朝開鑿。雲岡還有印度味，龍門已是中國臉。", "why": "考石窟對地點、考「石窟反映什麼」→ 佛教盛行。", "era": ["魏晉南北朝", "唐"], "when": "北魏開鑿（5 世紀）；莫高窟和龍門到唐代還持續開鑿", "where": "莫高窟在敦煌（甘肅，絲路入口）；雲岡在平城（山西大同，北魏前期首都）；龍門在洛陽（北魏遷都後）", "ctx": "三個石窟的位置剛好就是佛教傳入的路線和北魏遷都的路線：敦煌是絲路進中國的第一站，所以最早；雲岡在舊都平城，佛像高鼻深目有印度味；龍門在新都洛陽，佛像已經是中國人的臉和衣服。看石窟就看得到「佛教一路中國化」。", "ask": "雲岡和龍門的佛像為什麼長得不一樣？", "hint": "雲岡（遷都前）還照西域傳來的樣式刻；龍門（遷都、漢化後）工匠照漢人的審美刻。石窟是孝文帝漢化的藝術證據。"}, {"t": "唐朝：玄奘取經，佛教中國化", "zh": "唐太宗時玄奘到印度取經，回國翻譯大量佛經，佛教更貼近中國。禪宗說「人人皆有佛性，不出家也能成佛」，士大夫很愛。", "why": "考「玄奘最大貢獻」→ 有系統地翻譯佛經；考「玄奘的時代背景」→ 唐朝風氣開放、宗教交流頻繁。", "era": ["唐"], "when": "唐太宗時，約 627 年出發、645 年回長安，在外 19 年", "where": "長安 → 西域 → 中亞 → 印度那爛陀寺求學 → 帶回 657 部佛經", "ctx": "翻譯的佛經版本太多、互相矛盾，玄奘決定自己去印度找原典。回國後在長安有系統地翻譯，佛經變準確、好懂，佛教才真正和中國思想結合。之後禪宗說「人人皆有佛性」，不必苦修也能悟道，很合士大夫口味，佛教徹底中國化。", "ask": "玄奘的貢獻為什麼是「翻譯」而不是「取經」？", "hint": "取經是手段，翻譯才讓中國人讀得懂、用得上。考題選「有系統地翻譯佛經」。"}, {"t": "伊斯蘭教（回教）", "zh": "7 世紀阿拉伯人穆罕默德創立的一神信仰，唐代傳入中國。廣州懷聖寺＝中國現存最早的清真寺。", "why": "考唐代宗教多元 → 佛教、伊斯蘭教都有。", "era": ["唐"], "when": "7 世紀初穆罕默德在阿拉伯創立；7 世紀中（唐高宗時）傳入中國", "where": "海路到廣州（懷聖寺）、陸路到長安；阿拉伯＝大食", "ctx": "伊斯蘭教創立後阿拉伯帝國快速擴張到中亞，和唐朝接壤（後來打了怛羅斯之戰）。大食商人走海路到廣州、泉州，走陸路到長安做生意，順便把信仰帶來。廣州懷聖寺是中國現存最早的清真寺，證明唐代就有穆斯林社群。", "ask": "伊斯蘭教和佛教傳入中國的「路線」有什麼不同？", "hint": "佛教主要走陸上絲路（西域 → 洛陽）；伊斯蘭教陸海都有，海路到廣州是重點。唐代的對外交通已經不只一條路。"}, {"t": "胡風＝唐朝的流行", "zh": "胡食（葡萄酒、胡麻餅）、胡服（短衣窄袖）、胡樂（琵琶、胡琴、羌笛）、胡旋舞，長安城裡胡商雲集。「漢戴胡帽，胡戴漢帽」。唐文化的特色＝兼容並蓄。", "why": "考「長安買到胡食、看到胡服」顯示社會特色 → 兼容並蓄；考唐詩裡的胡風。", "era": ["唐"], "when": "唐代，盛唐（7～8 世紀）最盛", "where": "長安西市胡商雲集；胡姬酒肆、胡旋舞在長安街頭", "ctx": "唐皇室本身胡漢混血，對外族平等開放，絲路和海路又把各國商人帶來。吃的（葡萄酒、胡麻餅）、穿的（短衣窄袖、胡帽）、聽的（琵琶、胡琴、羌笛）、跳的（胡旋舞）都成了流行，連女子也騎馬打球。「漢戴胡帽，胡戴漢帽」說的就是互相學。唐文化的特色＝兼容並蓄。", "ask": "唐朝人「什麼都接受」，是沒有自己的文化嗎？", "hint": "相反，是夠自信才敢接受。把外來的吸收進來變成自己的（像唐詩寫葡萄酒、琵琶），這叫兼容並蓄，不是崇洋。"}], "order": {"title": "佛教在中國的五步", "hint": "從最早的一步開始點。", "items": ["西元前 6 世紀在印度創立", "西漢末年經西域傳入中國", "魏晉南北朝大流行、開鑿三大石窟", "唐太宗時玄奘到印度取經、翻譯佛經", "禪宗流行，士大夫也信"]}, "match": {"title": "胡風配對：這是哪一類", "hint": "唐詩與生活裡的胡風，配到正確的類別或地點。", "pairs": [["莫高窟", "甘肅敦煌"], ["雲岡石窟", "山西大同"], ["龍門石窟", "河南洛陽"], ["胡麻餅、葡萄酒", "胡食"], ["琵琶、胡琴、羌笛", "胡樂"], ["短衣窄袖", "胡服"], ["懷聖寺", "伊斯蘭教清真寺"]]}, "main": ["h2_2", "h2_4", "c_1", "c_5", "e114_30", "e114_32", "e113_30", "h1_3", "e114_24", "e113_28"], "pool": []}, {"id": 3, "title": "第 3 天｜中國文化傳出去 ＋ 總複習", "page": "講義 p.12–15、課本 p.87、89", "intro": "日本、新羅學唐朝，吐蕃娶公主，大食打一仗學到造紙。最後把前兩天錯的再練一次。", "big": "唐朝憑什麼讓日本、新羅主動來學？文化是怎麼傳出去的，又傳了什麼回來？", "cards": [{"t": "東亞文化圈", "zh": "隋唐太強，日本、朝鮮都來學，形成以中國為中心的東亞文化圈。西邊則和吐蕃、大食有往來。", "why": "考地圖箭頭從長安指向新羅、日本 → 唐文化傳播的路徑。", "era": ["隋", "唐"], "when": "隋唐（6～9 世紀）", "where": "以長安為中心，東到日本、朝鮮半島（新羅），南到安南（今越南北部）；西邊另有吐蕃、大食", "ctx": "隋唐統一後國力強、制度完整，周邊國家為了讓自己也變強，主動來學：漢字、儒學、律令、佛教、曆法。這些共同元素把東亞連成一個文化圈。傳出去的方向（長安 → 新羅、日本）和傳進來的方向（西域 → 長安）剛好相反。", "ask": "周邊國家為什麼「自願」學唐朝？", "hint": "不是被征服，是看到唐的制度有效，想複製來強化自己的國家。文化傳播靠吸引力，比靠武力更久。"}, {"t": "日本：遣唐使 → 大化革新", "zh": "日本多次派遣唐使（帶學生和僧侶）來學文化與佛法。7 世紀中葉孝德天皇推「大化革新」＝照唐朝制度改革（唐化運動）。飲茶、佛教、書法東傳。", "why": "考「日本效法唐代的改革叫什麼」→ 大化革新；使節團成員 → 留學生、僧侶。", "era": ["唐"], "when": "630～894 年共派十幾次遣唐使；645 年孝德天皇大化革新", "where": "從日本渡海到長安，船隊常遇難；學成帶回奈良（平城京仿長安建）", "ctx": "日本原本是豪族各管各的，看到唐朝皇帝中央集權很強，派留學生和僧侶來學。645 年孝德天皇照唐制改革：土地國有、建立中央官制、地方設郡＝大化革新，日本從此成為中央集權國家。連首都奈良都照長安的棋盤格蓋。", "ask": "日本學唐朝，學的是「東西」還是「制度」？", "hint": "兩者都學，但大化革新最重要的是制度（中央集權、律令）。飲茶、佛教、書法是文化，天皇制和官制是骨架。"}, {"t": "日本文字", "zh": "片假名取漢字楷書的偏旁，平假名模仿漢字草書。", "why": "考「日文仿中國文字的歷史背景」→ 日本推動大化革新。", "era": ["唐"], "when": "8～9 世紀（遣唐使時代）逐漸形成", "where": "日本", "ctx": "日本原本沒有文字，先直接用漢字寫，但日語發音和中文不同，不好用。於是拿漢字楷書的偏旁造「片假名」、把漢字草書簡化成「平假名」，用來標音。所以日文到今天還混用漢字和假名，是唐文化東傳最看得見的痕跡。", "ask": "日本為什麼不直接全用漢字就好？", "hint": "因為語言不同：漢字表意不表音，日語的助詞和變化寫不出來，需要一套表音符號。借來的東西總會被改造成自己的。"}, {"t": "新羅＝君子國", "zh": "7 世紀統一朝鮮半島，模仿中國的文字、曆法、儒學、佛教、律令、衣冠，被稱「君子國」。", "why": "考「君子國」→ 新羅；考「想看新羅與大唐的傳承要去哪」→ 朝鮮半島。", "era": ["唐"], "when": "668 年新羅聯合唐朝統一朝鮮半島", "where": "朝鮮半島，都慶州", "ctx": "朝鮮半島原本三國（高句麗、百濟、新羅），新羅靠和唐聯軍統一。之後全面學唐：用漢字、唐曆法、儒學、佛教、律令、衣冠，派大量留學生到長安（崔致遠還在唐朝當官）。因為學得最徹底、最講禮，中國人稱它「君子國」。", "ask": "新羅和日本都學唐朝，考題怎麼分？", "hint": "「君子國」、「朝鮮半島」＝新羅；「大化革新」、「遣唐使」、「假名」＝日本。地點題記半島 vs 島國。"}, {"t": "吐蕃：文成公主", "zh": "吐蕃（今西藏）唐太宗時求婚，文成公主和親，帶去穀物種子、工藝、藥材、茶葉、書籍和佛教。拉薩布達拉宮就是為她建的。", "why": "考「文成公主嫁到哪」→ 吐蕃，不是大食。", "era": ["唐"], "when": "641 年唐太宗把文成公主嫁給吐蕃贊普松贊干布", "where": "吐蕃＝今西藏，都邏些（今拉薩）；布達拉宮傳說為她而建", "ctx": "吐蕃在青藏高原崛起，和唐時戰時和。唐太宗用和親拉攏，文成公主帶去穀物種子、工匠、藥材、茶葉、書籍和佛教，西藏從此有了漢傳佛教的影響和飲茶習慣。這是唐朝「文化向西傳」的例子（往東是日本、新羅）。", "ask": "和親是「嫁一個人」，還是「嫁一整套文化」？", "hint": "是後者。公主帶的隨行工匠、書籍、作物才是重點，影響比婚姻本身久。對照漢代王昭君和親匈奴，也是同一種外交。"}, {"t": "大食：怛羅斯之戰", "zh": "大食＝阿拉伯帝國。8 世紀中葉（751 年）唐軍在中亞怛羅斯打輸，造紙匠被俘，造紙術西傳。", "why": "考「怛羅斯之戰後哪項發明西傳」→ 造紙術；唐朝輸出品 → 造紙術（葡萄酒、胡旋舞、琵琶都是傳進來的）。", "era": ["唐"], "when": "751 年（唐玄宗天寶十年，安史之亂前四年）", "where": "中亞怛羅斯（今哈薩克境內），唐和大食勢力的交界", "ctx": "唐和阿拉伯帝國（大食）都往中亞擴張，終於碰上。唐軍（高仙芝）戰敗，唐在中亞的影響力結束；但被俘的唐軍裡有造紙工匠，造紙術傳到阿拉伯，再傳到歐洲，取代羊皮紙，對世界影響極大。戰俘杜環還寫了中國第一本描述西亞的書。", "ask": "一場「打輸」的仗，為什麼在世界史上很重要？", "hint": "因為造紙術西傳改變了整個歐亞的知識傳播。歷史的影響常常不在輸贏，而在過程中發生了什麼。"}, {"t": "長安城", "zh": "隋代開始建，唐代近百萬人，世界第一大城。棋盤式街道，老百姓住「里坊」。佛教、道教、三夷教（祆教、景教、摩尼教）都有，粟特人擅長做生意。", "why": "考「為什麼說長安是國際城市」→ 各國人、各種宗教都在。", "era": ["隋", "唐"], "when": "隋文帝 582 年建（大興城），唐沿用；8 世紀人口近百萬，當時世界最大城", "where": "今陝西西安；絲路東端的起點", "ctx": "城市是棋盤格：皇城在北，百姓住一格一格的「里坊」，夜間關坊門；東市、西市做生意，西市滿是胡商（粟特人最會做生意）。城裡有佛寺、道觀，也有祆教、景教、摩尼教的寺院，各國留學生、使節、商人都在。長安就是唐朝「兼容並蓄」的縮影，也是日本奈良、新羅慶州模仿的對象。", "ask": "怎麼判斷一座城是「國際都市」？", "hint": "看有多少國家的人、多少種宗教、多少種語言同時在裡面。長安三夷教並存、胡商雲集，就是證據。"}], "order": null, "match": {"title": "哪個國家、哪件事", "hint": "國家配事件，還有三位唐代女子配皇帝。", "pairs": [["日本", "遣唐使、大化革新"], ["新羅", "君子國"], ["吐蕃", "文成公主和親"], ["大食", "怛羅斯之戰、造紙術西傳"], ["文成公主", "唐太宗時和親吐蕃"], ["武則天", "唐高宗皇后，後來稱帝"], ["楊貴妃", "唐玄宗寵妃，安史之亂"]]}, "main": ["h2_1", "h2_3", "h2_5", "h2_6", "h2_7", "c_3", "e112_34", "e113_34", "e114_34", "e112_26"], "pool": ["c_4", "e112_33", "e114_31", "e114_33"]}], "questions": [{"id": "h1_1", "src": "講義 2-1 隨堂 1", "q": "中國歷史上，草原民族與農業民族經歷長久的競爭與融合。請問：兩者的分界線位於何處？", "o": ["長江", "長城", "絲路", "黃河"], "a": 1, "ex": "秦連成長城後，長城就是農業民族（南）與草原民族（北）的分界線。", "card": "長城＝分界線"}, {"id": "h1_2", "src": "講義 2-1 隨堂 2", "q": "中國於 2014 年提出「一帶一路」政策，其中陸路「絲綢之路」在中國歷史上已於漢代開通。請問：當時開通原因為何？", "o": ["聯絡西域各國，抵制匈奴的威脅", "發展貿易，籌措攻打匈奴的經費", "國力不敵匈奴，開通和親的路線", "修築萬里長城，運輸材料的通道"], "a": 0, "ex": "漢武帝派張騫出使西域，目的是聯絡西域國家一起打擊匈奴，絲路是順便開通的。", "card": "張騫通西域"}, {"id": "h1_3", "src": "講義 2-1 隨堂 3", "q": "詩詞文章往往能反映一個時代的政治與社會變化。下列詩句當中，何者「無法」感受中國歷史上周邊民族與中國文化交融的時代意義？", "o": ["葡萄美酒夜光杯，欲飲琵琶馬上催", "千呼萬喚始出來，猶抱琵琶半遮面", "年年戰骨埋荒外，空見蒲桃入漢家", "但使龍城飛將在，不教胡馬渡陰山"], "a": 1, "ex": "琵琶半遮面只是在描寫琵琶女出場，沒有胡漢交流的意思。其他三句都有葡萄（蒲桃）、琵琶、胡馬等西域元素。", "card": "胡風＝唐朝的流行"}, {"id": "h1_4", "src": "講義 2-1 隨堂 4", "q": "某草原民族於黃河流域建國後，其君王積極推行漢化政策，包括改漢姓、通婚姻、說漢語等。請問：該君王為何人？", "o": ["秦始皇", "漢武帝", "北魏孝文帝", "唐太宗"], "a": 2, "ex": "改漢姓、通婚、說漢語＝北魏孝文帝的漢化措施。", "card": "北魏孝文帝漢化"}, {"id": "h1_5", "src": "講義 2-1 隨堂 5", "q": "有學者分析草原民族與農業民族的關係時，指出草原民族以漸進方式移入農業民族地區之後，會學習農業民族的組織及管理技巧，甚至進而建立政權。下列何者屬於此種情形？", "o": ["史前時代的臺灣原住民", "魏晉南北朝時期的匈奴與北魏政權", "隋唐時期的突厥政權", "隋唐時期的日本、新羅等國"], "a": 1, "ex": "五胡內遷後在黃河流域建國（五胡十六國），鮮卑人更建立北魏統一北方，就是「移入後建立政權」。", "card": "五胡"}, {"id": "h1_6", "src": "講義 2-1 隨堂 6", "q": "中國歷史上南方經濟發展示意圖中，311 年到 589 年是「開發期」，發展程度大幅提高。請問：原因為何？", "o": ["黃巾之亂", "周公東征", "張騫出使西域", "六朝的經營"], "a": 3, "ex": "311 年永嘉之禍後北方人南遷，六朝（孫吳、東晉、宋齊梁陳）在南京經營南方，到 589 年隋滅陳為止。", "card": "六朝"}, {"id": "h1_r1", "src": "講義 資料閱讀 1", "q": "漢高祖被匈奴包圍後採「和親」政策；漢元帝時王昭君自願嫁給呼韓邪單于，此後六十多年沒有戰爭。請問：王昭君的經歷反映漢代對外族採取何種外交方式？", "o": ["派兵攻打迫使外族投降", "稱臣投降避免衝突", "贈與金錢換取和平", "和親換取邊境安寧"], "a": 3, "ex": "把公主（或宮女）嫁給單于換和平，就是「和親」。", "card": "張騫通西域"}, {"id": "h1_r2", "src": "講義 資料閱讀 2", "q": "王昭君下嫁的呼韓邪單于，為當時漢代北方最大外患的領導者，他最有可能是下列哪一民族？", "o": ["突厥", "匈奴", "犬戎", "鮮卑"], "a": 1, "ex": "漢代北方最大外患是匈奴；突厥是隋唐的事，犬戎是西周的事。", "card": "五胡"}, {"id": "h1_r3", "src": "講義 資料閱讀 3", "q": "中國自秦代以來，為了防止此外族入侵，曾經採取下列何種方式防禦？", "o": ["統一車軌", "實施封建", "興築長城", "開通絲路"], "a": 2, "ex": "秦始皇把各國城牆連成長城，防禦匈奴南下。", "card": "長城＝分界線"}, {"id": "b_1", "src": "課本 學習會考 1", "q": "（地圖中「甲」是沿北方邊境的長城）根據地圖內容，「甲」最早在何時修築完成？", "o": ["西周", "秦朝", "漢朝", "唐朝"], "a": 1, "ex": "東周各國各築各的，秦統一後才連成長城。", "card": "長城＝分界線"}, {"id": "b_2", "src": "課本 學習會考 2", "q": "（「甲」是長城）以中國史的角度來看，「甲」對於當時的族群關係而言，有何意義？", "o": ["是農業與草原民族間的交流通道", "是魏晉南北朝時胡人分布最南端", "是中原地區通往西方的必經之路", "是防禦北方匈奴南下的國防設施"], "a": 3, "ex": "長城是防線，不是通道；通往西方的路是絲路。", "card": "長城＝分界線"}, {"id": "b_3", "src": "課本 學習會考 3", "q": "（「乙」是從長安往西到大秦的路線）圖中「乙」路線的開通，造成了何種影響？", "o": ["打通了往羅馬帝國的路線，中亞從此成為中國的版圖", "東西交通因而暢通，間接促成新航路與新大陸的發現", "增進漢人對西域的認識，促成東西文化與貿易的交流", "因絲路的暢通，使阿拉伯人居中成為東西貿易的主角"], "a": 2, "ex": "絲路的影響是東西文化與貿易交流；中亞沒有變成中國版圖，新航路是一千多年後的事。", "card": "絲路"}, {"id": "h2_1", "src": "講義 2-2 隨堂 1", "q": "小慧參加學校的日語社，老師說日文是模仿中國文字而設計。片假名採取漢字楷書偏旁簡化而成，平假名則是摹仿漢字草書所作。請問：出現此情形的歷史背景為何？", "o": ["唐太宗宣布與日本和親", "日本推動大化革新", "怛羅斯之役造成文物東傳", "西域動亂，日本派兵援助唐帝國"], "a": 1, "ex": "日本派遣唐使學唐朝文化，推動大化革新，連文字都仿漢字。", "card": "日本文字"}, {"id": "h2_2", "src": "講義 2-2 隨堂 2", "q": "隋唐時代，在長安城可以買到「胡食」，看到「胡姬」歌舞、細腰窄袖的「胡服」等景象，這顯示當時的社會有何特色？", "o": ["兼容並蓄", "崇洋媚外", "文化嚴重隔離", "壓抑漢人文化"], "a": 0, "ex": "唐朝什麼都接受，叫「兼容並蓄」。", "card": "胡風＝唐朝的流行"}, {"id": "h2_3", "src": "講義 2-2 隨堂 3", "q": "仕豪到日本奈良旅遊，發現東大寺很像中國的建築，導遊解釋此寺是摹仿唐代風格所建。仕豪回國後即查閱相關資料。請問：下列何者「不可能」是他查到的內容？", "o": ["唐代時中國書法、建築、佛教等文化東傳日本", "日本推行的大化革新，是模仿唐代文化的成果", "日本派遣使者及留學生，將中國文化帶回日本", "玄奘曾前往日本求法，對文化交流貢獻很大"], "a": 3, "ex": "玄奘是去印度取經，不是去日本。", "card": "日本：遣唐使 → 大化革新"}, {"id": "h2_4", "src": "講義 2-2 隨堂 4", "q": "歷史課時，小玲上臺報告有關唐代文化的敘述，下列哪一項「錯誤」？", "o": ["唐代聲威遠播，對印度與大食的文化影響頗深", "唐代文化包容性極強，具有兼容並蓄的特質", "唐代是中國歷史上對宗教頗為寬容的時期，佛教發展到鼎盛", "唐代社會可見胡食、胡服、胡樂與胡舞等西域文化內容"], "a": 0, "ex": "唐文化影響的是日本、新羅（東亞文化圈）；印度和大食是把文化傳進來的一方。", "card": "東亞文化圈"}, {"id": "h2_5", "src": "講義 2-2 隨堂 5", "q": "小瑜出國旅遊，發現當地文字竟與中國文字很類似，導遊說：「這個國家在 7 世紀時，派人至中國學習律令制度及文化，再進行一連串的改革。」請問：她可以去查閱下列哪一本書籍？", "o": ["《西域文化在中國》", "《吐蕃的漢化》", "《唐代文化在日本》", "《天可汗的國度》"], "a": 2, "ex": "7 世紀派人到中國學律令再改革＝日本的大化革新。", "card": "日本：遣唐使 → 大化革新"}, {"id": "h2_6", "src": "講義 2-2 隨堂 6", "q": "日本在隋唐時代多次派「使節團」到中國，有系統、有計畫地學習中國的典章制度與文化，成員通常有數百人之多。請問：除了官方使節外，主要還包括下列哪些人？", "o": ["商人、軍人", "商人、留學生", "軍人、留學生", "留學生、僧侶"], "a": 3, "ex": "遣唐使帶的是來學習的留學生和來學佛法的僧侶。", "card": "日本：遣唐使 → 大化革新"}, {"id": "h2_7", "src": "講義 2-2 隨堂 7", "q": "「中國第一個描寫歐洲的人是杜環，他留下了比西亞更西邊的資料。杜環到西亞去並非出於自願，也並非官派，而是作為一個戰俘被押解去的。不過，唐帝國在此戰中損失慘重，也喪失在中亞的領導權。」關於杜環的身世背景，下列何項理解正確？", "o": ["他曾作為吐蕃的俘虜", "俘虜他的國家後因文成公主和親而可能將他遣返", "他可能是在怛羅斯被敵軍所捕", "當時他是替唐太宗出戰"], "a": 2, "ex": "唐軍在中亞打輸、戰俘被押到西亞＝怛羅斯之戰（對手是大食，時間是 8 世紀中葉，不是唐太宗時）。", "card": "大食：怛羅斯之戰"}, {"id": "c_1", "src": "歷屆會考 1", "q": "玉潔參觀「歷代中國婦女生活文物展」，看到一尊泥俑：女子騎馬擊球，面容豐腴、穿著胡服。此朝代最可能是下列何者？", "o": ["漢代", "唐代", "宋代", "明代"], "a": 1, "ex": "女子騎馬打馬球、穿胡服、豐腴＝唐代風氣。", "card": "胡風＝唐朝的流行"}, {"id": "c_2", "src": "歷屆會考 2（105 會考改）", "q": "「中國史上，某位皇帝考量原根據地的農業生產落後，且北方外族威脅漸弱，為有效擴張勢力，因此將都城向南遷徙到漢文化的重鎮。遷都後，因貴族與大臣反彈，甚至起而叛亂，皇帝剷除反對勢力後，更加大力推行漢化，禁胡服、胡語。」上文所述最可能是下列哪一個時代的事件？", "o": ["周代", "漢代", "北魏", "唐代"], "a": 2, "ex": "遷都到漢文化重鎮（洛陽）＋禁胡服胡語＝北魏孝文帝。", "card": "北魏孝文帝漢化"}, {"id": "c_3", "src": "歷屆會考 3", "q": "唐文化影響亞洲各國，其中新羅對大唐文化的學習尤其激進，曾全力模仿中國的文字、曆法、儒學等。若我們想探訪新羅與大唐文化的傳承關係，應到現今何處？", "o": ["朝鮮半島", "琉球群島", "中南半島", "印度半島"], "a": 0, "ex": "新羅在朝鮮半島。", "card": "新羅＝君子國"}, {"id": "c_4", "src": "歷屆會考 4", "q": "一幅圖描繪中國某一時代的官員正在接待來訪使節：有拜占庭帝國使者、高麗或新羅使者、東北少數民族使者。根據圖片內容判斷，此時代最可能是下列何者？", "o": ["周代", "漢代", "唐代", "清代"], "a": 2, "ex": "各國使節齊聚＝唐代（唐墓壁畫〈禮賓圖〉）。", "card": "東亞文化圈"}, {"id": "c_5", "src": "歷屆會考 5", "q": "唐代玄奘對佛教中國化的貢獻極大，最主要是因他有下列何種重要作為？", "o": ["廣建佛寺", "首創佛教宗派", "新闢西行取經的捷徑", "有系統地翻譯佛經"], "a": 3, "ex": "玄奘回國後翻譯大量佛經，佛教才真正「中國化」。", "card": "唐朝：玄奘取經，佛教中國化"}, {"id": "c_6", "src": "歷屆會考 6", "q": "元大木回憶年輕時，從平城遷居洛陽，並配合政府的政策與漢人結婚，改變穿著，甚至改用漢姓。請問：他應該是哪一個時代的人？", "o": ["秦漢", "南北朝", "隋唐", "明清"], "a": 1, "ex": "平城→洛陽、通婚、改漢姓＝北魏孝文帝漢化，北魏屬南北朝。「元」就是拓跋改的漢姓。", "card": "北魏孝文帝漢化"}, {"id": "e112_24", "src": "112 段考 24", "q": "西元 311 年，北方匈奴人南下爆發「永嘉之禍」，逼迫原來在黃河流域的北方人士避難南遷，造成深遠影響。請問以下敘述何者「錯誤」？", "o": ["加速南方經濟的開發", "北魏孝文帝積極推動胡化運動", "中國經濟重心逐漸南移", "南北方的民族文化得以融合交流"], "a": 1, "ex": "孝文帝推的是「漢化」，不是胡化。其他三項都是永嘉之禍的影響。", "card": "永嘉之禍（311 年＝4 世紀）"}, {"id": "e112_26", "src": "112 段考 26", "q": "西元 751 年，阿拉伯（大食）軍隊與唐朝軍隊大戰於中亞的怛羅斯，唐軍失利。請問：這場戰役後造成哪一項中國的發明西傳？", "o": ["火藥", "造紙術", "印刷術", "指南針"], "a": 1, "ex": "造紙匠被俘，造紙術傳到阿拉伯，再傳到歐洲。", "card": "大食：怛羅斯之戰"}, {"id": "e112_29", "src": "112 段考 29", "q": "漢代開通了一條從長安往西經過西域的交通路線。請問：此路的開通與哪一史事關係最為密切？", "o": ["秦始皇統一天下", "玄奘西行取經求法", "張騫經營西域", "唐代大食怛羅斯之役"], "a": 2, "ex": "張騫出使西域打通了絲路。", "card": "張騫通西域"}, {"id": "e112_30", "src": "112 段考 30", "q": "（承上題）當時這條交通路線商旅往來愈來愈頻繁，最受西方商旅喜愛的商品是哪一項？", "o": ["茶葉", "瓷器", "紙張", "絲織品"], "a": 3, "ex": "所以才叫「絲」路。", "card": "絲路"}, {"id": "e112_31", "src": "112 段考 31", "q": "（承上題）這條路線最西可到達地圖上的「甲」地（地中海東岸一帶）。請問：甲地當時屬於哪一國家的領域？", "o": ["大秦", "安息", "身毒", "大月氏"], "a": 0, "ex": "絲路最遠到大秦（羅馬帝國）。安息是伊朗、身毒是印度。", "card": "絲路"}, {"id": "e112_33", "src": "112 段考 33", "q": "西元七世紀時，日本孝德天皇在唐朝時多次派人前往中國，學習中國文化與佛法，導致中國的飲茶、佛教、書法因而東傳。此外，日本文字的創作亦受到中國文字的影響。請問：日本效法唐代文化的「唐化運動」稱為什麼？", "o": ["永貞革新", "貞觀之治", "大化革新", "開元之治"], "a": 2, "ex": "貞觀之治、開元之治是唐朝自己的盛世，不是日本的改革。", "card": "日本：遣唐使 → 大化革新"}, {"id": "e112_34", "src": "112 段考 34", "q": "柏霖在遊戲排位賽中，負責打「上路」到歷史上的「君子國」，他必須找熟悉地形的當地人同行，下列哪一位是他適合選擇的隊友？", "o": ["新羅人：金秀明", "日本人：大野原", "大食人：諾可西", "吐蕃人：棄宗弄贊"], "a": 0, "ex": "君子國＝新羅。", "card": "新羅＝君子國"}, {"id": "e113_27", "src": "113 段考 27", "q": "漢代張騫曾奉漢武帝之命出使西域。請問：張騫出使西域的最大貢獻為何？", "o": ["成功驅逐匈奴", "使西域各國都願服從漢朝", "溝通中西交通與促進文化交流", "認識西域地理環境，並使匈奴成功漢化"], "a": 2, "ex": "張騫沒有打敗匈奴，他的貢獻是打通中西交通（絲路）。", "card": "張騫通西域"}, {"id": "e113_28", "src": "113 段考 28", "q": "甲：隋文帝的皇后為獨孤氏，唐高祖的母親也是獨孤氏。乙：一些唐朝名人為追求突厥式生活的熱情，竟能忍受不舒適的帳篷生活。請問：隋唐時代，在胡漢的議題上大多採取何種態度？", "o": ["井水不犯河水", "畫地自限", "看不到看不到", "平等開放"], "a": 3, "ex": "隋唐皇室本身有胡人血統，對胡漢一視同仁。", "card": "唐太宗＝天可汗"}, {"id": "e113_29", "src": "113 段考 29", "q": "某帝認為：「鮮卑人作為統治者，必須漢化，國家才能長治久安……現在我要廢除所有的北方語言，從正確的發音開始。」請問：某帝為下列何人？", "o": ["唐太宗", "秦始皇", "漢武帝", "北魏孝文帝"], "a": 3, "ex": "鮮卑人＋廢北方語言＝北魏孝文帝。", "card": "北魏孝文帝漢化"}, {"id": "e113_30", "src": "113 段考 30", "q": "學者提到：「過去歷史研究偏重統治者的歷史，比較忽略人民的歷史，其實人民才是我們應該關心的主體。」請問：下列哪個主題最接近這位學者主張的研究方向？", "o": ["西周的封建制度", "曹魏的九品官人法", "秦始皇實施郡縣制度", "隋唐「漢戴胡帽，胡戴漢帽」"], "a": 3, "ex": "「漢戴胡帽，胡戴漢帽」講的是老百姓的穿著與生活，其他三個都是制度。", "card": "胡風＝唐朝的流行"}, {"id": "e113_31", "src": "113 段考 31", "q": "「絲綢之路」早在漢代已經開通。請問：若要寫出呈現該路線特色的介紹詞句，下列何者最合適？", "o": ["走近黃河源頭，探訪生命源頭禁區", "主宰文明進程，東西文化進行交流", "豪情塞上威風鼓，黃土高原信天游", "天蒼蒼野茫茫，風吹草低見牛羊"], "a": 1, "ex": "絲路的特色＝東西文化交流。", "card": "絲路"}, {"id": "e113_33", "src": "113 段考 33", "q": "《資治通鑑》：四夷君長詣闕請上為天可汗，上曰：「我為天子，又下行可汗事乎？」群臣及四夷皆稱萬歲。請問：文中所指的大唐天子為何人？", "o": ["秦始皇", "漢武帝", "唐高祖", "唐太宗"], "a": 3, "ex": "被尊為天可汗的是唐太宗。", "card": "唐太宗＝天可汗"}, {"id": "e113_34", "src": "113 段考 34", "q": "老師講完隋唐文化外傳後，四位同學各說一句。威凱：「日本全力模仿中國的文字、曆法、儒學和佛教，因而有『君子國』之稱。」鈞閎：「日本展開唐化運動，史稱『大化革新』。」宗澤：「文成公主嫁到大食，宣揚佛教思想，並將農業技術帶入大食。」秉勳：「唐朝軍隊與大食交戰於怛羅斯，唐軍戰敗，造紙術西傳。」哪幾位說法正確？", "o": ["威凱、鈞閎", "鈞閎、秉勳", "宗澤、秉勳", "威凱、秉勳"], "a": 1, "ex": "君子國是新羅不是日本；文成公主嫁的是吐蕃不是大食。", "card": "吐蕃：文成公主"}, {"id": "e114_24", "src": "114 段考 24（非官方解答）", "q": "義大利羅馬一幅繪於西元前 1 世紀的壁畫中，人物身著來自中國的絲綢；這條路徑上往來的商旅牽起中西物質、文化交流。如果繼續看節目，最可能看見下列哪段關於該路徑的敘述？", "o": ["西周實施分封制，並設立絲路以推廣禮樂制度", "秦始皇阻絕對外交通，直到魏晉時才首次出使西域開通絲路", "漢武帝開啟與西域的交流，唐代社會則呈現多元融合與胡風時尚流行", "魏晉南北朝強調胡漢融合，社會平等開放，促使中西文化交流日益興盛"], "a": 2, "ex": "絲路是漢武帝時張騫打通的，唐代胡風盛行。魏晉南北朝門第森嚴，不能說「社會平等」。", "card": "絲路"}, {"id": "e114_25", "src": "114 段考 25（改，非官方解答）", "q": "西元 311 年發生的「永嘉之禍」，因為朝廷腐敗讓外族有機可乘，造成國家敗亡。請問：這個事件發生在哪一個朝代的末年？", "o": ["東漢", "西晉", "東晉", "隋"], "a": 1, "ex": "永嘉之禍讓西晉滅亡，之後才有東晉。原題是在時間軸上選位置，這裡改成選朝代。", "card": "永嘉之禍（311 年＝4 世紀）"}, {"id": "e114_26", "src": "114 段考 26（非官方解答）", "q": "中國對境外民族遷徙至邊境和內地者，通稱為「胡」。魏晉時期胡人大量內徙，對日後中國政治社會發展有何影響？", "o": ["引發犬戎之禍，周王室因此東遷", "開始修築長城，試圖阻隔胡漢衝突", "北方中原人士相繼南遷，造成人口南移", "徵調南方人到北方平亂，造成南方人口流失"], "a": 2, "ex": "胡人內遷→永嘉之禍→北方人南遷、江南開發。犬戎是西周、長城是東周到秦的事。", "card": "永嘉之禍（311 年＝4 世紀）"}, {"id": "e114_27", "src": "114 段考 27（改，非官方解答）", "q": "老師在黑板上畫了一幅形勢圖：北魏的首都由平城（今山西大同）畫一個箭頭指向洛陽。老師講述的內容可能是下列何者？", "o": ["東周群雄並起的局勢", "北魏的漢化政策", "經濟中心的北移", "永嘉之禍的南侵"], "a": 1, "ex": "平城遷洛陽是北魏孝文帝漢化的第一步。", "card": "北魏孝文帝漢化"}, {"id": "e114_30", "src": "114 段考 30（改，非官方解答）", "q": "佛教不是中國的本土宗教，隨著與西域頻繁接觸便傳到中國來。在政權交替和戰亂中，人們尋求心靈慰藉，傳播速度明顯提升。請問：佛教起源於何處？", "o": ["阿拉伯", "朝鮮", "印度", "中國"], "a": 2, "ex": "佛教創立於印度（天竺），阿拉伯是伊斯蘭教的起源地。", "card": "佛教的起源"}, {"id": "e114_31", "src": "114 段考 31（非官方解答）", "q": "「日本曾多次派人前往中國學習。西元 645 年，孝德天皇頒布《改新之詔》，決定效法中國體制成立中央集權，並把崇神敬佛觀念、建築、文字、律令等文化帶回日本。」請問：日本的這場改革運動歷史上被稱為什麼？", "o": ["明治維新", "大正革新", "大化革新", "昭和革新"], "a": 2, "ex": "645 年孝德天皇＝大化革新。明治維新是 19 世紀的事。", "card": "日本：遣唐使 → 大化革新"}, {"id": "e114_32", "src": "114 段考 32（非官方解答）", "q": "玄奘為尋求更完整的佛教經典西行求法，在外 19 年，帶回 657 部佛經並翻譯成漢文。請問：玄奘所處的時代背景應為下列何者？", "o": ["周天子勢力衰微，中央全力鬆綁", "張騫出使西域，歐亞交通暢通", "秦始皇修築長城，陸上貿易安全", "唐朝風氣開放，宗教交流頻繁"], "a": 3, "ex": "玄奘是唐太宗時的人。", "card": "唐朝：玄奘取經，佛教中國化"}, {"id": "e114_33", "src": "114 段考 33（改，非官方解答）", "q": "一張地圖上，箭頭由長安向外指向新羅、日本、安南等地。有關圖中的箭頭標示，我們可以有以下何種解讀？", "o": ["唐文化傳播的路徑", "唐朝人口遷徙的方向", "唐朝對外戰爭的路線", "唐朝商人的貿易路徑"], "a": 0, "ex": "從長安指向周邊國家＝唐文化向外傳播（東亞文化圈）。", "card": "東亞文化圈"}, {"id": "e114_34", "src": "114 段考 34（非官方解答）", "q": "唐代與周邊國家交流頻繁，請問：下列哪一項物品是唐朝的「輸出品」？", "o": ["葡萄酒", "胡旋舞", "琵琶", "造紙術"], "a": 3, "ex": "葡萄酒、胡旋舞、琵琶都是從西域傳進來的；造紙術是唐朝傳出去的。", "card": "大食：怛羅斯之戰"}]};

const KEY = "n8v5-hist2";

try { const j = JSON.parse(localStorage.getItem(KEY)||"null"); if (j) S = Object.assign(S, j); } catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,8);
let DEV = "", SID = uid();
try { DEV = localStorage.getItem("n8v5-dev") || ""; if (!DEV){ DEV = uid().slice(-6); localStorage.setItem("n8v5-dev", DEV); } } catch(e){ DEV = "nostore"; }
const LOGQ = "n8v5-hist2-logq"; let LQ = [];
try { LQ = JSON.parse(localStorage.getItem(LOGQ)||"[]") || []; } catch(e){}
function saveLQ(){ try{ localStorage.setItem(LOGQ, JSON.stringify(LQ)); }catch(e){} }
function logEv(ev){
  LQ.push(Object.assign({id:uid(), ts:Date.now(), dev:DEV, sid:SID, v:BUILD}, ev));
  if (LQ.length > 2000) LQ = LQ.slice(-2000);
  saveLQ(); clearTimeout(logEv.t); logEv.t = setTimeout(flushLog, 3000);
}
let flushing = false;
async function flushLog(leaving){
  if (!LOG_URL || flushing || !LQ.length || navigator.onLine === false) return;
  flushing = true;
  const batch = LQ.slice(0, leaving ? 30 : 200);
  try {
    const r = await fetch(LOG_URL, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify({app:D.app, events:batch}), redirect:"follow", keepalive:!!leaving});
    const j = await r.json();
    if (j && j.ok){ const done = new Set(batch.map(e=>e.id)); LQ = LQ.filter(e=>!done.has(e.id)); saveLQ(); flushing=false; if (LQ.length && !leaving) return flushLog(); }
  } catch(e){}
  flushing = false;
}
window.addEventListener("online", ()=>flushLog());
document.addEventListener("visibilitychange", ()=>{ if (document.visibilityState==="hidden") flushLog(true); });
setTimeout(()=>flushLog(), 2000);
function logAns(o){ logEv(Object.assign({k:"ans", L:"hist2", src:"歷史L2", c:"", cn:""}, o)); }

/* ───────── 小工具 ───────── */
const $ = (s,el=document)=>el.querySelector(s);
const $$ = (s,el=document)=>[...el.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const app = $("#app");
const Q = Object.fromEntries(D.questions.map(q=>[q.id,q]));
const CARDS = {}; D.days.forEach(d=>d.cards.forEach(c=>{ CARDS[c.t]=c; }));
const dayOf = id => D.days.find(d=>d.id===+id);
function page(title, body, back){
  // 每一頁右上角都有「返回首頁」：內頁回這一課的首頁；這一課的首頁則回八上英文站首頁
  const home = back===undefined ? `<button class="home" onclick="location.href='./'">↩ 回英文站</button>` : `<button class="home" onclick="location.hash='#/'">🏠 首頁</button>`;
  app.innerHTML = `<header class="top">${back!==undefined?`<button class="back" onclick="location.hash='${back}'">←</button>`:""}<h1>${title}</h1>${home}</header>${body}`;
  window.scrollTo(0,0);
}
const tile = (ic,name,desc,href,cls="") => `<button class="tile ${cls}" onclick="location.hash='${href}'"><span class="ic">${ic}</span><b>${name}</b><small>${desc}</small></button>`;
const ERAS = D.eras || [];
// 一張重點卡：標題 → 時間軸（亮出所屬時代）→ 年代／地點 → 一句話 → 前因後果 → 想一想（點開看提示）→ 考什麼
function cardHTML(c){
  const tl = ERAS.length? `<div class="tl">${ERAS.map(e=>`<span class="${(c.era||[]).includes(e)?"on":""}">${e}</span>`).join("")}</div>`:"";
  return `<div class="card flash"><div class="t">${esc(c.t)}</div>${tl}
  <div class="meta"><span>⏳ ${esc(c.when||"")}</span><span>📍 ${esc(c.where||"")}</span></div>
  <div class="zh">${esc(c.zh)}</div>
  ${c.ctx?`<div class="ctx"><b>前因後果</b>${esc(c.ctx)}</div>`:""}
  ${c.ask?`<details class="ask"><summary>💭 ${esc(c.ask)}</summary><div class="hint">${esc(c.hint||"")}</div></details>`:""}
  <div class="why">${esc(c.why)}</div></div>`;
}
const bigHTML = d => d.big? `<div class="bigq"><b>這幾天要一直想的大問題</b>${esc(d.big)}</div>`:"";
const cardRef = name => { const c=CARDS[name]; return c? `<div class="cardref"><b>回去看卡：${esc(c.t)}</b>${esc(c.zh)}${c.when?`<div class="muted" style="font-size:13px;margin-top:4px">⏳ ${esc(c.when)}</div>`:""}</div>` : ""; };

/* ═════════ 首頁 ═════════ */
function vHome(){
  const nW = Object.keys(S.wrong).filter(id=>S.wrong[id]>0).length;
  const dayTile = d => { const r=S.done[d.id]; return tile("📅", d.title, r?`做過了：寫題對 ${r.ok}/${r.n}，可以再練一次`:`${d.page}`, `#/d/${d.id}`, r?"done":""); };
  page("歷史 L2 民族與文化", `<p class="sub">康軒八上第 2 課「商周至隋唐的民族與文化」。每天 20 分鐘：讀重點卡 → 排順序／配對 → 寫題 → 看錯題。</p>
  <h2>三天進度</h2><div class="tiles">${D.days.map(dayTile).join("")}</div>
  <h2>多練一點</h2><div class="tiles">
    ${tile("📕","錯題本",`${nW} 題（答對就離開錯題本）`,"#/wrong")}
    ${tile("📄","段考原題加練","112～114 學年段考考過的本課題目，隨機 10 題","#/pool")}
    ${tile("🗂","全部重點卡","三天的卡一次看完","#/cards")}
    ${tile("↩","回英文站","回八上英文首頁","#/back")}
  </div>
  <p class="muted" style="font-size:12px;margin-top:24px">版本 ${BUILD}。進度存在這支手機裡。</p>`);
}

/* ═════════ 一天的流程 ═════════ */
let F = null;   // 目前這一天的流程狀態
function stepsOf(d){ const s=["cards"]; if(d.order) s.push("order"); if(d.match) s.push("match"); s.push("quiz"); if(d.id===D.days.length) s.push("mix"); return s; }
const STEP_NAME = {cards:"讀重點卡", order:"排順序", match:"配對", quiz:"寫題", mix:"總複習"};
function vDay(id, step){
  const d = dayOf(id); if(!d) return route("#/");
  const steps = stepsOf(d);
  if (!F || F.day!==d.id){ F = {day:d.id, i:0, card:0, doneSteps:{}}; }
  if (step!==undefined) F.i = Math.max(0, Math.min(steps.length-1, +step));
  const cur = steps[F.i];
  const head = `<div class="steps">${steps.map((s,i)=>`<span class="${i===F.i?"on":F.doneSteps[s]?"ok":""}">${i+1} ${STEP_NAME[s]}</span>`).join("")}</div>`;
  ({cards:vCards, order:vOrder, match:vMatch, quiz:vQuiz, mix:vMix})[cur](d, head);
}
function nextStep(){ const d=dayOf(F.day); const steps=stepsOf(d); F.doneSteps[steps[F.i]]=true; if (F.i+1<steps.length){ F.i++; vDay(d.id); } else { location.hash="#/"; } }
const nextBtn = () => `<button class="btn" onclick="nextStep()">這一步完成，下一步 →</button>`;

/* ── 1. 重點卡 ── */
function vCards(d, head){
  const n=d.cards.length; const i=Math.min(F.card, n-1); const c=d.cards[i];
  page(d.title, `${head}${F.i===0&&i===0?`<p class="sub">${esc(d.intro)}</p>${bigHTML(d)}`:""}
  <div class="sub">卡 ${i+1} / ${n}<span class="muted" style="float:right;font-size:12px">${esc(d.page)}</span></div><div class="prog"><i style="width:${(i+1)/n*100}%"></i></div>
  ${cardHTML(c)}
  <div class="row"><button class="btn ghost" ${i===0?"disabled":""} onclick="F.card=${i-1};vDay(${d.id})">← 上一張</button>
  ${i<n-1?`<button class="btn" onclick="F.card=${i+1};vDay(${d.id})">下一張 →</button>`:`<button class="btn" onclick="nextStep()">讀完了，下一步 →</button>`}</div>
  <button class="btn ghost sm" style="margin-top:16px" onclick="location.hash='#/cards/${d.id}'">一次看這天全部的卡</button>`, "#/");
  logEv({k:"view", page:`hist2/d${d.id}/card${i+1}`});
}
function vAllCards(dayId){
  const ds = dayId? [dayOf(dayId)] : D.days;
  page("全部重點卡", ds.map(d=>`<h2>${esc(d.title)}</h2>${bigHTML(d)}`+d.cards.map(cardHTML).join("")).join(""), dayId?`#/d/${dayId}`:"#/");
}

/* ── 2. 排順序：點候選區的卡片依序放進答案區 ── */
let OD = null;
// 🔴 onclick 屬性裡不能塞字串內容（會把 HTML 弄壞），一律用索引叫全域函式
function odPush(i){ OD.ans.push(OD.left[i]); OD.render(); }
function odPop(i){ OD.ans.splice(i,1); OD.render(); }
function vOrder(d, head){
  const o=d.order;
  if (!OD || OD.day!==d.id){ OD={day:d.id, pool:shuffle(o.items), ans:[], sent:false}; }
  OD.render = () => {
    OD.left = OD.pool.filter(x=>!OD.ans.includes(x));
    let verdict="";
    if (OD.sent){
      const allOk = OD.ans.every((x,i)=>x===o.items[i]);
      verdict = `<div class="verdict ${allOk?"ok":"ng"}">${allOk?"✅ 全部排對！":"❌ 有幾個位置不對"}</div>
      ${allOk?"":`<div class="ex"><b>正確順序：</b><ol class="list">${o.items.map(x=>`<li>${esc(x)}</li>`).join("")}</ol></div>`}
      <div class="row"><button class="btn ghost" onclick="OD=null;vDay(${d.id})">再排一次</button>${nextBtn()}</div>`;
    }
    page(d.title, `${head}<h3>${esc(o.title)}</h3><p class="sub">${esc(o.hint)}</p>
    <div class="muted">答案區（由早到晚）</div>
    <div class="chips" id="ans">${OD.ans.map((x,i)=>`<button class="chip ${OD.sent?(x===o.items[i]?"ok":"ng"):""}" ${OD.sent?"disabled":""} onclick="odPop(${i})"><span class="n">${i+1}</span>${esc(x)}</button>`).join("")||`<span class="muted">還沒放東西，從下面點</span>`}</div>
    <div class="muted">候選區</div>
    <div class="chips" id="cand">${OD.left.map((x,i)=>`<button class="chip" onclick="odPush(${i})">${esc(x)}</button>`).join("")||`<span class="muted">都放上去了</span>`}</div>
    ${OD.sent?"":`<button class="btn" id="send" ${OD.left.length?"disabled":""}>送出答案</button>`}
    ${verdict}`, "#/");
    const b=$("#send"); if (b) b.onclick=()=>{ OD.sent=true; const ok=OD.ans.every((x,i)=>x===o.items[i]); logAns({sec:d.title, qid:`order${d.id}`, t:"order", q:o.title, given:OD.ans.join("→"), ans:o.items.join("→"), ok:ok?1:0}); OD.render(); };
  };
  OD.render();
}

/* ── 3. 配對：點左邊一個再點右邊一個 ── */
let MD = null;
function mdSel(i){ MD.sel = MD.lefts[i]; MD.render(); }
function mdPick(i){ if (MD.sel){ MD.pairs[MD.sel] = MD.rights[i]; MD.sel = null; } MD.render(); }
function mdDel(i){ delete MD.pairs[Object.keys(MD.pairs)[i]]; MD.render(); }
function vMatch(d, head){
  const m=d.match;
  if (!MD || MD.day!==d.id){ MD={day:d.id, right:shuffle(m.pairs.map(p=>p[1])), sel:null, pairs:{}, sent:false}; }
  const correct = Object.fromEntries(m.pairs);
  MD.render = () => {
    const used = new Set(Object.values(MD.pairs));
    MD.lefts = m.pairs.map(p=>p[0]).filter(l=>!(l in MD.pairs));
    MD.rights = MD.right.filter(r=>!used.has(r));
    let verdict="";
    if (MD.sent){
      const nOk = m.pairs.filter(p=>MD.pairs[p[0]]===p[1]).length;
      verdict = `<div class="verdict ${nOk===m.pairs.length?"ok":"ng"}">${nOk===m.pairs.length?"✅ 全部配對！":`❌ 對了 ${nOk} / ${m.pairs.length} 組`}</div>
      ${nOk===m.pairs.length?"":`<div class="ex"><b>正確配法：</b><ul class="list">${m.pairs.filter(p=>MD.pairs[p[0]]!==p[1]).map(p=>`<li>${esc(p[0])} ↔ ${esc(p[1])}</li>`).join("")}</ul></div>`}
      <div class="row"><button class="btn ghost" onclick="MD=null;vDay(${d.id})">再配一次</button>${nextBtn()}</div>`;
    }
    page(d.title, `${head}<h3>${esc(m.title)}</h3><p class="sub">${esc(m.hint)}</p>
    <div class="pairs" id="pairs">${Object.entries(MD.pairs).map(([l,r],i)=>`<button class="chip ${MD.sent?(correct[l]===r?"ok":"ng"):"on"}" ${MD.sent?"disabled":""} onclick="mdDel(${i})">${esc(l)} ↔ ${esc(r)}${MD.sent?"":" ×"}</button>`).join("")}</div>
    ${MD.lefts.length?`<div class="cols"><div id="lefts">${MD.lefts.map((l,i)=>`<button class="chip ${MD.sel===l?"on":""}" onclick="mdSel(${i})">${esc(l)}</button>`).join("")}</div>
    <div id="rights">${MD.rights.map((r,i)=>`<button class="chip" onclick="mdPick(${i})">${esc(r)}</button>`).join("")}</div></div>
    <p class="muted">${MD.sel?`已選「${esc(MD.sel)}」，再點右邊一個`:"先點左邊一個"}</p>`:""}
    ${MD.sent?"":`<button class="btn" id="send" ${MD.lefts.length?"disabled":""}>送出答案</button>`}
    ${verdict}`, "#/");
    const b=$("#send"); if (b) b.onclick=()=>{ MD.sent=true; const nOk=m.pairs.filter(p=>MD.pairs[p[0]]===p[1]).length; logAns({sec:d.title, qid:`match${d.id}`, t:"match", q:m.title, given:Object.entries(MD.pairs).map(x=>x.join("↔")).join("；"), ans:m.pairs.map(x=>x.join("↔")).join("；"), ok:nOk===m.pairs.length?1:0, n:m.pairs.length, nok:nOk}); MD.render(); };
  };
  MD.render();
}

/* ── 4. 寫題（選擇題，即答即回饋）── */
let QZ = null;
function startQuiz(opt){ QZ = Object.assign({i:0, ok:0, wrong:[], picked:null, qt:Date.now()}, opt); vQuizQ(); }
function vQuizQ(){
  const qs=QZ.qs, i=QZ.i, q=qs[i];
  if (i>=qs.length) return vQuizEnd();
  const picked = QZ.picked;
  page(QZ.title, `<div class="sub">${i+1} / ${qs.length}<span class="muted" style="float:right;font-size:12px">${esc(q.src)}</span></div><div class="prog"><i style="width:${i/qs.length*100}%"></i></div>
  <div class="card"><p style="margin:0 0 12px;font-size:17px">${esc(q.q)}</p>
  ${q.o.map((o,k)=>`<button class="opt ${picked===null?"":k===q.a?"ok":k===picked?"ng":""}" ${picked===null?"":"disabled"} onclick="pickOpt(${k})">(${"ABCD"[k]}) ${esc(o)}</button>`).join("")}
  ${picked===null?"":`<div class="verdict ${picked===q.a?"ok":"ng"}">${picked===q.a?"✅ 答對":"❌ 答錯，正確答案是 ("+"ABCD"[q.a]+")"}</div>
  <div class="ex">${esc(q.ex)}<span class="src">來源：${esc(q.src)}</span></div>${picked===q.a?"":cardRef(q.card)}
  <button class="btn" onclick="QZ.i++;QZ.picked=null;QZ.qt=Date.now();vQuizQ()">${i+1<qs.length?"下一題 →":"看結果"}</button>`}
  </div>`, QZ.back);
}
function pickOpt(k){
  const q=QZ.qs[QZ.i]; if (QZ.picked!==null) return;
  QZ.picked=k; const ok = k===q.a;
  if (ok){ QZ.ok++; S.right[q.id]=(S.right[q.id]||0)+1; if (S.wrong[q.id]) S.wrong[q.id]=0; }
  else { QZ.wrong.push(q.id); S.wrong[q.id]=(S.wrong[q.id]||0)+1; }
  save();
  logAns({sec:QZ.title, qid:q.id, t:"mc", q:q.q, given:"ABCD"[k]+" "+q.o[k], ans:"ABCD"[q.a]+" "+q.o[q.a], ok:ok?1:0, ms:Date.now()-QZ.qt, from:q.src});
  vQuizQ();
}
function vQuizEnd(){
  const n=QZ.qs.length;
  if (QZ.onDone) QZ.onDone(QZ.ok, n);
  page(QZ.title, `<div class="card"><div class="big">${QZ.ok} / ${n}</div><p class="sub" style="text-align:center">${QZ.ok===n?"全對！":QZ.ok>=n*0.7?"不錯，錯的再看一次就穩了":"沒關係，錯的題目都進錯題本了，明天再練"}</p></div>
  ${QZ.wrong.length?`<h2>這次錯的</h2>${QZ.wrong.map(id=>{const q=Q[id];return `<div class="card"><p style="margin:0 0 8px">${esc(q.q)}</p><div class="ex"><b>正確：(${"ABCD"[q.a]}) ${esc(q.o[q.a])}</b><br>${esc(q.ex)}</div>${cardRef(q.card)}</div>`;}).join("")}`:""}
  ${QZ.next?`<button class="btn" onclick="${QZ.next}">${QZ.nextLabel||"下一步 →"}</button>`:""}
  <button class="btn ghost" onclick="location.hash='${QZ.back}'">回上一頁</button>`, QZ.back);
}
function vQuiz(d, head){
  const qs = d.main.map(id=>Q[id]);
  page(d.title, `${head}<div class="card"><h3 style="margin-top:0">寫題：${qs.length} 題</h3><p class="sub">講義、課本和段考考過的題目。答錯會馬上看到解析，還會告訴你回哪張卡。</p>
  <button class="btn" id="go">開始寫題</button></div>`, "#/");
  $("#go").onclick=()=>startQuiz({title:d.title.replace(/｜.*/,"")+" 寫題", qs, back:`#/d/${d.id}`, next:"nextStep()", nextLabel: d.id===D.days.length?"去總複習 →":"完成今天的練習 →",
    onDone:(ok,n)=>{ S.done[d.id]={ok,n,ts:Date.now()}; save(); }});
}
/* ── 5. 最後一天總複習：先抽前兩天錯的，不夠再從段考題補 ── */
function mixQs(){
  const wrongIds = Object.keys(S.wrong).filter(id=>S.wrong[id]>0 && Q[id]);
  let qs = shuffle(wrongIds).slice(0,6).map(id=>Q[id]);
  if (qs.length<6){ const pool = D.days.flatMap(d=>d.pool).filter(id=>!wrongIds.includes(id)); qs = qs.concat(shuffle(pool).slice(0, 6-qs.length).map(id=>Q[id])); }
  return qs;
}
function vMix(d, head){
  page(d.title, `${head}<div class="card"><h3 style="margin-top:0">總複習 6 題</h3><p class="sub">先抽你前幾天答錯的題目，不夠再從段考題裡補。</p><button class="btn" id="go">開始</button></div>`, "#/");
  $("#go").onclick=()=>startQuiz({title:"總複習", qs:mixQs(), back:`#/d/${d.id}`, next:"nextStep()", nextLabel:"三天全部完成 🎉"});
}
/* ── 錯題本、段考題加練 ── */
function vWrong(){
  const ids = Object.keys(S.wrong).filter(id=>S.wrong[id]>0 && Q[id]);
  page("錯題本", `<div class="card"><p class="sub" style="margin-top:0">${ids.length?`現在有 ${ids.length} 題。答對一次就離開錯題本。`:"錯題本是空的，去寫題吧。"}</p>${ids.length?`<button class="btn" id="go">練這 ${ids.length} 題</button>`:""}</div>
  ${ids.map(id=>`<div class="card" style="padding:12px 16px"><div class="sub">${esc(Q[id].q)}</div><div class="muted" style="font-size:12px">錯 ${S.wrong[id]} 次・${esc(Q[id].src)}</div></div>`).join("")}`, "#/");
  const b=$("#go"); if (b) b.onclick=()=>startQuiz({title:"錯題本", qs:shuffle(ids).map(id=>Q[id]), back:"#/wrong"});
}
function vPool(){
  const all = D.days.flatMap(d=>d.pool.concat(d.main)).filter(id=>/^e1/.test(id));
  page("段考原題加練", `<div class="card"><p class="sub" style="margin-top:0">112、113、114 學年第一次段考考過的本課題目共 ${all.length} 題，隨機抽 10 題。有圖的題目已改成文字敘述；114 學年沒有公布解答，答案是 AI 判讀的。</p><button class="btn" id="go">抽 10 題</button></div>`, "#/");
  $("#go").onclick=()=>startQuiz({title:"段考原題加練", qs:shuffle(all).slice(0,10).map(id=>Q[id]), back:"#/pool"});
}

/* ═════════ 路由 ═════════ */
function route(h){
  if (h!==undefined && location.hash!==h){ location.hash=h; return; }
  const p=(location.hash||"#/").slice(2).split("/");
  logEv({k:"view", page:"hist2/"+((location.hash||"#/").slice(2)||"home")});
  if (p[0]==="d") return vDay(p[1], p[2]);
  if (p[0]==="wrong") return vWrong();
  if (p[0]==="pool") return vPool();
  if (p[0]==="cards") return vAllCards(p[1]?+p[1]:0);
  if (p[0]==="back") { location.href="./"; return; }
  vHome();
}
window.addEventListener("hashchange", ()=>route());
route();
</script>
