sold his old bike.", "exz": "他把舊腳踏車賣了。", "pl": "sold", "plr": "irr", "der": ["sell ↔ buy"], "note": "", "tex": "Her father sold her to the old man…", "posq": true, "no": 7, "blue": false, "cap": 21}, {"sec": "對話：一本特別的書", "w": "because", "pos": "conj.", "zh": "因為", "ex": "I was late because I missed the bus.", "exz": "我遲到是因為錯過公車。", "pl": "", "plr": "none", "der": ["because＋句子", "because of＋名詞"], "note": "", "tex": "…because her family was very poor.", "posq": false, "no": 8, "blue": false, "cap": 68}, {"sec": "對話：一本特別的書", "w": "poor", "pos": "adj.", "zh": "貧窮的；可憐的", "ex": "Her family was very poor.", "exz": "她家很窮。", "pl": "", "plr": "none", "der": ["poor ↔ rich"], "note": "", "tex": "…because her family was very poor.", "posq": true, "no": 9, "blue": false, "cap": 7}, {"sec": "對話：一本特別的書", "w": "happen", "pos": "v.", "zh": "發生", "ex": "What happened to you?", "exz": "你怎麼了？", "pl": "happened", "plr": "ed", "der": ["What happened (to…)? （…）怎麼了？"], "note": "", "tex": "What happened next?", "posq": true, "no": 10, "blue": false, "cap": 17}, {"sec": "對話：一本特別的書", "w": "hit", "pos": "v.", "zh": "打", "ex": "Her husband often hit her.", "exz": "她丈夫常打她。", "pl": "hit", "plr": "same", "der": [], "note": "原形和過去式同形", "tex": "Her husband often hit her.", "posq": true, "no": 11, "blue": false, "cap": 15}, {"sec": "對話：一本特別的書", "w": "terrible", "pos": "adj.", "zh": "糟糕的", "ex": "That's terrible!", "exz": "那真糟糕！", "pl": "", "plr": "none", "der": [], "note": "", "tex": "That's terrible!", "posq": true, "no": 12, "blue": false, "cap": 11}, {"sec": "對話：一本特別的書", "w": "ever", "pos": "adv.", "zh": "曾經", "ex": "Did her husband ever find her?", "exz": "她丈夫有找到過她嗎？", "pl": "", "plr": "none", "der": [], "note": "", "tex": "Did her husband ever find her?", "posq": true, "no": 13, "blue": false, "cap": 14}, {"sec": "對話：一本特別的書", "w": "finish", "pos": "v.", "zh": "完成", "ex": "Please finish your homework.", "exz": "請完成你的作業。", "pl": "finished", "plr": "ed", "der": [], "note": "", "tex": "Please finish it and tell me.", "posq": true, "no": 14, "blue": false, "cap": 11}, {"sec": "對話：一本特別的書", "w": "curious", "pos": "adj.", "zh": "好奇的", "ex": "I'm curious about the ending.", "exz": "我對結局很好奇。", "pl": "", "plr": "none", "der": ["be curious about… 對…好奇"], "note": "", "tex": "I'm really curious about the ending of this story.", "posq": true, "no": 16, "blue": true, "cap": 0}, {"sec": "對話：一本特別的書", "w": "ending", "pos": "n.", "zh": "結局", "ex": "The ending of the movie was sad.", "exz": "電影的結局很悲傷。", "pl": "", "plr": "none", "der": ["end v. 結束"], "note": "", "tex": "", "posq": true, "no": 17, "blue": true, "cap": 0}, {"sec": "對話：一本特別的書", "w": "stand", "pos": "v.", "zh": "忍受", "ex": "She couldn't stand it.", "exz": "她無法忍受。", "pl": "stood", "plr": "irr", "der": ["stand 也是「站」"], "note": "can't／couldn't stand＝受不了", "tex": "She couldn't stand it, so she ran away.", "posq": true, "cap": 5}, {"sec": "對話：一本特別的書", "w": "run", "pos": "v.", "zh": "跑", "ex": "She ran away.", "exz": "她逃走了。", "pl": "ran", "plr": "irr", "der": ["run away 逃走"], "note": "", "tex": "…so she ran away.", "posq": true, "cap": 20}, {"sec": "對話：一本特別的書", "w": "read", "pos": "v.", "zh": "讀", "ex": "I read a special book last week.", "exz": "我上週讀了一本特別的書。", "pl": "read", "plr": "same", "der": [], "note": "過去式拼法一樣，唸 /rɛd/", "tex": "I read a special book.", "posq": true, "cap": 11}, {"sec": "不同孩子的生活", "w": "shoe", "pos": "n.", "zh": "鞋子", "ex": "He makes shoes in a factory.", "exz": "他在工廠做鞋。", "pl": "", "plr": "none", "der": ["shoes（一雙鞋通常用複數）"], "note": "", "tex": "", "posq": true, "no": 18, "blue": false, "cap": 2}, {"sec": "不同孩子的生活", "w": "buy", "pos": "v.", "zh": "購買", "ex": "Mom bought a pair of shoes for me.", "exz": "媽媽幫我買了一雙鞋。", "pl": "bought", "plr": "irr", "der": [], "note": "", "tex": "buy a pair of shoes", "posq": true, "no": 19, "blue": false, "cap": 33}, {"sec": "不同孩子的生活", "w": "pair", "pos": "n.", "zh": "一雙；一對", "ex": "I need a new pair of shoes.", "exz": "我需要一雙新鞋。", "pl": "", "plr": "none", "der": ["a pair of＋複數名詞"], "note": "", "tex": "", "posq": true, "no": 20, "blue": false, "cap": 1}, {"sec": "不同孩子的生活", "w": "pick", "pos": "v.", "zh": "摘採", "ex": "They picked cacao fruit.", "exz": "他們摘可可果實。", "pl": "picked", "plr": "ed", "der": [], "note": "", "tex": "pick cacao fruit", "posq": true, "no": 21, "blue": false, "cap": 20}, {"sec": "不同孩子的生活", "w": "chocolate", "pos": "n.", "zh": "巧克力", "ex": "Chocolate is made from cacao.", "exz": "巧克力是可可做的。", "pl": "", "plr": "none", "der": [], "note": "", "tex": "eat chocolate", "posq": true, "no": 22, "blue": false, "cap": 10}, {"sec": "不同孩子的生活", "w": "break", "pos": "v.", "zh": "折斷；破裂", "ex": "He broke his arm.", "exz": "他摔斷了手臂。", "pl": "broke", "plr": "irr", "der": [], "note": "", "tex": "break his arm", "posq": true, "no": 23, "blue": false, "cap": 10}, {"sec": "不同孩子的生活", "w": "arm", "pos": "n.", "zh": "手臂", "ex": "My arm hurts.", "exz": "我的手臂痛。", "pl": "", "plr": "none", "der": [], "note": "", "tex": "", "posq": true, "no": 24, "blue": false, "cap": 1}, {"sec": "不同孩子的生活", "w": "computer", "pos": "n.", "zh": "電腦", "ex": "He played computer games all day.", "exz": "他整天打電動。", "pl": "", "plr": "none", "der": [], "note": "", "tex": "play computer games", "posq": true, "no": 25, "blue": false, "cap": 6}, {"sec": "閱讀：童婚", "w": "choose", "pos": "v.", "zh": "選擇", "ex": "You can choose your friends.", "exz": "你可以選擇你的朋友。", "pl": "chose", "plr": "irr", "der": ["choice n. 選擇（have no choice 別無選擇）"], "note": "", "tex": "Most people in Taiwan can choose their husband or wife.", "posq": true, "no": 26, "blue": false, "cap": 20}, {"sec": "閱讀：童婚", "w": "children", "pos": "n.", "zh": "小孩（child 的複數）", "ex": "The children are playing.", "exz": "孩子們在玩。", "pl": "", "plr": "none", "der": [], "note": "不加 s", "tex": "Millions of children…", "posq": true, "no": 27, "blue": false, "cap": 24}, {"sec": "閱讀：童婚", "w": "age", "pos": "n.", "zh": "年齡", "ex": "She got married at the age of eleven.", "exz": "她十一歲就結婚了。", "pl": "", "plr": "none", "der": ["at the age of＋數字"], "note": "", "tex": "…under the age of eighteen…", "posq": true, "no": 28, "blue": false, "cap": 5}, {"sec": "閱讀：童婚", "w": "without", "pos": "prep.", "zh": "沒有", "ex": "They get married without a choice.", "exz": "他們沒有選擇就結婚了。", "pl": "", "plr": "none", "der": [], "note": "", "tex": "…without a choice.", "posq": false, "no": 29, "blue": false, "cap": 34}, {"sec": "閱讀：童婚", "w": "baby", "pos": "n.", "zh": "嬰兒", "ex": "Geeta had her first baby at eleven.", "exz": "Geeta 十一歲就生了第一個孩子。", "pl": "", "plr": "none", "der": ["babies（複數）"], "note": "", "tex": "", "posq": true, "no": 30, "blue": false, "cap": 15}, {"sec": "閱讀：童婚", "w": "become", "pos": "v.", "zh": "成為；變成", "ex": "She became a mother at eleven.", "exz": "她十一歲就成為母親。", "pl": "became", "plr": "irr", "der": [], "note": "", "tex": "…and became a mother at eleven.", "posq": true, "no": 31, "blue": false, "cap": 49}, {"sec": "閱讀：童婚", "w": "cry", "pos": "v.", "zh": "哭泣", "ex": "She cried and said \"NO!\"", "exz": "她哭著說「不！」", "pl": "cried", "plr": "ed", "der": [], "note": "子音＋y → cried", "tex": "", "posq": true, "no": 32, "blue": false, "cap": 6}, {"sec": "閱讀：童婚", "w": "nobody", "pos": "pron.", "zh": "沒有人", "ex": "Nobody helped her.", "exz": "沒有人幫她。", "pl": "", "plr": "none", "der": [], "note": "nobody 當主詞，動詞用單數", "tex": "", "posq": false, "no": 33, "blue": false, "cap": 4}, {"sec": "閱讀：童婚", "w": "scared", "pos": "adj.", "zh": "害怕的", "ex": "She was scared and could not sleep.", "exz": "她很害怕，晚上睡不著。", "pl": "", "plr": "none", "der": ["be scared of… 害怕…"], "note": "", "tex": "", "posq": true, "no": 34, "blue": false, "cap": 13}, {"sec": "閱讀：童婚", "w": "marriage", "pos": "n.", "zh": "婚姻", "ex": "The marriage was like a nightmare.", "exz": "那段婚姻像一場惡夢。", "pl": "", "plr": "none", "der": ["marry v. 結婚", "married adj. 已婚的"], "note": "", "tex": "", "posq": true, "no": 36, "blue": true, "cap": 0}, {"sec": "閱讀：童婚", "w": "give", "pos": "v.", "zh": "給", "ex": "He gave her father money.", "exz": "他給了她父親錢。", "pl": "gave", "plr": "irr", "der": [], "note": "", "tex": "", "posq": true, "cap": 57}, {"sec": "片語", "w": "get married", "pos": "phr.", "zh": "結婚", "ex": "She got married at twelve.", "exz": "她十二歲就結婚了。", "pl": "got married", "plr": "irr", "der": ["get married to＋人 和某人結婚"], "note": "", "tex": "…she got married to a 65-year-old man.", "posq": false, "no": 5, "blue": false, "cap": 3}, {"sec": "片語", "w": "not… anymore", "pos": "phr.", "zh": "不再", "ex": "She could not go to school anymore.", "exz": "她不能再去上學了。", "pl": "", "plr": "none", "der": [], "note": "anymore 放句尾", "tex": "She could not go to school anymore.", "posq": false, "no": 15, "blue": true, "cap": 0}, {"sec": "片語", "w": "take action", "pos": "phr.", "zh": "採取行動", "ex": "Let's take action now!", "exz": "我們現在就採取行動！", "pl": "took action", "plr": "irr", "der": [], "note": "", "tex": "Let's take action now!", "posq": false, "no": 35, "blue": false, "cap": 3}], "texts": [{"id": "d1", "title": "Dialogue（In the classroom）", "src": "課本 p.19–20", "lines": [{"sp": "Jeff", "en": "Hey Nina. Did you study for the math test?", "zh": "嘿 Nina。你有準備數學考試嗎？", "hl": false, "note": ""}, {"sp": "Nina", "en": "No, I didn't. But guess what? I read a special book.", "zh": "沒有。但你猜怎麼著？我讀了一本特別的書。", "hl": true, "note": "read 過去式拼法一樣，唸 /rɛd/。"}, {"sp": "Jeff", "en": "Oh? What is special about it?", "zh": "喔？它哪裡特別？", "hl": false, "note": ""}, {"sp": "Nina", "en": "Well, it's about a girl from Nigeria. She was only 12 years old, but she got married to a 65-year-old man.", "zh": "嗯，它是關於一個來自奈及利亞的女孩。她才 12 歲，卻嫁給一個 65 歲的男人。", "hl": true, "note": "get married to＋人；65-year-old 當形容詞，year 不加 s。"}, {"sp": "Jeff", "en": "What! Why did she do that? She was so young!", "zh": "什麼！她為什麼要那樣做？她那麼年輕！", "hl": true, "note": "Why＋did＋主詞＋原形 do。"}, {"sp": "Nina", "en": "She had no choice. Her father sold her to the old man because her family was very poor.", "zh": "她別無選擇。她爸爸把她賣給那個老人，因為她家很窮。", "hl": true, "note": "sell → sold；because＋原因。"}, {"sp": "Nina", "en": "She could not go to school anymore.", "zh": "她不能再去上學了。", "hl": true, "note": "not… anymore 不再。can → could。"}, {"sp": "Jeff", "en": "That's so sad. What happened next?", "zh": "好悲傷。後來怎麼了？", "hl": false, "note": ""}, {"sp": "Nina", "en": "Her husband often hit her. She couldn't stand it, so she ran away.", "zh": "她丈夫常打她。她受不了，所以逃走了。", "hl": true, "note": "hit 過去式同形；stand 忍受；so＋結果；run → ran。"}, {"sp": "Jeff", "en": "That's terrible! Did her husband ever find her?", "zh": "太糟了！她丈夫有找到過她嗎？", "hl": false, "note": ""}, {"sp": "Nina", "en": "I don't know. I'm still reading it.", "zh": "我不知道。我還在讀。", "hl": false, "note": ""}, {"sp": "Jeff", "en": "I'm really curious about the ending of this story. Please finish it and tell me.", "zh": "我真的很好奇這個故事的結局。請讀完再告訴我。", "hl": false, "note": "be curious about…"}, {"sp": "Nina", "en": "Sure!", "zh": "當然！", "hl": false, "note": ""}]}, {"id": "w1", "title": "Word Power（How Are These Kids Different From Each Other in Their Lives?）", "src": "課本 p.22", "lines": [{"sp": "A／B", "en": "One boy makes shoes, and another boy buys a pair of shoes.", "zh": "一個男孩做鞋子，另一個男孩買一雙鞋子。", "hl": false, "note": ""}, {"sp": "C／D", "en": "One girl gets married, and other kids go to school.", "zh": "一個女孩結婚了，其他孩子去上學。", "hl": false, "note": ""}, {"sp": "E／F", "en": "One girl picks cacao fruit, and another girl eats chocolate.", "zh": "一個女孩摘可可果實，另一個女孩吃巧克力。", "hl": false, "note": ""}, {"sp": "G／H", "en": "One boy breaks his arm in a war, and another boy plays computer games.", "zh": "一個男孩在戰爭中斷了手臂，另一個男孩在打電動。", "hl": false, "note": ""}]}, {"id": "r1", "title": "Reading〈Child Marriage〉", "src": "課本 p.23", "lines": [{"sp": "", "en": "Most people in Taiwan can choose their husband or wife, but people in some countries cannot.", "zh": "台灣大部分的人可以選擇自己的丈夫或妻子，但有些國家的人不行。", "hl": true, "note": ""}, {"sp": "", "en": "Millions of children under the age of eighteen get married without a choice.", "zh": "數百萬名十八歲以下的孩子在沒有選擇的情況下結婚。", "hl": true, "note": "under the age of eighteen 十八歲以下；without 沒有。"}, {"sp": "", "en": "Here are two stories.", "zh": "這裡有兩個故事。", "hl": false, "note": ""}, {"sp": "", "en": "A ten-year-old girl from Niger, Geeta, got married to a thirty-year-old man.", "zh": "一個來自尼日的十歲女孩 Geeta，嫁給了一個三十歲的男人。", "hl": false, "note": ""}, {"sp": "", "en": "Geeta had her first baby and became a mother at eleven.", "zh": "Geeta 生了第一個孩子，十一歲就成為母親。", "hl": true, "note": "have → had；become → became。"}, {"sp": "", "en": "She could not go to school because her baby needed her.", "zh": "她不能上學，因為她的寶寶需要她。", "hl": true, "note": ""}, {"sp": "", "en": "Tanya, from Yemen, got married to a man at eleven because he gave her father money.", "zh": "來自葉門的 Tanya 十一歲就嫁人了，因為那個男人給了她父親錢。", "hl": false, "note": "give → gave。"}, {"sp": "", "en": "She cried and said \"NO!\", but nobody helped her.", "zh": "她哭著說「不！」，但沒有人幫她。", "hl": true, "note": ""}, {"sp": "", "en": "Her husband hit her very often. She was scared and could not sleep at night.", "zh": "她丈夫很常打她。她很害怕，晚上睡不著。", "hl": false, "note": ""}, {"sp": "", "en": "The marriage was like a nightmare.", "zh": "這段婚姻就像一場惡夢。", "hl": false, "note": "Using Context Clues：從前一句推測 nightmare＝很糟的經驗。"}, {"sp": "", "en": "Child marriage is happening in many countries.", "zh": "童婚正在許多國家發生。", "hl": false, "note": ""}, {"sp": "", "en": "Children like Geeta and Tanya need our help. Let's take action now!", "zh": "像 Geeta 和 Tanya 這樣的孩子需要我們的幫助。我們現在就採取行動吧！", "hl": true, "note": ""}]}], "grammar": [{"id": "past-irr", "name": "不規則動詞過去式（課本 p.27 表）", "icon": "📋", "c": ["PAST-IRR"], "intro": "不規則動詞沒有規則可以推，只能背。但可以<b>照長相分組</b>，一組一組背會快很多。", "table": [["長相", "例子"], ["母音換掉", "come → came、run → ran、swim → swam、sing → sang、win → won、get → got、sit → sat"], ["-ought／-aught", "buy → bought、bring → brought、fight → fought、catch → caught"], ["-ew", "know → knew、fly → flew、draw → drew、throw → threw"], ["-o-e", "choose → chose、break → broke、write → wrote、ride → rode、wear → wore"], ["-d → -t", "build → built、sleep → slept、meet → met、mean → meant、feel → felt"], ["完全不像", "go → went、be → was／were、have → had、eat → ate、see → saw、sell → sold、tell → told、take → took"], ["原形＝過去式", "hit、hurt、let、put、read（唸 /rɛd/）"]], "flows": [{"title": "課文裡的不規則動詞", "steps": [{"tokens": ["Her", "father", "sells", "her", "."], "hl": [2], "note": "現在式：sells"}, {"tokens": ["Her", "father", "sold", "her", "."], "hl": [2], "note": "過去式：sell → <b>sold</b>（不是 selled）"}, {"tokens": ["Did", "her", "father", "sell", "her", "?"], "hl": [0, 3], "note": "問句一樣用 did＋<b>原形 sell</b>"}]}, {"title": "🔴 原形和過去式同形", "steps": [{"tokens": ["He", "often", "hits", "her", "."], "hl": [2], "note": "現在式第三人稱單數：hits"}, {"tokens": ["He", "often", "hit", "her", "."], "hl": [2], "note": "過去式：hit（看到沒有 s 就知道是過去）"}, {"tokens": ["I", "read", "a", "special", "book", "last", "week", "."], "hl": [1, 5, 6], "note": "read 過去式拼法一樣，靠 last week 判斷，唸 /rɛd/"}]}], "tutor": [{"say": "buy 的過去式是？", "ch": [{"t": "buyed", "ok": false, "re": "buy 是不規則動詞，-ought 那一組。"}, {"t": "bought", "ok": true, "re": "對！buy → bought，和 bring → brought 同一組。"}, {"t": "brought", "ok": false, "re": "brought 是 bring（帶來）的過去式。"}]}, {"say": "「She ___ a mother at eleven.」（become）", "ch": [{"t": "becomed", "ok": false, "re": "become 不規則。"}, {"t": "became", "ok": true, "re": "沒錯！come → came，所以 become → became。"}]}, {"say": "「He ___ her very often last year.」（hit）", "ch": [{"t": "hitted", "ok": false, "re": "hit 的過去式還是 hit。"}, {"t": "hit", "ok": true, "re": "對！hit、put、let、hurt 原形和過去式同形。"}, {"t": "hits", "ok": false, "re": "last year 要過去式。"}]}]}, {"id": "why", "name": "Why…? Because…", "icon": "❔", "c": ["WHY"], "intro": "問原因用 <b>Why</b>，回答用 <b>Because＋完整句子</b>。Why 後面的結構和其他疑問詞一樣：Why＋did／was＋主詞…？", "table": [["問句", "回答"], ["Why did she take a bus to school yesterday?", "Because her sister broke her bike."], ["Why didn't she go to the party last weekend?", "Because she was sick."], ["Why were you late?", "Because I missed the bus."]], "flows": [{"title": "Did 問句加上 Why", "steps": [{"tokens": ["Did", "she", "take", "a", "bus", "?"], "hl": [0, 2], "note": "Yes／No 問句：Did＋主詞＋原形"}, {"tokens": ["Why", "did", "she", "take", "a", "bus", "?"], "hl": [0], "note": "問原因：句首加 Why"}, {"tokens": ["Because", "her", "sister", "broke", "her", "bike", "."], "hl": [0, 3], "note": "回答：Because＋完整句子（broke 過去式）"}]}, {"title": "Why didn't…?", "steps": [{"tokens": ["Why", "didn't", "Terry", "come", "to", "work", "?"], "hl": [1, 3], "note": "Why didn't＋主詞＋原形：為什麼沒有…？"}, {"tokens": ["He", "didn't", "come", "because", "his", "grandfather", "was", "sick", "."], "hl": [3], "note": "回答時可以說完整句：…because＋原因"}]}], "tutor": [{"say": "「___ did you cry?」—「Because the movie was sad.」", "ch": [{"t": "What", "ok": false, "re": "回答用 Because → 問原因 Why。"}, {"t": "Why", "ok": true, "re": "對！Why 和 Because 是一組。"}, {"t": "How", "ok": false, "re": "How 問方法或狀況，這裡在問原因。"}]}, {"say": "「Why didn't Sara go to the party?」最好的回答？", "ch": [{"t": "Yes, she didn't.", "ok": false, "re": "Why 問句不能用 Yes／No 回答。"}, {"t": "Because she was too busy.", "ok": true, "re": "完美！Because＋完整句子。"}, {"t": "So she was busy.", "ok": false, "re": "回答原因要用 Because，不是 So。"}]}]}, {"id": "because-so", "name": "because 和 so：同一件事的兩種寫法", "icon": "🔗", "c": ["CONJ"], "intro": "中文說「<b>因為</b>下雨，<b>所以</b>我沒出門」，英文<b>只能選一個</b>：because 接原因，so 接結果。另外 <b>because of</b> 後面接名詞（段考考過）。", "table": [["寫法", "例句"], ["Because＋原因, 結果.", "Because Amy won the game, she was very happy."], ["結果＋because＋原因.", "Amy was very happy because she won the game."], ["原因, so＋結果.", "Amy won the game, so she was very happy."], ["because of＋名詞", "I stayed home because of the heavy rain."]], "flows": [{"title": "同一件事三種寫法", "steps": [{"tokens": ["Because", "Leo", "was", "busy", ",", "he", "didn't", "feed", "his", "cat", "."], "hl": [0, 4], "note": "Because 放句首：原因後面要加逗號"}, {"tokens": ["Leo", "didn't", "feed", "his", "cat", "because", "he", "was", "busy", "."], "hl": [5], "note": "because 放中間：不用逗號"}, {"tokens": ["Leo", "was", "busy", ",", "so", "he", "didn't", "feed", "his", "cat", "."], "hl": [3, 4], "note": "so 接結果：前面加逗號"}]}, {"title": "🔴 because 和 because of", "steps": [{"tokens": ["I", "stayed", "home", "because", "it", "rained", "."], "hl": [3, 4, 5], "note": "because＋<b>句子</b>（it rained）"}, {"tokens": ["I", "stayed", "home", "because", "of", "the", "rain", "."], "hl": [3, 4, 6], "note": "because of＋<b>名詞</b>（the rain）"}]}], "tutor": [{"say": "「I was very hungry, ___ I ate some bread.」", "ch": [{"t": "because", "ok": false, "re": "後面「吃麵包」是結果，不是原因。"}, {"t": "so", "ok": true, "re": "對！餓是原因，吃麵包是結果 → so。"}, {"t": "but", "ok": false, "re": "前後不是相反的意思。"}]}, {"say": "「Because it rained, so I stayed home.」對嗎？", "ch": [{"t": "對", "ok": false, "re": "🔴 because 和 so 不能同時用，刪掉其中一個。"}, {"t": "不對", "ok": true, "re": "沒錯！只能寫 Because it rained, I stayed home. 或 It rained, so I stayed home."}]}, {"say": "「Tom didn't come ___ the heavy snow.」", "ch": [{"t": "because", "ok": false, "re": "後面 the heavy snow 是名詞，要用 because of。"}, {"t": "because of", "ok": true, "re": "對！because of＋名詞。"}, {"t": "so", "ok": false, "re": "後面是原因不是結果。"}]}]}], "questions": [{"id": "L2:mc01", "t": "mc", "set": "mc", "c": ["PAST-IRR"], "q": "Her father ___ her to an old man last year.", "o": ["sell", "sells", "sold", "selled"], "a": 2, "x": "sell → sold。", "L": "L2"}, {"id": "L2:mc02", "t": "mc", "set": "mc", "c": ["WHY"], "q": "A: ___ did you go to bed early last night?<br>B: Because I was tired.", "o": ["What", "Why", "How", "Who"], "a": 1, "x": "回答 Because → Why。", "L": "L2"}, {"id": "L2:mc03", "t": "mc", "set": "mc", "c": ["CONJ"], "q": "She couldn't stand it, ___ she ran away.", "o": ["because", "so", "or", "because of"], "a": 1, "x": "受不了（原因）→ 逃走（結果）→ so。", "L": "L2"}, {"id": "L2:mc04", "t": "mc", "set": "mc", "c": ["CONJ"], "q": "Geeta could not go to school ___ her baby needed her.", "o": ["so", "because", "but", "and"], "a": 1, "x": "後面是原因 → because。", "L": "L2"}, {"id": "L2:mc05", "t": "mc", "set": "mc", "c": ["CONJ"], "q": "We didn't go hiking ___ the heavy rain.", "o": ["because", "so", "because of", "and"], "a": 2, "x": "the heavy rain 名詞 → because of。", "L": "L2"}, {"id": "L2:mc06", "t": "mc", "set": "mc", "c": ["PAST-IRR"], "q": "Tanya ___ and said \"NO!\", but nobody helped her.", "o": ["cry", "cried", "cries", "cryed"], "a": 1, "x": "子音＋y → cried。", "L": "L2"}, {"id": "L2:mc07", "t": "mc", "set": "mc", "c": ["PHR"], "q": "She was only twelve, but she ___ to a 65-year-old man.", "o": ["got married", "took action", "passed away", "ran away"], "a": 0, "x": "get married to＋人。", "L": "L2"}, {"id": "L2:mc08", "t": "mc", "set": "mc", "c": ["PHR"], "q": "After the accident, he could not play basketball ___.", "o": ["ago", "anymore", "together", "ever"], "a": 1, "x": "not… anymore 不再。", "L": "L2"}, {"id": "L2:mc09", "t": "mc", "set": "mc", "c": ["V-ZH"], "q": "I'm ___ about the ending. Please tell me!", "o": ["scared", "poor", "curious", "terrible"], "a": 2, "x": "想知道結局 → 好奇 curious。", "L": "L2"}, {"id": "L2:mc10", "t": "mc", "set": "mc", "c": ["V-ZH"], "q": "___ helped her. She was all alone.", "o": ["Somebody", "Nobody", "Everybody", "Children"], "a": 1, "x": "孤單一人 → 沒有人幫她 Nobody。", "L": "L2"}, {"id": "L2:mc11", "t": "mc", "set": "mc", "c": ["PAST-IRR"], "q": "Zoe ___ her arm last week, so she can't write now.", "o": ["break", "breaked", "broke", "breaks"], "a": 2, "x": "break → broke。", "L": "L2"}, {"id": "L2:mc12", "t": "mc", "set": "mc", "c": ["PAST-IRR", "PAST-Q"], "q": "A: Did you buy a new computer?<br>B: Yes, I ___ it last Sunday.", "o": ["buy", "bought", "buyed", "brought"], "a": 1, "x": "buy → bought（brought 是 bring 的過去式）。", "L": "L2"}, {"id": "L2:mc13", "t": "mc", "set": "mc", "c": ["WHY", "PAST-NEG"], "q": "A: Why ___ you come to my party yesterday?<br>B: Because I was sick.", "o": ["don't", "didn't", "weren't", "aren't"], "a": 1, "x": "come 是一般動詞、yesterday → didn't。", "L": "L2"}, {"id": "L2:mc14", "t": "mc", "set": "mc", "c": ["V-ZH"], "q": "Millions of children under the ___ of eighteen get married.", "o": ["age", "pair", "test", "ending"], "a": 0, "x": "under the age of… 在…歲以下。", "L": "L2"} ward visited his grandma last weekend, ___ he didn't come to our party.", "a": ["so"], "x": "後面是結果 → so。", "L": "L2", "tsec": "wk-so"}, {"id": "L2:ws5", "t": "fill", "set": "workbook", "c": ["CONJ"], "q": "Marven was happy ___ he got a new toy on his birthday.", "a": ["because"], "x": "後面是原因 → because。", "L": "L2", "tsec": "wk-so"}, {"id": "L2:wc1", "t": "mc", "set": "workbook", "c": ["WH-PAST"], "q": "Ken: ___ did John do this morning? Mandy: He did nothing.", "o": ["Why", "How", "What", "Where"], "a": 2, "x": "回答「做了什麼」→ What。", "L": "L2", "tsec": "wk-choose"}, {"id": "L2:wc2", "t": "mc", "set": "workbook", "c": ["WHY"], "q": "Brian: ___ do you love basketball? Michael: Because it is exciting (令人感到刺激的).", "o": ["Who", "Why", "How", "Where"], "a": 1, "x": "回答 Because → Why。", "L": "L2", "tsec": "wk-choose"}, {"id": "L2:wc3", "t": "mc", "set": "workbook", "c": ["PAST-Q"], "q": "Alex: Did Hank ___ any sport today? Irene: No, he was at home.", "o": ["play", "plays", "played", "playing"], "a": 0, "x": "Did＋原形 play。", "L": "L2", "tsec": "wk-choose"}, {"id": "L2:wl1", "t": "order", "set": "workbook", "c": ["WH-PAST", "PAST-IRR"], "zh": "（圖：2017 年的婚禮）When did Natasha get married?", "en": "She got married in 2017.", "alt": [], "x": "get married → got married；in＋年份。", "L": "L2", "tsec": "wk-look"}, {"id": "L2:wl2", "t": "order", "set": "workbook", "c": ["WH-PAST", "PAST-IRR"], "zh": "（圖：王先生晚上坐在桌前看書）What did Mr. Wang do last night?（用「讀一本書」回答）", "en": "He read a book last night.", "alt": [], "x": "read 的過去式還是 read。", "L": "L2", "tsec": "wk-look"}, {"id": "L2:wl3", "t": "order", "set": "workbook", "c": ["CONJ", "WHY"], "zh": "（圖：下大雨，John 在公車站等車）rain a lot／go to school by bus：Because ___, ___ yesterday.", "en": "Because it rained a lot, John went to school by bus yesterday.", "alt": [], "x": "Because＋原因，結果放後面；go → went。", "L": "L2", "tsec": "wk-look"}, {"id": "L2:wl4", "t": "order", "set": "workbook", "c": ["CONJ", "PAST-NEG"], "zh": "（圖：Sandy 生病躺在床上）be sick／not go to the music class：___, so ___ last night.", "en": "Sandy was sick, so she didn't go to the music class last night.", "alt": [], "x": "原因, so＋結果；didn't＋原形 go。", "L": "L2", "tsec": "wk-look"}, {"id": "L2:wr1", "t": "mc", "set": "workbook", "c": ["V-ZH"], "q": "（短文：There is a special woman from Pakistan, and her name is Malala Yousafzai. In her childhood, she loved school and always enjoyed her classes. At that same time in Pakistan, there was a group of people, the Taliban. They didn't care about women's education. \"Women should be cooking at home and having babies. They shouldn't go to school,\" the Taliban said. They then stopped women from going to school ever again. Malala didn't like this, so she did something about it. She wrote about her life and women's troubles in Pakistan. She told the world her story, and the world listened. The Taliban was very angry. They shot her, but she didn't die. Two years later, she won the Nobel Peace Prize. What an amazing woman!） What did the Taliban say about women?", "o": ["They should have an education.", "They should cook for their family.", "They should tell their troubles to the world.", "They should write something about their life."], "a": 1, "x": "Women should be cooking at home…", "L": "L2", "tsec": "wk-read"}, {"id": "L2:wr2", "t": "mc", "set": "workbook", "c": ["V-ZH"], "q": "（短文：There is a special woman from Pakistan, and her name is Malala Yousafzai. In her childhood, she loved school and always enjoyed her classes. At that same time in Pakistan, there was a group of people, the Taliban. They didn't care about women's education. \"Women should be cooking at home and having babies. They shouldn't go to school,\" the Taliban said. They then stopped women from going to school ever again. Malala didn't like this, so she did something about it. She wrote about her life and women's troubles in Pakistan. She told the world her story, and the world listened. The Taliban was very angry. They shot her, but she didn't die. Two years later, she won the Nobel Peace Prize. What an amazing woman!） What do we know about Malala?", "o": ["She joined the Taliban.", "The Taliban shot her family.", "She didn't care about women's education.", "She almost died because the Taliban shot her."], "a": 3, "x": "They shot her, but she didn't die → 差點死掉。", "L": "L2", "tsec": "wk-read"}, {"id": "L2:wr3", "t": "mc", "set": "workbook", "c": ["V-ZH"], "q": "（短文：There is a special woman from Pakistan, and her name is Malala Yousafzai. In her childhood, she loved school and always enjoyed her classes. At that same time in Pakistan, there was a group of people, the Taliban. They didn't care about women's education. \"Women should be cooking at home and having babies. They shouldn't go to school,\" the Taliban said. They then stopped women from going to school ever again. Malala didn't like this, so she did something about it. She wrote about her life and women's troubles in Pakistan. She told the world her story, and the world listened. The Taliban was very angry. They shot her, but she didn't die. Two years later, she won the Nobel Peace Prize. What an amazing woman!） What could the title of this reading be?", "o": ["The Taliban.", "Women Should Be at Home.", "A Special Woman in Pakistan.", "Write Something, and Become Famous."], "a": 2, "x": "全文在介紹 Malala 這位特別的女性。", "L": "L2", "tsec": "wk-read"}], "reading": [{"id": "L2:r1", "title": "閱讀（一）Kids Around the World", "tree": "", "p": "Sam is 11. He lives in Canada. Every morning he takes a bus to school, and after school he plays soccer with his friends. Ali is 11, too, but his life is very different. His family is poor, so he works in a shoe factory ten hours a day. He makes shoes, but he doesn't have a pair of his own. Last year, a teacher from a city school visited the factory. <b>She</b> started a night class for the kids there. Now Ali studies math and English after work. \"I want to be a teacher, too,\" he says.", "qs": [{"id": "L2:r1a", "t": "mc", "set": "read", "c": ["CONJ"], "q": "Why does Ali work in a factory?", "o": ["He likes making shoes.", "His family is poor.", "He doesn't like school.", "His teacher works there."], "a": 1, "x": "His family is poor, so he works…", "L": "L2"}, {"id": "L2:r1b", "t": "mc", "set": "read", "c": ["V-ZH"], "q": "What does <b>She</b> mean?", "o": ["Ali's mother.", "A teacher from a city school.", "Sam's friend.", "A factory worker."], "a": 1, "x": "前一句提到 a teacher from a city school。", "L": "L2"}, {"id": "L2:r1c", "t": "mc", "set": "read", "c": ["V-ZH"], "q": "Which is TRUE?", "o": ["Sam works in a factory.", "Ali has many pairs of shoes.", "Ali goes to a night class now.", "Sam and Ali live in the same country."], "a": 2, "x": "Now Ali studies math and English after work（夜間課）。", "L": "L2"}]}, {"id": "L2:r2", "title": "閱讀（二）克漏字：A Bad Day", "tree": "", "p": "Yesterday was a bad day for Kevin. He got up late __1__ his alarm clock didn't ring. He ran to the bus stop, but he __2__ the bus. In class, he couldn't find his homework, __3__ the teacher was angry. After school, it rained, and he didn't have an umbrella. \"What a terrible day!\" he said.", "qs": [{"id": "L2:r2a", "t": "mc", "set": "read", "c": ["CONJ"], "q": "第 1 格：", "o": ["so", "because", "but", "or"], "a": 1, "x": "鬧鐘沒響是原因 → because。", "L": "L2"}, {"id": "L2:r2b", "t": "mc", "set": "read", "c": ["PAST-REG"], "q": "第 2 格：", "o": ["miss", "missed", "misses", "missing"], "a": 1, "x": "Yesterday 的事 → 過去式 missed（錯過）。", "L": "L2"}, {"id": "L2:r2c", "t": "mc", "set": "read", "c": ["CONJ"], "q": "第 3 格：", "o": ["because", "so", "or", "because of"], "a": 1, "x": "找不到作業 → 老師生氣（結果）→ so。", "L": "L2"}]}], "teacher": [], "workbook": [{"id": "wk-fill", "title": "Part 1 Fill In 選字填空", "page": "習作 p.9", "ids": ["L2:wf1", "L2:wf2", "L2:wf3", "L2:wf4", "L2:wf5", "L2:wf6", "L2:wf7", "L2:wf8"]}, {"id": "wk-hint", "title": "Part 2 Fill In 依字首字尾填字", "page": "習作 p.10", "ids": ["L2:wh1", "L2:wh2", "L2:wh3", "L2:wh4", "L2:wh5", "L2:wh6", "L2:wh7", "L2:wh8"]}, {"id": "wk-past", "title": "Part 3 寫出過去式（不規則）", "page": "習作 p.10", "ids": ["L2:wp1", "L2:wp2", "L2:wp3", "L2:wp4", "L2:wp5", "L2:wp6", "L2:wp7", "L2:wp8", "L2:wp9"]}, {"id": "wk-so", "title": "Part 4 填 because 或 so", "page": "習作 p.11", "ids": ["L2:ws1", "L2:ws2", "L2:ws3", "L2:ws4", "L2:ws5"]}, {"id": "wk-choose", "title": "Part 5 Read and Choose 文法選擇", "page": "習作 p.11", "ids": ["L2:wc1", "L2:wc2", "L2:wc3"]}, {"id": "wk-look", "title": "Part 6 Look, Read, and Write 看圖作答", "page": "習作 p.12", "ids": ["L2:wl1", "L2:wl2", "L2:wl3", "L2:wl4"]}, {"id": "wk-read", "title": "Part 7 Read and Choose 閱讀〈Malala〉", "page": "習作 p.13", "ids": ["L2:wr1", "L2:wr2", "L2:wr3"]}], "secNotes": {"對話：一本特別的書": "這一課的動詞很多是<b>不規則</b>的：sell → sold、hit → hit、read → read、have → had、can → could、run → ran。why（為什麼）和 because（因為）是一組。", "不同孩子的生活": "Word Power 用兩兩對照的圖片比較孩子的生活：make shoes ↔ buy a pair of shoes、pick cacao fruit ↔ eat chocolate。buy → bought、break → broke 要背。", "閱讀：童婚": "〈Child Marriage〉的字。choose → chose、become → became、give → gave、cry → cried。children 是 child 的複數；nobody＝沒有人（後面動詞用單數）。", "片語": "get married 結婚（got married）、not… anymore 不再、take action 採取行動（took action）、at the age of 在……歲時。"}, "tiles": [["🔤", "單字卡", "選類別→學習單字或拼字", "words"], ["📖", "課文", "對話＋閱讀・重點句", "text"], ["⭐", "課文重點句", "中翻英：先排字再打字", "do/best"], ["🧩", "文法", "不規則過去式・Why・because／so", "grammar"], ["📋", "不規則動詞表", "課本 p.27 整張表分組背", "g/past-irr"], ["🔁", "不規則動詞過去式練習", "57 個動詞，每回合 8 個，輪完為止", "#/verbs/irr"], ["🔗", "because／so", "原因和結果，一句只能用一個", "g/because-so"], ["📒", "習作（附答案）", "習作 p.9–13：看答案或直接作答", "workbook"], ["📄", "講義型練習", "片語・一字多義・句型…", "handout"], ["👂", "聽力", "辨識句意・問答・言談理解", "listen"], ["✅", "本課小考", "16 題混合", "quiz"]]}, {"id": "R1", "short": "Review 1", "title": "Review 1　總複習＋Reading Corner 1", "sub": "課本 p.33–38｜現在式 vs 過去式・because／so・圖表閱讀・Dear Diary", "scope": ["L1", "L2", "R1"], "words": [{"sec": "Review 與 Reading Corner", "w": "finally", "pos": "adv.", "zh": "最終地；終於", "ex": "Emma and Irene finally arrived.", "exz": "Emma 和 Irene 終於到了。", "pl": "", "plr": "none", "der": [], "note": "", "tex": "Emma and Irene finally arrived…", "posq": true, "cap": 22}, {"sec": "Review 與 Reading Corner", "w": "arrive", "pos": "v.", "zh": "抵達", "ex": "We arrived at the restaurant at noon.", "exz": "我們中午抵達餐廳。", "pl": "arrived", "plr": "ed", "der": ["arrive at＋小地點", "arrive in＋大地方"], "note": "", "tex": "", "posq": true, "cap": 8}, {"sec": "Review 與 Reading Corner", "w": "miss", "pos": "v.", "zh": "錯過；想念", "ex": "Emma missed the bus.", "exz": "Emma 錯過了公車。", "pl": "missed", "plr": "ed", "der": ["miss the bus 錯過公車", "miss someone 想念某人"], "note": "", "tex": "Emma was late because she missed the bus.", "posq": true, "cap": 11}, {"sec": "Review 與 Reading Corner", "w": "get lost", "pos": "phr.", "zh": "迷路", "ex": "Irene got lost on her way.", "exz": "Irene 在路上迷路了。", "pl": "got lost", "plr": "irr", "der": [], "note": "", "tex": "Irene was late because she got lost.", "posq": false, "cap": 1}, {"sec": "Review 與 Reading Corner", "w": "diary", "pos": "n.", "zh": "日記", "ex": "I write in my diary every night.", "exz": "我每晚寫日記。", "pl": "", "plr": "none", "der": ["Dear Diary, 日記開頭"], "note": "", "tex": "", "posq": true, "cap": 8}, {"sec": "Review 與 Reading Corner", "w": "mood", "pos": "n.", "zh": "心情", "ex": "He was in a bad mood.", "exz": "他心情不好。", "pl": "", "plr": "none", "der": ["in a good／bad mood"], "note": "", "tex": "He was in a bad mood.", "posq": true, "cap": 0}, {"sec": "Review 與 Reading Corner", "w": "worried", "pos": "adj.", "zh": "擔心的", "ex": "I am worried about the test.", "exz": "我很擔心考試。", "pl": "", "plr": "none", "der": ["be worried about…"], "note": "", "tex": "", "posq": true, "cap": 12}, {"sec": "Review 與 Reading Corner", "w": "note", "pos": "n.", "zh": "筆記", "ex": "Can you share your notes with me?", "exz": "你可以跟我分享筆記嗎？", "pl": "", "plr": "none", "der": [], "note": "", "tex": "", "posq": true, "cap": 0}, {"sec": "Review 與 Reading Corner", "w": "surprise", "pos": "n.", "zh": "驚喜", "ex": "The cake was a surprise.", "exz": "那個蛋糕是個驚喜。", "pl": "", "plr": "none", "der": [], "note": "", "tex": "It was a surprise from Emma and Irene.", "posq": true, "cap": 9}, {"sec": "Review 與 Reading Corner", "w": "waiter", "pos": "n.", "zh": "服務生", "ex": "The waiter brought a cake.", "exz": "服務生端來一個蛋糕。", "pl": "", "plr": "none", "der": [], "note": "", "tex": "Later, the waiter brought a cake to our table.", "posq": true, "cap": 0}, {"sec": "Review 與 Reading Corner", "w": "bring", "pos": "v.", "zh": "帶來", "ex": "He brought gifts for me.", "exz": "他帶禮物給我。", "pl": "brought", "plr": "irr", "der": ["bring ↔ take"], "note": "", "tex": "", "posq": true, "cap": 36}, {"sec": "Review 與 Reading Corner", "w": "wait", "pos": "v.", "zh": "等", "ex": "I waited for them for an hour.", "exz": "我等了他們一個小時。", "pl": "waited", "plr": "ed", "der": ["wait for… 等待…"], "note": "", "tex": "I waited for them in front of the restaurant for almost an hour.", "posq": true, "cap": 16}], "texts": [{"id": "v1", "title": "Build Your Vocabulary（人的一生）", "src": "課本 p.33", "lines": [{"sp": "", "en": "People study at school, make friends, and share everything with each other.", "zh": "人們在學校讀書、交朋友，彼此分享一切。", "hl": false, "note": ""}, {"sp": "", "en": "People have sweet memories of life and work.", "zh": "人們擁有生活和工作的甜蜜回憶。", "hl": false, "note": ""}, {"sp": "", "en": "People fall in love with someone, get married, and start a new family.", "zh": "人們愛上某人、結婚，並組成新家庭。", "hl": false, "note": ""}, {"sp": "", "en": "People finally pass away.", "zh": "人們最終會過世。", "hl": false, "note": ""}]}, {"id": "v2", "title": "Read and Fill In（Dear Diary）", "src": "課本 p.34", "lines": [{"sp": "", "en": "Dear Diary,", "zh": "親愛的日記：", "hl": false, "note": ""}, {"sp": "", "en": "I get up early and cook breakfast for my husband every morning.", "zh": "我每天早上很早起床，為我丈夫做早餐。", "hl": false, "note": "every morning → 現在式 get。"}, {"sp": "", "en": "After he goes to work, I do the dishes, clean the house, and look after my baby. I am very busy every day.", "zh": "他去上班後，我洗碗、打掃房子、照顧寶寶。我每天都很忙。", "hl": false, "note": ""}, {"sp": "", "en": "Last night, my husband came home very late. He was in a bad mood.", "zh": "昨晚，我丈夫很晚才回家。他心情很差。", "hl": true, "note": "Last night → 過去式 came、was。"}, {"sp": "", "en": "He hit me and broke my arm. I cried, but no one helped me.", "zh": "他打我，還打斷了我的手臂。我哭了，但沒有人幫我。", "hl": true, "note": "hit（同形）、broke、cried。"}, {"sp": "", "en": "I'm just 12 years old. I am sad. I don't want a life like this anymore. Who can help me?", "zh": "我才 12 歲。我很難過。我不想再過這樣的生活了。誰能幫我？", "hl": false, "note": ""}]}, {"id": "rc1", "title": "Reading Corner 1〈Dear Diary〉", "src": "課本 p.37", "lines": [{"sp": "", "en": "Emma, Irene, and I met for lunch at a restaurant on my birthday, but they were late.", "zh": "我生日那天，Emma、Irene 和我約在餐廳吃午餐，但她們遲到了。", "hl": true, "note": ""}, {"sp": "", "en": "Emma was late because she missed the bus. Irene was late because she got lost.", "zh": "Emma 遲到是因為錯過公車。Irene 遲到是因為迷路了。", "hl": true, "note": ""}, {"sp": "", "en": "So, I waited for them in front of the restaurant for almost an hour. I was angry.", "zh": "所以，我在餐廳前面等了她們將近一小時。我很生氣。", "hl": false, "note": ""}, {"sp": "", "en": "Emma and Irene finally arrived, and we went inside the restaurant.", "zh": "Emma 和 Irene 終於到了，我們走進餐廳。", "hl": false, "note": ""}, {"sp": "", "en": "The food was great. We all enjoyed the meal, and I was not that angry with them anymore.", "zh": "食物很棒。我們都很享受這一餐，我也沒那麼生她們的氣了。", "hl": false, "note": ""}, {"sp": "", "en": "Later, the waiter brought a cake to our table. There were candles on it.", "zh": "後來，服務生端了一個蛋糕到我們桌上。上面有蠟燭。", "hl": true, "note": "it＝the cake（課本第 1 題）。"}, {"sp": "", "en": "It was a surprise from Emma and Irene. They bought the cake for me and brought gifts.", "zh": "那是 Emma 和 Irene 給的驚喜。她們為我買了蛋糕，還帶了禮物。", "hl": false, "note": ""}, {"sp": "", "en": "Emma missed the bus because she went to buy the cake. Irene went to the gift shop for my gift, but she got lost.", "zh": "Emma 錯過公車是因為她去買蛋糕。Irene 去禮品店買我的禮物，結果迷路了。", "hl": true, "note": ""}, {"sp": "", "en": "My friends are sweet and really care about me. I love them so much.", "zh": "我的朋友們很貼心，真的很關心我。我好愛她們。", "hl": false, "note": ""}, {"sp": "", "en": "It was a great day with good food and good friends.", "zh": "那是有美食和好朋友的美好一天。", "hl": false, "note": ""}]}], "grammar": [{"id": "past-sum", "name": "現在式 vs 過去式總整理", "icon": "🔁", "c": ["PAST-BE", "PAST-REG", "PAST-IRR", "TIME"], "intro": "判斷用現在式還是過去式，<b>先找時間線索</b>：every day、usually、now → 現在式；yesterday、last…、…ago → 過去式。", "table": [["", "現在式", "過去式"], ["be 動詞", "am、is／are", "was／were"], ["規則動詞", "share、jog、study", "shared、jogged、studied"], ["不規則動詞", "sell、buy、break", "sold、bought、broke"], ["否定", "don't／doesn't＋原形", "didn't＋原形"], ["問句", "Do／Does＋主詞＋原形", "Did＋主詞＋原形"]], "flows": [{"title": "同一個人、兩個時間", "steps": [{"tokens": ["I", "get", "up", "early", "every", "morning", "."], "hl": [1, 4, 5], "note": "every morning → 現在式 get"}, {"tokens": ["I", "got", "up", "late", "yesterday", "."], "hl": [1, 4], "note": "yesterday → 過去式 got"}, {"tokens": ["I", "didn't", "get", "up", "early", "yesterday", "."], "hl": [1, 2], "note": "否定：didn't＋原形 get"}]}, {"title": "🔴 第三人稱單數只在現在式", "steps": [{"tokens": ["He", "goes", "to", "work", "every", "day", "."], "hl": [1], "note": "現在式：he → goes"}, {"tokens": ["He", "went", "to", "work", "yesterday", "."], "hl": [1], "note": "過去式：不管主詞是誰，都是 went"}]}], "tutor": [{"say": "「After he ___ to work, I clean the house.」（every day 的日記）", "ch": [{"t": "goes", "ok": true, "re": "對！every day 的習慣用現在式，he → goes。"}, {"t": "went", "ok": false, "re": "這段講的是每天的事，用現在式。"}, {"t": "go", "ok": false, "re": "主詞 he 是第三人稱單數，要加 es。"}]}, {"say": "「Last night, my husband ___ home very late.」", "ch": [{"t": "comes", "ok": false, "re": "Last night 是過去 → came。"}, {"t": "came", "ok": true, "re": "沒錯！come → came。"}]}]}], "questions": [{"id": "R1:mc01", "t": "mc", "set": "mc", "c": ["TIME", "PAST-IRR"], "q": "I usually take the bus to school, but I ___ a taxi yesterday.", "o": ["take", "took", "takes", "taking"], "a": 1, "x": "yesterday → took。", "L": "R1"}, {"id": "R1:mc02", "t": "mc", "set": "mc", "c": ["CONJ"], "q": "Emma was late ___ she missed the bus.", "o": ["so", "because", "and", "or"], "a": 1, "x": "後面是原因 → because。", "L": "R1"}, {"id": "R1:mc03", "t": "mc", "set": "mc", "c": ["MULTI"], "q": "I ___ my grandma a lot. She lives in Tainan.", "o": ["miss", "arrive", "wait", "bring"], "a": 0, "x": "想念 miss（miss 也可以是「錯過」）。", "L": "R1"}, {"id": "R1:mc04", "t": "mc", "set": "mc", "c": ["PHR"], "q": "Irene went to the gift shop, but she ___.", "o": ["got lost", "got married", "took action", "passed away"], "a": 0, "x": "迷路 got lost。", "L": "R1"}, {"id": "R1:mc05", "t": "mc", "set": "mc", "c": ["V-ZH"], "q": "We waited for an hour, and the bus ___ came.", "o": ["finally", "ago", "seldom", "together"], "a": 0, "x": "等了一小時 → 終於 finally。", "L": "R1"}, {"id": "R1:mc06", "t": "mc", "set": "mc", "c": ["THERE"], "q": "There ___ some candles on the cake yesterday.", "o": ["is", "are", "was", "were"], "a": 3, "x": "candles 複數、過去 → were。", "L": "R1"}, {"id": "R1:mc07", "t": "mc", "set": "mc", "c": ["PAST-BE", "TIME"], "q": "My brother ___ in a bad mood last night.", "o": ["is", "was", "were", "did"], "a": 1, "x": "brother → was。", "L": "R1"}, {"id": "R1:mc08", "t": "mc", "set": "mc", "c": ["WH-PAST"], "q": "A: What did the waiter bring?<br>B: He ___ a cake.", "o": ["bring", "brought", "brings", "bringed"], "a": 1, "x": "bring → brought。", "L": "R1"}, {"id": "R1:mc09", "t": "mc", "set": "mc", "c": ["V-ZH"], "q": "I am ___ about the English test on Friday. I didn't study.", "o": ["worried", "lively", "sweet", "dead"], "a": 0, "x": "沒讀書 → 擔心 worried。", "L": "R1"}, {"id": "R1:mc10", "t": "mc", "set": "mc", "c": ["PAST-NEG"], "q": "Kevin ___ have an umbrella, so he got wet.", "o": ["doesn't", "didn't", "wasn't", "isn't"], "a": 1, "x": "got 過去 → didn't＋原形 have。", "L": "R1"}, {"id": "R1:mc11", "t": "mc", "set": "mc", "c": ["CONJ"], "q": "It was rainy, ___ we stayed home and watched TV.", "o": ["because", "so", "because of", "or"], "a": 1, "x": "結果 → so。", "L": "R1"}, {"id": "R1:mc12", "t": "mc", "set": "mc", "c": ["PAST-REG", "TIME"], "q": "We ___ in front of the restaurant for almost an hour yesterday.", "o": ["wait", "waited", "waits", "waiting"], "a": 1, "x": "waited。", "L": "R1"}, {"id": "R1:j01", "t": "fill", "set": "judge", "c": ["PAST-IRR"], "q": "Last night, my husband ___ (come) home very late.", "a": ["came"], "x": "come → came。", "L": "R1"}, {"id": "R1:j02", "t": "fill", "set": "judge", "c": ["PAST-IRR"], "q": "He ___ (break) my arm.", "a": ["broke"], "x": "break → broke。", "L": "R1"}, {"id": "R1:j03", "t": "fill", "set": "judge", "c": ["PAST-REG"], "q": "I ___ (cry), but no one helped me.", "a": ["cried"], "x": "cry → cried。", "L": "R1"}, {"id": "R1:j04", "t": "fill", "set": "judge", "c": ["TIME"], "q": "I ___ (get) up early every morning.", "a": ["get"], "x": "every morning → 現在式。", "L": "R1"}, {"id": "R1:j05", "t": "fill", "set": "judge", "c": ["PAST-IRR"], "q": "They ___ (buy) the cake for me.", "a": ["bought"], "x": "buy → bought。", "L": "R1"}, {"id": "R1:j06", "t": "fill", "set": "judge", "c": ["PAST-REG"], "q": "Emma and Irene finally ___ (arrive).", "a": ["arrived"], "x": "字尾 e → arrived。", "L": "R1"}, {"id": "R1:t01", "t": "order", "set": "pattern", "c": ["CONJ"], "zh": "用 because 合併：Irene was late. She got lost.", "en": "Irene was late because she got lost.", "alt": [], "x": "", "L": "R1"}, {"id": "R1:t02", "t": "order", "set": "pattern", "c": ["CONJ"], "zh": "用 so 合併：I missed your call last night. I didn't go to school yesterday.", "en": "I missed your call last night, so I didn't go to school yesterday.", "alt": [], "x": "", "L": "R1"}, {"id": "R1:t03", "t": "order", "set": "pattern", "c": ["PAST-Q", "PAST-IRR"], "zh": "改問句：The waiter brought a cake.", "en": "Did the waiter bring a cake?", "alt": [], "x": "", "L": "R1"}, {"id": "R1:t04", "t": "order", "set": "pattern", "c": ["WHY"], "zh": "依畫線部分造問句：Emma missed the bus <u>because she went to buy the cake</u>.", "en": "Why did Emma miss the bus?", "alt": [], "x": "", "L": "R1"}, {"id": "R1:b01", "t": "order", "set": "best", "c": ["CONJ"], "zh": "Emma 遲到是因為她錯過了公車。", "en": "Emma was late because she missed the bus.", "alt": [], "x": "", "L": "R1"}, {"id": "R1:b02", "t": "order", "set": "best", "c": ["PAST-REG"], "zh": "我在餐廳前面等了她們將近一小時。", "en": "I waited for them in front of the restaurant for almost an hour.", "alt": [], "x": "", "L": "R1"}, {"id": "R1:b03", "t": "order", "set": "best", "c": ["V-ZH"], "zh": "那是有美食和好朋友的美好一天。", "en": "It was a great day with good food and good friends.", "alt": [], "x": "", "L": "R1"}, {"id": "R1:h01", "t": "fill", "set": "hand", "c": ["PHR", "PAST-IRR"], "q": "Irene 在路上迷路了。<br>Irene ___ ___ on her way.（兩格用空格隔開）", "a": ["got lost"], "x": "get lost → got lost。", "L": "R1"}, {"id": "R1:h02", "t": "fill", "set": "hand", "c": ["PAST-IRR"], "q": "服務生端來一個蛋糕。<br>The ___ ___ a cake.（兩格用空格隔開）", "a": ["waiter brought"], "x": "bring → brought。", "L": "R1"}, {"id": "R1:h03", "t": "fill", "set": "hand", "c": ["V-ZH"], "q": "她們終於到了。<br>They ___ ___.（兩格用空格隔開）", "a": ["finally arrived"], "x": "finally＋過去式 arrived。", "L": "R1"}, {"id": "R1:la1", "t": "listen", "set": "listen", "kind": "pic", "c": ["V-ZH"], "s": "The waiter brought a birthday cake with candles.", "q": "選出符合的圖", "o": ["🎂", "🚌", "📒"], "a": 0, "x": "birthday cake。", "L": "R1"}, {"id": "R1:lb1", "t": "listen", "set": "listen", "kind": "resp", "c": ["WHY"], "s": "Why were you late?", "q": "選出最適合的回應", "o": ["Because I got lost.", "Yes, I was.", "I'm late."], "a": 0, "x": "Why → Because。", "L": "R1"}, {"id": "R1:lc1", "t": "listen", "set": "listen", "kind": "talk", "c": ["V-ZH"], "s": "W: Did you have a good birthday, Ann?|M: Yes! My friends were late, but they brought a surprise cake for me.|Q: What did Ann's friends bring?", "q": "根據對話回答問題", "o": ["Some flowers.", "A cake.", "A gift card."], "a": 1, "x": "a surprise cake。", "L": "R1"}, {"id": "R1:e114_22", "t": "mc", "set": "mc", "c": ["PAST-BE"], "q": "Tom: How ___ the weather in Tainan yesterday?<br>Mary: Too cold.", "o": ["is", "be", "was", "did"], "a": 2, "x": "yesterday 過去、the weather 單數 → was。（114 學年第一次段考原題，非官方解答）", "L": "R1"}, {"id": "R1:e114_23", "t": "mc", "set": "mc", "c": ["PAST-Q"], "q": "Hank: ___ it rain a lot yesterday?<br>Mary: Yes.", "o": ["Is", "Did", "Was", "Does"], "a": 1, "x": "後面是原形動詞 rain、yesterday 過去 → Did。（114 學年第一次段考原題，非官方解答）", "L": "R1"}, {"id": "R1:e114_25", "t": "mc", "set": "mc", "c": ["PHR", "WHY"], "q": "Henry: Why are you crying?<br>Jane: Because I am afraid ___ that dog.", "o": ["for", "of", "in", "at"], "a": 1, "x": "be afraid of… 害怕…。（114 學年第一次段考原題，非官方解答）", "L": "R1"}, {"id": "R1:e114_27", "t": "mc", "set": "mc", "c": ["PAST-REG"], "q": "Henry: What happened to this island?<br>Jane: People on this island said goodbye to their homes and ___ away.", "o": ["move", "moved", "moving", "didn't move"], "a": 1, "x": "前面 said 是過去式，and 連接同時態 → moved。（114 學年第一次段考原題，非官方解答）", "L": "R1"}, {"id": "R1:e114_29", "t": "mc", "set": "mc", "c": ["PHR", "PAST-IRR"], "q": "Henry: It was Mother's Day yesterday. What did you do?<br>Jane: I made a special card ___ my mom, and she was very happy.", "o": ["to", "by", "for", "with"], "a": 2, "x": "make something <b>for</b> someone 為某人做…。（114 學年第一次段考原題，非官方解答）", "L": "R1"}, {"id": "R1:e114_30", "t": "mc", "set": "mc", "c": ["CONJ", "WHY"], "q": "Henry: Why didn't you go to school yesterday?<br>Keven: I didn't go there ___ I was sick.", "o": ["so", "because", "because of", "thanks to"], "a": 1, "x": "後面是完整句子 I was sick（原因）→ because；because of 後面只能接名詞。（114 學年第一次段考原題，非官方解答）", "L": "R1"}, {"id": "R1:e114_31", "t": "mc", "set": "mc", "c": ["PAST-IRR", "WHY"], "q": "Tom: Why is your brother sick?<br>Keven: Because he ___ a cold shower yesterday.", "o": ["took", "make", "made", "take"], "a": 0, "x": "take a shower 洗澡；yesterday → took。（114 學年第一次段考原題，非官方解答）", "L": "R1"}, {"id": "R1:e114_32", "t": "mc", "set": "mc", "c": ["CONJ"], "q": "Tom: Why didn't you come to my birthday party yesterday?<br>Keven: ___ the heavy snow.", "o": ["Because", "So", "Because of", "And"], "a": 2, "x": "後面是名詞 the heavy snow → Because of。（114 學年第一次段考原題，非官方解答）", "L": "R1"}, {"id": "R1:e114_33", "t": "mc", "set": "mc", "c": ["CONJ"], "q": "Mary joined the study group ___ learned a lot.", "o": ["or", "because of", "so", "and"], "a": 3, "x": "參加讀書會「而且」學到很多，兩個動作同方向 → and。（114 學年第一次段考原題，非官方解答）", "L": "R1"}, {"id": "R1:e114_34", "t": "mc", "set": "mc", "c": ["CONJ"], "q": "You can watch TV with me at home ___ go shopping with Mom.", "o": ["or", "because of", "so", "and"], "a": 0, "x": "在家看電視「或」去逛街，二選一 → or。（114 學年第一次段考原題，非官方解答）", "L": "R1"}, {"id": "R1:e114_35", "t": "mc", "set": "mc", "c": ["PAST-NEG"], "q": "Henry: How did you treat your cold?<br>Jane: I didn't go to a doctor or ___ any medicine.", "o": ["take", "took", "make", "made"], "a": 0, "x": "didn't 後面兩個動詞都用原形：didn't go… or take…；take medicine 吃藥。（114 學年第一次段考原題，非官方解答）", "L": "R1"}, {"id": "R1:wc1", "t": "mc", "set": "workbook", "c": ["V-ZH"], "q": "We eat three ___ a day. They are breakfast, lunch and dinner.", "o": ["candles", "meals", "candies", "flowers"], "a": 1, "x": "早午晚三餐 → meals。", "L": "R1", "tsec": "wk-choose"}, {"id": "R1:wc2", "t": "mc", "set": "workbook", "c": ["V-ZH"], "q": "Jerry: How about having lunch at the new restaurant this weekend? Peter: Sorry. I'm really busy. Let's talk about it ___.", "o": ["yesterday", "ago", "later", "ever"], "a": 2, "x": "現在很忙 → 之後再說 later。", "L": "R1", "tsec": "wk-choose"}, {"id": "R1:wc3", "t": "mc", "set": "workbook", "c": ["PAST-IRR", "V-ZH"], "q": "The woman's husband ___ her every day. She couldn't stand it, so she ran away.", "o": ["hit", "sold", "guessed", "chose"], "a": 0, "x": "受不了而逃走 → 打她 hit。", "L": "R1", "tsec": "wk-choose"}, {"id": "R1:wc4", "t": "mc", "set": "workbook", "c": ["PAST-REG", "V-ZH"], "q": "Cathy ___ a story with her friends yesterday.", "o": ["jogged", "remembered", "planted", "shared"], "a": 3, "x": "share a story with… 和…分享故事。", "L": "R1", "tsec": "wk-choose"}, {"id": "R1:wc5", "t": "mc", "set": "workbook", "c": ["V-ZH"], "q": "Mary had a bad dream (夢). She was very ___ and could not sleep.", "o": ["dead", "last", "scared", "lively"], "a": 2, "x": "做惡夢睡不著 → 害怕 scared。", "L": "R1", "tsec": "wk-choose"}, {"id": "R1:wc6", "t": "mc", "set": "workbook", "c": ["PAST-BE"], "q": "Cindy: Were you busy then? John: No, I ___.", "o": ["were", "weren't", "was", "wasn't"], "a": 3, "x": "No, I wasn't.", "L": "R1", "tsec": "wk-choose"}, {"id": "R1:wc7", "t": "mc", "set": "workbook", "c": ["PAST-NEG"], "q": "Emily ___ talk to her sister last night. She was angry with her.", "o": ["did", "didn't", "was", "wasn't"], "a": 1, "x": "生氣 → 沒有跟她說話；didn't＋原形 talk。", "L": "R1", "tsec": "wk-choose"}, {"id": "R1:wc8", "t": "mc", "set": "workbook", "c": ["WHY", "PAST-Q"], "q": "Miss Lee: Why ___ your brother do his homework yesterday? Kenny: He didn't do his homework because he was sick.", "o": ["did", "does", "doesn't", "didn't"], "a": 3, "x": "回答 didn't do → Why didn't…?", "L": "R1", "tsec": "wk-choose"}, {"id": "R1:wc9", "t": "mc", "set": "workbook", "c": ["CONJ"], "q": "Mandy went to the doctor this morning ___ she broke her leg.", "o": ["because", "so", "but", "and"], "a": 0, "x": "後面是原因 → because。", "L": "R1", "tsec": "wk-choose"}, {"id": "R1:wc10", "t": "mc", "set": "workbook", "c": ["CONJ"], "q": "It was rainy this morning, ___ I didn't ride a bike to school.", "o": ["or", "so", "but", "because"], "a": 1, "x": "後面是結果 → so。", "L": "R1", "tsec": "wk-choose"}, {"id": "R1:wr1", "t": "mc", "set": "workbook", "c": ["V-ZH"], "q": "（短文：Mr. Lin's students found some examples about child labor. Here are two stories. Kanji, a 10-year-old boy, had to work seven days a week. Children of his age went to school, but he had to work for a landlord (地主). After a day's hard work, Kanji only got a small piece of bread. That was not enough, so he was always hungry. Kanji never got any money for his hard work. Bunita was 12 years old. Her family was very poor. She, too, had to work very hard for a landlord. She had to take care of many cows on a farm. Bunita's landlord did not give her enough food or money, but Bunita could not quit (辭職). She had to work. She had no choice.） What can we learn from the reading?", "o": ["Some children didn't get enough food.", "All children under the age of 12 go to school.", "All the landlords are very bad to their workers.", "Children at the age of 10 go to school every day."], "a": 0, "x": "Kanji 只拿到一小塊麵包、Bunita 沒有足夠的食物。", "L": "R1", "tsec": "wk-read"}, {"id": "R1:wr2", "t": "mc", "set": "workbook", "c": ["V-ZH"], "q": "（短文：Mr. Lin's students found some examples about child labor. Here are two stories. Kanji, a 10-year-old boy, had to work seven days a week. Children of his age went to school, but he had to work for a landlord (地主). After a day's hard work, Kanji only got a small piece of bread. That was not enough, so he was always hungry. Kanji never got any money for his hard work. Bunita was 12 years old. Her family was very poor. She, too, had to work very hard for a landlord. She had to take care of many cows on a farm. Bunita's landlord did not give her enough food or money, but Bunita could not quit (辭職). She had to work. She had no choice.） Which is another example of child labor?", "o": ["Jusalu is 21 years old. He works very hard but can't get a lot of money.", "Duhula is 10 years old. He works seven days a week to get food and money.", "Guta is an 11-year-old girl. She was hungry because she didn't have enough food.", "Ali is 9 years old. He didn't go to school because his family didn't have any money."], "a": 1, "x": "童工＝小孩被迫工作：10 歲、一週工作七天。", "L": "R1", "tsec": "wk-read"}], "reading": [{"id": "R1:r1", "title": "閱讀（一）Reading Corner 延伸：Ann's Birthday", "tree": "", "p": "Emma, Irene, and Ann met for lunch on Ann's birthday. Emma missed the bus because she went to buy a cake. Irene got lost because she went to the gift shop first. Ann waited for almost an hour and was angry. But when the waiter brought the cake with candles on <b>it</b>, Ann understood everything. \"You two are so sweet!\" she said.", "qs": [{"id": "R1:r1a", "t": "mc", "set": "read", "c": ["V-ZH"], "q": "What does <b>it</b> mean?", "o": ["The table.", "The cake.", "The bus.", "The gift shop."], "a": 1, "x": "candles on it → 蛋糕上。", "L": "R1"}, {"id": "R1:r1b", "t": "mc", "set": "read", "c": ["CONJ"], "q": "Why was Irene late?", "o": ["She missed the bus.", "She got lost.", "She was sick.", "She forgot the time."], "a": 1, "x": "Irene got lost because she went to the gift shop first.", "L": "R1"}]}, {"id": "R1:r2", "title": "閱讀（二）圖表：Age of Marriage", "tree": "", "p": "<table class='info'><tr><th>Country</th><th>Women (mean age)</th><th>Men (mean age)</th></tr><tr><td>Sweden</td><td>33</td><td>35</td></tr><tr><td>Canada</td><td>29</td><td>31</td></tr><tr><td>Nigeria</td><td>19</td><td>27</td></tr></table>（mean age 平均年齡；資料為簡化的示意數字）", "qs": [{"id": "R1:r2a", "t": "mc", "set": "read", "c": ["V-ZH"], "q": "In which country do women get married the youngest?", "o": ["Sweden.", "Canada.", "Nigeria.", "We don't know."], "a": 2, "x": "Nigeria 女性平均 19 歲。", "L": "R1"}, {"id": "R1:r2b", "t": "mc", "set": "read", "c": ["V-ZH"], "q": "Which is TRUE?", "o": ["Men get married older than women in all three countries.", "Women in Canada get married at 31.", "In Sweden, men get married at 33.", "Women and men in Nigeria get married at the same age."], "a": 0, "x": "三國都是男性比女性晚結婚。", "L": "R1"}]}, {"id": "R1:e114_r1", "title": "閱讀（一）Protecting the Nature", "tree": "", "p": "Many people think protecting the nature is something the government should do. However, every person can help the Earth in his/her life. One simple way is not to use the plastic bags. For example, when you go shopping, bring your own bags with you. Another way is to save energy. Don't forget to turn off the lights when you leave the room.<br><br>Water is also very important. Do not let the water run when you brush your teeth. If we can save a little water every day, the water is enough for all of us. By the way, trees are also very useful. Trees can clean the air, give homes for animals, and even make us feel great.<br><br>Protecting the nature is not difficult. If each person can help, we can have a clean and safe world for the future.<div class='gloss'>government 政府　save 節省　energy 能源</div>", "qs": [{"id": "R1:e114_36", "t": "mc", "set": "read", "c": ["V-ZH"], "q": "What is one way not to use the plastic bags?", "o": ["Plant more trees.", "Use your own shopping bags.", "Turn off the lights.", "Save water when you brush your teeth."], "a": 1, "x": "when you go shopping, bring your own bags with you。（114 學年第一次段考原題，非官方解答）", "L": "R1"}, {"id": "R1:e114_37", "t": "mc", "set": "read", "c": ["V-ZH"], "q": "Why are trees important?", "o": ["They can save energy.", "They can stop using plastic bags.", "They can clean the air and help animals.", "They can give people free food."], "a": 2, "x": "Trees can clean the air, give homes for animals。（114 學年第一次段考原題，非官方解答）", "L": "R1"}, {"id": "R1:e114_38", "t": "mc", "set": "read", "c": ["V-ZH"], "q": "What is the main idea of the reading?", "o": ["Only the government can protect the nature.", "Everyone can protect the Earth.", "Saving water is important.", "Trees are useful."], "a": 1, "x": "第一段和最後一段都在說「每個人都能幫地球」；省水、樹只是其中的例子。（114 學年第一次段考原題，非官方解答）", "L": "R1"}]}, {"id": "R1:e114_r2", "title": "閱讀（二）The Common Cold", "tree": "", "p": "Catching a cold is common in the world. Most people catch a cold once or twice a year, especially in winter. A cold is usually from viruses, not just from the weather change. When the virus goes into your body through your nose or mouth, you may catch a cold.<br><br>There is no real cure for the common cold, but some ways can make you feel good. First, get a lot of rest. Second, drink much water or warm soup. Third, wash your hands often.<br><br>Some people think taking medicine can quickly let the cold go away, but this is not true. Medicine may help but some people don't like to go to a doctor. In London, they seldom see a doctor when they catch a common cold.<div class='gloss'>especially 特別地　virus 病毒　cure 治療　history 歷史　truth 事實</div>", "qs": [{"id": "R1:e114_39", "t": "mc", "set": "read", "c": ["V-ZH"], "q": "What mainly leads to the common cold?", "o": ["Cold weather.", "Viruses.", "Drinking water.", "Taking medicine."], "a": 1, "x": "A cold is usually from viruses。（114 學年第一次段考原題，非官方解答）", "L": "R1"}, {"id": "R1:e114_40", "t": "mc", "set": "read", "c": ["V-ZH"], "q": "What is the best title (標題) for the reading?", "o": ["The history of medicine.", "Why people get tired.", "The truth about catching the common cold.", "The useful medicine."], "a": 2, "x": "全文在講感冒的真相：來自病毒、沒有真正的解藥、吃藥不一定快好。（114 學年第一次段考原題，非官方解答）", "L": "R1"}, {"id": "R1:e114_41", "t": "mc", "set": "read", "c": ["V-ZH"], "q": "What is true about the reading?", "o": ["Medicine is the only cure to let the cold go away.", "Most people catch a cold because of the weather change.", "Drinking much water can help you feel good when you catch a cold.", "In London, people always see a doctor when they catch a common cold."], "a": 2, "x": "Second, drink much water or warm soup → 喝水會讓你舒服一點；其他三個都和文章相反。（114 學年第一次段考原題，非官方解答）", "L": "R1"}]}, {"id": "R1:e114_r3", "title": "閱讀（三）A Trip to Yangmingshan", "tree": "", "p": "Last weekend, our class went on a trip to Yangmingshan National Park. <b>It</b> is famous for its flowers, hot spring, and beautiful mountains. When we __1__ there, the sun was shining, and the air was fresh. We walked along and listened to the birds. Some students took photos of butterflies and beautiful flowers.<br><br>At noon, we had lunch on the grass and __2__ lots of people around us. After lunch, our teacher told us about the importance of protecting the nature. He said, \"If we people keep throwing trash or cutting trees, the animals will lose their homes.\"<br><br>In the afternoon, it started to rain a lot, so we quickly put on our raincoats. We got wet but we learned __3__ from this trip.", "qs": [{"id": "R1:e114_42", "t": "mc", "set": "read", "c": ["V-ZH"], "q": "What does <b>It</b> mean in the reading?", "o": ["Last weekend.", "Our class.", "Yangmingshan National Park.", "Flowers."], "a": 2, "x": "前一句的主角是陽明山國家公園，「它」以花、溫泉、山出名。（114 學年第一次段考原題，非官方解答）", "L": "R1"}, {"id": "R1:e114_43", "t": "mc", "set": "read", "c": ["PAST-IRR"], "q": "第 1 格：", "o": ["getting", "get", "got", "gets"], "a": 2, "x": "Last weekend 過去 → get 的過去式 got。（114 學年第一次段考原題，非官方解答）", "L": "R1"}, {"id": "R1:e114_44", "t": "mc", "set": "read", "c": ["PAST-IRR"], "q": "第 2 格：", "o": ["seeing", "sees", "see", "saw"], "a": 3, "x": "and 連接 had（過去式）→ saw。（114 學年第一次段考原題，非官方解答）", "L": "R1"}, {"id": "R1:e114_45", "t": "mc", "set": "read", "c": ["V-ZH"], "q": "第 3 格：", "o": ["a lot of", "a lot", "rainy", "happy"], "a": 1, "x": "learned <b>a lot</b> 學到很多；a lot of 後面要接名詞。（114 學年第一次段考原題，非官方解答）", "L": "R1"}]}], "teacher": [], "workbook": [{"id": "wk-choose", "title": "A. Choose 依句意選答", "page": "習作 p.14", "ids": ["R1:wc1", "R1:wc2", "R1:wc3", "R1:wc4", "R1:wc5", "R1:wc6", "R1:wc7", "R1:wc8", "R1:wc9", "R1:wc10"]}, {"id": "wk-read", "title": "B. Read and Choose 閱讀〈child labor〉", "page": "習作 p.15", "ids": ["R1:wr1", "R1:wr2"]}], "secNotes": {"Review 與 Reading Corner": "miss 有兩個意思：<b>錯過</b>（miss the bus）和<b>想念</b>（miss my grandma）。get lost 迷路（got lost）、arrive 抵達、finally 最後終於。"}, "tiles": [["🔁", "句型總整理", "現在式 vs 過去式・because／so", "grammar"], ["✏️", "規則動詞過去式練習", "每回合 8 個，輪完為止", "#/verbs/reg"], ["📋", "不規則動詞過去式練習", "每回合 8 個，輪完為止", "#/verbs/irr"], ["📖", "課文", "Dear Diary・Reading Corner", "text"], ["🔤", "單字卡", "Review 與 Reading Corner 的字", "words"], ["📒", "習作（附答案）", "習作 p.14–15：看答案或直接作答", "workbook"], ["📄", "講義型練習", "L1＋L2＋R1 混合", "handout"], ["👂", "聽力", "L1＋L2 範圍的問答與對話", "listen"], ["✅", "總複習小考", "L1＋L2＋R1 混合 16 題", "quiz"]]}, {"id": "L3", "short": "Lesson 3", "title": "Lesson 3　All Animals Were Going to the Party", "sub": "課本 p.41–60｜掉進深洞的青蛙和蟾蜍｜過去進行式・when／while・before／after", "scope": ["L3"], "words": [{"sec": "故事前半：掉進深洞", "w": "king", "pos": "n.", "zh": "國王", "ex": "The king became a frog in the story.", "exz": "故事裡國王變成了一隻青蛙。", "pl": "", "plr": "none", "der": ["queen 女王；皇后"], "note": "", "tex": "It was the Lion King's birthday.", "posq": true, "no": 1, "blue": false, "cap": 13}, {"sec": "故事前半：掉進深洞", "w": "way", "pos": "n.", "zh": "路", "ex": "Can you find the way to the train station?", "exz": "你找得到去火車站的路嗎？", "pl": "", "plr": "none", "der": ["on the way (to…) 在去……的路上", "by the way 順便一提", "way 也是「方法」"], "note": "", "tex": "Taylor the Toad and Fred the Frog were on the way.", "posq": true, "no": 2, "blue": false, "cap": 64}, {"sec": "故事前半：掉進深洞", "w": "wet", "pos": "adj.", "zh": "濕的", "ex": "It's raining. I'm all wet.", "exz": "下雨了。我全身都濕了。", "pl": "", "plr": "none", "der": ["wet ↔ dry 乾的"], "note": "", "tex": "The road was wet and full of mud.", "posq": true, "no": 3, "blue": false, "cap": 8}, {"sec": "故事前半：掉進深洞", "w": "mud", "pos": "n.", "zh": "泥土", "ex": "There's mud all over the table.", "exz": "桌上到處都是泥巴。", "pl": "", "plr": "none", "der": ["muddy adj. 泥濘的", "be full of… 充滿……"], "note": "", "tex": "The road was wet and full of mud.", "posq": true, "no": 4, "blue": false, "cap": 3}, {"sec": "故事前半：掉進深洞", "w": "deep", "pos": "adj.", "zh": "深的", "ex": "Don't swim in this river. The water is very deep.", "exz": "別在這條河游泳。水很深。", "pl": "", "plr": "none", "der": ["deep ↔ shallow 淺的"], "note": "", "tex": "Suddenly, they fell into a deep hole.", "posq": true, "no": 5, "blue": false, "cap": 1}, {"sec": "故事前半：掉進深洞", "w": "toad", "pos": "n.", "zh": "蟾蜍", "ex": "A toad is different from a frog.", "exz": "蟾蜍和青蛙不一樣。", "pl": "", "plr": "none", "der": [], "note": "", "tex": "Taylor the Toad", "posq": true, "no": 24, "blue": true, "cap": 0}, {"sec": "故事前半：掉進深洞", "w": "suddenly", "pos": "adv.", "zh": "突然地", "ex": "It was sunny, but suddenly it s
