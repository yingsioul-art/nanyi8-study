<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>八上英文（南一）</title>
<meta name="theme-color" content="#5b4bdb">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
/* ───────── 設計基準：8px 網格｜灰階分層｜Indigo 為唯一強調色 ───────── */
:root{
  --accent:#4f46e5; --accent-ink:#4338ca; --accent-soft:#eef2ff; --accent-line:rgba(79,70,229,.18);
  --bg:#f7f7f8; --surface:#ffffff; --surface-2:#f4f4f5; --line:#e4e4e7;
  --ink:#18181b; --ink-2:#52525b; --ink-3:#a1a1aa;
  --ok:#15803d; --ok-soft:#f0fdf4; --ng:#b91c1c; --ng-soft:#fef2f2; --warn:#a16207; --warn-soft:#fefce8;
  --r-sm:8px; --r-md:12px; --r-lg:16px;
  --sh-1:0 1px 2px rgba(24,24,27,.04),0 1px 3px rgba(24,24,27,.06);
  --sh-2:0 8px 24px rgba(24,24,27,.08),0 2px 6px rgba(24,24,27,.04);
  --ease:cubic-bezier(.2,.8,.2,1);
  --pad:16px;
}
@media (prefers-color-scheme: dark){
  :root{ --accent:#818cf8; --accent-ink:#a5b4fc; --accent-soft:rgba(129,140,248,.14); --accent-line:rgba(129,140,248,.28);
    --bg:#0c0c0e; --surface:#18181b; --surface-2:#232328; --line:#2e2e34;
    --ink:#f4f4f5; --ink-2:#a1a1aa; --ink-3:#71717a;
    --ok:#4ade80; --ok-soft:rgba(74,222,128,.10); --ng:#f87171; --ng-soft:rgba(248,113,113,.10); --warn:#facc15; --warn-soft:rgba(250,204,21,.10);
    --sh-1:0 1px 2px rgba(0,0,0,.4); --sh-2:0 8px 24px rgba(0,0,0,.5); }
}
@media (min-width:600px){ :root{ --pad:24px; } }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  -webkit-font-smoothing:antialiased}
#app{max-width:720px;margin:0 auto;padding:0 16px 96px}

/* 標題列：毛玻璃、黏在頂端 */
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;margin:0 -16px 8px;padding:16px;
  background:color-mix(in srgb,var(--bg) 78%,transparent);
  backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);
  border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
header.top h1{font-size:20px;font-weight:700;letter-spacing:-.01em;margin:0;flex:1;line-height:1.3}
header.top .back{width:40px;height:40px;flex:none;border:0;border-radius:50%;background:var(--surface);color:var(--ink);
  font-size:18px;cursor:pointer;box-shadow:var(--sh-1);transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
header.top .back:hover{box-shadow:var(--sh-2)}
header.top .back:active{transform:scale(.92)}

h2{font-size:13px;font-weight:600;letter-spacing:.06em;color:var(--ink-3);margin:32px 0 16px}
h3{font-size:16px;font-weight:600;margin:24px 0 8px}
p{margin:8px 0 16px}
.sub{color:var(--ink-2);font-size:14px}
.muted{color:var(--ink-3);font-size:14px}
b{font-weight:600}

/* 卡片 */
.card{background:var(--surface);border-radius:var(--r-lg);padding:var(--pad);margin:16px 0;box-shadow:var(--sh-1)}

/* 首頁方塊 */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:16px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:8px;background:var(--surface);border:0;border-radius:var(--r-lg);
  padding:16px;cursor:pointer;text-align:left;color:var(--ink);font:inherit;box-shadow:var(--sh-1);
  transition:transform .25s var(--ease),box-shadow .25s var(--ease)}
.tile:hover{transform:translateY(-2px);box-shadow:var(--sh-2)}
.tile:active{transform:scale(.97)}
.tile .ic{width:40px;height:40px;border-radius:var(--r-md);background:var(--surface-2);display:grid;place-items:center;font-size:20px}
.tile b{font-size:16px;line-height:1.3}
.tile small{color:var(--ink-3);font-size:13px;line-height:1.5}
.tile.off{opacity:.45;cursor:default;box-shadow:none;background:var(--surface-2)}
.tile.off:hover{transform:none}

/* 按鈕 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;border:0;border-radius:var(--r-md);
  background:var(--accent);color:#fff;font:inherit;font-size:15px;font-weight:600;padding:0 16px;margin:8px 8px 0 0;cursor:pointer;
  transition:transform .2s var(--ease),background .2s var(--ease),box-shadow .2s var(--ease)}
.btn:hover{box-shadow:0 4px 12px var(--accent-line)}
.btn:active{transform:scale(.96)}
.btn.ghost{background:var(--accent-soft);color:var(--accent-ink)}
.btn.ghost:hover{box-shadow:none;background:var(--accent-line)}
.btn.small{min-height:32px;font-size:13px;padding:0 16px;border-radius:var(--r-sm)}
.btn:disabled{opacity:.35;pointer-events:none}
.say{width:32px;height:32px;flex:none;border:0;border-radius:50%;background:var(--surface-2);color:var(--ink-2);font-size:14px;cursor:pointer;
  transition:transform .2s var(--ease),background .2s var(--ease),color .2s var(--ease)}
.say:hover{background:var(--accent-soft);color:var(--accent)}
.say:active{transform:scale(.9)}

/* 表格 */
.tablewrap{overflow-x:auto}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:14px}
th,td{padding:8px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
@media (min-width:600px){ th,td{padding:8px 16px} }
th{font-size:13px;font-weight:600;color:var(--ink-2);background:var(--surface-2)}
th:first-child{border-top-left-radius:var(--r-sm)}
th:last-child{border-top-right-radius:var(--r-sm)}
tr:last-child td{border-bottom:0}
th:first-child,td:first-child{white-space:nowrap}

/* 單字卡 */
.word{display:flex;gap:16px;align-items:flex-start;padding:16px 0;border-bottom:1px solid var(--line)}
.word:first-child{padding-top:0}
.word:last-child{border:0;padding-bottom:0}
.word .w{font-size:20px;font-weight:700;letter-spacing:-.01em}
.word .pos{color:var(--accent);font-weight:600;font-size:14px;margin:0 8px}
.badge{display:inline-block;font-size:12px;line-height:20px;padding:0 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);margin:8px 8px 0 0}
.badge.cap{background:var(--accent-soft);color:var(--accent-ink)}
.badge.irr{background:var(--ng-soft);color:var(--ng)}
.eg{display:block;color:var(--ink-2);font-size:14px;margin-top:8px}
.eg .say{width:24px;height:24px;font-size:11px;vertical-align:middle;margin-right:4px}

/* 課文 */
.line{display:flex;gap:16px;align-items:flex-start;padding:16px 0;border-bottom:1px solid var(--line)}
.line:first-child{padding-top:0}
.line:last-child{border:0;padding-bottom:0}
.line .sp{font-weight:600;font-size:14px;min-width:40px;color:var(--ink-3);padding-top:4px}
.line .en{font-size:17px}
.line .hl{background:linear-gradient(transparent 58%,var(--accent-line) 58%);-webkit-box-decoration-break:clone;box-decoration-break:clone}
.line .zh{color:var(--ink-3);font-size:14px;margin-top:4px}
.note{background:var(--surface-2);border-left:3px solid var(--accent);border-radius:var(--r-sm);padding:8px 16px;font-size:14px;color:var(--ink-2);margin-top:8px}

/* 文法字卡 */
.chips{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;padding:8px 0}
.chipw{padding:8px 16px;border-radius:var(--r-sm);background:var(--surface-2);color:var(--ink);font-size:18px;font-weight:600;
  border:0;transition:all .4s var(--ease)}
.chipw.on{background:var(--accent);color:#fff;transform:translateY(-4px);box-shadow:0 6px 16px var(--accent-line)}
.stepnote{min-height:48px;font-size:15px;color:var(--ink-2);margin:8px 0}

/* 小老師對話 */
.bubble{border-radius:var(--r-lg);padding:16px;margin:8px 0;max-width:88%;font-size:15px}
.bubble.t{background:var(--surface-2);border-top-left-radius:4px}
.bubble.ok{background:var(--ok-soft);margin-left:auto;border-top-right-radius:4px}
.bubble.ng{background:var(--warn-soft);margin-left:auto;border-top-right-radius:4px}

/* 選項 */
.opts{display:grid;gap:8px;margin-top:16px}
.opt{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;text-align:left;padding:12px 16px;border-radius:var(--r-md);cursor:pointer;
  transition:border-color .2s var(--ease),background .2s var(--ease),transform .15s var(--ease)}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt:active:not(:disabled){transform:scale(.98)}
.opt.big{font-size:40px;text-align:center;padding:8px}
.opts.pic{grid-template-columns:repeat(3,1fr)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ng{border-color:var(--ng);background:var(--ng-soft)}
.opt:disabled{cursor:default}
.chips .opt{padding:8px 16px}
.dropzone{background:var(--surface-2);border-radius:var(--r-md);padding:8px;margin:16px 0 8px;min-height:64px;align-items:center}
.dropzone .opt{background:var(--surface);box-shadow:var(--sh-1);border-color:transparent}
.dropzone.over{outline:2px dashed var(--accent);outline-offset:2px}
/* 句子打字：一字一格 */
.wb{display:flex;flex-wrap:wrap;gap:8px 8px;align-items:flex-end;margin:16px 0 8px}
.wbw{display:inline-flex;align-items:flex-end;gap:2px}
.wbi{font:inherit;font-size:18px;padding:8px 4px;min-width:40px;text-align:center;border:0;border-bottom:2px solid var(--ink-3);
  border-radius:var(--r-sm) var(--r-sm) 0 0;background:var(--surface-2);color:var(--ink);outline:none;
  transition:border-color .2s var(--ease),background .2s var(--ease)}
.wbi:focus{border-color:var(--accent);background:var(--accent-soft)}
.wbi.ok{border-color:var(--ok);background:var(--ok-soft)}
.wbi.ng{border-color:var(--ng);background:var(--ng-soft)}
.wbp{font-size:20px;font-weight:700;padding-bottom:6px}
.verdict{margin-top:16px;padding:12px 16px;border-radius:var(--r-md);font-size:20px;font-weight:700}
.verdict.ok{background:var(--ok-soft);color:var(--ok);border:2px solid var(--ok)}
.verdict.ng{background:var(--ng-soft);color:var(--ng);border:2px solid var(--ng)}
/* 學生答案逐字母比對 */
.yours{margin-top:8px;font-size:18px;line-height:1.9}
.ya{margin:16px 0 8px;border-radius:var(--r-md);overflow:hidden;border:2px solid var(--line);background:var(--surface)}
.ya.is-ok{border-color:var(--ok)} .ya.is-ng{border-color:var(--ng)}
.ya-row{display:flex;align-items:baseline;gap:16px;padding:12px 16px}
.ya-row+.ya-row{border-top:1px solid var(--line);background:var(--surface-2)}
.ya-lab{flex:none;width:64px;font-size:13px;font-weight:600;color:var(--ink-3)}
.ya-val{font-size:22px;font-weight:600;line-height:1.5;word-break:break-word}
.ya-ok{color:var(--ok)}
.ya-note{padding:8px 16px;font-size:13px;color:var(--ok);background:var(--ok-soft)}
.dword{font-weight:600;letter-spacing:.02em}
.dbad{background:var(--ng-soft);color:var(--ng);text-decoration:line-through;border-radius:3px;padding:0 1px}
.dmiss{color:var(--ng);border:1px dashed var(--ng);border-radius:3px;padding:0 2px;margin:0 1px}
/* 句子解析 */
.sxbox{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:8px 16px 16px}
.sxbox summary{font-weight:600;color:var(--accent);padding:8px 0}
.sx{padding:8px 0;border-bottom:1px solid var(--line)}
.sx-type{font-size:14px;margin-bottom:8px}
.sx-row{display:flex;flex-wrap:wrap;gap:8px}
.sx-chip{display:inline-flex;flex-direction:column;align-items:center;gap:2px;padding:8px 12px;border-radius:var(--r-sm);font-weight:600;font-size:16px}
.sx-chip small{font-size:11px;font-weight:500;opacity:.75}
.r-s{background:var(--accent-soft);color:var(--accent-ink)}
.r-v{background:var(--accent);color:#fff}
.r-not{background:var(--ng-soft);color:var(--ng)}
.r-c{background:var(--surface-2);color:var(--ink)}
.r-wh{background:var(--warn-soft);color:var(--warn)}
.r-cj{background:transparent;border:1px dashed var(--ink-3);color:var(--ink-2)}
.r-ph{background:var(--ok-soft);color:var(--ok)}
.sx-sec{margin-top:16px;font-size:14px;line-height:1.7}
.sx-sec>b{display:block;font-size:13px;color:var(--ink-3);letter-spacing:.04em;margin-bottom:4px}
.drag{touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.dropzone .opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.dropzone .opt.ng{border-color:var(--ng);background:var(--ng-soft)}
.drag-ghost{position:fixed;z-index:50;pointer-events:none;margin:0;transform:scale(1.08);box-shadow:var(--sh-2);background:var(--surface)!important;opacity:.95}

/* 作答 */
.q{font-size:19px;line-height:1.7;font-weight:500}
.blank{display:inline-block;min-width:64px;border-bottom:2px solid var(--ink-3);margin:0 4px}
/* 填空：每個字一格 */
input.wbox{font:inherit;font-size:18px;width:7.5em;max-width:40vw;padding:6px 8px;margin:2px 3px;text-align:center;border:none;border-bottom:2px solid var(--accent);border-radius:var(--r-sm) var(--r-sm) 0 0;background:var(--surface-2);color:var(--ink)}
input.wbox:focus{outline:none;background:var(--surface);box-shadow:0 0 0 3px var(--accent-line)}
input.wbox:disabled{opacity:.8}
.wrow{margin:8px 0}
.slot{display:inline-block;min-width:56px;border-bottom:2px solid var(--ink-3);margin:0 3px}
input.ans{font:inherit;font-size:18px;width:100%;padding:12px 16px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface-2);
  color:var(--ink);margin-top:16px;outline:none;transition:border-color .2s var(--ease),box-shadow .2s var(--ease),background .2s var(--ease)}
input.ans:focus{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 4px var(--accent-line)}
.fb{border-radius:var(--r-md);padding:12px 16px;margin-top:16px;font-size:15px}
.fb.ok{background:var(--ok-soft)}
.fb.ng{background:var(--ng-soft)}
.fb.warn{background:var(--warn-soft)}
.prog{height:4px;background:var(--line);border-radius:999px;overflow:hidden;margin:8px 0 16px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .4s var(--ease)}
.passage{background:var(--surface-2);border-radius:var(--r-md);padding:16px;font-size:15px;margin-bottom:16px;max-height:45vh;overflow:auto}
.passage .gloss{font-size:13px;color:var(--ink-3);margin-top:8px}
table.info td,table.info th{padding:8px}

/* 弱點條 */
.bar{height:6px;background:var(--surface-2);border-radius:999px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}

/* 家庭樹 */
.tree svg{width:100%;height:auto;display:block;color:var(--ink)}
.tree .pn{cursor:pointer}
.tree .pn circle{transition:fill .25s var(--ease)}
.relbox{min-height:64px}
.big{font-size:20px;font-weight:600;display:flex;align-items:center;gap:8px}

.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
details summary{cursor:pointer;color:var(--accent)}
.center{text-align:center}
.score{font-size:48px;font-weight:700;letter-spacing:-.02em;color:var(--accent);line-height:1.2}
label.row{color:var(--ink-2);font-size:14px}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }

/* 首頁每課可收合頁籤 */
details.ltab{border-radius:var(--r-lg);margin:12px 0;background:var(--surface);box-shadow:var(--sh-1)}
details.ltab>summary{list-style:none;cursor:pointer;padding:14px 16px;font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px}
details.ltab>summary::-webkit-details-marker{display:none}
details.ltab>summary::after{content:"▸";margin-left:auto;color:var(--accent);transition:transform .15s}
details.ltab[open]>summary::after{transform:rotate(90deg)}
details.ltab>.tiles{padding:0 12px 12px}
/* ───────── 自然站風格（10/23 使用者定：和七上生物闖關島同一套外觀＋遊戲機制） ───────── */
:root{
  --accent:#5b4bdb; --accent-ink:#4a3bc4; --accent-soft:#eeebff; --accent-line:rgba(91,75,219,.22);
  --bg:#f4f1ff; --surface:#ffffff; --surface-2:#f1eefc; --line:#e3def7;
  --ink:#22203a; --ink-2:#5d5a78; --ink-3:#8c88aa;
  --ok:#1f9d55; --ok-soft:#e3f7ea; --ng:#d64545; --ng-soft:#fde8e8; --warn:#a16207; --warn-soft:#fff6dc;
  --gold:#f5a524; --r-md:14px; --r-lg:20px;
  --sh-1:0 4px 0 rgba(40,30,110,.12),0 8px 24px rgba(40,30,110,.08);
  --sh-2:0 6px 0 rgba(40,30,110,.14),0 12px 28px rgba(40,30,110,.12);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --accent:#8f82ff; --accent-ink:#b3aaff; --accent-soft:rgba(143,130,255,.16); --accent-line:rgba(143,130,255,.32);
    --bg:#16142a; --surface:#221f3d; --surface-2:#2b2850; --line:#37335e;
    --ink:#f1efff; --ink-2:#b4b0d6; --ink-3:#8581ad;
    --ok:#4ade80; --ok-soft:#173b27; --ng:#f87171; --ng-soft:#47202a; --warn:#facc15; --warn-soft:#3d3413;
    --sh-1:0 4px 0 rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.25); --sh-2:0 6px 0 rgba(0,0,0,.4),0 12px 28px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --accent:#8f82ff; --accent-ink:#b3aaff; --accent-soft:rgba(143,130,255,.16); --accent-line:rgba(143,130,255,.32);
  --bg:#16142a; --surface:#221f3d; --surface-2:#2b2850; --line:#37335e;
  --ink:#f1efff; --ink-2:#b4b0d6; --ink-3:#8581ad;
  --ok:#4ade80; --ok-soft:#173b27; --ng:#f87171; --ng-soft:#47202a; --warn:#facc15; --warn-soft:#3d3413;
  --sh-1:0 4px 0 rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.25); --sh-2:0 6px 0 rgba(0,0,0,.4),0 12px 28px rgba(0,0,0,.3);
}
html,body{font-size:17px}
h2{font-size:18px;font-weight:800;letter-spacing:0;color:var(--ink);margin:28px 0 12px}
header.top h1{font-weight:800}
header.top .back{border:2px solid var(--line);box-shadow:none}
.card{border-radius:var(--r-lg)}
.btn{border-radius:14px;font-weight:800;box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 60%,#000);min-height:48px}
.btn:hover{box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.btn.ghost{background:var(--surface);color:var(--accent);border:2px solid var(--accent);box-shadow:none}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.small{box-shadow:none}
.tile{border-radius:20px;min-height:110px}
.tile:hover{transform:translateY(-2px)}
.tile .ic{width:48px;height:48px;border-radius:14px;font-size:26px;background:var(--accent-soft)}
.tile b{font-weight:800}
.opt{border-width:2px;border-radius:14px}
.verdict{font-weight:900}
.prog{height:10px}
.score{font-weight:900}
details.ltab{border-radius:22px;border-left:8px solid var(--c,var(--accent))}
details.ltab>summary{font-weight:800;color:var(--ink)}
details.ltab>summary .lid{flex:none;min-width:44px;height:44px;padding:0 8px;border-radius:14px;display:grid;place-items:center;font-size:15px;font-weight:900;
  background:color-mix(in srgb,var(--c,var(--accent)) 18%,transparent);color:var(--c,var(--accent))}
details.ltab>summary .stars{font-size:15px}
details.ltab>.tiles .tile .ic{background:color-mix(in srgb,var(--c,var(--accent)) 16%,transparent)}
/* 頂列等級條 */
.xpbox{display:flex;align-items:center;gap:8px;flex:none}
.lv{background:var(--gold);color:#3b2300;font-weight:800;border-radius:999px;padding:2px 10px;font-size:13px;white-space:nowrap}
.xpbar{width:90px;height:10px;background:var(--line);border-radius:999px;overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#ffd36b);border-radius:999px;transition:width .5s}
@media (max-width:400px){.xpbar{width:56px}}
/* 首頁橫幅 */
.hero{padding:20px;border-radius:24px;color:#fff;background:linear-gradient(135deg,#5b4bdb,#9b5de5 60%,#f15bb5);box-shadow:var(--sh-1);margin:8px 0 16px;position:relative;overflow:hidden}
.hero b{display:block;font-size:24px;line-height:1.3;margin-bottom:4px}
.hero p{margin:0;opacity:.95}
.hero .blob{position:absolute;right:-20px;top:-26px;font-size:110px;opacity:.18;transform:rotate(-12deg)}
.hero .hstat{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.hero .hstat span{background:rgba(255,255,255,.2);border-radius:999px;padding:2px 12px;font-size:14px;font-weight:700}
/* 星星、徽章、提示、彩帶 */
.stars{color:var(--gold);letter-spacing:2px}
.stars .off{color:var(--line)}
.streak{float:right;font-size:13px;color:var(--ink-2);margin-right:12px}
.bigemo{font-size:56px;line-height:1.2}
.bdgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.bdg{background:var(--surface);border-radius:18px;padding:12px;text-align:center;box-shadow:var(--sh-1)}
.bdg .ic{font-size:36px;filter:grayscale(1);opacity:.35}
.bdg.got .ic{filter:none;opacity:1}
.bdg b{display:block}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);opacity:0;background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:999px;font-weight:800;z-index:60;transition:transform .35s,opacity .35s;max-width:90vw;text-align:center}
.toast.on{transform:translateX(-50%) translateY(0);opacity:1}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:55;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:3px;animation:fall 1.2s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.7}}
@media (prefers-reduced-motion: reduce){ *{animation:none!important} }

const D = {"app": "n8v5", "appTitle": "八上英文（南一）", "form": {"label": "過去式"}, "spellPre": true, "typeOptional": true, "spellRound": 8, "textNote": "粉紅底線＝課文重點句（考試常考的句型，沒有老師畫線資料，由 AI 依文法重點挑選）。", "handoutNote": "照段考與習作的題型自己出的題目。", "sets": {"best": ["⭐", "課文重點句", "課文句子中翻英：先排字再打字"], "judge": ["⚖", "動詞變化填空", "過去式・進行式・to V／V-ing 填空"], "pattern": ["🔧", "句型練一練", "改過去式・問句・because／so・when／while・before／after"], "hand": ["✍", "填空式翻譯", "中文句＋英文句填兩格（段考手寫卷）"]}, "concepts": {"V-SP": {"name": "單字拼字", "g": "", "tip": "聽到發音先拆音節，再對照字母。容易錯的字：relative、memory、candle、tomb（b 不發音）、touching、nobody。"}, "V-POS": {"name": "詞性", "g": "", "tip": "人、事、物＝<b>n.</b>；形容人事物＝<b>adj.</b>；動作＝<b>v.</b>；修飾動作或時間＝<b>adv.</b>。🔴 death n.／dead adj.／die v."}, "V-ZH": {"name": "中文字義", "g": "", "tip": "把整句讀一遍再決定字義。英文一個字常有好幾個意思：last＝前一個的／最後的；place＝地方／放置。"}, "PAST-BE": {"name": "be 動詞過去式 was／were", "g": "was-were", "tip": "am、is → <b>was</b>；are → <b>were</b>。I、he、she、it、單數 → was；you、we、they、複數 → were。否定 wasn't／weren't；問句把 Was／Were 搬到句首。"}, "THERE": {"name": "There was／There were", "g": "was-were", "tip": "There＋be＋東西：<b>看後面的東西</b>是單數還是複數。There <b>was</b> a cake.／There <b>were</b> many candles."}, "PAST-REG": {"name": "規則動詞過去式（-ed 拼法）", "g": "past-reg", "tip": "①一般加 -ed（watched）②字尾 e 只加 -d（danced）③子音＋y 去 y 加 -ied（studied）④短母音＋一個子音，重複字尾再加 -ed（jogged、planned）。🔴 play → played（母音＋y 直接加）。"}, "PAST-IRR": {"name": "不規則動詞過去式", "g": "past-irr", "tip": "不規則動詞要整個背：go → <b>went</b>、take → <b>took</b>、buy → <b>bought</b>、sell → <b>sold</b>、break → <b>broke</b>、hit → <b>hit</b>（同形）、read → <b>read</b>（唸 /rɛd/）。"}, "PAST-Q": {"name": "Did 問句與簡答", "g": "did-q", "tip": "Did＋主詞＋<b>原形動詞</b>…？回答 Yes, 代名詞 did.／No, 代名詞 didn't.。🔴 有 did 就不能再用過去式：Did you watched ✗ → Did you watch ✓。"}, "PAST-NEG": {"name": "過去式否定 didn't", "g": "did-q", "tip": "主詞＋<b>didn't＋原形動詞</b>：I didn't go.（✗ I didn't went.）。be 動詞的否定不用 did：I wasn't busy."}, "WH-PAST": {"name": "疑問詞＋did 問句", "g": "wh-did", "tip": "What／Where／How／When＋<b>did</b>＋主詞＋原形…？回答時動詞改過去式：What did you do? — I <b>watched</b> a movie."}, "TIME": {"name": "時間副詞 yesterday／last／ago", "g": "time", "tip": "yesterday（昨天）、yesterday morning；<b>last</b>＋時間（last night／last week）；一段時間＋<b>ago</b>（two years ago）。🔴 不說 last yesterday、ago two years。"}, "WHY": {"name": "Why 問句與 Because 回答", "g": "why", "tip": "問原因用 Why，回答用 Because＋完整句子：Why did she cry? — Because she was sad."}, "CONJ": {"name": "because／so／because of／and／or", "g": "because-so", "tip": "<b>because＋原因</b>、<b>so＋結果</b>，一句只能用一個；<b>because of＋名詞</b>（because of the rain）；and 往同方向、or 二選一、but 相反。"}, "PHR": {"name": "片語", "g": "", "tip": "片語要整組背：pass away、look after、remind… of…、after all、dress up、get married、take action、not… anymore。"}, "MULTI": {"name": "一字多義", "g": "", "tip": "同一個字在不同句子裡意思和詞性會變：last（前一個的／最後的）、place（地方／放置）、plant（植物／種植）、watch（觀看／手錶）。"}, "MECH": {"name": "大小寫和標點", "g": "", "tip": "①句首大寫 ②人名、I、地名、節日（Tomb Sweeping Day）大寫 ③句尾要有句點或問號。"}, "PAST-PROG": {"name": "過去進行式 was／were＋V-ing", "g": "past-prog", "tip": "過去某個時間點<b>正在做</b>的事：主詞＋<b>was／were＋V-ing</b>。問句 What was／were＋主詞＋doing…?🔴 不能少 be 動詞（He reading ✗），也不能用原形（He was read ✗）。常和 then、at that time、at six last night 一起出現。"}, "WHEN-WHILE": {"name": "when 和 while", "g": "when-while", "tip": "<b>when＋短動作（過去簡單式）</b>：When Fred arrived, everyone was surprised.；<b>while＋長動作（過去進行式）</b>：While they were crying, a rabbit went by.。子句放句首要加逗號，放中間不加。"}, "BEF-AFT": {"name": "before 和 after", "g": "before-after", "tip": "before＝在……之前、after＝在……之後，後面接<b>完整句子</b>。先發生的事放 after 後面、後發生的事放 before 後面：After he finished his homework, he went to the party.＝He finished his homework before he went to the party."}, "TIME-TELL": {"name": "時間的說法", "g": "tell-time", "tip": "整點 five o'clock；30 分 <b>half past</b> four；15 分 <b>a quarter past／after</b> five；45 分＝差 15 分到下一點 <b>a quarter to</b> eight；8:50＝ten <b>to</b> nine。past／after＝過了幾分，to＝差幾分到。"}, "TO-V": {"name": "want／need／plan＋to V", "g": "to-v", "tip": "want、need、plan、hope、ask 後面接 <b>to＋原形動詞</b>：I want <b>to take</b> a working holiday.（✗ want taking、✗ want to took）"}, "V-ING": {"name": "enjoy／keep／practice／finish＋V-ing", "g": "to-v", "tip": "enjoy、keep、practice、finish 後面接 <b>V-ing</b>：She enjoys <b>cooking</b>.（✗ enjoys to cook）。🔴 動詞本身照時態變：kept crying、finished cleaning。"}, "BOTH": {"name": "begin／start／like／love 兩種都可以", "g": "to-v", "tip": "begin、start、like、love 後面接 <b>to V 或 V-ing</b> 都可以，意思一樣：Mary began <b>to dance</b>.＝Mary began <b>dancing</b>."}, "GER-SUBJ": {"name": "動名詞當主詞", "g": "ger-subj", "tip": "動作當主詞要改成 <b>V-ing</b>，而且算<b>單數</b>：<b>Traveling</b> in Taiwan <b>is</b> safe.（✗ Travel in Taiwan is…、✗ …are safe）"}, "IT-TO": {"name": "It is＋形容詞＋to V", "g": "it-to", "tip": "It is＋形容詞＋<b>to＋原形</b>＝V-ing＋is＋形容詞：<b>It is</b> fun <b>to play</b> the violin.＝<b>Playing</b> the violin is fun.It 是虛主詞，真正的主詞是後面的 to V。"}, "SUFFIX": {"name": "字尾 -ful／-less", "g": "", "tip": "<b>-ful＝有</b>、<b>-less＝沒有</b>：helpful 有幫助的 ↔ helpless 無助的、useful ↔ useless、careful ↔ careless、colorful ↔ colorless。"}, "ANT": {"name": "反義字", "g": "", "tip": "成對記：begin ↔ end、happy ↔ unhappy、win ↔ lose、answer ↔ question、birth ↔ death、smart ↔ stupid、arrive ↔ leave。"}}, "exam": {"listen": 15, "mc": 15, "read": 10, "hand": 5, "weight": {"listen": 2, "mc": 2, "read": 2, "hand": 4}, "desc": "照八年級第一次段考（114 學年卷）的題型和配分：", "scope": "範圍：Lesson 1、Lesson 2、Review 1", "handName": "填空式翻譯", "scopes": {"1": {"ids": ["L1", "L2", "R1"], "scope": "範圍：Lesson 1、Lesson 2、Review 1", "desc": "照八年級第一次段考（114 學年卷）的題型和配分："}, "2": {"ids": ["L3", "L4", "R2"], "scope": "範圍：Lesson 3、Lesson 4、Review 2", "desc": "第二次段考的考卷還沒整理，先照第一次段考（114 學年卷）的題型和配分："}}}, "lessons": [{"id": "L1", "short": "Lesson 1", "title": "Lesson 1　We Visited Our Relatives Yesterday", "sub": "課本 p.1–16｜想念過世的親人｜墨西哥亡靈節", "scope": ["L1"], "words": [{"sec": "對話：說過去的事", "w": "yesterday", "pos": "adv.", "zh": "昨天", "ex": "I visited my aunt yesterday.", "exz": "我昨天去看我阿姨。", "pl": "", "plr": "none", "der": ["yesterday morning 昨天早上", "the day before yesterday 前天"], "note": "過去式的時間線索第一名", "tex": "What did you do yesterda here two years ago.", "exz": "Leo 兩年前搬來這裡。", "pl": "", "plr": "none", "der": ["一段時間＋ago：three days ago"], "note": "ago 放在時間的後面", "tex": "A few years ago…", "posq": true, "no": 8, "blue": false, "cap": 17}, {"sec": "對話：說過去的事", "w": "parents", "pos": "n.", "zh": "父母親", "ex": "My parents were at home last night.", "exz": "我爸媽昨晚在家。", "pl": "", "plr": "none", "der": ["parent 父或母", "grandparents 祖父母"], "note": "", "tex": "My parents were very busy.", "posq": true, "no": 9, "blue": false, "cap": 17}, {"sec": "對話：說過去的事", "w": "were", "pos": "v.", "zh": "是（are 的過去式）", "ex": "We were happy at the party.", "exz": "我們在派對上很開心。", "pl": "", "plr": "none", "der": ["weren't＝were not"], "note": "you、we、they、複數主詞用 were", "tex": "", "posq": false, "no": 10, "blue": false, "cap": 68}, {"sec": "對話：說過去的事", "w": "was", "pos": "v.", "zh": "是（am、is 的過去式）", "ex": "I was tired yesterday.", "exz": "我昨天很累。", "pl": "", "plr": "none", "der": ["wasn't＝was not"], "note": "I、he、she、it、單數主詞用 was", "tex": "That was nice.", "posq": false, "no": 11, "blue": false, "cap": 147}, {"sec": "對話：說過去的事", "w": "must", "pos": "aux.", "zh": "一定；必須", "ex": "You must be hungry.", "exz": "你一定餓了。", "pl": "", "plr": "none", "der": ["must＋原形動詞"], "note": "", "tex": "You must really love him.", "posq": false, "no": 12, "blue": false, "cap": 15}, {"sec": "對話：說過去的事", "w": "together", "pos": "adv.", "zh": "一起", "ex": "We cooked dinner together.", "exz": "我們一起煮晚餐。", "pl": "", "plr": "none", "der": [], "note": "", "tex": "We cooked breakfast together.", "posq": true, "no": 14, "blue": false, "cap": 24}, {"sec": "對話：說過去的事", "w": "sweet", "pos": "adj.", "zh": "貼心的；甜的", "ex": "The cake is too sweet.", "exz": "這個蛋糕太甜了。", "pl": "", "plr": "none", "der": ["sweet 甜的（味道）", "sweet 貼心的（人或行為）"], "note": "", "tex": "That was so sweet!", "posq": true, "no": 15, "blue": false, "cap": 4}, {"sec": "對話：說過去的事", "w": "memory", "pos": "n.", "zh": "回憶；記憶", "ex": "I have many happy memories of my grandma.", "exz": "我有很多和奶奶的快樂回憶。", "pl": "", "plr": "none", "der": ["memories（複數）"], "note": "複數 memories：子音＋y 去 y 加 ies", "tex": "I have so many happy memories with him.", "posq": true, "no": 17, "blue": true, "cap": 0}, {"sec": "對話：說過去的事", "w": "grandparents", "pos": "n.", "zh": "祖父母", "ex": "I visited my grandparents last Sunday.", "exz": "我上週日去看祖父母。", "pl": "", "plr": "none", "der": [], "note": "", "tex": "How do you show your love to your grandparents?", "posq": true, "cap": 5}, {"sec": "對話：說過去的事", "w": "meal", "pos": "n.", "zh": "餐", "ex": "We enjoyed a big meal on New Year's Eve.", "exz": "除夕我們享用了一頓大餐。", "pl": "", "plr": "none", "der": [], "note": "", "tex": "Her family cooked a big meal for everyone.", "posq": true, "no": 31, "blue": false, "cap": 6}, {"sec": "節日與紀念", "w": "music", "pos": "n.", "zh": "音樂", "ex": "We danced to the music.", "exz": "我們隨著音樂跳舞。", "pl": "", "plr": "none", "der": [], "note": "", "tex": "People dance to music in a circle.", "posq": true, "no": 19, "blue": false, "cap": 8}, {"sec": "節日與紀念", "w": "circle", "pos": "n.", "zh": "圓圈", "ex": "The kids sat in a circle.", "exz": "孩子們圍成一圈坐。", "pl": "", "plr": "none", "der": ["in a circle 圍成一圈"], "note": "", "tex": "", "posq": true, "no": 20, "blue": false, "cap": 0}, {"sec": "節日與紀念", "w": "plant", "pos": "v.", "zh": "種植", "ex": "We planted flowers in the garden.", "exz": "我們在花園種了花。", "pl": "planted", "plr": "ed", "der": ["plant n. 植物"], "note": "", "tex": "People plant flowers and paint eggs.", "posq": true, "no": 21, "blue": false, "cap": 5}, {"sec": "節日與紀念", "w": "flower", "pos": "n.", "zh": "花", "ex": "There were many flowers on the table.", "exz": "桌上有很多花。", "pl": "", "plr": "none", "der": [], "note": "", "tex": "", "posq": true, "no": 22, "blue": false, "cap": 9}, {"sec": "節日與紀念", "w": "candle", "pos": "n.", "zh": "蠟燭", "ex": "There were ten candles on the cake.", "exz": "蛋糕上有十根蠟燭。", "pl": "", "plr": "none", "der": [], "note": "", "tex": "", "posq": true, "no": 23, "blue": false, "cap": 3}, {"sec": "節日與紀念", "w": "tomb", "pos": "n.", "zh": "墳墓", "ex": "They cleaned the tomb on Tomb Sweeping Day.", "exz": "他們在清明節清掃墳墓。", "pl": "", "plr": "none", "der": ["Tomb Sweeping Day 清明節"], "note": "b 不發音：/tum/", "tex": "People place candles and flowers around the tomb.", "posq": true, "no": 24, "blue": true, "cap": 0}, {"sec": "節日與紀念", "w": "place", "pos": "v.", "zh": "放置", "ex": "She placed the cake on the table.", "exz": "她把蛋糕放在桌上。", "pl": "placed", "plr": "ed", "der": ["place n. 地方"], "note": "字尾 e → 只加 d", "tex": "", "posq": true, "cap": 23}, {"sec": "節日與紀念", "w": "paint", "pos": "v.", "zh": "畫；上顏料", "ex": "We painted our faces for the party.", "exz": "我們為了派對在臉上彩繪。", "pl": "painted", "plr": "ed", "der": [], "note": "", "tex": "People paint their faces and dress up in costumes.", "posq": true, "cap": 9}, {"sec": "閱讀：亡靈節", "w": "remember", "pos": "v.", "zh": "記得；紀念", "ex": "I remember my first day at school.", "exz": "我記得上學的第一天。", "pl": "remembered", "plr": "ed", "der": ["forget ↔ remember"], "note": "", "tex": "They remember their dead relatives in a lively way.", "posq": true, "no": 25, "blue": false, "cap": 20}, {"sec": "閱讀：亡靈節", "w": "dead", "pos": "adj.", "zh": "死的；過世的", "ex": "My dead grandpa was a farmer.", "exz": "我過世的爺爺是農夫。", "pl": "", "plr": "none", "der": ["death n.", "die v."], "note": "", "tex": "their dead relatives", "posq": true, "no": 26, "blue": false, "cap": 15}, {"sec": "閱讀：亡靈節", "w": "relative", "pos": "n.", "zh": "親戚", "ex": "We visited our relatives during Chinese New Year.", "exz": "我們過年時去拜訪親戚。", "pl": "", "plr": "none", "der": [], "note": "", "tex": "We Visited Our Relatives Yesterday", "posq": true, "no": 27, "blue": false, "cap": 0}, {"sec": "閱讀：亡靈節", "w": "ghost", "pos": "n.", "zh": "鬼", "ex": "Are you afraid of ghosts?", "exz": "你怕鬼嗎？", "pl": "", "plr": "none", "der": [], "note": "", "tex": "We invited the ghosts back to our world.", "posq": true, "no": 28, "blue": false, "cap": 1}, {"sec": "閱讀：亡靈節", "w": "later", "pos": "adv.", "zh": "之後", "ex": "See you later!", "exz": "待會見！", "pl": "", "plr": "none", "der": ["later 後來（講故事）"], "note": "", "tex": "Later, we danced at a street party.", "posq": true, "no": 29, "blue": false, "cap": 24}, {"sec": "閱讀：亡靈節", "w": "candy", "pos": "n.", "zh": "糖果", "ex": "Kids love candy.", "exz": "小孩愛糖果。", "pl": "", "plr": "none", "der": ["candies（複數）"], "note": "", "tex": "there were flowers, candles, candy, and food on the table.", "posq": true, "no": 30, "blue": false, "cap": 5}, {"sec": "閱讀：亡靈節", "w": "share", "pos": "v.", "zh": "分享", "ex": "Tom shared his snacks with me.", "exz": "Tom 和我分享他的零食。", "pl": "shared", "plr": "ed", "der": ["share A with B 和 B 分享 A"], "note": "字尾 e → 只加 d", "tex": "…then shared touching stories…", "posq": true, "no": 32, "blue": false, "cap": 23}, {"sec": "閱讀：亡靈節", "w": "story", "pos": "n.", "zh": "故事", "ex": "Grandma told me a story.", "exz": "奶奶講了一個故事給我聽。", "pl": "", "plr": "none", "der": ["stories（複數）"], "note": "", "tex": "", "posq": true, "no": 33, "blue": false, "cap": 15}, {"sec": "閱讀：亡靈節", "w": "sweep", "pos": "v.", "zh": "清掃", "ex": "We swept the floor yesterday.", "exz": "我們昨天掃了地。", "pl": "swept", "plr": "irr", "der": ["sweep tombs 掃墓"], "note": "", "tex": "they also sweep tombs", "posq": true, "no": 34, "blue": true, "cap": 0}, {"sec": "閱讀：亡靈節", "w": "lively", "pos": "adj.", "zh": "充滿活力的", "ex": "The street party was lively.", "exz": "街頭派對熱鬧又有活力。", "pl": "", "plr": "none", "der": [], "note": "字尾 -ly 但它是形容詞", "tex": "in a lively way", "posq": true, "no": 35, "blue": true, "cap": 0}, {"sec": "閱讀：亡靈節", "w": "touching", "pos": "adj.", "zh": "感人的", "ex": "It was a touching story.", "exz": "那是個感人的故事。", "pl": "", "plr": "none", "der": [], "note": "", "tex": "touching stories", "posq": true, "no": 36, "blue": true, "cap": 0}, {"sec": "閱讀：亡靈節", "w": "fear", "pos": "n.", "zh": "害怕", "ex": "She showed no fear.", "exz": "她一點也不害怕。", "pl": "", "plr": "none", "der": ["be afraid of 害怕（段考考過）"], "note": "", "tex": "…is all about love, not fear.", "posq": true, "no": 37, "blue": true, "cap": 0}, {"sec": "閱讀：亡靈節", "w": "celebrate", "pos": "v.", "zh": "慶祝", "ex": "We celebrated Mom's birthday.", "exz": "我們慶祝媽媽生日。", "pl": "celebrated", "plr": "ed", "der": [], "note": "", "tex": "In Mexico, people celebrate the Day of the Dead with joy.", "posq": true, "cap": 9}, {"sec": "閱讀：亡靈節", "w": "seldom", "pos": "adv.", "zh": "很少", "ex": "We seldom talk about it.", "exz": "我們很少談論它。", "pl": "", "plr": "none", "der": ["always > usually > often > sometimes > seldom > never"], "note": "", "tex": "", "posq": true, "cap": 8}, {"sec": "片語", "w": "pass away", "pos": "phr.", "zh": "過世", "ex": "His grandpa passed away last year.", "exz": "他爺爺去年過世了。", "pl": "passed away", "plr": "ed", "der": [], "note": "", "tex": "But he passed away last year.", "posq": false, "no": 13, "blue": false, "cap": 0}, {"sec": "片語", "w": "look after", "pos": "phr.", "zh": "照顧", "ex": "My grandma looked after me.", "exz": "我奶奶照顧我。", "pl": "looked after", "plr": "ed", "der": ["＝take care of"], "note": "", "tex": "My grandfather looked after me all the time.", "posq": false, "cap": 0}, {"sec": "片語", "w": "remind… of…", "pos": "phr.", "zh": "使某人想起", "ex": "This song reminds me of my mom.", "exz": "這首歌讓我想起媽媽。", "pl": "", "plr": "none", "der": [], "note": "", "tex": "it reminded me of my grandfather.", "posq": false, "no": 16, "blue": true, "cap": 0}, {"sec": "片語", "w": "after all", "pos": "phr.", "zh": "畢竟", "ex": "After all, he is only five.", "exz": "畢竟他才五歲。", "pl": "", "plr": "none", "der": [], "note": "", "tex": "After all, I have so many happy memories with him.", "posq": false, "cap": 2}, {"sec": "片語", "w": "dress up", "pos": "phr.", "zh": "裝扮", "ex": "We dressed up in costumes.", "exz": "我們穿上戲服打扮。", "pl": "dressed up", "plr": "ed", "der": [], "note": "", "tex": "We painted our faces and dressed up in costumes.", "posq": false, "no": 18, "blue": false, "cap": 0}], "texts": [{"id": "d1", "title": "Dialogue（At school）", "src": "課本 p.3–4", "lines": [{"sp": "Tom", "en": "What did you do yesterday, Rita?", "zh": "Rita，你昨天做了什麼？", "hl": true, "note": "What＋did＋主詞＋原形 do？問「做了什麼」。"}, {"sp": "Rita", "en": "I studied English in the morning and jogged after lunch. How about you?", "zh": "我早上讀英文，午餐後去慢跑。你呢？", "hl": true, "note": "studied（去 y 加 ied）、jogged（重複 g）。How about you? 你呢？"}, {"sp": "Rita", "en": "Did you do anything special?", "zh": "你有做什麼特別的事嗎？", "hl": false, "note": "Did＋主詞＋原形 do。anything special：形容詞放在 anything 後面。"}, {"sp": "Tom", "en": "Yes. I watched the movie Coco last night. It's a movie about death, and it reminded me of my grandfather.", "zh": "有。我昨晚看了電影《可可夜總會》。那是一部關於死亡的電影，它讓我想起我的爺爺。", "hl": true, "note": "last night 過去式；remind A of B 讓 A 想起 B。death 是名詞。"}, {"sp": "Rita", "en": "Your grandfather?", "zh": "你爺爺？", "hl": false, "note": ""}, {"sp": "Tom", "en": "Yes. A few years ago, my parents were very busy. My grandfather looked after me all the time.", "zh": "對。幾年前我爸媽很忙，我爺爺一直照顧我。", "hl": true, "note": "a few years ago 幾年前；parents 複數 → were。look after 照顧。"}, {"sp": "Rita", "en": "That was nice. You must really love him.", "zh": "那真好。你一定很愛他。", "hl": false, "note": "That → was；must＋原形 love。"}, {"sp": "Tom", "en": "Yes. But he passed away last year. I was very sad then.", "zh": "是的。但他去年過世了。我那時候很難過。", "hl": true, "note": "pass away 過世（passed away）。I → was。"}, {"sp": "Rita", "en": "I'm sorry.", "zh": "我很遺憾。", "hl": false, "note": ""}, {"sp": "Tom", "en": "It's OK. I'm not so sad about his death now. After all, I have so many happy memories with him.", "zh": "沒關係。我現在沒那麼難過了。畢竟我和他有好多快樂的回憶。", "hl": false, "note": "now 現在 → 用現在式 I'm。After all 畢竟。"}, {"sp": "Rita", "en": "What did you usually do with your grandfather?", "zh": "你以前通常和爺爺做什麼？", "hl": true, "note": ""}, {"sp": "Tom", "en": "We cooked breakfast together, and then he walked me to school. After school, I played basketball with him in the park.", "zh": "我們一起做早餐，然後他陪我走路去上學。放學後我和他在公園打籃球。", "hl": true, "note": "cooked、walked、played 都是規則動詞加 ed。played：母音＋y 直接加 ed。"}, {"sp": "Rita", "en": "That was so sweet!", "zh": "那真是太貼心了！", "hl": false, "note": ""}]}, {"id": "w1", "title": "Word Power（Festivals of the Dead Around the World）", "src": "課本 p.6", "lines": [{"sp": "Mexico", "en": "People paint their faces and dress up in costumes.", "zh": "人們在臉上彩繪並穿上戲服。", "hl": false, "note": ""}, {"sp": "Japan", "en": "People dance to music in a circle.", "zh": "人們隨著音樂圍成一圈跳舞。", "hl": false, "note": ""}, {"sp": "Russia", "en": "People plant flowers and paint eggs.", "zh": "人們種花並彩繪蛋。", "hl": false, "note": ""}, {"sp": "France", "en": "People place candles and flowers around the tomb.", "zh": "人們在墳墓周圍放蠟燭和花。", "hl": false, "note": "place 在這裡是動詞（放置）。"}]}, {"id": "r1", "title": "Reading〈The Day of the Dead〉", "src": "課本 p.7–8", "lines": [{"sp": "", "en": "People from different countries see death in different ways.", "zh": "不同國家的人用不同的方式看待死亡。", "hl": false, "note": ""}, {"sp": "", "en": "In Taiwan, we seldom talk about it even on Tomb Sweeping Day.", "zh": "在台灣，即使在清明節我們也很少談論它。", "hl": true, "note": "it＝death（課本第 3 題考 it 指什麼）。seldom 很少。"}, {"sp": "", "en": "In Mexico, people celebrate the Day of the Dead with joy.", "zh": "在墨西哥，人們歡欣地慶祝亡靈節。", "hl": false, "note": ""}, {"sp": "", "en": "During the festival, they also sweep tombs, but they remember their dead relatives in a lively way.", "zh": "節日期間他們也掃墓，但他們用充滿活力的方式紀念過世的親人。", "hl": true, "note": "dead 形容詞；lively 形容詞（字尾 -ly）。"}, {"sp": "", "en": "Two months ago, I visited my friend, Rosa, in Mexico.", "zh": "兩個月前，我去墨西哥拜訪我的朋友 Rosa。", "hl": true, "note": "two months ago → 過去式 visited。"}, {"sp": "", "en": "I was there for the Day of the Dead on November first and second.", "zh": "我在十一月一日和二日的亡靈節時在那裡。", "hl": false, "note": ""}, {"sp": "", "en": "We invited the ghosts back to our world.", "zh": "我們邀請鬼魂回到我們的世界。", "hl": false, "note": ""}, {"sp": "", "en": "We painted our faces and dressed up in costumes.", "zh": "我們在臉上彩繪並穿上戲服。", "hl": false, "note": ""}, {"sp": "", "en": "Later, we danced at a street party. It was so fun.", "zh": "之後，我們在街頭派對跳舞。真的好好玩。", "hl": false, "note": "danced：字尾 e 只加 d。"}, {"sp": "", "en": "Back at Rosa's house, there were flowers, candles, candy, and food on the table.", "zh": "回到 Rosa 家，桌上有花、蠟燭、糖果和食物。", "hl": true, "note": "There were＋複數（好幾樣東西）。"}, {"sp": "", "en": "Her family cooked a big meal for everyone and then shared touching stories of their dead relatives with me.", "zh": "她的家人為大家煮了一頓大餐，然後和我分享他們過世親人的感人故事。", "hl": false, "note": ""}, {"sp": "", "en": "For Mexicans, the Day of the Dead is all about love, not fear.", "zh": "對墨西哥人來說，亡靈節完全是關於愛，而不是恐懼。", "hl": true, "note": ""}]}], "grammar": [{"id": "was-were", "name": "be 動詞過去式 was／were", "icon": "🕰️", "c": ["PAST-BE", "THERE"], "intro": "七年級學的 am、is、are，講「以前」時只剩兩個：<b>was</b> 和 <b>were</b>。用哪一個，一樣看主詞。", "table": [["現在", "過去", "主詞"], ["am、is", "was", "I、he、she、it、單數名詞"], ["are", "were", "you、we、they、複數名詞"], ["There is", "There was", "後面接單數"], ["There are", "There were", "後面接複數"]], "flows": [{"title": "現在 → 過去", "steps": [{"tokens": ["I", "am", "tired", "now", "."], "hl": [1, 3], "note": "現在：I am"}, {"tokens": ["I", "was", "tired", "yesterday", "."], "hl": [1, 3], "note": "加了 yesterday → am 變成 <b>was</b>"}, {"tokens": ["My", "parents", "were", "busy", "."], "hl": [1, 2], "note": "parents 複數 → are 變成 <b>were</b>"}]}, {"title": "否定句、問句、簡答", "steps": [{"tokens": ["Tom", "was", "sad", "."], "hl": [1], "note": "直述句：找到 was"}, {"tokens": ["Tom", "wasn't", "sad", "."], "hl": [1], "note": "否定：was＋not＝<b>wasn't</b>（不用 did）"}, {"tokens": ["Was", "Tom", "sad", "?"], "hl": [0], "note": "問句：Was 搬到句首"}, {"tokens": ["Yes", ",", "he", "was", "."], "hl": [2, 3], "note": "簡答：Yes, he was.／No, he wasn't."}]}, {"title": "There was／were 看後面的東西", "steps": [{"tokens": ["There", "was", "a", "cake", "on", "the", "table", "."], "hl": [1, 3], "note": "a cake 一個 → was"}, {"tokens": ["There", "were", "many", "candles", "on", "the", "cake", "."], "hl": [1, 3], "note": "candles 複數 → were"}, {"tokens": ["There", "weren't", "any", "students", "at", "school", "."], "hl": [1, 3], "note": "否定：weren't＋any"}]}], "tutor": [{"say": "「My grandfather ___ a farmer ten years ago.」要填？", "ch": [{"t": "was", "ok": true, "re": "對！grandfather 一個人、ten years ago 過去 → was。"}, {"t": "were", "ok": false, "re": "were 給 you、we、they 和複數。爺爺只有一個人喔。"}, {"t": "is", "ok": false, "re": "ten years ago 是十年前，要用過去式。"}]}, {"say": "「___ you at home last night?」", "ch": [{"t": "Was", "ok": false, "re": "you 不管幾個人都配 were（就像現在式 you are）。"}, {"t": "Were", "ok": true, "re": "沒錯！you → were，搬到句首變 Were。"}, {"t": "Did", "ok": false, "re": "後面沒有一般動詞（at home 不是動作），所以用 be 動詞，不用 did。"}]}, {"say": "「There ___ many flowers and candles on the table.」", "ch": [{"t": "was", "ok": false, "re": "看後面：flowers and candles 是很多東西 → were。"}, {"t": "were", "ok": true, "re": "對！There＋be 要看後面的東西，複數 → were。"}]}]}, {"id": "past-reg", "name": "規則動詞過去式（-ed 四個規則）", "icon": "✏️", "c": ["PAST-REG"], "intro": "大部分動詞變過去式就是加 -ed，但<b>拼法有四種情況</b>。段考的「寫出過去式」幾乎都考這四種。", "table": [["規則", "怎麼變", "例子"], ["① 一般", "加 -ed", "watch → watched、play → played"], ["② 字尾 e", "只加 -d", "dance → danced、share → shared、place → placed"], ["③ 子音＋y", "去 y 加 -ied", "study → studied、cry → cried"], ["④ 短母音＋一個子音", "重複字尾再加 -ed", "jog → jogged、plan → planned、stop → stopped"]], "flows": [{"title": "四種拼法一次看", "steps": [{"tokens": ["watch", "→", "watched"], "hl": [2], "note": "① 一般動詞：直接加 ed"}, {"tokens": ["dance", "→", "danced"], "hl": [2], "note": "② 字尾已經有 e：只加 d"}, {"tokens": ["study", "→", "studied"], "hl": [2], "note": "③ 子音 d＋y：去 y 加 ied"}, {"tokens": ["jog", "→", "jogged"], "hl": [2], "note": "④ 短母音 o＋一個子音 g：重複 g 再加 ed"}]}, {"title": "🔴 母音＋y 不用去 y", "steps": [{"tokens": ["play", "→", "played"], "hl": [2], "note": "a 是母音，母音＋y → 直接加 ed"}, {"tokens": ["enjoy", "→", "enjoyed"], "hl": [2], "note": "o＋y 也是母音＋y → enjoyed"}, {"tokens": ["cry", "→", "cried"], "hl": [2], "note": "r 是子音，子音＋y → 去 y 加 ied"}]}, {"title": "-ed 的三種唸法", "steps": [{"tokens": ["watched", "/t/"], "hl": [1], "note": "字尾無聲子音（ch、k、p、s、sh）→ 唸 /t/"}, {"tokens": ["played", "/d/"], "hl": [1], "note": "字尾有聲音（母音、g、n、l…）→ 唸 /d/"}, {"tokens": ["planted", "/ɪd/"], "hl": [1], "note": "字尾 t 或 d → 多一個音節 /ɪd/"}]}], "tutor": [{"say": "plan 的過去式是？", "ch": [{"t": "planed", "ok": false, "re": "plan 是短母音 a＋一個子音 n → 要重複 n：planned。"}, {"t": "planned", "ok": true, "re": "對！短母音＋一個子音，重複字尾再加 ed。"}, {"t": "planted", "ok": false, "re": "planted 是 plant（種植）的過去式，不一樣的字喔。"}]}, {"say": "enjoy 的過去式是？", "ch": [{"t": "enjoied", "ok": false, "re": "o 是母音，母音＋y 直接加 ed。"}, {"t": "enjoyed", "ok": true, "re": "沒錯！只有「子音＋y」才去 y 加 ied。"}]}, {"say": "「Rita ___ English yesterday morning.」（study）", "ch": [{"t": "studyed", "ok": false, "re": "d 是子音，子音＋y 要去 y 加 ied。"}, {"t": "studied", "ok": true, "re": "完美！study → studied。"}, {"t": "studies", "ok": false, "re": "studies 是現在式（第三人稱單數），yesterday 要用過去式。"}]}]}, {"id": "did-q", "name": "Did 問句與否定 didn't", "icon": "❓", "c": ["PAST-Q", "PAST-NEG"], "intro": "一般動詞的過去式要變問句或否定，請 <b>did</b> 來幫忙。記一句口訣：<b>did 一出現，動詞回原形</b>（因為「過去」已經由 did 表示了）。", "table": [["句型", "怎麼變", "例句"], ["直述句", "動詞改過去式", "She <b>watched</b> TV."], ["否定句", "didn't＋原形", "She <b>didn't watch</b> TV."], ["問句", "Did＋主詞＋原形", "<b>Did</b> she <b>watch</b> TV?"], ["簡答", "Yes／No＋代名詞＋did／didn't", "Yes, she did.／No, she didn't."]], "flows": [{"title": "直述句 → 否定句", "steps": [{"tokens": ["Tom", "watched", "a", "movie", "."], "hl": [1], "note": "直述句：watched 是過去式"}, {"tokens": ["Tom", "didn't", "watch", "a", "movie", "."], "hl": [1, 2], "note": "否定：加 didn't，watched 變回<b>原形 watch</b>"}]}, {"title": "直述句 → 問句 → 簡答", "steps": [{"tokens": ["Tom", "watched", "a", "movie", "."], "hl": [1], "note": "直述句"}, {"tokens": ["Did", "Tom", "watch", "a", "movie", "?"], "hl": [0, 2], "note": "問句：Did 放句首，watched 變回<b>原形</b>"}, {"tokens": ["Yes", ",", "he", "did", "."], "hl": [2, 3], "note": "肯定簡答：Yes, he did."}, {"tokens": ["No", ",", "he", "didn't", "."], "hl": [3], "note": "否定簡答：No, he didn't."}]}, {"title": "🔴 be 動詞句不用 did", "steps": [{"tokens": ["Tom", "was", "sad", "."], "hl": [1], "note": "有 was／were 的句子"}, {"tokens": ["Was", "Tom", "sad", "?"], "hl": [0], "note": "問句直接把 Was 搬到前面（✗ Did Tom was sad?）"}]}], "tutor": [{"say": "「Did you ___ the movie last night?」", "ch": [{"t": "watched", "ok": false, "re": "🔴 did 已經表示過去了，後面要用原形。"}, {"t": "watch", "ok": true, "re": "對！did 一出現，動詞回原形。"}, {"t": "watches", "ok": false, "re": "watches 是現在式第三人稱單數，did 後面只能接原形。"}]}, {"say": "「Did Rita jog after lunch?」肯定簡答是？", "ch": [{"t": "Yes, she did.", "ok": true, "re": "完美！Rita → she，用 did 回答。"}, {"t": "Yes, she jogged.", "ok": false, "re": "簡答只用 did，不重複動詞。"}, {"t": "Yes, she was.", "ok": false, "re": "問句用 Did，回答也要用 did。"}]}, {"say": "「I ___ go to school yesterday. I was sick.」", "ch": [{"t": "don't", "ok": false, "re": "yesterday 是過去，要用 didn't。"}, {"t": "didn't", "ok": true, "re": "對！didn't＋原形 go。"}, {"t": "wasn't", "ok": false, "re": "後面有一般動詞 go，否定要用 didn't，不用 wasn't。"}]}]}, {"id": "wh-did", "name": "What did…? 問「做了什麼」", "icon": "🔍", "c": ["WH-PAST"], "intro": "想問「你昨天做了什麼」，就把<b>疑問詞放在 Did 問句前面</b>。回答時不用 Yes／No，直接說做了什麼，動詞改<b>過去式</b>。", "table": [["疑問詞", "問句", "回答"], ["What", "What did you do yesterday?", "I <b>studied</b> English."], ["Where", "Where did you go last weekend?", "I <b>went</b> to the park."], ["How", "How did you go to school?", "I <b>walked</b> there."], ["When", "When did she get married?", "She <b>got</b> married in 2017."]], "flows": [{"title": "Did 問句加上 What", "steps": [{"tokens": ["Did", "you", "study", "English", "?"], "hl": [0], "note": "Yes／No 問句"}, {"tokens": ["What", "did", "you", "do", "yesterday", "?"], "hl": [0, 1, 3], "note": "問「做了什麼」：What＋did＋主詞＋<b>do</b>（原形）"}, {"tokens": ["I", "studied", "English", "."], "hl": [1], "note": "回答：動詞改過去式 studied（不用 Yes／No）"}]}, {"title": "問「做了什麼」和「誰做的」不一樣", "steps": [{"tokens": ["What", "did", "Tom", "watch", "?"], "hl": [1, 3], "note": "問 Tom 看了什麼：要用 did＋原形"}, {"tokens": ["Who", "moved", "the", "sofa", "?"], "hl": [0, 1], "note": "🔴 問「誰」當主詞：Who＋過去式，不用 did"}, {"tokens": ["My", "father", "did", "."], "hl": [2], "note": "回答：My father did.（did 代替 moved）"}]}], "tutor": [{"say": "「What ___ you do last Sunday?」", "ch": [{"t": "are", "ok": false, "re": "後面有一般動詞 do，過去式要用 did。"}, {"t": "did", "ok": true, "re": "對！What＋did＋主詞＋原形。"}, {"t": "were", "ok": false, "re": "were 是 be 動詞，後面不能接 do。"}]}, {"say": "「What did Adam do yesterday?」最好的回答是？", "ch": [{"t": "Yes, he did.", "ok": false, "re": "What 問句不能用 Yes／No 回答。"}, {"t": "He painted the bedroom.", "ok": true, "re": "對！直接說做了什麼，動詞用過去式。"}, {"t": "He paints the bedroom.", "ok": false, "re": "yesterday 要用過去式 painted。"}]}, {"say": "「How ___ you go to the restaurant last Friday?」— 「I walked there.」", "ch": [{"t": "do", "ok": false, "re": "last Friday 是過去 → did。"}, {"t": "did", "ok": true, "re": "沒錯！How did…? 問「怎麼去的」。"}, {"t": "can", "ok": false, "re": "這裡問的是上週五怎麼去，要用過去式 did。"}]}]}, {"id": "time", "name": "時間副詞 yesterday／last／ago", "icon": "📅", "c": ["TIME"], "intro": "看到這些字，就知道句子要用<b>過去式</b>。三個字的用法不一樣，段考常考填空。", "table": [["字", "怎麼用", "例子"], ["yesterday", "單獨用，或＋早上／下午", "yesterday、yesterday afternoon"], ["last", "last＋時間單位", "last night、last week、last Sunday、last year"], ["ago", "一段時間＋ago", "two hours ago、five years ago、a few days ago"]], "flows": [{"title": "三種說法", "steps": [{"tokens": ["I", "saw", "him", "yesterday", "afternoon", "."], "hl": [3, 4], "note": "yesterday afternoon 昨天下午"}, {"tokens": ["I", "saw", "him", "last", "night", "."], "hl": [3, 4], "note": "🔴 昨晚是 last night（✗ yesterday night）"}, {"tokens": ["I", "saw", "him", "two", "days", "ago", "."], "hl": [3, 4, 5], "note": "兩天前：時間在前、ago 在後"}]}], "tutor": [{"say": "「My mom was a teacher five years ___.」", "ch": [{"t": "ago", "ok": true, "re": "對！一段時間＋ago。"}, {"t": "last", "ok": false, "re": "last 要放在時間前面：last year。"}, {"t": "yesterday", "ok": false, "re": "five years yesterday 不通喔。"}]}, {"say": "「昨晚」怎麼說？", "ch": [{"t": "yesterday night", "ok": false, "re": "英文習慣說 last night。"}, {"t": "last night", "ok": true, "re": "沒錯！"}, {"t": "night ago", "ok": false, "re": "ago 前面要有一段時間：two nights ago。"}]}]}], "questions": [{"id": "L1:mc01", "t": "mc", "set": "mc", "c": ["PAST-BE"], "q": "A: Where ___ you last night?<br>B: I was at my grandma's house.", "o": ["are", "was", "were", "did"], "a": 2, "x": "you 配 were；last night 過去。", "L": "L1"}, {"id": "L1:mc02", "t": "mc", "set": "mc", "c": ["PAST-Q"], "q": "A: ___ Tom jog in the park yesterday?<br>B: Yes, he did.", "o": ["Was", "Did", "Does", "Is"], "a": 1, "x": "後面有一般動詞 jog（原形）、回答用 did → Did。", "L": "L1"}, {"id": "L1:mc03", "t": "mc", "set": "mc", "c": ["PAST-NEG"], "q": "Rita didn't ___ TV last night. She studied English.", "o": ["watch", "watched", "watches", "watching"], "a": 0, "x": "didn't＋原形 watch。", "L": "L1"}, {"id": "L1:mc04", "t": "mc", "set": "mc", "c": ["WH-PAST"], "q": "A: ___ did you do last weekend?<br>B: I visited my relatives.", "o": ["What", "Who", "How", "Why"], "a": 0, "x": "回答「做了什麼」→ What。", "L": "L1"}, {"id": "L1:mc05", "t": "mc", "set": "mc", "c": ["TIME"], "q": "My grandpa passed away two years ___.", "o": ["last", "ago", "before", "yesterday"], "a": 1, "x": "一段時間＋ago。", "L": "L1"}, {"id": "L1:mc06", "t": "mc", "set": "mc", "c": ["THERE"], "q": "There ___ many candles and flowers on the table last night.", "o": ["is", "are", "was", "were"], "a": 3, "x": "last night 過去；candles and flowers 複數 → were。", "L": "L1"}, {"id": "L1:mc07", "t": "mc", "set": "mc", "c": ["PAST-REG"], "q": "We ___ breakfast together this morning. It was delicious.", "o": ["cook", "cooked", "cooks", "cooking"], "a": 1, "x": "後面 It was delicious 是過去式，表示早餐已經吃完 → cooked。", "L": "L1"}, {"id": "L1:mc08", "t": "mc", "set": "mc", "c": ["V-POS"], "q": "The ___ of his dog made Ben very sad.", "o": ["dead", "die", "death", "died"], "a": 2, "x": "the ___ of → 名詞 death。", "L": "L1"}, {"id": "L1:mc09", "t": "mc", "set": "mc", "c": ["V-POS"], "q": "Henry's dog ___ last Saturday. He was very sad.", "o": ["death", "died", "dead", "dies"], "a": 1, "x": "空格是動詞、last Saturday 過去 → died。", "L": "L1"}, {"id": "L1:mc10", "t": "mc", "set": "mc", "c": ["PHR"], : "wk-look"}, {"id": "L1:wl2", "t": "fill", "set": "workbook", "c": ["PAST-Q", "PAST-REG"], "q": "（圖：Eric 在路上慢跑）Q: ___ Eric jog last weekend? A: ___, he ___ ___ weekend.（四格用空格隔開）", "a": ["Did Yes jogged last"], "x": "Did 問句；詳答用過去式 jogged。", "L": "L1", "tsec": "wk-look"}, {"id": "L1:wl3", "t": "fill", "set": "workbook", "c": ["WH-PAST", "PAST-REG"], "q": "（圖：Adam 拿刷子在油漆臥室牆壁）Q: What did Adam ___ yesterday? A: He ___ the bedroom ___.（三格用空格隔開）", "a": ["do painted yesterday"], "x": "What did…do？→ painted。", "L": "L1", "tsec": "wk-look"}, {"id": "L1:wl4", "t": "fill", "set": "workbook", "c": ["WH-PAST", "PAST-REG"], "q": "（圖：Ryan 和 Anna 在公園草地上野餐）Q: What ___ Ryan and Anna do last Sunday? A: ___ ___ in the park ___ ___.（五格用空格隔開）", "a": ["did They picnicked last Sunday"], "x": "picnic 的過去式是 picnicked（加 k 再加 ed）。", "L": "L1", "tsec": "wk-look"}, {"id": "L1:wl5", "t": "order", "set": "workbook", "c": ["PAST-NEG", "PAST-Q"], "zh": "（圖：Ruby 坐在沙發上吃爆米花、看電視）Did Ruby study English this morning?（詳答）", "en": "No, she didn't study English this morning.", "alt": [], "x": "她在看電視 → No；didn't＋原形 study。", "L": "L1", "tsec": "wk-look"}, {"id": "L1:wr1", "t": "mc", "set": "workbook", "c": ["V-ZH"], "q": "（短文〈Lucy's Memory of Miaoli〉：Many years ago, Lucy's parents were busy in Taipei. They didn't have time for Lucy, so she lived with her grandparents in Miaoli. Lucy loved Miaoli very much. Her grandma always looked after her and cooked her favorite food: egg noodles. They were very delicious. Lucy's grandpa always made toys for her. He made everything from dolls to small cars. Lucy also liked his funny stories although (雖然) he always told the same <u>ones</u>. Now, Lucy lives with her parents in Taipei, but she misses Miaoli a lot. The place is full of sweet memories. She misses the egg noodles. She misses the same old stories. She misses her grandparents.） What do <u>ones</u> mean in the reading?", "o": ["Toys.", "Stories.", "Memories.", "Egg noodles."], "a": 1, "x": "the same ones＝the same stories（前面剛說 funny stories）。", "L": "L1", "tsec": "wk-read"}, {"id": "L1:wr2", "t": "mc", "set": "workbook", "c": ["V-ZH"], "q": "（短文〈Lucy's Memory of Miaoli〉：Many years ago, Lucy's parents were busy in Taipei. They didn't have time for Lucy, so she lived with her grandparents in Miaoli. Lucy loved Miaoli very much. Her grandma always looked after her and cooked her favorite food: egg noodles. They were very delicious. Lucy's grandpa always made toys for her. He made everything from dolls to small cars. Lucy also liked his funny stories although (雖然) he always told the same <u>ones</u>. Now, Lucy lives with her parents in Taipei, but she misses Miaoli a lot. The place is full of sweet memories. She misses the egg noodles. She misses the same old stories. She misses her grandparents.） What do we know from the reading?", "o": ["Lucy doesn't like Miaoli at first.", "Lucy doesn't live in Miaoli now.", "Lucy's grandparents are gone now.", "Lucy's grandma was a cook many years ago."], "a": 1, "x": "Now, Lucy lives with her parents in Taipei → 現在不住苗栗。", "L": "L1", "tsec": "wk-read"}], "reading": [{"id": "L1:r1", "title": "閱讀（一）Obon in Japan", "tree": "", "p": "Last summer, my family visited my aunt in Japan. We were there for Obon, a festival for dead relatives. On the first night, people placed lanterns (燈籠) in front of their houses. The lights showed the ghosts the way home. On the second night, we wore summer clothes and danced to music in a circle with many people. My aunt said, \"We don't feel sad at Obon. We remember our grandparents with music and food.\" On the last night, people put the lanterns on the river. <b>They</b> went away slowly. It was beautiful.", "qs": [{"id": "L1:r1a", "t": "mc", "set": "read", "c": ["V-ZH"], "q": "What is the reading mainly about?", "o": ["A trip to buy summer clothes.", "A festival for dead relatives in Japan.", "How to make lanterns.", "The writer's aunt's job."], "a": 1, "x": "全文在講日本的盂蘭盆節。", "L": "L1"}, {"id": "L1:r1b", "t": "mc", "set": "read", "c": ["V-ZH"], "q": "What did people do on the second night?", "o": ["They placed lanterns in front of houses.", "They put lanterns on the river.", "They danced in a circle.", "They cleaned the tombs."], "a": 2, "x": "On the second night… danced to music in a circle。", "L": "L1"}, {"id": "L1:r1c", "t": "mc", "set": "read", "c": ["V-ZH"], "q": "What does <b>They</b> in the last paragraph mean?", "o": ["The ghosts.", "The lanterns.", "The people.", "The houses."], "a": 1, "x": "放在河上、慢慢漂走的是燈籠。", "L": "L1"}]}, {"id": "L1:r2", "title": "閱讀（二）克漏字：Grandma's Birthday", "tree": "", "p": "Last Sunday was my grandma's 80th birthday. My parents and I __1__ up early and went to her house. My aunt cooked a big meal, and there __2__ many candles on the cake. After dinner, Grandma showed us some old photos. \"This was me sixty years __3__,\" she said. We all laughed. It was a sweet day.", "qs": [{"id": "L1:r2a", "t": "mc", "set": "read", "c": ["PAST-IRR"], "q": "第 1 格：", "o": ["get", "got", "gets", "getting"], "a": 1, "x": "Last Sunday 過去 → got。", "L": "L1"}, {"id": "L1:r2b", "t": "mc", "set": "read", "c": ["THERE"], "q": "第 2 格：", "o": ["was", "were", "is", "are"], "a": 1, "x": "many candles 複數、過去 → were。", "L": "L1"}, {"id": "L1:r2c", "t": "mc", "set": "read", "c": ["TIME"], "q": "第 3 格：", "o": ["last", "ago", "before", "yesterday"], "a": 1, "x": "sixty years ago。", "L": "L1"}]}, {"id": "L1:r3", "title": "閱讀（三）Ken's Diary", "tree": "", "p": "<b>Saturday, October 4</b><br>This morning I didn't go jogging because it rained. I stayed home and studied English. In the afternoon, my cousin Amy visited us. We played video games and watched a movie about a boy and his grandpa. It was very touching, and Amy cried at the end. At night, Mom cooked beef noodles for us. Yummy!", "qs": [{"id": "L1:r3a", "t": "mc", "set": "read", "c": ["PAST-NEG"], "q": "Why didn't Ken go jogging?", "o": ["He was sick.", "It rained.", "Amy visited him.", "He was busy."], "a": 1, "x": "because it rained。", "L": "L1"}, {"id": "L1:r3b", "t": "mc", "set": "read", "c": ["V-ZH"], "q": "Which is TRUE?", "o": ["Ken studied math in the morning.", "Amy cooked beef noodles.", "Amy cried at the end of the movie.", "Ken went to Amy's house."], "a": 2, "x": "Amy cried at the end。", "L": "L1"}]}], "teacher": [], "workbook": [{"id": "wk-mix", "title": "Read and Choose 綜合測驗", "page": "習作 p.2–3", "ids": ["L1:wm1", "L1:wm2", "L1:wm3", "L1:wm4", "L1:wm5", "L1:wm6", "L1:wm7", "L1:wm8", "L1:wm9", "L1:wm10"]}, {"id": "wk-fill", "title": "Part 1 Fill In 選字填空", "page": "習作 p.4", "ids": ["L1:wf1", "L1:wf2", "L1:wf3", "L1:wf4", "L1:wf5", "L1:wf6", "L1:wf7", "L1:wf8", "L1:wf9", "L1:wf10"]}, {"id": "wk-past", "title": "Part 2 寫出過去式", "page": "習作 p.5", "ids": ["L1:wp1", "L1:wp2", "L1:wp3", "L1:wp4", "L1:wp5", "L1:wp6"]}, {"id": "wk-time", "title": "Part 3 填 ago／yesterday／last", "page": "習作 p.5", "ids": ["L1:wt1", "L1:wt2", "L1:wt3"]}, {"id": "wk-write", "title": "Part 4 Read and Write 依提示作答", "page": "習作 p.5", "ids": ["L1:ww1", "L1:ww2", "L1:ww3", "L1:ww4"]}, {"id": "wk-choose", "title": "Part 5 Choose 文法選擇", "page": "習作 p.6", "ids": ["L1:wc1", "L1:wc2", "L1:wc3", "L1:wc4", "L1:wc5", "L1:wc6", "L1:wc7", "L1:wc8", "L1:wc9"]}, {"id": "wk-look", "title": "Part 6 Look and Write 看圖詳答", "page": "習作 p.7", "ids": ["L1:wl1", "L1:wl2", "L1:wl3", "L1:wl4", "L1:wl5"]}, {"id": "wk-read", "title": "Part 7 Read and Choose 閱讀", "page": "習作 p.8", "ids": ["L1:wr1", "L1:wr2"]}], "secNotes": {"對話：說過去的事": "這一課從頭到尾在講「昨天、以前」。動詞要連<b>過去式</b>一起背：study → studied（子音＋y 去 y 加 ied）、jog → jogged（短母音＋子音，重複字尾再加 ed）。was、were 是 be 動詞的過去式。", "節日與紀念": "Word Power 的字，用來描述各國怎麼紀念過世的親人：paint faces、dress up、dance in a circle、place candles。🔴 place 在這裡是<b>動詞</b>（放置），不是「地方」。", "閱讀：亡靈節": "讀懂〈The Day of the Dead〉用的字。🔴 <b>death</b> 是名詞（死亡）、<b>dead</b> 是形容詞（死的）、<b>die</b> 是動詞（死，過去式 died），段考最愛考這一組。", "片語": "片語要整組背：pass away 過世、look after 照顧、remind… of… 使某人想起、after all 畢竟、dress up 裝扮。"}, "tiles": [["🔤", "單字卡", "選類別→學習單字或拼字", "words"], ["
