<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>八上英文（南一）</title>
<meta name="theme-color" content="#2563eb">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
/* ───────── 設計基準：8px 網格｜灰階分層｜Indigo 為唯一強調色 ───────── */
:root{
  --accent:#4f46e5; --accent-ink:#4338ca; --accent-soft:#eef2ff; --accent-line:rgba(79,70,229,.18);
  --bg:#f7f7f8; --surface:#ffffff; --surface-2:#f4f4f5; --line:#e4e4e7;
  --ink:#18181b; --ink-2:#52525b; --ink-3:#a1a1aa;
  --ok:#15803d; --ok-soft:#f0fdf4; --ng:#b91c1c; --ng-soft:#fef2f2; --warn:#a16207; --warn-soft:#fefce8;
  --r-sm:8px; --r-md:12px; --r-lg:16px;
  --sh-1:0 1px 2px rgba(24,24,27,.04),0 1px 3px rgba(24,24,27,.06);
  --sh-2:0 8px 24px rgba(24,24,27,.08),0 2px 6px rgba(24,24,27,.04);
  --ease:cubic-bezier(.2,.8,.2,1);
  --pad:16px;
}
@media (prefers-color-scheme: dark){
  :root{ --accent:#818cf8; --accent-ink:#a5b4fc; --accent-soft:rgba(129,140,248,.14); --accent-line:rgba(129,140,248,.28);
    --bg:#0c0c0e; --surface:#18181b; --surface-2:#232328; --line:#2e2e34;
    --ink:#f4f4f5; --ink-2:#a1a1aa; --ink-3:#71717a;
    --ok:#4ade80; --ok-soft:rgba(74,222,128,.10); --ng:#f87171; --ng-soft:rgba(248,113,113,.10); --warn:#facc15; --warn-soft:rgba(250,204,21,.10);
    --sh-1:0 1px 2px rgba(0,0,0,.4); --sh-2:0 8px 24px rgba(0,0,0,.5); }
}
@media (min-width:600px){ :root{ --pad:24px; } }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  -webkit-font-smoothing:antialiased}
#app{max-width:720px;margin:0 auto;padding:0 16px 96px}

/* 標題列：毛玻璃、黏在頂端 */
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;margin:0 -16px 8px;padding:16px;
  background:color-mix(in srgb,var(--bg) 78%,transparent);
  backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);
  border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
header.top h1{font-size:20px;font-weight:700;letter-spacing:-.01em;margin:0;flex:1;line-height:1.3}
header.top .back{width:40px;height:40px;flex:none;border:0;border-radius:50%;background:var(--surface);color:var(--ink);
  font-size:18px;cursor:pointer;box-shadow:var(--sh-1);transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
header.top .back:hover{box-shadow:var(--sh-2)}
header.top .back:active{transform:scale(.92)}

h2{font-size:13px;font-weight:600;letter-spacing:.06em;color:var(--ink-3);margin:32px 0 16px}
h3{font-size:16px;font-weight:600;margin:24px 0 8px}
p{margin:8px 0 16px}
.sub{color:var(--ink-2);font-size:14px}
.muted{color:var(--ink-3);font-size:14px}
b{font-weight:600}

/* 卡片 */
.card{background:var(--surface);border-radius:var(--r-lg);padding:var(--pad);margin:16px 0;box-shadow:var(--sh-1)}

/* 首頁方塊 */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:16px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:8px;background:var(--surface);border:0;border-radius:var(--r-lg);
  padding:16px;cursor:pointer;text-align:left;color:var(--ink);font:inherit;box-shadow:var(--sh-1);
  transition:transform .25s var(--ease),box-shadow .25s var(--ease)}
.tile:hover{transform:translateY(-2px);box-shadow:var(--sh-2)}
.tile:active{transform:scale(.97)}
.tile .ic{width:40px;height:40px;border-radius:var(--r-md);background:var(--surface-2);display:grid;place-items:center;font-size:20px}
.tile b{font-size:16px;line-height:1.3}
.tile small{color:var(--ink-3);font-size:13px;line-height:1.5}
.tile.off{opacity:.45;cursor:default;box-shadow:none;background:var(--surface-2)}
.tile.off:hover{transform:none}

/* 按鈕 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;border:0;border-radius:var(--r-md);
  background:var(--accent);color:#fff;font:inherit;font-size:15px;font-weight:600;padding:0 16px;margin:8px 8px 0 0;cursor:pointer;
  transition:transform .2s var(--ease),background .2s var(--ease),box-shadow .2s var(--ease)}
.btn:hover{box-shadow:0 4px 12px var(--accent-line)}
.btn:active{transform:scale(.96)}
.btn.ghost{background:var(--accent-soft);color:var(--accent-ink)}
.btn.ghost:hover{box-shadow:none;background:var(--accent-line)}
.btn.small{min-height:32px;font-size:13px;padding:0 16px;border-radius:var(--r-sm)}
.btn:disabled{opacity:.35;pointer-events:none}
.say{width:32px;height:32px;flex:none;border:0;border-radius:50%;background:var(--surface-2);color:var(--ink-2);font-size:14px;cursor:pointer;
  transition:transform .2s var(--ease),background .2s var(--ease),color .2s var(--ease)}
.say:hover{background:var(--accent-soft);color:var(--accent)}
.say:active{transform:scale(.9)}

/* 表格 */
.tablewrap{overflow-x:auto}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:14px}
th,td{padding:8px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
@media (min-width:600px){ th,td{padding:8px 16px} }
th{font-size:13px;font-weight:600;color:var(--ink-2);background:var(--surface-2)}
th:first-child{border-top-left-radius:var(--r-sm)}
th:last-child{border-top-right-radius:var(--r-sm)}
tr:last-child td{border-bottom:0}
th:first-child,td:first-child{white-space:nowrap}

/* 單字卡 */
.word{display:flex;gap:16px;align-items:flex-start;padding:16px 0;border-bottom:1px solid var(--line)}
.word:first-child{padding-top:0}
.word:last-child{border:0;padding-bottom:0}
.word .w{font-size:20px;font-weight:700;letter-spacing:-.01em}
.word .pos{color:var(--accent);font-weight:600;font-size:14px;margin:0 8px}
.badge{display:inline-block;font-size:12px;line-height:20px;padding:0 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);margin:8px 8px 0 0}
.badge.cap{background:var(--accent-soft);color:var(--accent-ink)}
.badge.irr{background:var(--ng-soft);color:var(--ng)}
.eg{display:block;color:var(--ink-2);font-size:14px;margin-top:8px}
.eg .say{width:24px;height:24px;font-size:11px;vertical-align:middle;margin-right:4px}

/* 課文 */
.line{display:flex;gap:16px;align-items:flex-start;padding:16px 0;border-bottom:1px solid var(--line)}
.line:first-child{padding-top:0}
.line:last-child{border:0;padding-bottom:0}
.line .sp{font-weight:600;font-size:14px;min-width:40px;color:var(--ink-3);padding-top:4px}
.line .en{font-size:17px}
.line .hl{background:linear-gradient(transparent 58%,var(--accent-line) 58%);-webkit-box-decoration-break:clone;box-decoration-break:clone}
.line .zh{color:var(--ink-3);font-size:14px;margin-top:4px}
.note{background:var(--surface-2);border-left:3px solid var(--accent);border-radius:var(--r-sm);padding:8px 16px;font-size:14px;color:var(--ink-2);margin-top:8px}

/* 文法字卡 */
.chips{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;padding:8px 0}
.chipw{padding:8px 16px;border-radius:var(--r-sm);background:var(--surface-2);color:var(--ink);font-size:18px;font-weight:600;
  border:0;transition:all .4s var(--ease)}
.chipw.on{background:var(--accent);color:#fff;transform:translateY(-4px);box-shadow:0 6px 16px var(--accent-line)}
.stepnote{min-height:48px;font-size:15px;color:var(--ink-2);margin:8px 0}

/* 小老師對話 */
.bubble{border-radius:var(--r-lg);padding:16px;margin:8px 0;max-width:88%;font-size:15px}
.bubble.t{background:var(--surface-2);border-top-left-radius:4px}
.bubble.ok{background:var(--ok-soft);margin-left:auto;border-top-right-radius:4px}
.bubble.ng{background:var(--warn-soft);margin-left:auto;border-top-right-radius:4px}

/* 選項 */
.opts{display:grid;gap:8px;margin-top:16px}
.opt{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;text-align:left;padding:12px 16px;border-radius:var(--r-md);cursor:pointer;
  transition:border-color .2s var(--ease),background .2s var(--ease),transform .15s var(--ease)}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt:active:not(:disabled){transform:scale(.98)}
.opt.big{font-size:40px;text-align:center;padding:8px}
.opts.pic{grid-template-columns:repeat(3,1fr)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ng{border-color:var(--ng);background:var(--ng-soft)}
.opt:disabled{cursor:default}
.chips .opt{padding:8px 16px}
.dropzone{background:var(--surface-2);border-radius:var(--r-md);padding:8px;margin:16px 0 8px;min-height:64px;align-items:center}
.dropzone .opt{background:var(--surface);box-shadow:var(--sh-1);border-color:transparent}
.dropzone.over{outline:2px dashed var(--accent);outline-offset:2px}
/* 句子打字：一字一格 */
.wb{display:flex;flex-wrap:wrap;gap:8px 8px;align-items:flex-end;margin:16px 0 8px}
.wbw{display:inline-flex;align-items:flex-end;gap:2px}
.wbi{font:inherit;font-size:18px;padding:8px 4px;min-width:40px;text-align:center;border:0;border-bottom:2px solid var(--ink-3);
  border-radius:var(--r-sm) var(--r-sm) 0 0;background:var(--surface-2);color:var(--ink);outline:none;
  transition:border-color .2s var(--ease),background .2s var(--ease)}
.wbi:focus{border-color:var(--accent);background:var(--accent-soft)}
.wbi.ok{border-color:var(--ok);background:var(--ok-soft)}
.wbi.ng{border-color:var(--ng);background:var(--ng-soft)}
.wbp{font-size:20px;font-weight:700;padding-bottom:6px}
.verdict{margin-top:16px;padding:12px 16px;border-radius:var(--r-md);font-size:20px;font-weight:700}
.verdict.ok{background:var(--ok-soft);color:var(--ok);border:2px solid var(--ok)}
.verdict.ng{background:var(--ng-soft);color:var(--ng);border:2px solid var(--ng)}
/* 學生答案逐字母比對 */
.yours{margin-top:8px;font-size:18px;line-height:1.9}
.ya{margin:16px 0 8px;border-radius:var(--r-md);overflow:hidden;border:2px solid var(--line);background:var(--surface)}
.ya.is-ok{border-color:var(--ok)} .ya.is-ng{border-color:var(--ng)}
.ya-row{display:flex;align-items:baseline;gap:16px;padding:12px 16px}
.ya-row+.ya-row{border-top:1px solid var(--line);background:var(--surface-2)}
.ya-lab{flex:none;width:64px;font-size:13px;font-weight:600;color:var(--ink-3)}
.ya-val{font-size:22px;font-weight:600;line-height:1.5;word-break:break-word}
.ya-ok{color:var(--ok)}
.ya-note{padding:8px 16px;font-size:13px;color:var(--ok);background:var(--ok-soft)}
.dword{font-weight:600;letter-spacing:.02em}
.dbad{background:var(--ng-soft);color:var(--ng);text-decoration:line-through;border-radius:3px;padding:0 1px}
.dmiss{color:var(--ng);border:1px dashed var(--ng);border-radius:3px;padding:0 2px;margin:0 1px}
/* 句子解析 */
.sxbox{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:8px 16px 16px}
.sxbox summary{font-weight:600;color:var(--accent);padding:8px 0}
.sx{padding:8px 0;border-bottom:1px solid var(--line)}
.sx-type{font-size:14px;margin-bottom:8px}
.sx-row{display:flex;flex-wrap:wrap;gap:8px}
.sx-chip{display:inline-flex;flex-direction:column;align-items:center;gap:2px;padding:8px 12px;border-radius:var(--r-sm);font-weight:600;font-size:16px}
.sx-chip small{font-size:11px;font-weight:500;opacity:.75}
.r-s{background:var(--accent-soft);color:var(--accent-ink)}
.r-v{background:var(--accent);color:#fff}
.r-not{background:var(--ng-soft);color:var(--ng)}
.r-c{background:var(--surface-2);color:var(--ink)}
.r-wh{background:var(--warn-soft);color:var(--warn)}
.r-cj{background:transparent;border:1px dashed var(--ink-3);color:var(--ink-2)}
.r-ph{background:var(--ok-soft);color:var(--ok)}
.sx-sec{margin-top:16px;font-size:14px;line-height:1.7}
.sx-sec>b{display:block;font-size:13px;color:var(--ink-3);letter-spacing:.04em;margin-bottom:4px}
.drag{touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.dropzone .opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.dropzone .opt.ng{border-color:var(--ng);background:var(--ng-soft)}
.drag-ghost{position:fixed;z-index:50;pointer-events:none;margin:0;transform:scale(1.08);box-shadow:var(--sh-2);background:var(--surface)!important;opacity:.95}

/* 作答 */
.q{font-size:19px;line-height:1.7;font-weight:500}
.blank{display:inline-block;min-width:64px;border-bottom:2px solid var(--ink-3);margin:0 4px}
input.ans{font:inherit;font-size:18px;width:100%;padding:12px 16px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface-2);
  color:var(--ink);margin-top:16px;outline:none;transition:border-color .2s var(--ease),box-shadow .2s var(--ease),background .2s var(--ease)}
input.ans:focus{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 4px var(--accent-line)}
.fb{border-radius:var(--r-md);padding:12px 16px;margin-top:16px;font-size:15px}
.fb.ok{background:var(--ok-soft)}
.fb.ng{background:var(--ng-soft)}
.fb.warn{background:var(--warn-soft)}
.prog{height:4px;background:var(--line);border-radius:999px;overflow:hidden;margin:8px 0 16px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .4s var(--ease)}
.passage{background:var(--surface-2);border-radius:var(--r-md);padding:16px;font-size:15px;margin-bottom:16px;max-height:45vh;overflow:auto}
.passage .gloss{font-size:13px;color:var(--ink-3);margin-top:8px}
table.info td,table.info th{padding:8px}

/* 弱點條 */
.bar{height:6px;background:var(--surface-2);border-radius:999px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}

/* 家庭樹 */
.tree svg{width:100%;height:auto;display:block;color:var(--ink)}
.tree .pn{cursor:pointer}
.tree .pn circle{transition:fill .25s var(--ease)}
.relbox{min-height:64px}
.big{font-size:20px;font-weight:600;display:flex;align-items:center;gap:8px}

.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
details summary{cursor:pointer;color:var(--accent)}
.center{text-align:center}
.score{font-size:48px;font-weight:700;letter-spacing:-.02em;color:var(--accent);line-height:1.2}
label.row{color:var(--ink-2);font-size:14px}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>
</head>
<body>
<div id="app"></div>
<script>
const D = {"app": "n8v5", "appTitle": "八上英文（南一）", "form": {"label": "過去式"}, "textNote": "粉紅底線＝課文重點句（考試常考的句型，沒有老師畫線資料，由 AI 依文法重點挑選）。", "handoutNote": "照段考與習作的題型自己出的題目。", "sets": {"best": ["⭐", "課文重點句", "課文句子中翻英：先排字再打字"], "judge": ["⚖", "動詞變化填空", "過去式・was／were・did 填空"], "pattern": ["🔧", "句型練一練", "改過去式・否定・問句・because／so"], "hand": ["✍", "填空式翻譯", "中文句＋英文句填兩格（段考手寫卷）"]}, "concepts": {"V-SP": {"name": "單字拼字", "g": "", "tip": "聽到發音先拆音節，再對照字母。容易錯的字：relative、memory、candle、tomb（b 不發音）、touching、nobody。"}, "V-POS": {"name": "詞性", "g": "", "tip": "人、事、物＝<b>n.</b>；形容人事物＝<b>adj.</b>；動作＝<b>v.</b>；修飾動作或時間＝<b>adv.</b>。🔴 death n.／dead adj.／die v."}, "V-ZH": {"name": "中文字義", "g": "", "tip": "把整句讀一遍再決定字義。英文一個字常有好幾個意思：last＝前一個的／最後的；place＝地方／放置。"}, "PAST-BE": {"name": "be 動詞過去式 was／were", "g": "was-were", "tip": "am、is → <b>was</b>；are → <b>were</b>。I、he、she、it、單數 → was；you、we、they、複數 → were。否定 wasn't／weren't；問句把 Was／Were 搬到句首。"}, "THERE": {"name": "There was／There were", "g": "was-were", "tip": "There＋be＋東西：<b>看後面的東西</b>是單數還是複數。There <b>was</b> a cake.／There <b>were</b> many candles."}, "PAST-REG": {"name": "規則動詞過去式（-ed 拼法）", "g": "past-reg", "tip": "①一般加 -ed（watched）②字尾 e 只加 -d（danced）③子音＋y 去 y 加 -ied（studied）④短母音＋一個子音，重複字尾再加 -ed（jogged、planned）。🔴 play → played（母音＋y 直接加）。"}, "PAST-IRR": {"name": "不規則動詞過去式", "g": "past-irr", "tip": "不規則動詞要整個背：go → <b>went</b>、take → <b>took</b>、buy → <b>bought</b>、sell → <b>sold</b>、break → <b>broke</b>、hit → <b>hit</b>（同形）、read → <b>read</b>（唸 /rɛd/）。"}, "PAST-Q": {"name": "Did 問句與簡答", "g": "did-q", "tip": "Did＋主詞＋<b>原形動詞</b>…？回答 Yes, 代名詞 did.／No, 代名詞 didn't.。🔴 有 did 就不能再用過去式：Did you watched ✗ → Did you watch ✓。"}, "PAST-NEG": {"name": "過去式否定 didn't", "g": "did-q", "tip": "主詞＋<b>didn't＋原形動詞</b>：I didn't go.（✗ I didn't went.）。be 動詞的否定不用 did：I wasn't busy."}, "WH-PAST": {"name": "疑問詞＋did 問句", "g": "wh-did", "tip": "What／Where／How／When＋<b>did</b>＋主詞＋原形…？回答時動詞改過去式：What did you do? — I <b>watched</b> a movie."}, "TIME": {"name": "時間副詞 yesterday／last／ago", "g": "time", "tip": "yesterday（昨天）、yesterday morning；<b>last</b>＋時間（last night／last week）；一段時間＋<b>ago</b>（two years ago）。🔴 不說 last yesterday、ago two years。"}, "WHY": {"name": "Why 問句與 Because 回答", "g": "why", "tip": "問原因用 Why，回答用 Because＋完整句子：Why did she cry? — Because she was sad."}, "CONJ": {"name": "because／so／because of／and／or", "g": "because-so", "tip": "<b>because＋原因</b>、<b>so＋結果</b>，一句只能用一個；<b>because of＋名詞</b>（because of the rain）；and 往同方向、or 二選一、but 相反。"}, "PHR": {"name": "片語", "g": "", "tip": "片語要整組背：pass away、look after、remind… of…、after all、dress up、get married、take action、not… anymore。"}, "MULTI": {"name": "一字多義", "g": "", "tip": "同一個字在不同句子裡意思和詞性會變：last（前一個的／最後的）、place（地方／放置）、plant（植物／種植）、watch（觀看／手錶）。"}, "MECH": {"name": "大小寫和標點", "g": "", "tip": "①句首大寫 ②人名、I、地名、節日（Tomb Sweeping Day）大寫 ③句尾要有句點或問號。"}}, "exam": {"listen": 15, "mc": 15, "read": 10, "hand": 5, "weight": {"listen": 2, "mc": 2, "read": 2, "hand": 4}, "desc": "照八年級第一次段考（114 學年卷）的題型和配分：", "scope": "範圍：Lesson 1、Lesson 2、Review 1", "handName": "填空式翻譯"}, "lessons": [{"id": "L1", "short": "Lesson 1", "title": "Lesson 1　We Visited Our Relatives Yesterday", "sub": "課本 p.1–16｜想念過世的親人｜墨西哥亡靈節", "scope": ["L1"], "words": [{"sec": "對話：說過去的事", "w": "yesterday", "pos": "adv.", "zh": "昨天", "ex": "I visited my aunt yesterday.", "exz": "我昨天去看我阿姨。", "pl": "", "plr": "none", "der": ["yesterday morning 昨天早上", "the day before yesterday 前天"], "note": "過去式的時間線索第一名", "tex": "What did you do yesterday, Rita?", "posq": true, "cap": 11}, {"sec": "對話：說過去的事", "w": "study", "pos": "v.", "zh": "研讀", "ex": "Ben studied math last night.", "exz": "Ben 昨晚讀數學。", "pl": "studied", "plr": "ed", "der": ["student 學生", "studies（第三人稱單數）"], "note": "子音＋y → 去 y 加 ied", "tex": "I studied English in the morning.", "posq": true, "cap": 24}, {"sec": "對話：說過去的事", "w": "jog", "pos": "v.", "zh": "慢跑", "ex": "My dad jogged in the park this morning.", "exz": "我爸今天早上在公園慢跑。", "pl": "jogged", "plr": "ed", "der": ["go jogging 去慢跑"], "note": "短母音＋一個子音 → 重 "閱讀：亡靈節", "w": "dead", "pos": "adj.", "zh": "死的；過世的", "ex": "My dead grandpa was a farmer.", "exz": "我過世的爺爺是農夫。", "pl": "", "plr": "none", "der": ["death n.", "die v."], "note": "", "tex": "their dead relatives", "posq": true, "cap": 15}, {"sec": "閱讀：亡靈節", "w": "relative", "pos": "n.", "zh": "親戚", "ex": "We visited our relatives during Chinese New Year.", "exz": "我們過年時去拜訪親戚。", "pl": "", "plr": "none", "der": [], "note": "", "tex": "We Visited Our Relatives Yesterday", "posq": true, "cap": 0}, {"sec": "閱讀：亡靈節", "w": "ghost", "pos": "n.", "zh": "鬼", "ex": "Are you afraid of ghosts?", "exz": "你怕鬼嗎？", "pl": "", "plr": "none", "der": [], "note": "", "tex": "We invited the ghosts back to our world.", "posq": true, "cap": 1}, {"sec": "閱讀：亡靈節", "w": "later", "pos": "adv.", "zh": "之後", "ex": "See you later!", "exz": "待會見！", "pl": "", "plr": "none", "der": ["later 後來（講故事）"], "note": "", "tex": "Later, we danced at a street party.", "posq": true, "cap": 24}, {"sec": "閱讀：亡靈節", "w": "candy", "pos": "n.", "zh": "糖果", "ex": "Kids love candy.", "exz": "小孩愛糖果。", "pl": "", "plr": "none", "der": ["candies（複數）"], "note": "", "tex": "there were flowers, candles, candy, and food on the table.", "posq": true, "cap": 5}, {"sec": "閱讀：亡靈節", "w": "share", "pos": "v.", "zh": "分享", "ex": "Tom shared his snacks with me.", "exz": "Tom 和我分享他的零食。", "pl": "shared", "plr": "ed", "der": ["share A with B 和 B 分享 A"], "note": "字尾 e → 只加 d", "tex": "…then shared touching stories…", "posq": true, "cap": 23}, {"sec": "閱讀：亡靈節", "w": "story", "pos": "n.", "zh": "故事", "ex": "Grandma told me a story.", "exz": "奶奶講了一個故事給我聽。", "pl": "", "plr": "none", "der": ["stories（複數）"], "note": "", "tex": "", "posq": true, "cap": 15}, {"sec": "閱讀：亡靈節", "w": "sweep", "pos": "v.", "zh": "清掃", "ex": "We swept the floor yesterday.", "exz": "我們昨天掃了地。", "pl": "swept", "plr": "irr", "der": ["sweep tombs 掃墓"], "note": "", "tex": "they also sweep tombs", "posq": true, "cap": 0}, {"sec": "閱讀：亡靈節", "w": "lively", "pos": "adj.", "zh": "充滿活力的", "ex": "The street party was lively.", "exz": "街頭派對熱鬧又有活力。", "pl": "", "plr": "none", "der": [], "note": "字尾 -ly 但它是形容詞", "tex": "in a lively way", "posq": true, "cap": 0}, {"sec": "閱讀：亡靈節", "w": "touching", "pos": "adj.", "zh": "感人的", "ex": "It was a touching story.", "exz": "那是個感人的故事。", "pl": "", "plr": "none", "der": [], "note": "", "tex": "touching stories", "posq": true, "cap": 0}, {"sec": "閱讀：亡靈節", "w": "fear", "pos": "n.", "zh": "害怕", "ex": "She showed no fear.", "exz": "她一點也不害怕。", "pl": "", "plr": "none", "der": ["be afraid of 害怕（段考考過）"], "note": "", "tex": "…is all about love, not fear.", "posq": true, "cap": 0}, {"sec": "閱讀：亡靈節", "w": "celebrate", "pos": "v.", "zh": "慶祝", "ex": "We celebrated Mom's birthday.", "exz": "我們慶祝媽媽生日。", "pl": "celebrated", "plr": "ed", "der": [], "note": "", "tex": "In Mexico, people celebrate the Day of the Dead with joy.", "posq": true, "cap": 9}, {"sec": "閱讀：亡靈節", "w": "seldom", "pos": "adv.", "zh": "很少", "ex": "We seldom talk about it.", "exz": "我們很少談論它。", "pl": "", "plr": "none", "der": ["always > usually > often > sometimes > seldom > never"], "note": "", "tex": "", "posq": true, "cap": 8}, {"sec": "片語", "w": "pass away", "pos": "phr.", "zh": "過世", "ex": "His grandpa passed away last year.", "exz": "他爺爺去年過世了。", "pl": "passed away", "plr": "ed", "der": [], "note": "", "tex": "But he passed away last year.", "posq": false, "cap": 0}, {"sec": "片語", "w": "look after", "pos": "phr.", "zh": "照顧", "ex": "My grandma looked after me.", "exz": "我奶奶照顧我。", "pl": "looked after", "plr": "ed", "der": ["＝take care of"], "note": "", "tex": "My grandfather looked after me all the time.", "posq": false, "cap": 0}, {"sec": "片語", "w": "remind… of…", "pos": "phr.", "zh": "使某人想起", "ex": "This song reminds me of my mom.", "exz": "這首歌讓我想起媽媽。", "pl": "", "plr": "none", "der": [], "note": "", "tex": "it reminded me of my grandfather.", "posq": false, "cap": 0}, {"sec": "片語", "w": "after all", "pos": "phr.", "zh": "畢竟", "ex": "After all, he is only five.", "exz": "畢竟他才五歲。", "pl": "", "plr": "none", "der": [], "note": "", "tex": "After all, I have so many happy memories with him.", "posq": false, "cap": 2}, {"sec": "片語", "w": "dress up", "pos": "phr.", "zh": "裝扮", "ex": "We dressed up in costumes.", "exz": "我們穿上戲服打扮。", "pl": "dressed up", "plr": "ed", "der": [], "note": "", "tex": "We painted our faces and dressed up in costumes.", "posq": false, "cap": 0}], "texts": [{"id": "d1", "title": "Dialogue（At school）", "src": "課本 p.3–4", "lines": [{"sp": "Tom", "en": "What did you do yesterday, Rita?", "zh": "Rita，你昨天做了什麼？", "hl": true, "note": "What＋did＋主詞＋原形 do？問「做了什麼」。"}, {"sp": "Rita", "en": "I studied English in the morning and jogged after lunch. How about you?", "zh": "我早上讀英文，午餐後去慢跑。你呢？", "hl": true, "note": "studied（去 y 加 ied）、jogged（重複 g）。How about you? 你呢？"}, {"sp": "Rita", "en": "Did you do anything special?", "zh": "你有做什麼特別的事嗎？", "hl": false, "note": "Did＋主詞＋原形 do。anything special：形容詞放在 anything 後面。"}, {"sp": "Tom", "en": "Yes. I watched the movie Coco last night. It's a movie about death, and it reminded me of my grandfather.", "zh": "有。我昨晚看了電影《可可夜總會》。那是一部關於死亡的電影，它讓我想起我的爺爺。", "hl": true, "note": "last night 過去式；remind A of B 讓 A 想起 B。death 是名詞。"}, {"sp": "Rita", "en": "Your grandfather?", "zh": "你爺爺？", "hl": false, "note": ""}, {"sp": "Tom", "en": "Yes. A few years ago, my parents were very busy. My grandfather looked after me all the time.", "zh": "對。幾年前我爸媽很忙，我爺爺一直照顧我。", "hl": true, "note": "a few years ago 幾年前；parents 複數 → were。look after 照顧。"}, {"sp": "Rita", "en": "That was nice. You must really love him.", "zh": "那真好。你一定很愛他。", "hl": false, "note": "That → was；must＋原形 love。"}, {"sp": "Tom", "en": "Yes. But he passed away last year. I was very sad then.", "zh": "是的。但他去年過世了。我那時候很難過。", "hl": true, "note": "pass away 過世（passed away）。I → was。"}, {"sp": "Rita", "en": "I'm sorry.", "zh": "我很遺憾。", "hl": false, "note": ""}, {"sp": "Tom", "en": "It's OK. I'm not so sad about his death now. After all, I have so many happy memories with him.", "zh": "沒關係。我現在沒那麼難過了。畢竟我和他有好多快樂的回憶。", "hl": false, "note": "now 現在 → 用現在式 I'm。After all 畢竟。"}, {"sp": "Rita", "en": "What did you usually do with your grandfather?", "zh": "你以前通常和爺爺做什麼？", "hl": true, "note": ""}, {"sp": "Tom", "en": "We cooked breakfast together, and then he walked me to school. After school, I played basketball with him in the park.", "zh": "我們一起做早餐，然後他陪我走路去上學。放學後我和他在公園打籃球。", "hl": true, "note": "cooked、walked、played 都是規則動詞加 ed。played：母音＋y 直接加 ed。"}, {"sp": "Rita", "en": "That was so sweet!", "zh": "那真是太貼心了！", "hl": false, "note": ""}]}, {"id": "w1", "title": "Word Power（Festivals of the Dead Around the World）", "src": "課本 p.6", "lines": [{"sp": "Mexico", "en": "People paint their faces and dress up in costumes.", "zh": "人們在臉上彩繪並穿上戲服。", "hl": false, "note": ""}, {"sp": "Japan", "en": "People dance to music in a circle.", "zh": "人們隨著音樂圍成一圈跳舞。", "hl": false, "note": ""}, {"sp": "Russia", "en": "People plant flowers and paint eggs.", "zh": "人們種花並彩繪蛋。", "hl": false, "note": ""}, {"sp": "France", "en": "People place candles and flowers around the tomb.", "zh": "人們在墳墓周圍放蠟燭和花。", "hl": false, "note": "place 在這裡是動詞（放置）。"}]}, {"id": "r1", "title": "Reading〈The Day of the Dead〉", "src": "課本 p.7–8", "lines": [{"sp": "", "en": "People from different countries see death in different ways.", "zh": "不同國家的人用不同的方式看待死亡。", "hl": false, "note": ""}, {"sp": "", "en": "In Taiwan, we seldom talk about it even on Tomb Sweeping Day.", "zh": "在台灣，即使在清明節我們也很少談論它。", "hl": true, "note": "it＝death（課本第 3 題考 it 指什麼）。seldom 很少。"}, {"sp": "", "en": "In Mexico, people celebrate the Day of the Dead with joy.", "zh": "在墨西哥，人們歡欣地慶祝亡靈節。", "hl": false, "note": ""}, {"sp": "", "en": "During the festival, they also sweep tombs, but they remember their dead relatives in a lively way.", "zh": "節日期間他們也掃墓，但他們用充滿活力的方式紀念過世的親人。", "hl": true, "note": "dead 形容詞；lively 形容詞（字尾 -ly）。"}, {"sp": "", "en": "Two months ago, I visited my friend, Rosa, in Mexico.", "zh": "兩個月前，我去墨西哥拜訪我的朋友 Rosa。", "hl": true, "note": "two months ago → 過去式 visited。"}, {"sp": "", "en": "I was there for the Day of the Dead on November first and second.", "zh": "我在十一月一日和二日的亡靈節時在那裡。", "hl": false, "note": ""}, {"sp": "", "en": "We invited the ghosts back to our world.", "zh": "我們邀請鬼魂回到我們的世界。", "hl": false, "note": ""}, {"sp": "", "en": "We painted our faces and dressed up in costumes.", "zh": "我們在臉上彩繪並穿上戲服。", "hl": false, "note": ""}, {"sp": "", "en": "Later, we danced at a street party. It was so fun.", "zh": "之後，我們在街頭派對跳舞。真的好好玩。", "hl": false, "note": "danced：字尾 e 只加 d。"}, {"sp": "", "en": "Back at Rosa's house, there were flowers, candles, candy, and food on the table.", "zh": "回到 Rosa 家，桌上有花、蠟燭、糖果和食物。", "hl": true, "note": "There were＋複數（好幾樣東西）。"}, {"sp": "", "en": "Her family cooked a big meal for everyone and then shared touching stories of their dead relatives with me.", "zh": "她的家人為大家煮了一頓大餐，然後和我分享他們過世親人的感人故事。", "hl": false, "note": ""}, {"sp": "", "en": "For Mexicans, the Day of the Dead is all about love, not fear.", "zh": "對墨西哥人來說，亡靈節完全是關於愛，而不是恐懼。", "hl": true, "note": ""}]}], "grammar": [{"id": "was-were", "name": "be 動詞過去式 was／were", "icon": "🕰️", "c": ["PAST-BE", "THERE"], "intro": "七年級學的 am、is、are，講「以前」時只剩兩個：<b>was</b> 和 <b>were</b>。用哪一個，一樣看主詞。", "table": [["現在", "過去", "主詞"], ["am、is", "was", "I、he、she、it、單數名詞"], ["are", "were", "you、we、they、複數名詞"], ["There is", "There was", "後面接單數"], ["There are", "There were", "後面接複數"]], "flows": [{"title": "現在 → 過去", "steps": [{"tokens": ["I", "am", "tired", "now", "."], "hl": [1, 3], "note": "現在：I am"}, {"tokens": ["I", "was", "tired", "yesterday", "."], "hl": [1, 3], "note": "加了 yesterday → am 變成 <b>was</b>"}, {"tokens": ["My", "parents", "were", "busy", "."], "hl": [1, 2], "note": "parents 複數 → are 變成 <b>were</b>"}]}, {"title": "否定句、問句、簡答", "steps": [{"tokens": ["Tom", "was", "sad", "."], "hl": [1], "note": "直述句：找到 was"}, {"tokens": ["Tom", "wasn't", "sad", "."], "hl": [1], "note": "否定：was＋not＝<b>wasn't</b>（不用 did）"}, {"tokens": ["Was", "Tom", "sad", "?"], "hl": [0], "note": "問句：Was 搬到句首"}, {"tokens": ["Yes", ",", "he", "was", "."], "hl": [2, 3], "note": "簡答：Yes, he was.／No, he wasn't."}]}, {"title": "There was／were 看後面的東西", "steps": [{"tokens": ["There", "was", "a", "cake", "on", "the", "table", "."], "hl": [1, 3], "note": "a cake 一個 → was"}, {"tokens": ["There", "were", "many", "candles", "on", "the", "cake", "."], "hl": [1, 3], "note": "candles 複數 → were"}, {"tokens": ["There", "weren't", "any", "students", "at", "school", "."], "hl": [1, 3], "note": "否定：weren't＋any"}]}], "tutor": [{"say": "「My grandfather ___ a farmer ten years ago.」要填？", "ch": [{"t": "was", "ok": true, "re": "對！grandfather 一個人、ten years ago 過去 → was。"}, {"t": "were", "ok": false, "re": "were 給 you、we、they 和複數。爺爺只有一個人喔。"}, {"t": "is", "ok": false, "re": "ten years ago 是十年前，要用過去式。"}]}, {"say": "「___ you at home last night?」", "ch": [{"t": "Was", "ok": false, "re": "you 不管幾個人都配 were（就像現在式 you are）。"}, {"t": "Were", "ok": true, "re": "沒錯！you → were，搬到句首變 Were。"}, {"t": "Did", "ok": false, "re": "後面沒有一般動詞（at home 不是動作），所以用 be 動詞，不用 did。"}]}, {"say": "「There ___ many flowers and candles on the table.」", "ch": [{"t": "was", "ok": false, "re": "看後面：flowers and candles 是很多東西 → were。"}, {"t": "were", "ok": true, "re": "對！There＋be 要看後面的東西，複數 → were。"}]}]}, {"id": "past-reg", "name": "規則動詞過去式（-ed 四個規則）", "icon": "✏️", "c": ["PAST-REG"], "intro": "大部分動詞變過去式就是加 -ed，但<b>拼法有四種情況</b>。段考的「寫出過去式」幾乎都考這四種。", "table": [["規則", "怎麼變", "例子"], ["① 一般", "加 -ed", "watch → watched、play → played"], ["② 字尾 e", "只加 -d", "dance → danced、share → shared、place → placed"], ["③ 子音＋y", "去 y 加 -ied", "study → studied、cry → cried"], ["④ 短母音＋一個子音", "重複字尾再加 -ed", "jog → jogged、plan → planned、stop → stopped"]], "flows": [{"title": "四種拼法一次看", "steps": [{"tokens": ["watch", "→", "watched"], "hl": [2], "note": "① 一般動詞：直接加 ed"}, {"tokens": ["dance", "→", "danced"], "hl": [2], "note": "② 字尾已經有 e：只加 d"}, {"tokens": ["study", "→", "studied"], "hl": [2], "note": "③ 子音 d＋y：去 y 加 ied"}, {"tokens": ["jog", "→", "jogged"], "hl": [2], "note": "④ 短母音 o＋一個子音 g：重複 g 再加 ed"}]}, {"title": "🔴 母音＋y 不用去 y", "steps": [{"tokens": ["play", "→", "played"], "hl": [2], "note": "a 是母音，母音＋y → 直接加 ed"}, {"tokens": ["enjoy", "→", "enjoyed"], "hl": [2], "note": "o＋y 也是母音＋y → enjoyed"}, {"tokens": ["cry", "→", "cried"], "hl": [2], "note": "r 是子音，子音＋y → 去 y 加 ied"}]}, {"title": "-ed 的三種唸法", "steps": [{"tokens": ["watched", "/t/"], "hl": [1], "note": "字尾無聲子音（ch、k、p、s、sh）→ 唸 /t/"}, {"tokens": ["played", "/d/"], "hl": [1], "note": "字尾有聲音（母音、g、n、l…）→ 唸 /d/"}, {"tokens": ["planted", "/ɪd/"], "hl": [1], "note": "字尾 t 或 d → 多一個音節 /ɪd/"}]}], "tutor": [{"say": "plan 的過去式是？", "ch": [{"t": "planed", "ok": false, "re": "plan 是短母音 a＋一個子音 n → 要重複 n：planned。"}, {"t": "planned", "ok": true, "re": "對！短母音＋一個子音，重複字尾再加 ed。"}, {"t": "planted", "ok": false, "re": "planted 是 plant（種植）的過去式，不一樣的字喔。"}]}, {"say": "enjoy 的過去式是？", "ch": [{"t": "enjoied", "ok": false, "re": "o 是母音，母音＋y 直接加 ed。"}, {"t": "enjoyed", "ok": true, "re": "沒錯！只有「子音＋y」才去 y 加 ied。"}]}, {"say": "「Rita ___ English yesterday morning.」（study）", "ch": [{"t": "studyed", "ok": false, "re": "d 是子音，子音＋y 要去 y 加 ied。"}, {"t": "studied", "ok": true, "re": "完美！study → studied。"}, {"t": "studies", "ok": false, "re": "studies 是現在式（第三人稱單數），yesterday 要用過去式。"}]}]}, {"id": "did-q", "name": "Did 問句與否定 didn't", "icon": "❓", "c": ["PAST-Q", "PAST-NEG"], "intro": "一般動詞的過去式要變問句或否定，請 <b>did</b> 來幫忙。記一句口訣：<b>did 一出現，動詞回原形</b>（因為「過去」已經由 did 表示了）。", "table": [["句型", "怎麼變", "例句"], ["直述句", "動詞改過去式", "She <b>watched</b> TV."], ["否定句", "didn't＋原形", "She <b>didn't watch</b> TV."], ["問句", "Did＋主詞＋原形", "<b>Did</b> she <b>watch</b> TV?"], ["簡答", "Yes／No＋代名詞＋did／didn't", "Yes, she did.／No, she didn't."]], "flows": [{"title": "直述句 → 否定句", "steps": [{"tokens": ["Tom", "watched", "a", "movie", "."], "hl": [1], "note": "直述句：watched 是過去式"}, {"tokens": ["Tom", "didn't", "watch", "a", "movie", "."], "hl": [1, 2], "note": "否定：加 didn't，watched 變回<b>原形 watch</b>"}]}, {"title": "直述句 → 問句 → 簡答", "steps": [{"tokens": ["Tom", "watched", "a", "movie", "."], "hl": [1], "note": "直述句"}, {"tokens": ["Did", "Tom", "watch", "a", "movie", "?"], "hl": [0, 2], "note": "問句：Did 放句首，watched 變回<b>原形</b>"}, {"tokens": ["Yes", ",", "he", "did", "."], "hl": [2, 3], "note": "肯定簡答：Yes, he did."}, {"tokens": ["No", ",", "he", "didn't", "."], "hl": [3], "note": "否定簡答：No, he didn't."}]}, {"title": "🔴 be 動詞句不用 did", "steps": [{"tokens": ["Tom", "was", "sad", "."], "hl": [1], "note": "有 was／were 的句子"}, {"tokens": ["Was", "Tom", "sad", "?"], "hl": [0], "note": "問句直接把 Was 搬到前面（✗ Did Tom was sad?）"}]}], "tutor": [{"say": "「Did you ___ the movie last night?」", "ch": [{"t": "watched", "ok": false, "re": "🔴 did 已經表示過去了，後面要用原形。"}, {"t": "watch", "ok": true, "re": "對！did 一出現，動詞回原形。"}, {"t": "watches", "ok": false, "re": "watches 是現在式第三人稱單數，did 後面只能接原形。"}]}, {"say": "「Did Rita jog after lunch?」肯定簡答是？", "ch": [{"t": "Yes, she did.", "ok": true, "re": "完美！Rita → she，用 did 回答。"}, {"t": "Yes, she jogged.", "ok": false, "re": "簡答只用 did，不重複動詞。"}, {"t": "Yes, she was.", "ok": false, "re": "問句用 Did，回答也要用 did。"}]}, {"say": "「I ___ go to school yesterday. I was sick.」", "ch": [{"t": "don't", "ok": false, "re": "yesterday 是過去，要用 didn't。"}, {"t": "didn't", "ok": true, "re": "對！didn't＋原形 go。"}, {"t": "wasn't", "ok": false, "re": "後面有一般動詞 go，否定要用 didn't，不用 wasn't。"}]}]}, {"id": "wh-did", "name": "What did…? 問「做了什麼」", "icon": "🔍", "c": ["WH-PAST"], "intro": "想問「你昨天做了什麼」，就把<b>疑問詞放在 Did 問句前面</b>。回答時不用 Yes／No，直接說做了什麼，動詞改<b>過去式</b>。", "table": [["疑問詞", "問句", "回答"], ["What", "What did you do yesterday?", "I <b>studied</b> English."], ["Where", "Where did you go last weekend?", "I <b>went</b> to the park."], ["How", "How did you go to school?", "I <b>walked</b> there."], ["When", "When did she get married?", "She <b>got</b> married in 2017."]], "flows": [{"title": "Did 問句加上 What", "steps": [{"tokens": ["Did", "you", "study", "English", "?"], "hl": [0], "note": "Yes／No 問句"}, {"tokens": ["What", "did", "you", "do", "yesterday", "?"], "hl": [0, 1, 3], "note": "問「做了什麼」：What＋did＋主詞＋<b>do</b>（原形）"}, {"tokens": ["I", "studied", "English", "."], "hl": [1], "note": "回答：動詞改過去式 studied（不用 Yes／No）"}]}, {"title": "問「做了什麼」和「誰做的」不一樣", "steps": [{"tokens": ["What", "did", "Tom", "watch", "?"], "hl": [1, 3], "note": "問 Tom 看了什麼：要用 did＋原形"}, {"tokens": ["Who", "moved", "the", "sofa", "?"], "hl": [0, 1], "note": "🔴 問「誰」當主詞：Who＋過去式，不用 did"}, {"tokens": ["My", "father", "did", "."], "hl": [2], "note": "回答：My father did.（did 代替 moved）"}]}], "tutor": [{"say": "「What ___ you do last Sunday?」", "ch": [{"t": "are", "ok": false, "re": "後面有一般動詞 do，過去式要用 did。"}, {"t": "did", "ok": true, "re": "對！What＋did＋主詞＋原形。"}, {"t": "were", "ok": false, "re": "were 是 be 動詞，後面不能接 do。"}]}, {"say": "「What did Adam do yesterday?」最好的回答是？", "ch": [{"t": "Yes, he did.", "ok": false, "re": "What 問句不能用 Yes／No 回答。"}, {"t": "He painted the bedroom.", "ok": true, "re": "對！直接說做了什麼，動詞用過去式。"}, {"t": "He paints the bedroom.", "ok": false, "re": "yesterday 要用過去式 painted。"}]}, {"say": "「How ___ you go to the restaurant last Friday?」— 「I walked there.」", "ch": [{"t": "do", "ok": false, "re": "last Friday 是過去 → did。"}, {"t": "did", "ok": true, "re": "沒錯！How did…? 問「怎麼去的」。"}, {"t": "can", "ok": false, "re": "這裡問的是上週五怎麼去，要用過去式 did。"}]}]}, {"id": "time", "name": "時間副詞 yesterday／last／ago", "icon": "📅", "c": ["TIME"], "intro": "看到這些字，就知道句子要用<b>過去式</b>。三個字的用法不一樣，段考常考填空。", "table": [["字", "怎麼用", "例子"], ["yesterday", "單獨用，或＋早上／下午", "yesterday、yesterday afternoon"], ["last", "last＋時間單位", "last night、last week、last Sunday、last year"], ["ago", "一段時間＋ago", "two hours ago、five years ago、a few days ago"]], "flows": [{"title": "三種說法", "steps": [{"tokens": ["I", "saw", "him", "yesterday", "afternoon", "."], "hl": [3, 4], "note": "yesterday afternoon 昨天下午"}, {"tokens": ["I", "saw", "him", "last", "night", "."], "hl": [3, 4], "note": "🔴 昨晚是 last night（✗ yesterday night）"}, {"tokens": ["I", "saw", "him", "two", "days", "ago", "."], "hl": [3, 4, 5], "note": "兩天前：時間在前、ago 在後"}]}], "tutor": [{"say": "「My mom was a teacher five years ___.」", "ch": [{"t": "ago", "ok": true, "re": "對！一段時間＋ago。"}, {"t": "last", "ok": false, "re": "last 要放在時間前面：last year。"}, {"t": "yesterday", "ok": false, "re": "five years yesterday 不通喔。"}]}, {"say": "「昨晚」怎麼說？", "ch": [{"t": "yesterday night", "ok": false, "re": "英文習慣說 last night。"}, {"t": "last night", "ok": true, "re": "沒錯！"}, {"t": "night ago", "ok": false, "re": "ago 前面要有一段時間：two nights ago。"}]}]}], "questions": [{"id": "L1:mc01", "t": "mc", "set": "mc", "c": ["PAST-BE"], "q": "A: Where ___ you last night?<br>B: I was at my grandma's house.", "o": ["are", "was", "were", "did"], "a": 2, "x": "you 配 were；last night 過去。", "L": "L1"}, {"id": "L1:mc02", "t": "mc", "set": "mc", "c": ["PAST-Q"], "q": "A: ___ Tom jog in the park yesterday?<br>B: Yes, he did.", "o": ["Was", "Did", "Does", "Is"], "a": 1, "x": "後面有一般動詞 jog（原形）、回答用 did → Did。", "L": "L1"}, {"id": "L1:mc03", "t": "mc", "set": "mc", "c": ["PAST-NEG"], "q": "Rita didn't ___ TV last night. She studied English.", "o": ["watch", "watched", "watches", "watching"], "a": 0, "x": "didn't＋原形 watch。", "L": "L1"}, {"id": "L1:mc04", "t": "mc", "set": "mc", "c": ["WH-PAST"], "q": "A: ___ did you do last weekend?<br>B: I visited my relatives.", "o": ["What", "Who", "How", "Why"], "a": 0, "x": "回答「做了什麼」→ What。", "L": "L1"}, {"id": "L1:mc05", "t": "mc", "set": "mc", "c": ["TIME"], "q": "My grandpa passed away two years ___.", "o": ["last", "ago", "before", "yesterday"], "a": 1, "x": "一段時間＋ago。", "L": "L1"}, {"id": "L1:mc06", "t": "mc", "set": "mc", "c": ["THERE"], "q": "There ___ many candles and flowers on the table last night.", "o": ["is", "are", "was", "were"], "a": 3, "x": "last night 過去；candles and flowers 複數 → were。", "L": "L1"}, {"id": "L1:mc07", "t": "mc", "set": "mc", "c": ["PAST-REG"], "q": "We ___ breakfast together this morning.", "o": ["cook", "cooked", "cooks", "cooking"], "a": 1, "x": "this morning 已經過去（現在是下午）→ cooked。", "L": "L1"}, {"id": "L1:mc08", "t": "mc", "set": "mc", "c": ["V-POS"], "q": "The ___ of his dog made Ben very sad.", "o": ["dead", "die", "death", "died"], "a": 2, "x": "the ___ of → 名詞 death。", "L": "L1"}, {"id": "L1:mc09", "t": "mc", "set": "mc", "c": ["V-POS"], "q": "Henry's dog ___ last Saturday. He was very sad.", "o": ["death", "died", "dead", "dies"], "a": 1, "x": "空格是動詞、last Saturday 過去 → died。", "L": "L1"}, {"id": "L1:mc10", "t": "mc", "set": "mc", "c": ["PHR"], "q": "My parents were busy, so my grandma ___ me.", "o": ["passed away", "looked after", "dressed up", "reminded"], "a": 1, "x": "爸媽忙 → 奶奶照顧我 looked after。", "L": "L1"}, {"id": "L1:mc11", "t": "mc", "set": "mc", "c": ["PHR"], "q": "This photo ___ me ___ my happy days in Mexico.", "o": ["reminds; of", "looks; after", "passes; away", "dresses; up"], "a": 0, "x": "remind A of B 讓 A 想起 B。", "L": "L1"}, {"id": "L1:mc12", "t": "mc", "set": "mc", "c": ["PAST-BE", "PAST-Q"], "q": "A: Were you busy this morning?<br>B: Yes, I ___.", "o": ["did", "was", "were", "am"], "a": 1, "x": "Were you…? → 回答 I was。", "L": "L1"}, {"id": "L1:mc13", "t": "mc", "set": "mc", "c": ["PAST-Q"], "q": "A: Did your sister listen to music yesterday?<br>B: No, ___.", "o": ["she did", "she didn't", "my sister didn't", "she wasn't"], "a": 1, "x": "簡答用代名詞 she＋didn't。", "L": "L1"}, {"id": "L1:mc14", "t": "mc", "set": "mc", "c": ["WH-PAST"], "q": "A: Who moved the sofa?<br>B: My brother ___.", "o": ["moved", "was", "did", "does"], "a": 2, "x": "用 did 代替 moved：My brother did.", "L": "L1"}, {"id": "L1:mc15", "t": "mc", "set": "mc", "c": ["PAST-BE"], "q": "Timmy was at school yesterday morning, but I ___.", "o": ["didn't", "wasn't", "weren't", "doesn't"], "a": 1, "x": "前面是 was → 後面用 wasn't（I 配 was）。", "L": "L1"}, {"id": "L1:mc16", "t": "mc", "set": "mc", "c": ["V-ZH"], "q": "In Taiwan, we ___ talk about death. It's not a happy topic.", "o": ["seldom", "always", "together", "later"], "a"  were very delicious. Lucy's grandpa always made toys for her. He made everything from dolls to small cars. Lucy also liked his funny stories although (雖然) he always told the same <u>ones</u>. Now, Lucy lives with her parents in Taipei, but she misses Miaoli a lot. The place is full of sweet memories. She misses the egg noodles. She misses the same old stories. She misses her grandparents.） What do <u>ones</u> mean in the reading?", "o": ["Toys.", "Stories.", "Memories.", "Egg noodles."], "a": 1, "x": "the same ones＝the same stories（前面剛說 funny stories）。", "L": "L1", "tsec": "wk-read"}, {"id": "L1:wr2", "t": "mc", "set": "workbook", "c": ["V-ZH"], "q": "（短文〈Lucy's Memory of Miaoli〉：Many years ago, Lucy's parents were busy in Taipei. They didn't have time for Lucy, so she lived with her grandparents in Miaoli. Lucy loved Miaoli very much. Her grandma always looked after her and cooked her favorite food: egg noodles. They were very delicious. Lucy's grandpa always made toys for her. He made everything from dolls to small cars. Lucy also liked his funny stories although (雖然) he always told the same <u>ones</u>. Now, Lucy lives with her parents in Taipei, but she misses Miaoli a lot. The place is full of sweet memories. She misses the egg noodles. She misses the same old stories. She misses her grandparents.） What do we know from the reading?", "o": ["Lucy doesn't like Miaoli at first.", "Lucy doesn't live in Miaoli now.", "Lucy's grandparents are gone now.", "Lucy's grandma was a cook many years ago."], "a": 1, "x": "Now, Lucy lives with her parents in Taipei → 現在不住苗栗。", "L": "L1", "tsec": "wk-read"}], "reading": [{"id": "L1:r1", "title": "閱讀（一）Obon in Japan", "tree": "", "p": "Last summer, my family visited my aunt in Japan. We were there for Obon, a festival for dead relatives. On the first night, people placed lanterns (燈籠) in front of their houses. The lights showed the ghosts the way home. On the second night, we wore summer clothes and danced to music in a circle with many people. My aunt said, \"We don't feel sad at Obon. We remember our grandparents with music and food.\" On the last night, people put the lanterns on the river. <b>They</b> went away slowly. It was beautiful.", "qs": [{"id": "L1:r1a", "t": "mc", "set": "read", "c": ["V-ZH"], "q": "What is the reading mainly about?", "o": ["A trip to buy summer clothes.", "A festival for dead relatives in Japan.", "How to make lanterns.", "The writer's aunt's job."], "a": 1, "x": "全文在講日本的盂蘭盆節。", "L": "L1"}, {"id": "L1:r1b", "t": "mc", "set": "read", "c": ["V-ZH"], "q": "What did people do on the second night?", "o": ["They placed lanterns in front of houses.", "They put lanterns on the river.", "They danced in a circle.", "They cleaned the tombs."], "a": 2, "x": "On the second night… danced to music in a circle。", "L": "L1"}, {"id": "L1:r1c", "t": "mc", "set": "read", "c": ["V-ZH"], "q": "What does <b>They</b> in the last paragraph mean?", "o": ["The ghosts.", "The lanterns.", "The people.", "The houses."], "a": 1, "x": "放在河上、慢慢漂走的是燈籠。", "L": "L1"}]}, {"id": "L1:r2", "title": "閱讀（二）克漏字：Grandma's Birthday", "tree": "", "p": "Last Sunday was my grandma's 80th birthday. My parents and I __1__ up early and went to her house. My aunt cooked a big meal, and there __2__ many candles on the cake. After dinner, Grandma showed us some old photos. \"This was me sixty years __3__,\" she said. We all laughed. It was a sweet day.", "qs": [{"id": "L1:r2a", "t": "mc", "set": "read", "c": ["PAST-IRR"], "q": "第 1 格：", "o": ["get", "got", "gets", "getting"], "a": 1, "x": "Last Sunday 過去 → got。", "L": "L1"}, {"id": "L1:r2b", "t": "mc", "set": "read", "c": ["THERE"], "q": "第 2 格：", "o": ["was", "were", "is", "are"], "a": 1, "x": "many candles 複數、過去 → were。", "L": "L1"}, {"id": "L1:r2c", "t": "mc", "set": "read", "c": ["TIME"], "q": "第 3 格：", "o": ["last", "ago", "before", "yesterday"], "a": 1, "x": "sixty years ago。", "L": "L1"}]}, {"id": "L1:r3", "title": "閱讀（三）Ken's Diary", "tree": "", "p": "<b>Saturday, October 4</b><br>This morning I didn't go jogging because it rained. I stayed home and studied English. In the afternoon, my cousin Amy visited us. We played video games and watched a movie about a boy and his grandpa. It was very touching, and Amy cried at the end. At night, Mom cooked beef noodles for us. Yummy!", "qs": [{"id": "L1:r3a", "t": "mc", "set": "read", "c": ["PAST-NEG"], "q": "Why didn't Ken go jogging?", "o": ["He was sick.", "It rained.", "Amy visited him.", "He was busy."], "a": 1, "x": "because it rained。", "L": "L1"}, {"id": "L1:r3b", "t": "mc", "set": "read", "c": ["V-ZH"], "q": "Which is TRUE?", "o": ["Ken studied math in the morning.", "Amy cooked beef noodles.", "Amy cried at the end of the movie.", "Ken went to Amy's house."], "a": 2, "x": "Amy cried at the end。", "L": "L1"}]}], "teacher": [], "workbook": [{"id": "wk-mix", "title": "Read and Choose 綜合測驗", "page": "習作 p.2–3", "ids": ["L1:wm1", "L1:wm2", "L1:wm3", "L1:wm4", "L1:wm5", "L1:wm6", "L1:wm7", "L1:wm8", "L1:wm9", "L1:wm10"]}, {"id": "wk-fill", "title": "Part 1 Fill In 選字填空", "page": "習作 p.4", "ids": ["L1:wf1", "L1:wf2", "L1:wf3", "L1:wf4", "L1:wf5", "L1:wf6", "L1:wf7", "L1:wf8", "L1:wf9", "L1:wf10"]}, {"id": "wk-past", "title": "Part 2 寫出過去式", "page": "習作 p.5", "ids": ["L1:wp1", "L1:wp2", "L1:wp3", "L1:wp4", "L1:wp5", "L1:wp6"]}, {"id": "wk-time", "title": "Part 3 填 ago／yesterday／last", "page": "習作 p.5", "ids": ["L1:wt1", "L1:wt2", "L1:wt3"]}, {"id": "wk-write", "title": "Part 4 Read and Write 依提示作答", "page": "習作 p.5", "ids": ["L1:ww1", "L1:ww2", "L1:ww3", "L1:ww4"]}, {"id": "wk-choose", "title": "Part 5 Choose 文法選擇", "page": "習作 p.6", "ids": ["L1:wc1", "L1:wc2", "L1:wc3", "L1:wc4", "L1:wc5", "L1:wc6", "L1:wc7", "L1:wc8", "L1:wc9"]}, {"id": "wk-look", "title": "Part 6 Look and Write 看圖詳答", "page": "習作 p.7", "ids": ["L1:wl1", "L1:wl2", "L1:wl3", "L1:wl4", "L1:wl5"]}, {"id": "wk-read", "title": "Part 7 Read and Choose 閱讀", "page": "習作 p.8", "ids": ["L1:wr1", "L1:wr2"]}], "secNotes": {"對話：說過去的事": "這一課從頭到尾在講「昨天、以前」。動詞要連<b>過去式</b>一起背：study → studied（子音＋y 去 y 加 ied）、jog → jogged（短母音＋子音，重複字尾再加 ed）。was、were 是 be 動詞的過去式。", "節日與紀念": "Word Power 的字，用來描述各國怎麼紀念過世的親人：paint faces、dress up、dance in a circle、place candles。🔴 place 在這裡是<b>動詞</b>（放置），不是「地方」。", "閱讀：亡靈節": "讀懂〈The Day of the Dead〉用的字。🔴 <b>death</b> 是名詞（死亡）、<b>dead</b> 是形容詞（死的）、<b>die</b> 是動詞（死，過去式 died），段考最愛考這一組。", "片語": "片語要整組背：pass away 過世、look after 照顧、remind… of… 使某人想起、after all 畢竟、dress up 裝扮。"}, "tiles": [["🔤", "單字卡", "選類別→學習單字或拼字", "words"], ["📖", "課文", "對話＋閱讀・重點句", "text"], ["⭐", "課文重點句", "中翻英：先排字再打字", "do/best"], ["🧩", "文法", "was／were・過去式・Did 問句", "grammar"], ["🕰️", "過去式拼法", "-ed 四個規則＋發音", "g/past-reg"], ["❓", "Did 問句", "did 一出現，動詞回原形", "g/did-q"], ["📒", "習作（附答案）", "習作 p.2–9：看答案或直接作答", "workbook"], ["📄", "講義型練習", "片語・一字多義・句型…", "handout"], ["👂", "聽力", "辨識句意・問答・言談理解", "listen"], ["✅", "本課小考", "16 題混合", "quiz"]]}, {"id": "L2", "short": "Lesson 2", "title": "Lesson 2　I Read a Special Book Last Week", "sub": "課本 p.17–32｜奈及利亞女孩的故事｜童婚", "scope": ["L2"], "words": [{"sec": "對話：一本特別的書", "w": "math", "pos": "n.", "zh": "數學", "ex": "We have a math test today.", "exz": "我們今天有數學考試。", "pl": "", "plr": "none", "der": [], "note": "", "tex": "Did you study for the math test?", "posq": true, "cap": 5}, {"sec": "對話：一本特別的書", "w": "test", "pos": "n.", "zh": "考試；測驗", "ex": "Did you pass the English test?", "exz": "你英文考試及格了嗎？", "pl": "", "plr": "none", "der": [], "note": "", "tex": "Did you study for the math test?", "posq": true, "cap": 1}, {"sec": "對話：一本特別的書", "w": "guess", "pos": "v.", "zh": "猜；猜測", "ex": "Guess what? I won the game!", "exz": "你猜怎麼著？我贏了比賽！", "pl": "guessed", "plr": "ed", "der": ["Guess what? 你猜怎麼著？（要講新鮮事）"], "note": "", "tex": "But guess what? I read a special book.", "posq": true, "cap": 6}, {"sec": "對話：一本特別的書", "w": "well", "pos": "int.", "zh": "嗯；那麼（發語詞）", "ex": "Well, it's a long story.", "exz": "嗯，說來話長。", "pl": "", "plr": "none", "der": ["well adv. 很好地"], "note": "", "tex": "Well {"sec": "片語", "w": "not… anymore", "pos": "phr.", "zh": "不再", "ex": "She could not go to school anymore.", "exz": "她不能再去上學了。", "pl": "", "plr": "none", "der": [], "note": "anymore 放句尾", "tex": "She could not go to school anymore.", "posq": false, "cap": 0}, {"sec": "片語", "w": "take action", "pos": "phr.", "zh": "採取行動", "ex": "Let's take action now!", "exz": "我們現在就採取行動！", "pl": "took action", "plr": "irr", "der": [], "note": "", "tex": "Let's take action now!", "posq": false, "cap": 3}], "texts": [{"id": "d1", "title": "Dialogue（In the classroom）", "src": "課本 p.19–20", "lines": [{"sp": "Jeff", "en": "Hey Nina. Did you study for the math test?", "zh": "嘿 Nina。你有準備數學考試嗎？", "hl": false, "note": ""}, {"sp": "Nina", "en": "No, I didn't. But guess what? I read a special book.", "zh": "沒有。但你猜怎麼著？我讀了一本特別的書。", "hl": true, "note": "read 過去式拼法一樣，唸 /rɛd/。"}, {"sp": "Jeff", "en": "Oh? What is special about it?", "zh": "喔？它哪裡特別？", "hl": false, "note": ""}, {"sp": "Nina", "en": "Well, it's about a girl from Nigeria. She was only 12 years old, but she got married to a 65-year-old man.", "zh": "嗯，它是關於一個來自奈及利亞的女孩。她才 12 歲，卻嫁給一個 65 歲的男人。", "hl": true, "note": "get married to＋人；65-year-old 當形容詞，year 不加 s。"}, {"sp": "Jeff", "en": "What! Why did she do that? She was so young!", "zh": "什麼！她為什麼要那樣做？她那麼年輕！", "hl": true, "note": "Why＋did＋主詞＋原形 do。"}, {"sp": "Nina", "en": "She had no choice. Her father sold her to the old man because her family was very poor.", "zh": "她別無選擇。她爸爸把她賣給那個老人，因為她家很窮。", "hl": true, "note": "sell → sold；because＋原因。"}, {"sp": "Nina", "en": "She could not go to school anymore.", "zh": "她不能再去上學了。", "hl": true, "note": "not… anymore 不再。can → could。"}, {"sp": "Jeff", "en": "That's so sad. What happened next?", "zh": "好悲傷。後來怎麼了？", "hl": false, "note": ""}, {"sp": "Nina", "en": "Her husband often hit her. She couldn't stand it, so she ran away.", "zh": "她丈夫常打她。她受不了，所以逃走了。", "hl": true, "note": "hit 過去式同形；stand 忍受；so＋結果；run → ran。"}, {"sp": "Jeff", "en": "That's terrible! Did her husband ever find her?", "zh": "太糟了！她丈夫有找到過她嗎？", "hl": false, "note": ""}, {"sp": "Nina", "en": "I don't know. I'm still reading it.", "zh": "我不知道。我還在讀。", "hl": false, "note": ""}, {"sp": "Jeff", "en": "I'm really curious about the ending of this story. Please finish it and tell me.", "zh": "我真的很好奇這個故事的結局。請讀完再告訴我。", "hl": false, "note": "be curious about…"}, {"sp": "Nina", "en": "Sure!", "zh": "當然！", "hl": false, "note": ""}]}, {"id": "w1", "title": "Word Power（How Are These Kids Different From Each Other in Their Lives?）", "src": "課本 p.22", "lines": [{"sp": "A／B", "en": "One boy makes shoes, and another boy buys a pair of shoes.", "zh": "一個男孩做鞋子，另一個男孩買一雙鞋子。", "hl": false, "note": ""}, {"sp": "C／D", "en": "One girl gets married, and other kids go to school.", "zh": "一個女孩結婚了，其他孩子去上學。", "hl": false, "note": ""}, {"sp": "E／F", "en": "One girl picks cacao fruit, and another girl eats chocolate.", "zh": "一個女孩摘可可果實，另一個女孩吃巧克力。", "hl": false, "note": ""}, {"sp": "G／H", "en": "One boy breaks his arm in a war, and another boy plays computer games.", "zh": "一個男孩在戰爭中斷了手臂，另一個男孩在打電動。", "hl": false, "note": ""}]}, {"id": "r1", "title": "Reading〈Child Marriage〉", "src": "課本 p.23", "lines": [{"sp": "", "en": "Most people in Taiwan can choose their husband or wife, but people in some countries cannot.", "zh": "台灣大部分的人可以選擇自己的丈夫或妻子，但有些國家的人不行。", "hl": true, "note": ""}, {"sp": "", "en": "Millions of children under the age of eighteen get married without a choice.", "zh": "數百萬名十八歲以下的孩子在沒有選擇的情況下結婚。", "hl": true, "note": "under the age of eighteen 十八歲以下；without 沒有。"}, {"sp": "", "en": "Here are two stories.", "zh": "這裡有兩個故事。", "hl": false, "note": ""}, {"sp": "", "en": "A ten-year-old girl from Niger, Geeta, got married to a thirty-year-old man.", "zh": "一個來自尼日的十歲女孩 Geeta，嫁給了一個三十歲的男人。", "hl": false, "note": ""}, {"sp": "", "en": "Geeta had her first baby and became a mother at eleven.", "zh": "Geeta 生了第一個孩子，十一歲就成為母親。", "hl": true, "note": "have → had；become → became。"}, {"sp": "", "en": "She could not go to school because her baby needed her.", "zh": "她不能上學，因為她的寶寶需要她。", "hl": true, "note": ""}, {"sp": "", "en": "Tanya, from Yemen, got married to a man at eleven because he gave her father money.", "zh": "來自葉門的 Tanya 十一歲就嫁人了，因為那個男人給了她父親錢。", "hl": false, "note": "give → gave。"}, {"sp": "", "en": "She cried and said \"NO!\", but nobody helped her.", "zh": "她哭著說「不！」，但沒有人幫她。", "hl": true, "note": ""}, {"sp": "", "en": "Her husband hit her very often. She was scared and could not sleep at night.", "zh": "她丈夫很常打她。她很害怕，晚上睡不著。", "hl": false, "note": ""}, {"sp": "", "en": "The marriage was like a nightmare.", "zh": "這段婚姻就像一場惡夢。", "hl": false, "note": "Using Context Clues：從前一句推測 nightmare＝很糟的經驗。"}, {"sp": "", "en": "Child marriage is happening in many countries.", "zh": "童婚正在許多國家發生。", "hl": false, "note": ""}, {"sp": "", "en": "Children like Geeta and Tanya need our help. Let's take action now!", "zh": "像 Geeta 和 Tanya 這樣的孩子需要我們的幫助。我們現在就採取行動吧！", "hl": true, "note": ""}]}], "grammar": [{"id": "past-irr", "name": "不規則動詞過去式（課本 p.27 表）", "icon": "📋", "c": ["PAST-IRR"], "intro": "不規則動詞沒有規則可以推，只能背。但可以<b>照長相分組</b>，一組一組背會快很多。", "table": [["長相", "例子"], ["母音換掉", "come → came、run → ran、swim → swam、sing → sang、win → won、get → got、sit → sat"], ["-ought／-aught", "buy → bought、bring → brought、fight → fought、catch → caught"], ["-ew", "know → knew、fly → flew、draw → drew、throw → threw"], ["-o-e", "choose → chose、break → broke、write → wrote、ride → rode、wear → wore"], ["-d → -t", "build → built、sleep → slept、meet → met、mean → meant、feel → felt"], ["完全不像", "go → went、be → was／were、have → had、eat → ate、see → saw、sell → sold、tell → told、take → took"], ["原形＝過去式", "hit、hurt、let、put、read（唸 /rɛd/）"]], "flows": [{"title": "課文裡的不規則動詞", "steps": [{"tokens": ["Her", "father", "sells", "her", "."], "hl": [2], "note": "現在式：sells"}, {"tokens": ["Her", "father", "sold", "her", "."], "hl": [2], "note": "過去式：sell → <b>sold</b>（不是 selled）"}, {"tokens": ["Did", "her", "father", "sell", "her", "?"], "hl": [0, 3], "note": "問句一樣用 did＋<b>原形 sell</b>"}]}, {"title": "🔴 原形和過去式同形", "steps": [{"tokens": ["He", "often", "hits", "her", "."], "hl": [2], "note": "現在式第三人稱單數：hits"}, {"tokens": ["He", "often", "hit", "her", "."], "hl": [2], "note": "過去式：hit（看到沒有 s 就知道是過去）"}, {"tokens": ["I", "read", "a", "special", "book", "last", "week", "."], "hl": [1, 5, 6], "note": "read 過去式拼法一樣，靠 last week 判斷，唸 /rɛd/"}]}], "tutor": [{"say": "buy 的過去式是？", "ch": [{"t": "buyed", "ok": false, "re": "buy 是不規則動詞，-ought 那一組。"}, {"t": "bought", "ok": true, "re": "對！buy → bought，和 bring → brought 同一組。"}, {"t": "brought", "ok": false, "re": "brought 是 bring（帶來）的過去式。"}]}, {"say": "「She ___ a mother at eleven.」（become）", "ch": [{"t": "becomed", "ok": false, "re": "become 不規則。"}, {"t": "became", "ok": true, "re": "沒錯！come → came，所以 become → became。"}]}, {"say": "「He ___ her very often last year.」（hit）", "ch": [{"t": "hitted", "ok": false, "re": "hit 的過去式還是 hit。"}, {"t": "hit", "ok": true, "re": "對！hit、put、let、hurt 原形和過去式同形。"}, {"t": "hits", "ok": false, "re": "last year 要過去式。"}]}]}, {"id": "why", "name": "Why…? Because…", "icon": "❔", "c": ["WHY"], "intro": "問原因用 <b>Why</b>，回答用 <b>Because＋完整句子</b>。Why 後面的結構和其他疑問詞一樣：Why＋did／was＋主詞…？", "table": [["問句", "回答"], ["Why did she take a bus to school yesterday?", "Because her sister broke her bike."], ["Why didn't she go to the party last weekend?", "Because she was sick."], ["Why were you late?", "Because I missed the bus."]], "flows": [{"title": "Did 問句加上 Why", "steps": [{"tokens": ["Did", "she", "take", "a", "bus", "?"], "hl": [0, 2], "note": "Yes／No 問句：Did＋主詞＋原形"}, {"tokens": ["Why", "did", "she", "take", "a", "bus", "?"], "hl": [0], "note": "問原因：句首加 Why"}, {"tokens": ["Because", "her", "sister", "broke", "her", "bike", "."], "hl": [0, 3], "note": "回答：Because＋完整句子（broke 過去式）"}]}, {"title": "Why didn't…?", "steps": [{"tokens": ["Why", "didn't", "Terry", "come", "to", "work", "?"], "hl": [1, 3], "note": "Why didn't＋主詞＋原形：為什麼沒有…？"}, {"tokens": ["He", "didn't", "come", "because", "his", "grandfather", "was", "sick", "."], "hl": [3], "note": "回答時可以說完整句：…because＋原因"}]}], "tutor": [{"say": "「___ did you cry?」—「Because the movie was sad.」", "ch": [{"t": "What", "ok": false, "re": "回答用 Because → 問原因 Why。"}, {"t": "Why", "ok": true, "re": "對！Why 和 Because 是一組。"}, {"t": "How", "ok": false, "re": "How 問方法或狀況，這裡在問原因。"}]}, {"say": "「Why didn't Sara go to the party?」最好的回答？", "ch": [{"t": "Yes, she didn't.", "ok": false, "re": "Why 問句不能用 Yes／No 回答。"}, {"t": "Because she was too busy.", "ok": true, "re": "完美！Because＋完整句子。"}, {"t": "So she was busy.", "ok": false, "re": "回答原因要用 Because，不是 So。"}]}]}, {"id": "because-so", "name": "because 和 so：同一件事的兩種寫法", "icon": "🔗", "c": ["CONJ"], "intro": "中文說「<b>因為</b>下雨，<b>所以</b>我沒出門」，英文<b>只能選一個</b>：because 接原因，so 接結果。另外 <b>because of</b> 後面接名詞（段考考過）。", "table": [["寫法", "例句"], ["Because＋原因, 結果.", "Because Amy won the game, she was very happy."], ["結果＋because＋原因.", "Amy was very happy because she won the game."], ["原因, so＋結果.", "Amy won the game, so she was very happy."], ["because of＋名詞", "I stayed home because of the heavy rain."]], "flows": [{"title": "同一件事三種寫法", "steps": [{"tokens": ["Because", "Leo", "was", "busy", ",", "he", "didn't", "feed", "his", "cat", "."], "hl": [0, 4], "note": "Because 放句首：原因後面要加逗號"}, {"tokens": ["Leo", "didn't", "feed", "his", "cat", "because", "he", "was", "busy", "."], "hl": [5], "note": "because 放中間：不用逗號"}, {"tokens": ["Leo", "was", "busy", ",", "so", "he", "didn't", "feed", "his", "cat", "."], "hl": [3, 4], "note": "so 接結果：前面加逗號"}]}, {"title": "🔴 because 和 because of", "steps": [{"tokens": ["I", "stayed", "home", "because", "it", "rained", "."], "hl": [3, 4, 5], "note": "because＋<b>句子</b>（it rained）"}, {"tokens": ["I", "stayed", "home", "because", "of", "the", "rain", "."], "hl": [3, 4, 6], "note": "because of＋<b>名詞</b>（the rain）"}]}], "tutor": [{"say": "「I was very hungry, ___ I ate some bread.」", "ch": [{"t": "because", "ok": false, "re": "後面「吃麵包」是結果，不是原因。"}, {"t": "so", "ok": true, "re": "對！餓是原因，吃麵包是結果 → so。"}, {"t": "but", "ok": false, "re": "前後不是相反的意思。"}]}, {"say": "「Because it rained, so I stayed home.」對嗎？", "ch": [{"t": "對", "ok": false, "re": "🔴 because 和 so 不能同時用，刪掉其中一個。"}, {"t": "不對", "ok": true, "re": "沒錯！只能寫 Because it rained, I stayed home. 或 It rained, so I stayed home."}]}, {"say": "「Tom didn't come ___ the heavy snow.」", "ch": [{"t": "because", "ok": false, "re": "後面 the heavy snow 是名詞，要用 because of。"}, {"t": "because of", "ok": true, "re": "對！because of＋名詞。"}, {"t": "so", "ok": false, "re": "後面是原因不是結果。"}]}]}], "questions": [{"id": "L2:mc01", "t": "mc", "set": "mc", "c": ["PAST-IRR"], "q": "Her father ___ her to an old man last year.", "o": ["sell", "sells", "sold", "selled"], "a": 2, "x": "sell → sold。", "L": "L2"}, {"id": "L2:mc02", "t": "mc", "set": "mc", "c": ["WHY"], "q": "A: ___ did you go to bed early last night?<br>B: Because I was tired.", "o": ["What", "Why", "How", "Who"], "a": 1, "x": "回答 Because → Why。", "L": "L2"}, {"id": "L2:mc03", "t": "mc", "set": "mc", "c": ["CONJ"], "q": "She couldn't stand it, ___ she ran away.", "o": ["because", "so", "or", "because of"], "a": 1, "x": "受不了（原因）→ 逃走（結果）→ so。", "L": "L2"}, {"id": "L2:mc04", "t": "mc", "set": "mc", "c": ["CONJ"], "q": "Geeta could not go to school ___ her baby needed her.", "o": ["so", "because", "but", "and"], "a": 1, "x": "後面是原因 → because。", "L": "L2"}, {"id": "L2:mc05", "t": "mc", "set": "mc", "c": ["CONJ"], "q": "We didn't go hiking ___ the heavy rain.", "o": ["because", "so", "because of", "and"], "a": 2, "x": "the heavy rain 名詞 → because of。", "L": "L2"}, {"id": "L2:mc06", "t": "mc", "set": "mc", "c": ["PAST-IRR"], "q": "Tanya ___ and said \"NO!\", but nobody helped her.", "o": ["cry", "cried", "cries", "cryed"], "a": 1, "x": "子音＋y → cried。", "L": "L2"}, {"id": "L2:mc07", "t": "mc", "set": "mc", "c": ["PHR"], "q": "She was only twelve, but she ___ to a 65-year-old man.", "o": ["got married", "took action", "passed away", "ran away"], Pakistan, there was a group of people, the Taliban. They didn't care about women's education. \"Women should be cooking at home and having babies. They shouldn't go to school,\" the Taliban said. They then stopped women from going to school ever again. Malala didn't like this, so she did something about it. She wrote about her life and women's troubles in Pakistan. She told the world her story, and the world listened. The Taliban was very angry. They shot her, but she didn't die. Two years later, she won the Nobel Peace Prize. What an amazing woman!） What did the Taliban say about women?", "o": ["They should have an education.", "They should cook for their family.", "They should tell their troubles to the world.", "They should write something about their life."], "a": 1, "x": "Women should be cooking at home…", "L": "L2", "tsec": "wk-read"}, {"id": "L2:wr2", "t": "mc", "set": "workbook", "c": ["V-ZH"], "q": "（短文：There is a special woman from Pakistan, and her name is Malala Yousafzai. In her childhood, she loved school and always enjoyed her classes. At that same time in Pakistan, there was a group of people, the Taliban. They didn't care about women's education. \"Women should be cooking at home and having babies. They shouldn't go to school,\" the Taliban said. They then stopped women from going to school ever again. Malala didn't like this, so she did something about it. She wrote about her life and women's troubles in Pakistan. She told the world her story, and the world listened. The Taliban was very angry. They shot her, but she didn't die. Two years later, she won the Nobel Peace Prize. What an amazing woman!） What do we know about Malala?", "o": ["She joined the Taliban.", "The Taliban shot her family.", "She didn't care about women's education.", "She almost died because the Taliban shot her."], "a": 3, "x": "They shot her, but she didn't die → 差點死掉。", "L": "L2", "tsec": "wk-read"}, {"id": "L2:wr3", "t": "mc", "set": "workbook", "c": ["V-ZH"], "q": "（短文：There is a special woman from Pakistan, and her name is Malala Yousafzai. In her childhood, she loved school and always enjoyed her classes. At that same time in Pakistan, there was a group of people, the Taliban. They didn't care about women's education. \"Women should be cooking at home and having babies. They shouldn't go to school,\" the Taliban said. They then stopped women from going to school ever again. Malala didn't like this, so she did something about it. She wrote about her life and women's troubles in Pakistan. She told the world her story, and the world listened. The Taliban was very angry. They shot her, but she didn't die. Two years later, she won the Nobel Peace Prize. What an amazing woman!） What could the title of this reading be?", "o": ["The Taliban.", "Women Should Be at Home.", "A Special Woman in Pakistan.", "Write Something, and Become Famous."], "a": 2, "x": "全文在介紹 Malala 這位特別的女性。", "L": "L2", "tsec": "wk-read"}], "reading": [{"id": "L2:r1", "title": "閱讀（一）Kids Around the World", "tree": "", "p": "Sam is 11. He lives in Canada. Every morning he takes a bus to school, and after school he plays soccer with his friends. Ali is 11, too, but his life is very different. His family is poor, so he works in a shoe factory ten hours a day. He makes shoes, but he doesn't have a pair of his own. Last year, a teacher from a city school visited the factory. <b>She</b> started a night class for the kids there. Now Ali studies math and English after work. \"I want to be a teacher, too,\" he says.", "qs": [{"id": "L2:r1a", "t": "mc", "set": "read", "c": ["CONJ"], "q": "Why does Ali work in a factory?", "o": ["He likes making shoes.", "His family is poor.", "He doesn't like school.", "His teacher works there."], "a": 1, "x": "His family is poor, so he works…", "L": "L2"}, {"id": "L2:r1b", "t": "mc", "set": "read", "c": ["V-ZH"], "q": "What does <b>She</b> mean?", "o": ["Ali's mother.", "A teacher from a city school.", "Sam's friend.", "A factory worker."], "a": 1, "x": "前一句提到 a teacher from a city school。", "L": "L2"}, {"id": "L2:r1c", "t": "mc", "set": "read", "c": ["V-ZH"], "q": "Which is TRUE?", "o": ["Sam works in a factory.", "Ali has many pairs of shoes.", "Ali goes to a night class now.", "Sam and Ali live in the same country."], "a": 2, "x": "Now Ali studies math and English after work（夜間課）。", "L": "L2"}]}, {"id": "L2:r2", "title": "閱讀（二）克漏字：A Bad Day", "tree": "", "p": "Yesterday was a bad day for Kevin. He got up late __1__ his alarm clock didn't ring. He ran to the bus stop, but the bus __2__ already left. In class, he couldn't find his homework, __3__ the teacher was angry. After school, it rained, and he didn't have an umbrella. \"What a terrible day!\" he said.", "qs": [{"id": "L2:r2a", "t": "mc", "set": "read", "c": ["CONJ"], "q": "第 1 格：", "o": ["so", "because", "but", "or"], "a": 1, "x": "鬧鐘沒響是原因 → because。", "L": "L2"}, {"id": "L2:r2b", "t": "mc", "set": "read", "c": ["PAST-IRR"], "q": "第 2 格：", "o": ["has", "had", "have", "having"], "a": 1, "x": "had already left 已經開走了（過去）。", "L": "L2"}, {"id": "L2:r2c", "t": "mc", "set": "read", "c": ["CONJ"], "q": "第 3 格：", "o": ["because", "so", "or", "because of"], "a": 1, "x": "找不到作業 → 老師生氣（結果）→ so。", "L": "L2"}]}], "teacher": [], "workbook": [{"id": "wk-fill", "title": "Part 1 Fill In 選字填空", "page": "習作 p.9", "ids": ["L2:wf1", "L2:wf2", "L2:wf3", "L2:wf4", "L2:wf5", "L2:wf6", "L2:wf7", "L2:wf8"]}, {"id": "wk-hint", "title": "Part 2 Fill In 依字首字尾填字", "page": "習作 p.10", "ids": ["L2:wh1", "L2:wh2", "L2:wh3", "L2:wh4", "L2:wh5", "L2:wh6", "L2:wh7", "L2:wh8"]}, {"id": "wk-past", "title": "Part 3 寫出過去式（不規則）", "page": "習作 p.10", "ids": ["L2:wp1", "L2:wp2", "L2:wp3", "L2:wp4", "L2:wp5", "L2:wp6", "L2:wp7", "L2:wp8", "L2:wp9"]}, {"id": "wk-so", "title": "Part 4 填 because 或 so", "page": "習作 p.11", "ids": ["L2:ws1", "L2:ws2", "L2:ws3", "L2:ws4", "L2:ws5"]}, {"id": "wk-choose", "title": "Part 5 Read and Choose 文法選擇", "page": "習作 p.11", "ids": ["L2:wc1", "L2:wc2", "L2:wc3"]}, {"id": "wk-look", "title": "Part 6 Look, Read, and Write 看圖作答", "page": "習作 p.12", "ids": ["L2:wl1", "L2:wl2", "L2:wl3", "L2:wl4"]}, {"id": "wk-read", "title": "Part 7 Read and Choose 閱讀〈Malala〉", "page": "習作 p.13", "ids": ["L2:wr1", "L2:wr2", "L2:wr3"]}], "secNotes": {"對話：一本特別的書": "這一課的動詞很多是<b>不規則</b>的：sell → sold、hit → hit、read → read、have → had、can → could、run → ran。why（為什麼）和 because（因為）是一組。", "不同孩子的生活": "Word Power 用兩兩對照的圖片比較孩子的生活：make shoes ↔ buy a pair of shoes、pick cacao fruit ↔ eat chocolate。buy → bought、break → broke 要背。", "閱讀：童婚": "〈Child Marriage〉的字。choose → chose、become → became、give → gave、cry → cried。children 是 child 的複數；nobody＝沒有人（後面動詞用單數）。", "片語": "get married 結婚（got married）、not… anymore 不再、take action 採取行動（took action）、at the age of 在……歲時。"}, "tiles": [["🔤", "單字卡", "選類別→學習單字或拼字", "words"], ["📖", "課文", "對話＋閱讀・重點句", "text"], ["⭐", "課文重點句", "中翻英：先排字再打字", "do/best"], ["🧩", "文法", "不規則過去式・Why・because／so", "grammar"], ["📋", "不規則動詞表", "課本 p.27 整張表分組背", "g/past-irr"], ["🔗", "because／so", "原因和結果，一句只能用一個", "g/because-so"], ["📒", "習作（附答案）", "習作 p.9–13：看答案或直接作答", "workbook"], ["📄", "講義型練習", "片語・一字多義・句型…", "handout"], ["👂", "聽力", "辨識句意・問答・言談理解", "listen"], ["✅", "本課小考", "16 題混合", "quiz"]]}, {"id": "R1", "short": "Review 1", "title": "Review 1　總複習＋Reading Corner 1", "sub": "課本 p.33–38｜現在式 vs 過去式・because／so・圖表閱讀・Dear Diary", "scope": ["L1", "L2", "R1"], "words": [{"sec": "Review 與 Reading Corner", "w": "finally", "pos": "adv.", "zh": "最終地；終於", "ex": "Emma and Irene finally arrived.", "exz": "Emma 和 Irene 終於到了。", "pl": "", "plr": "none", "der": [], "note": "", "tex": "Emma and Irene finally arrived…", "posq": true, "cap": 22}, {"sec": "Review 與 Reading Corner", "w": "arrive", "pos": "v.", "zh": "抵達", "ex": "We arrived at the restaurant at noon.", "exz": "我們中午抵達餐廳。", "pl": "arrived", "plr": "ed", "der": ["arrive at＋小地點", "arrive in＋大地方"], "note": "", "tex": "", "posq": true, "cap": 8}, {"sec": "Review 與 Reading Corner", "w": "miss", "pos": "v.", "zh": "錯過；想念", "ex": "Emma missed the bus.", "exz": "Emma 錯過了公車。", "pl": "missed", "plr": "ed", "der": ["miss the bus 錯過公車", "miss someone 想念某人"], "note": "", "tex": "Emma was late because she missed the bus.", "posq": true, "cap": 11}, {"sec": "Review 與 Reading Corner", "w": "get lost", "pos": "phr.", "zh": "迷路", "ex": "Irene got lost on her way.", "exz": "Irene 在路上迷路了。", "pl": "got lost", "plr": "irr", "der": [], "note": "", "tex": "Irene was late because she got lost.", "posq": false, "cap": 1}, {"sec": "Review 與 Reading Corner", "w": "diary", "pos": "n.", "zh": "日記", "ex": "I write in my diary every night.", "exz": "我每晚寫日記。", "pl": "", "plr": "none", "der": ["Dear Diary, 日記開頭"], "note": "", "tex": "", "posq": true, "cap": 8}, {"sec": "Review 與 Reading Corner", "w": "mood", "pos": "n.", "zh": "心情", "ex": "He was in a bad mood.", "exz": "他心情不好。", "pl": "", "plr": "none", "der": ["in a good／bad mood"], "note": "", "tex": "He was in a bad mood.", "posq": true, "cap": 0}, {"sec": "Review 與 Reading Corner", "w": "worried", "pos": "adj.", "zh": "擔心的", "ex": "I am worried about the test.", "exz": "我很擔心考試。", "pl": "", "plr": "none", "der": ["be worried about…"], "note": "", "tex": "", "posq": true, "cap": 12}, {"sec": "Review 與 Reading Corner", "w": "note", "pos": "n.", "zh": "筆記", "ex": "Can you share your notes with me?", "exz": "你可以跟我分享筆記嗎？", "pl": "", "plr": "none", "der": [], "note": "", "tex": "", "posq": true, "cap": 0}, {"sec": "Review 與 Reading Corner", "w": "surprise", "pos": "n.", "zh": "驚喜", "ex": "The cake was a surprise.", "exz": "那個蛋糕是個驚喜。", "pl": "", "plr": "none", "der": [], "note": "", "tex": "It was a surprise from Emma and Irene.", "posq": true, "cap": 9}, {"sec": "Review 與 Reading Corner", "w": "waiter", "pos": "n.", "zh": "服務生", "ex": "The waiter brought a cake.", "exz": "服務生端來一個蛋糕。", "pl": "", "plr": "none", "der": [], "note": "", "tex": "Later, the waiter brought a cake to our table.", "posq": true, "cap": 0}, {"sec": "Review 與 Reading Corner", "w": "bring", "pos": "v.", "zh": "帶來", "ex": "He brought gifts for me.", "exz": "他帶禮物給我。", "pl": "brought", "plr": "irr", "der": ["bring ↔ take"], "note": "", "tex": "", "posq": true, "cap": 36}, {"sec": "Review 與 Reading Corner", "w": "wait", "pos": "v.", "zh": "等", "ex": "I waited for them for an hour.", "exz": "我等了他們一個小時。", "pl": "waited", "plr": "ed", "der": ["wait for… 等待…"], "note": "", "tex": "I waited for them in front of the restaurant for almost an hour.", "posq": true, "cap": 16}], "texts": [{"id": "v1", "title": "Build Your Vocabulary（人的一生）", "src": "課本 p.33", "lines": [{"sp": "", "en": "People study at school, make friends, and share everything with each other.", "zh": "人們在學校讀書、交朋友，彼此分享一切。", "hl": false, "note": ""}, {"sp": "", "en": "People have sweet memories of life and work.", "zh": "人們擁有生活和工作的甜蜜回憶。", "hl": false, "note": ""}, {"sp": "", "en": "People fall in love with someone, get married, and start a new family.", "zh": "人們愛上某人、結婚，並組成新家庭。", "hl": false, "note": ""}, {"sp": "", "en": "People finally pass away.", "zh": "人們最終會過世。", "hl": false, "note": ""}]}, {"id": "v2", "title": "Read and Fill In（Dear Diary）", "src": "課本 p.34", "lines": [{"sp": "", "en": "Dear Diary,", "zh": "親愛的日記：", "hl": false, "note": ""}, {"sp": "", "en": "I get up early and cook breakfast for my husband every morning.", "zh": "我每天早上很早起床，為我丈夫做早餐。", "hl": false, "note": "every morning → 現在式 get。"}, {"sp": "", "en": "After he goes to work, I do the dishes, clean the house, and look after my baby. I am very busy every day.", "zh": "他去上班後，我洗碗、打掃房子、照顧寶寶。我每天都很忙。", "hl": false, "note": ""}, {"sp": "", "en": "Last night, my husband came home very late. He was in a bad mood.", "zh": "昨晚，我丈夫很晚才回家。他心情很差。", "hl": true, "note": "Last night → 過去式 came、was。"}, {"sp": "", "en": "He hit me and broke my arm. I cried, but no one helped me.", "zh": "他打我，還打斷了我的手臂。我哭了，但沒有人幫我。", "hl": true, "note": "hit（同形）、broke、cried。"}, {"sp": "", "en": "I'm just 12 years old. I am sad. I don't want a life like this anymore. Who can help me?", "zh": "我才 12 歲。我很難過。我不想再過這樣的生活了。誰能幫我？", "hl": false, "note": ""}]}, {"id": "rc1", "title": "Reading Corner 1〈Dear Diary〉", "src": "課本 p.37", "lines": [{"sp": "", "en": "Emma, Irene, and I met for lunch at a restaurant on my birthday, but they were late.", "zh": "我生日那天，Emma、Irene 和我約在餐廳吃午餐，但她們遲到了。", "hl": true, "note": ""}, {"sp": "", "en": "Emma was late because she missed the bus. Irene was late because she got lost.", "zh": "Emma 遲到是因為錯過公車。Irene 遲到是因為迷路了。", "hl": true, "note": ""}, {"sp": "", "en": "So, I waited for them in front of the restaurant for almost an hour. I was angry.", "zh": "所以，我在餐廳前面等了她們將近一小時。我很生氣。", "hl": false, "note": ""}, {"sp": "", "en": "Emma and Irene finally arrived, and we went inside the restaurant.", "zh": "Emma 和 Irene 終於到了，我們走進餐廳。", "hl": false, "note": ""}, {"sp": "", "en": "The food was great. We all enjoyed the meal, and I was not that angry with them anymore.", "zh": "食物很棒。我們都很享受這一餐，我也沒那麼生她們的氣了。", "hl": false, "note": ""}, {"sp": "", "en": "Later, the waiter brought a cake to our table. There were candles on it.", "zh": "後來，服務生端了一個蛋糕到我們桌上。上面有蠟燭。", "hl": true, "note": "it＝the cake（課本第 1 題）。"}, {"sp": "", "en": "It was a surprise from Emma and Irene. They bought the cake for me and brought gifts.", "zh": "那是 Emma 和 Irene 給的驚喜。她們為我買了蛋糕，還帶了禮物。", "hl": false, "note": ""}, {"sp": "", "en": "Emma missed the bus because she went to buy the cake. Irene went to the gift shop for my gift, but she got lost.", "zh": "Emma 錯過公車是因為她去買蛋糕。Irene 去禮品店買我的禮物，結果迷路了。", "hl": true, "note": ""}, {"sp": "", "en": "My friends are sweet and really care about me. I love them so much.", "zh": "我的朋友們很貼心，真的很關心我。我好愛她們。", "hl": false, "note": ""}, {"sp": "", "en": "It was a great day with good food and good friends.", "zh": "那是有美食和好朋友的美好一天。", "hl": false, "note": ""}]}], "grammar": [{"id": "past-sum", "name": "現在式 vs 過去式總整理", "icon": "🔁", "c": ["PAST-BE", "PAST-REG", "PAST-IRR", "TIME"], "intro": "判斷用現在式還是過去式，<b>先找時間線索</b>：every day、usually、now → 現在式；yesterday、last…、…ago → 過去式。", "table": [["", "現在式", "過去式"], ["be 動詞", "am、is／are", "was／were"], ["規則動詞", "share、jog、study", "shared、jogged、studied"], ["不規則動詞", "sell、buy、break", "sold、bought、broke"], ["否定", "don't／doesn't＋原形", "didn't＋原形"], ["問句", "Do／Does＋主詞＋原形", "Did＋主詞＋原形"]], "flows": [{"title": "同一個人、兩個時間", "steps": [{"tokens": ["I", "get", "up", "early", "every", "morning", "."], "hl": [1, 4, 5], "note": "every morning → 現在式 get"}, {"tokens": ["I", "got", "up", "late", "yesterday", "."], "hl": [1, 4], "note": "yesterday → 過去式 got"}, {"tokens": ["I", "didn't", "get", "up", "early", "yesterday", "."], "hl": [1, 2], "note": "否定：didn't＋原形 get"}]}, {"title": "🔴 第三人稱單數只在現在式", "steps": [{"tokens": ["He", "goes", "to", "work", "every", "day", "."], "hl": [1], "note": "現在式：he → goes"}, {"tokens": ["He", "went", "to", "work", "yesterday", "."], "hl": [1], "note": "過去式：不管主詞是誰，都是 went"}]}], "tutor": [{"say": "「After he ___ to work, I clean the house.」（every day 的日記）", "ch": [{"t": "goes", "ok": true, "re": "對！every day 的習慣用現在式，he → goes。"}, {"t": "went", "ok": false, "re": "這段講的是每天的事，用現在式。"}, {"t": "go", "ok": false, "re": "主詞 he 是第三人稱單數，要加 es。"}]}, {"say": "「Last night, my husband ___ home very late.」", "ch": [{"t": "comes", "ok": false, "re": "Last night 是過去 → came。"}, {"t": "came", "ok": true, "re": "沒錯！come → came。"}]}]}], "questions": [{"id": "R1:mc01", "t": "mc", "set": "mc", "c": ["TIME", "PAST-IRR"], "q": "I usually take the bus to school, but I ___ a taxi yesterday.", "o": ["take", "took", "takes", "taking"], "a": 1, "x": "yesterday → took。", "L": "R1"}, {"id": "R1:mc02", "t": "mc", "set": "mc", "c": ["CONJ"], "q": "Emma was late ___ she missed the bus.", "o": ["so", "because", "and", "or"], "a": 1, "x": "後面是原因 → because。", "L": "R1"}, {"id": "R1:mc03", "t": "mc", "set": "mc", "c": ["MULTI"], "q": "I ___ my grandma a lot. She lives in Tainan.", "o": ["miss", "arrive", "wait", "bring"], "a": 0, "x": "想念 miss（miss 也可以是「錯過」）。", "L": "R1"}, {"id": "R1:mc04", "t": "mc", "se /* ───────── 後台紀錄：使用紀錄＋每題作答 → Google 試算表（Apps Script，設定見 backend\部署步驟.md） ─────────
   先存進手機上的佇列，有網路才送；送成功才從佇列刪掉，所以離線練習也不會漏。LOG_URL 留空＝只存不送。 */
const LOG_URL = "https://script.google.com/macros/s/AKfycbyyDAoND78F63e3cKMtTkkSG1w-U2MCZtVzbQXuttB3PECj6hHElKtQInaRbRbb2sXT/exec";
const LOGQ = "n8v5-logq";
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
let DEV = "";
try { DEV = localStorage.getItem("n8v5-dev") || ""; if (!DEV){ DEV = uid().slice(-6); localStorage.setItem("n8v5-dev", DEV); } } catch(e){ DEV = "nostore"; }
const SID = uid();   // 場次：每打開一次 app 一個
let LQ = [];
try { LQ = JSON.parse(localStorage.getItem(LOGQ)||"[]") || []; } catch(e){}
function saveLQ(){ try{ localStorage.setItem(LOGQ, JSON.stringify(LQ)); }catch(e){} }
const plain = s => String(s??"").replace(/<span class="blank">&nbsp;<\/span>/g,"___").replace(/<[^>]+>/g," ").replace(/&nbsp;/g," ").replace(/&lt;/g,"<").replace(/&gt;/g,">")
  .replace(/&quot;/g,'"').replace(/&amp;/g,"&").replace(/\s+/g," ").trim().slice(0,300);
function logEv(ev){
  LQ.push(Object.assign({id:uid(), ts:Date.now(), dev:DEV, sid:SID, v:BUILD}, ev));
  if (LQ.length > 5000) LQ = LQ.slice(-5000);
  saveLQ(); clearTimeout(logEv.t); logEv.t = setTimeout(flushLog, 3000);
}
let flushing = false;
async function flushLog(leaving){
  if (!LOG_URL || flushing || !LQ.length || navigator.onLine === false) return;
  flushing = true;
  const batch = LQ.slice(0, leaving ? 30 : 200);   // 離開頁面時用 keepalive，內容不能太大
  try {
    // text/plain 是「簡單請求」，不觸發 CORS 預檢；Apps Script 會 302 轉址，fetch 自動跟隨
    const r = await fetch(LOG_URL, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify({app:D.app, events:batch}), redirect:"follow", keepalive:!!leaving});
    const j = await r.json();
    if (j && j.ok){
      const done = new Set(batch.map(e=>e.id)); LQ = LQ.filter(e=>!done.has(e.id)); saveLQ();
      flushing = false; if (LQ.length && !leaving) return flushLog();
    }
  } catch(e){}
  flushing = false;
}
window.addEventListener("online", ()=>flushLog());
document.addEventListener("visibilitychange", ()=>{ if (document.visibilityState==="hidden") flushLog(true); });
setTimeout(()=>flushLog(), 2000);

const pick = (a,n) => shuffle(a).slice(0,n);
const norm = s => String(s).replace(/[’‘`]/g,"'").replace(/\s+/g," ").trim();
const loose = s => norm(s).toLowerCase().replace(/[.,!?]/g,"").replace(/\s+/g," ").trim();
