const CN = D.concepts;

/* ───────── 語音（瀏覽器內建，不用網路） ───────── */
let VOICE = null;
function pickVoice(){
  if (!("speechSynthesis" in window)) return;
  const vs = speechSynthesis.getVoices().filter(v=>/^en[-_]US/i.test(v.lang));
  VOICE = vs.find(v=>/Google|Samantha|Aria|Jenny|Zira/i.test(v.name)) || vs[0] || null;
}
if ("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text, opt={}){
  return new Promise(res=>{
    if (!("speechSynthesis" in window)) return res();
    const u = new SpeechSynthesisUtterance(text);
    u.lang="en-US"; if (VOICE) u.voice=VOICE;
    u.rate = opt.rate || 0.85; u.pitch = opt.pitch || 1;
    u.onend = res; u.onerror = res;
    speechSynthesis.speak(u);
  });
}
async function speakTalk(script){
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  for (const part of script.split("|")){
    const m = part.match(/^(W|M|Q):\s*(.*)$/);
    if (!m){ await speak(part); continue; }
    const pitch = m[1]==="W" ? 1.3 : m[1]==="M" ? 0.75 : 1;
    await speak((m[1]==="Q" ? "Question. " : "") + m[2], {pitch});
    await new Promise(r=>setTimeout(r,350));
  }
}
function sayBtn(text){ return `<button class="say" data-say="${esc(text)}" aria-label="播放">🔊</button>`; }

/* ───────── 家庭樹：關係計算 ───────── */
function famMap(F){ const m={}; F.people.forEach(p=>m[p.id]=p); return m; }
function siblings(m, id){ const p=m[id]; if(!p.par.length) return [];
  return Object.values(m).filter(q=>q.id!==id && q.par.some(x=>p.par.includes(x))).map(q=>q.id); }
function rel(F, a, b){ // a 是 b 的什麼人
  const m = famMap(F), A=m[a], B=m[b]; if(!A||!B||a===b) return null;
  const g = (mw,fw)=> A.sex==="m"?mw:fw;
  if (A.sp===b) return g("husband","wife");
  if (B.par.includes(a)) return g("father","mother");
  if (A.par.includes(b)) return g("son","daughter");
  if (siblings(m,a).includes(b)) return g("brother","sister");
  if (B.par.some(p=>m[p].par.includes(a))) return g("grandfather","grandmother");
  if (A.par.some(p=>m[p].par.includes(b))) return g("grandson","granddaughter");
  const bParSibs = B.par.flatMap(p=>siblings(m,p));
  if (bParSibs.includes(a) || bParSibs.some(s=>m[s].sp===a)) return g("uncle","aunt");
  if (A.par.some(p=>bParSibs.includes(p))) return "cousin";
  // uncle／aunt 的反方向（課外字，只顯示不出題）
  if (A.par.some(p=>siblings(m,p).includes(b) || siblings(m,p).some(s=>m[s].sp===b))) return g("nephew","niece");
  return null;
}
const EXTRA = {nephew:"姪子／外甥", niece:"姪女／外甥女"};
const REL_M = ["father","son","brother","husband","grandfather","grandson","uncle","cousin"];
const REL_F = ["mother","daughter","sister","wife","grandmother","granddaughter","aunt","cousin"];

function treeSVG(F, sel=[]){
  const m=famMap(F), W=66, H=120, R=23, ox=6, oy=30;
  const X=p=>ox+p.x*W+W/2, Y=p=>oy+p.y*H;
  const maxx=Math.max(...F.people.map(p=>p.x)), maxy=Math.max(...F.people.map(p=>p.y));
  let s=`<svg viewBox="0 0 ${ox*2+(maxx+1)*W} ${oy+maxy*H+80}" role="img" aria-label="${esc(F.title)}">`;
  const done=new Set();
  F.people.forEach(p=>{ if(p.sp && !done.has(p.sp)){ done.add(p.id); const q=m[p.sp];
    s+=`<line x1="${X(p)}" y1="${Y(p)}" x2="${X(q)}" y2="${Y(q)}" stroke="var(--ink-3)" stroke-width="2"/>`; }});
  const groups={};
  F.people.forEach(p=>{ if(p.par.length){ const k=p.par.slice().sort().join("+"); (groups[k]=groups[k]||[]).push(p);} });
  Object.entries(groups).forEach(([k,kids])=>{
    const [a,b]=k.split("+").map(i=>m[i]); const mx=(X(a)+X(b))/2, py=Y(a), by=py+H*0.55;
    const xs=kids.map(X); const x1=Math.min(...xs,mx), x2=Math.max(...xs,mx);
    s+=`<g stroke="var(--ink-3)" stroke-width="1.5" opacity=".7"><line x1="${mx}" y1="${py}" x2="${mx}" y2="${by}"/><line x1="${x1}" y1="${by}" x2="${x2}" y2="${by}"/>`;
    kids.forEach(c=>s+=`<line x1="${X(c)}" y1="${by}" x2="${X(c)}" y2="${Y(c)-R}"/>`); s+=`</g>`;
  });
  F.people.forEach(p=>{
    const on = sel.indexOf(p.id);
    const fill = on===0 ? "var(--accent)" : on===1 ? "var(--accent-line)" : "var(--surface-2)";
    s+=`<g class="pn" data-p="${p.id}"><circle cx="${X(p)}" cy="${Y(p)}" r="${R}" fill="${fill}" stroke="${on>=0?"var(--accent)":"var(--line)"}" stroke-width="${on>=0?2.5:1.5}"/>`+
       `<text x="${X(p)}" y="${Y(p)+6}" text-anchor="middle" font-size="18">${p.sex==="m"?"👦":"👧"}</text>`+
       `<text x="${X(p)}" y="${Y(p)+R+19}" text-anchor="middle" font-size="19" font-weight="700" fill="currentColor">${p.id}</text>`+
       `<text x="${X(p)}" y="${Y(p)+R+37}" text-anchor="middle" font-size="15" fill="var(--ink-3)">${p.age}</text></g>`;
  });
  return s+"</svg>";
}
function famQuestions(F, n){
  const ids=F.people.map(p=>p.id), out=[], seen=new Set();
  let guard=0;
  while(out.length<n && guard++<500){
    const a=ids[Math.floor(Math.random()*ids.length)], b=ids[Math.floor(Math.random()*ids.length)];
    const r=rel(F,a,b); if(!r || EXTRA[r]) continue;
    const kind=["word","flip","who"][Math.floor(Math.random()*3)];
    const key=kind+a+b; if(seen.has(key)) continue; seen.add(key);
    const A=famMap(F)[a], pool=(A.sex==="m"?REL_M:REL_F).filter(x=>x!==r);
    if(kind==="word"){
      const o=shuffle([r,...pick(pool,3)]);
      out.push({id:`fam:${F.id}:w:${a}:${b}`,t:"mc",c:["FAM-WORD"],tree:F.id,q:`${a} is ${b}'s ___.`,o,a:o.indexOf(r),
        x:`看家庭樹：${a} 是 ${b} 的 <b>${r}</b>。`});
    } else if(kind==="flip"){
      const r2=rel(F,b,a); if(!r2 || EXTRA[r2]) continue;
      const B=famMap(F)[b]; const pool2=(B.sex==="m"?REL_M:REL_F).filter(x=>x!==r2);
      const o=shuffle([r2,...pick(pool2,3)]);
      out.push({id:`fam:${F.id}:f:${a}:${b}`,t:"mc",c:["FAM-FLIP"],tree:F.id,q:`${a} is ${b}'s ${r}.<br>So ${b} is ${a}'s ___.`,o,a:o.indexOf(r2),
        x:`換 ${b} 當主詞：${b} 是${B.sex==="m"?"男生":"女生"} → <b>${r2}</b>。`});
    } else {
      const ans=ids.filter(i=>rel(F,i,b)===r); if(ans.length!==1) continue;
      const o=shuffle([a,...pick(ids.filter(i=>i!==a&&i!==b),3)]);
      out.push({id:`fam:${F.id}:h:${a}:${b}`,t:"mc",c:["FAM-WORD","WH"],tree:F.id,q:`Who is ${b}'s ${r}?`,o,a:o.indexOf(a),
        x:`${b}'s ${r} 是 <b>${a}</b>。`});
    }
  }
  return out;
}

  ALLW.push(...l.words); l.grammar.forEach(g=>{ g.L=l.id; ALLG.push(g); });
});
const QBY = {}; QS.forEach(q=>QBY[q.id]=q);
const FAM = D.families || {};

const posq = ALLW.filter(w=>w.posq);
const inL = (q, ids) => ids.includes(q.L);
function spellQ(w){ return {id:"sp:"+w.w, t:"spell", c:["V-SP","V-ZH"].concat(w.posq?["V-POS"]:[]), w}; }
function zhQ(w){ return {id:"ze:"+w.w, t:"fill", c:["V-SP"], q:`${w.zh}（${w.pos}）→ ___`, a:[w.w], x:`${w.w}：${w.zh}`}; }
function poolFor(code){
  let p = QS.filter(q=>q.c.includes(code));
  if ((code==="FAM-WORD"||code==="FAM-FLIP") && FAM.nick) p = p.concat(famQuestions(FAM.nick,6).filter(q=>q.c.includes(code)));
  if (code==="V-SP"||code==="V-ZH") p = p.concat(pick(ALLW,6).map(spellQ));
  if (code==="V-POS") p = p.concat(pick(posq,6).map(spellQ));
  if (code==="MECH") p = p.concat(pick(QS.filter(q=>q.t==="order"),3));
  return p;
}

/* ───────── 作答紀錄＋錯題本 ───────── */
function record(q, okByConcept){ // okByConcept: {code: bool}
  for (const [c,ok] of Object.entries(okByConcept)){
    const s = S.stats[c] || (S.stats[c]={n:0,w:0}); s.n++; if(!ok) s.w++;
  }
  // 大小寫標點（MECH）只提醒、另外記統計，不影響這題的對錯
  const allOk = Object.entries(okByConcept).filter(([c])=>c!=="MECH").every(([,v])=>v);
  if (!allOk){ S.wrong[q.id] = {q, s:0}; }
  else if (S.wrong[q.id]){ S.wrong[q.id].s++; if (S.wrong[q.id].s>=2) delete S.wrong[q.id]; }
  save(); return allOk;
}

let QZ = null;
function startQuiz(opt){
  QZ = Object.assign({i:0, res:[], recent:[], drill:null, back:"#/"}, opt);
  QZ.list = opt.qs.slice();
  if (location.hash === "#/quiz") return renderQuiz();
  // 從「直接開考」的網址進來時用 replace，按返回鍵才不會又重開一次
  if (/\/(do|ls|quiz|spell)(\/|$)/.test(location.hash)) location.replace("#/quiz"); else location.hash = "#/quiz";

function curQ(){ return QZ.drill ? QZ.drill.list[QZ.drill.i] : QZ.list[QZ.i]; }
function renderQuiz(){
  if (!QZ) return route("#/");
  if (QZ.cp) return renderCheckpoint();
  const total = QZ.drill ? QZ.drill.list.length : QZ.list.length, idx = QZ.drill ? QZ.drill.i : QZ.i;
  if (idx >= total){ return QZ.drill ? endDrill() : renderResult(); }
  const q = curQ();
  const head = QZ.drill ? `<div class="fb warn">🎯 加練：${CN[QZ.drill.code].name}（答對才回到原本的題目）</div>` : "";
  page(QZ.title, `${head}<div class="sub">${idx+1} / ${total}<span class="muted" style="float:right;font-size:12px">版本 ${BUILD}</span></div><div class="prog"><i style="width:${idx/total*100}%"></i></div><div class="card" id="qbox"></div>`, QZ.back);

  ({mc:qMC, fill:qFill, spell:qSpell, order:qOrder, listen:qListen})[q.t](q, box);

function afterAnswer(q, okByConcept, box, html, given){
  const ok = record(q, okByConcept);
  const cs = Object.keys(okByConcept);
  logEv({k:"ans", L: q.L || (LS && LS.id) || "",
    src: QZ.exam ? "段考模擬" : QZ.drill ? "弱點加練" : q.set==="teacher" ? "老師講義" : q.set==="workbook" ? "習作" : /^錯題本/.test(QZ.title) ? "錯題本" : "練習",
    sec: QZ.title, qid: q.id || (q.w ? "spell:"+q.w.w : ""), t: q.t, c: cs.join(","),
    cn: cs.map(c=>CN[c] ? CN[c].name : c).join("、"), q: plain(qText(q)), given: plain(given), ans: plain(ansText(q)),
    ok: ok ? 1 : 0, ms: QZ.qt ? Date.now()-QZ.qt : 0});
  if (QZ.drill){
    if (!ok){ const d=QZ.drill; d.req[q.id]=(d.req[q.id]||0)+1; if (d.req[q.id]<=2) d.list.push(q); }
  } else { QZ.res.push({q, ok, okByConcept, given}); QZ.recent.push({q, okByConcept}); }
  if (QZ.exam){ return next(); }
  // 所有題型一律大字告訴學生答對或答錯，再接說明
  box.insertAdjacentHTML("beforeend", `<div class="verdict ${ok?"ok":"ng"}">${ok?"✅ 答對了！":"❌ 答錯了"}</div>${html?`<div class="fb ${ok?"ok":"ng"}">${html}</div>`:""}<button class="btn" id="nx">下一題 →</button>`);
  $("#nx").onclick = next; $("#nx").scrollIntoView({block:"nearest"});
}
function next(){
  if (QZ.drill){ QZ.drill.i++; return renderQuiz(); }
  QZ.i++;
  if (QZ.checkpoint && QZ.recent.length>=8){ QZ.cp = true; }
  renderQuiz();
}
function passageHTML(q){

  if (q.p){ const g=READ[q.p]; h+=`<div class="passage"><b>${g.title}</b>${g.tree?`<div class="tree">${treeSVG(FAM[g.tree])}</div>`:""}<div>${g.p}</div></div>`; }
  if (q.tree && !q.p){ h+=`<div class="passage tree">${treeSVG(FAM[q.tree])}</div>`; }
  return h;
}
function qMC(q, box){
  box.innerHTML = passageHTML(q)+`<div class="q">${q.q}</div><div class="opts">${q.o.map((o,i)=>`<button class="opt" data-i="${i}">(${"ABCD"[i]}) ${o}</button>`).join("")}</div>`;
  box.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i, ok=i===q.a;
    box.querySelectorAll(".opt").forEach(x=>{x.disabled=true; if(!QZ.exam){ if(+x.dataset.i===q.a) x.classList.add("ok"); else if(x===b) x.classList.add("ng"); }});
    const m={}; q.c.forEach(c=>m[c]=ok);
    afterAnswer(q, m, box, q.x, q.o[i]);

}
// 學生答案和正確答案逐字母比對：錯的字母標紅、漏掉的字母用紅色底線格補上
function diffHTML(got, want){
  got=String(got||""); want=String(want||"");
  if (loose(got)===loose(want)) return `<span style="color:var(--ok);font-weight:600">${esc(got)}</span>`;
  const a=got, b=want, n=a.length, m=b.length;
  // LCS 對齊（字很短，直接 DP）
  const dp=Array.from({length:n+1},()=>Array(m+1).fill(0));
  for (let i=n-1;i>=0;i--) for (let j=m-1;j>=0;j--)
    dp[i][j] = a[i].toLowerCase()===b[j].toLowerCase() ? dp[i+1][j+1]+1 : Math.max(dp[i+1][j], dp[i][j+1]);
  let i=0, j=0, out="";
  while (i<n || j<m){
    if (i<n && j<m && a[i].toLowerCase()===b[j].toLowerCase()){ out+=esc(a[i]); i++; j++; }
    else if (j<m && (i>=n || dp[i][j+1]>=dp[i+1][j])){ out+=`<span class="dmiss">${esc(b[j])}</span>`; j++; }   // 漏掉的字母
    else { out+=`<span class="dbad">${esc(a[i])}</span>`; i++; }                                              // 多打或打錯的字母
  }
  return `<span class="dword">${out}</span>`;
}
// 比對時忽略空格、大小寫和標點；撇號只有「所有格」題才算（girls'、its／it's 是考點）
const squash = (s, keepApos) => String(s||"").toLowerCase().replace(/[’‘`]/g,"'")
  .replace(keepApos ? /[\s.,!?;:"“”]/g : /[\s.,!?;:"“”']/g, "");
const same = (a, b, keepApos) => squash(a, keepApos) === squash(b, keepApos);
// 學生答案＋正確答案：兩行大字對照，答對答錯都顯示
function yourAnswer(got, want, ok){
  const g = String(got||"").trim();
  const mine = !g ? '<span class="muted">（沒有作答）</span>' : ok ? `<span class="ya-ok">${esc(g)}</span>` : diffHTML(g, want);
  const note = ok && g && norm(g)!==norm(want) ? `<div class="ya-note">✔ 算對（空格、標點、大小寫不影響）。標準寫法看上面的「正確答案」。</div>` : "";
  return `<div class="ya ${ok?"is-ok":"is-ng"}"><div class="ya-row"><span class="ya-lab">你寫的</span><span class="ya-val">${mine}</span></div>
    <div class="ya-row"><span class="ya-lab">正確答案</span><span class="ya-val"><b>${esc(want)}</b></span></div>${note}</div>`;
}
function blankify(s){ return s.replace(/___/g,'<span class="blank">&nbsp;</span>'); }
function qFill(q, box){
  box.innerHTML = passageHTML(q)+`<div class="q">${blankify(q.q)}</div><input class="ans" id="in" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="在這裡輸入"><div id="f-msg"></div><button class="btn" id="go">送出答案</button>`;
  const inp=$("#in"); inp.focus();
  const go=()=>{
    const v=inp.value; if(!v.trim()){ $("#f-msg").innerHTML=`<div class="fb warn">先打出答案，再按「送出答案」。</div>`; return; }
    inp.disabled=true; $("#go").remove(); $("#f-msg").remove();
    const kp = q.c.includes("POSS");
    const hit = q.a.find(a=>same(a, v, kp));
    const ok = !!hit;
    const m={}; q.c.forEach(c=>m[c]=ok);
    let extra="";
    // 大小寫不對：算對，只提醒（MECH 另外記，不影響對錯）
    if (ok && /[A-Z]/.test(hit) && norm(v).replace(/[.?!]$/,"")!==norm(hit).replace(/[.?!]$/,"") && v.trim()[0]!==hit[0]){
      m.MECH=false; extra=`<div class="fb warn">⚠ 字對了，但大小寫要注意：<b>${esc(hit)}</b>。段考會扣分。</div>`;
    }
    const fs = q.set==="hand" ? fillSentence(q) : null;
    afterAnswer(q, m, box, `${yourAnswer(v, hit||q.a[0], ok)}${q.x||""}${extra}${fs?explainHTML(fs.en, fs.zh):""}`, v);
  };
  $("#go").onclick=go; inp.onkeydown=e=>{ if(e.key==="Enter") e.preventDefault(); };   // 只用「送出答案」按鈕送出
}
function qSpell(q, box){
  const w=q.w, res={};
  // 🔴 這裡的干擾選項不能叫 same（會蓋掉全域比對函式 same()）
  let others = ALLW.filter(x=>x.zh!==w.zh && x.sec===w.sec);
  if (others.length<3) others = ALLW.filter(x=>x.zh!==w.zh);
  const zhOpts = shuffle([w.zh, ...pick(others,3).map(x=>x.zh)]);
  box.innerHTML = `<div class="sub">第 1 步：聽發音，打出英文拼字，再按「送出答案」</div><div class="row" style="margin:16px 0"><button class="btn" id="play">🔊 播放</button><button class="btn ghost small" id="slow">🐢 慢速</button></div>
    <input class="ans" id="in" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="英文拼字"><div id="sp-msg"></div><button class="btn" id="go">送出答案</button><div id="st2"></div>`;
  const play=(r)=>{ window.speechSynthesis && speechSynthesis.cancel(); speak(w.w,{rate:r}); };
  $("#play").onclick=()=>play(0.8); $("#slow").onclick=()=>play(0.5); setTimeout(()=>play(0.8),250);
  const inp=$("#in"); inp.focus();
  inp.onkeydown=e=>{ if(e.key==="Enter") e.preventDefault(); };   // 只用「送出答案」按鈕送出

  const dis = shuffle(toks.filter(t=>CONF[t] && !toks.includes(CONF[t])).map(t=>CONF[t])).slice(0,2);
  let pool = shuffle(toks.concat(dis).map((t,i)=>({t,i}))), ans=[];
  box.innerHTML = `<div class="q">${q.zh}</div><div class="sub">第 1 步：把字卡<b>拖曳</b>（或點一下）到上方排出句子；在上方也能拖曳換位置。可能有多出來的干擾卡。</div>
    <div class="chips dropzone" id="ansrow"></div><div class="chips" id="poolrow"></div>
    <div id="p1fb"></div><div class="row" id="p1btns"><button class="btn" id="chk">送出</button></div><div id="ph2"></div>`;
  let locked=false;
  const draw=()=>{
    $("#ansrow").innerHTML = ans.map((o,k)=>`<button class="chipw opt drag" data-row="ans" data-k="${k}">${esc(o.t)}</button>`).join("") || `<span class="muted">（把字卡拖到這裡）</span>`;
    const pr=$("#poolrow"); if (pr) pr.innerHTML = pool.map((o,k)=>`<button class="chipw opt drag" data-row="pool" data-k="${k}">${esc(o.t)}</button>`).join("");
  };
  // 拖曳（滑鼠＋觸控共用 Pointer Events）；移動不到 6px 視為點一下
  const insertIndex=(row, x, y)=>{
    const cs=[...row.querySelectorAll(".drag")];
    for (let i=0;i<cs.length;i++){ const r=cs[i].getBoundingClientRect();
      if (y < r.top) return i;
      if (y <= r.bottom && x < r.left + r.width/2) return i; }
    return cs.length;
  };
  box.addEventListener("pointerdown", e=>{
    const c=e.target.closest(".drag"); if(!c || locked) return;
    e.preventDefault();
    const from=c.dataset.row, k=+c.dataset.k, sx=e.clientX, sy=e.clientY;
    let ghost=null;
    const move=ev=>{
      if (!ghost && Math.hypot(ev.clientX-sx, ev.clientY-sy) > 6){
        ghost=c.cloneNode(true); ghost.classList.add("drag-ghost"); document.body.appendChild(ghost); c.style.opacity=".3";
      }
      if (ghost){ ghost.style.left=(ev.clientX-ghost.offsetWidth/2)+"px"; ghost.style.top=(ev.clientY-ghost.offsetHeight/2)+"px";
        $("#ansrow").classList.toggle("over", !!document.elementFromPoint(ev.clientX, ev.clientY)?.closest?.("#ansrow")); }
    };
    const up=ev=>{
      document.removeEventListener("pointermove", move); document.removeEventListener("pointerup", up);
      $("#ansrow").classList.remove("over");
      const src = from==="ans" ? ans : pool;
      if (!ghost){ // 點一下：在兩列之間移動
        (from==="ans"?pool:ans).push(src.splice(k,1)[0]); return draw();
      }
      ghost.remove();
      const el=document.elementFromPoint(ev.clientX, ev.clientY);
      const toAns=el && el.closest("#ansrow"), toPool=el && el.closest("#poolrow");
      if (toAns){ let idx=insertIndex($("#ansrow"), ev.clientX, ev.clientY); const item=src.splice(k,1)[0];
        if (from==="ans" && idx>k) idx--; ans.splice(idx,0,item); }
      else if (toPool && from==="ans"){ pool.push(ans.splice(k,1)[0]); }
      draw();
    };
    document.addEventListener("pointermove", move); document.addEventListener("pointerup", up);
  });
  draw();
  // 送出：顯示答對／答錯；答錯附說明，學生修改後可以再送出，排對才進第 2 步
  $("#chk").onclick=()=>{
    const got=ans.map(o=>o.t), good = got.join(" ")===q.en, done = got.length===toks.length;
    if (good){
      locked=true;
      $("#ansrow").querySelectorAll(".drag").forEach(b=>b.classList.add("ok"));
      $("#p1fb").innerHTML=`<div class="verdict ok">✅ 答對了！順序完全正確。</div>`;
      $("#p1btns").innerHTML=`<button class="btn" id="nx1">下一步：自己打出句子 →</button>`;
      $("#nx1").onclick=startPhase2; return;
    }
    tries++; phase1ok=false;
    $("#ansrow").querySelectorAll(".drag").forEach((b,i)=>b.classList.add(got[i]===toks[i]?"ok":"ng"));
    const why=[], nOk=got.filter((t,i)=>t===toks[i]).length;
    if (!got.length) why.push("還沒有排任何字卡。先把字卡拖到上面的框框裡。");
    else {
      if (nOk) why.push(`有 ${nOk} 張的位置對了（綠色）。`);
      if (!done) why.push(`還有 <b>${toks.length-got.filter(t=>toks.includes(t)).length}</b> 張該用的字卡沒排進去。`);
      got.filter(t=>!toks.includes(t)).forEach(d=>{ const c=toks.find(t=>CONF[t]===d); why.push(confReason(c, d)); });
      const i=got.findIndex((t,k)=>t!==toks[k] && toks.includes(t));
      if (i>=0) why.push(`第 <b>${i+1}</b> 個位置不對：這裡應該放一個「<b>${roleOf(toks[i])}</b>」。`);
      else if (got.length<toks.length && got.every((t,k)=>t===toks[k])) why.push(`前面都對了，接下來第 <b>${got.length+1}</b> 個應該放一個「<b>${roleOf(toks[got.length])}</b>」。`);
    }
    const [tn, tr]=sentenceType(q.en);
    why.push(`這句是「${tn}」：${tr}`);
    $("#p1fb").innerHTML=`<div class="verdict ng">❌ 答錯了（第 ${tries} 次）</div>
      <div class="fb ng" style="margin-top:8px">${why.map(x=>`<div>・${x}</div>`).join("")}<div style="margin-top:8px"><b>把紅色的字卡拖曳調整好，再按「送出」。</b></div></div>`;
    if (!$("#peek")){   // 答錯一次就能看正確順序（使用者 10/4 要求：不要卡著看不到答案）
      $("#p1btns").insertAdjacentHTML("beforeend", `<button class="btn ghost" id="peek">👀 看正確順序</button>`);
      $("#peek").onclick=()=>{ $("#p1fb").insertAdjacentHTML("beforeend", `<div class="fb warn reveal">正確順序：<b>${esc(q.en)}</b>　照著排好再按送出。</div>`); $("#peek").remove(); };
    }
  };
  function startPhase2(){
    const good = tries===0;
    $("#p1btns").remove(); $("#poolrow").remove();
    // 第 2 步：一個字一個空格（格子長短＝字的長短），標點已經印好；空白鍵、Enter 都不會跳格或送出，只有按「送出」才批改
    const words = q.en.split(" ").map(w=>{ const m=w.match(/^(.*?)([,.?!]*)$/); return {core:m[1], p:m[2]}; });
    // 第 1 步顯示過的正確順序先模糊，避免直接照抄；點一下可以偷看
    box.querySelectorAll(".reveal").forEach(p1=>{ p1.style.filter="blur(6px)"; p1.style.cursor="pointer"; p1.title="點一下偷看";
      p1.onclick=()=>{ p1.style.filter = p1.style.filter ? "" : "blur(6px)"; }; });
    $("#ph2").insertAdjacentHTML("beforeend", `<div class="sub" style="margin-top:16px">第 2 步：${good?"排對了！":""}不看字卡，在每個空格打一個字（注意大寫）。打完按「送出」。</div>
      <div class="wb" id="wb">${words.map((w,i)=>`<span class="wbw"><input class="wbi" data-i="${i}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
        style="width:calc(${Math.max(2,w.core.length)}ch + 24px)"><span class="wbp">${esc(w.p)}</span></span>`).join("")}</div>
      <div id="retry"></div><button class="btn" id="go">送出</button>`);
    $("#ansrow").style.opacity=".25"; $("#ansrow").style.filter="blur(5px)";
    const boxes=[...box.querySelectorAll(".wbi")];
    boxes.forEach(b=>b.addEventListener("keydown", e=>{ if (e.key===" " || e.key==="Enter") e.preventDefault(); }));
    boxes.forEach(b=>b.addEventListener("input", ()=>{ if (/\s/.test(b.value)) b.value=b.value.replace(/\s+/g,""); b.classList.remove("ok","ng"); }));
    boxes[0].focus();
    // 打錯要一直練到打對才能下一題；弱點統計只記第一次的對錯
    let firstOk, tries2=0;
    const go=()=>{
      const vals=boxes.map(b=>b.value.trim());
      if (vals.every(v=>!v)) { $("#retry").innerHTML=`<div class="fb warn">先在格子裡打字，再按送出。</div>`; return; }
      const kp=q.c.includes("POSS");
      const oks=vals.map((v,i)=>same(v, words[i].core, kp));
      const okType=oks.every(Boolean);
      if (firstOk===undefined) firstOk=okType;
      boxes.forEach((b,i)=>{ b.classList.toggle("ok",oks[i]); b.classList.toggle("ng",!oks[i]); });
      if (!okType){
        tries2++;
        const bad=oks.filter(x=>!x).length;
        const mine=words.map((w,i)=>(vals[i]?(oks[i]?esc(vals[i]):diffHTML(vals[i], w.core)):'<span class="dmiss">＿</span>')+esc(w.p)).join(" ");
        // 答錯立刻給看正確句子（兩行大字對照），看著把紅色格子改好再送出
        $("#retry").innerHTML=`<div class="verdict ng">❌ 答錯了（第 ${tries2} 次）：有 ${bad} 格不對</div>
          <div class="ya is-ng"><div class="ya-row"><span class="ya-lab">你寫的</span><span class="ya-val">${mine}</span></div>
          <div class="ya-row"><span class="ya-lab">正確答案</span><span class="ya-val"><b>${esc(q.en)}</b></span></div></div>
          <div class="muted" style="font-size:13px">紅底＝打錯或多打的字母；紅框＝漏掉的字母。<b>把紅色格子改好，再按「送出」</b>。</div>`;
        const firstBad=boxes.find((b,i)=>!oks[i]); firstBad.focus(); firstBad.select(); return;
      }
      boxes.forEach(b=>b.disabled=true); $("#go").remove(); $("#retry").remove();
      const v=words.map((w,i)=>vals[i]+w.p).join(" ");
      const m={}; q.c.forEach(c=>m[c]=phase1ok && firstOk);
      let extra="";
      const p=mechCheck(v); if(p.length){ m.MECH=false; extra=`<div class="fb warn">⚠ 字都對了，但${p.join("、")}。段考會扣分。</div>`; } else m.MECH=true;
      const zh = (q.set==="best" || q.tsec==="best") ? q.zh : "";
      if (document.activeElement) document.activeElement.blur();   // 避免空白鍵直接觸發「下一題」
      afterAnswer(q, m, box, `${firstOk?"":"練到正確了！第一次答錯，已收進錯題本。"}${yourAnswer(v, q.en, true)}${q.alt.length?`<span class="eg">也可以：${q.alt.map(esc).join("／")}</span>`:""}${q.x?"<br>"+q.x:""}${extra}${explainHTML(q.en, zh)}`, v);
    };
    $("#go").onclick=go;
  }
}
// 排句子答錯時，說明「這個位置應該放哪一種字」（不直接講答案）
function roleOf(token){
  const t=String(token||"").replace(/[,.?!]/g,""), lo=t.toLowerCase().replace(/’/g,"'");
  if (["am","is","are","isn't","aren't","was","were","wasn't","weren't"].includes(lo)) return "be 動詞";
  if (["did","didn't","do","does","don't","doesn't","can","could"].includes(lo)) return "助動詞（did／do…）";
  if (["who","what","how","why","where","when","who's","what's"].includes(lo)) return "疑問詞";
  if (["because","so"].includes(lo)) return "連接詞（because／so）";
  if (/^(i'm|he's|she's|it's|that's|you're|we're|they're)$/.test(lo)) return "主詞＋be 動詞（縮寫）";
  if (["i","you","he","she","it","we","they","this","that","these","those"].includes(lo)) return "主詞（代名詞）";
  if (["my","your","his","her","its","our","their"].includes(lo) || /'s$|s'$/.test(lo)) return "所有格（誰的）";
  if (["a","an","the"].includes(lo)) return "冠詞（a／an／the）";
  if (["and","but","or"].includes(lo)) return "連接詞";
  if (lo==="not") return "not（否定）";
  if (lo==="too") return "too（也）";
  if (/^\d/.test(lo)) return "數字";
  const e=wmap()[lo];
  if (e) return {"n.":"名詞","adj.":"形容詞","v.":"動詞","adv.":"副詞","conj.":"連接詞","pron.":"代名詞"}[e.w.pos] || "字";
  if (/^[A-Z]/.test(t)) return "人名或專有名詞";
  return "字";
}
function confReason(c, d){
  const lc=String(c||"").toLowerCase(), ld=String(d).toLowerCase();
  if (["is","are","am","isn't","aren't"].includes(ld)) return `干擾卡「<b>${esc(d)}</b>」不對：be 動詞要跟主詞搭配（I → am；he、she、it、單數名詞 → is；you、we、they、複數名詞 → are）。`;
  if (["a","an"].includes(ld)) return `干擾卡「<b>${esc(d)}</b>」不對：看<b>緊接在後面那個字</b>的發音，母音開頭用 an，子音開頭用 a。`;
  if (["he","his","she","her","they","their"].includes(ld)) return `干擾卡「<b>${esc(d)}</b>」不對：當主詞（後面接 be 動詞）用 he／she／they；後面接名詞要用所有格 his／her／their。`;
  if (["who","what"].includes(ld)) return `干擾卡「<b>${esc(d)}</b>」不對：問「人」用 Who，問「東西、名字」用 What，問「原因」用 Why。`;
  if (["was","were","wasn't","weren't"].includes(ld)) return `干擾卡「<b>${esc(d)}</b>」不對：I、he、she、it、單數名詞 → was；you、we、they、複數名詞 → were。`;
  if (["because","so"].includes(ld)) return `干擾卡「<b>${esc(d)}</b>」不對：because 接<b>原因</b>，so 接<b>結果</b>；一句裡只能用一個。`;
  if (["does","do","don't"].includes(ld)) return `干擾卡「<b>${esc(d)}</b>」不對：句子講的是過去的事（yesterday、last、ago），助動詞要用 did／didn't。`;
  return `干擾卡「<b>${esc(d)}</b>」不對：注意單複數和特殊複數的拼法（children、women、men 不加 s；兩個以上要用複數）。`;
}
function qListen(q, box){
  const kind = {pic:"辨識句意", word:"聽音辨字", resp:"基本問答", talk:"言談理解"}[q.kind];
  box.innerHTML = `<div class="sub">聽力・${kind}</div><div class="row" style="margin:16px 0"><button class="btn" id="play">🔊 播放</button><button class="btn ghost small" id="slow">🐢 慢速</button></div>
    <div class="q">${q.q}</div><div class="opts ${q.kind==="pic"?"pic":""}">${q.o.map((o,i)=>`<button class="opt ${q.kind==="pic"&&/^\p{Extended_Pictographic}/u.test(o)?"big":""}" data-i="${i}">${q.kind==="pic"?"":`(${"ABC"[i]}) `}${esc(o)}</button>`).join("")}</div>`;
  const play=(rate)=>{ if(q.kind==="talk") speakTalk(q.s); else { window.speechSynthesis && speechSynthesis.cancel(); speak(q.s,{rate}); } };
  $("#play").onclick=()=>play(0.85); $("#slow").onclick=()=>play(0.55); setTimeout(()=>play(0.85),300);

/* ───────── 每 8 題弱點分析卡 ───────── */
function worstConcept(items){
  const miss={};
  items.forEach(r=>Object.entries(r.okByConcept).forEach(([c,ok])=>{ if(!ok) miss[c]=(miss[c]||0)+1; }));
  const rate=c=>{const s=S.stats[c]; return s&&s.n? s.w/s.n : 0;};
  const arr=Object.keys(miss).sort((a,b)=>miss[b]-miss[a] || rate(b)-rate(a));
  return arr.length ? {code:arr[0], miss:miss[arr[0]]} : null;
}
function stepWidget(flow, id){
  return `<div class="card" id="${id}" data-i="0"><b>${flow.title}</b><div class="chips"></div><div class="stepnote"></div>
    <div class="row"><button class="btn ghost small" data-act="prev">◀ 上一步</button><button class="btn small" data-act="next">下一步 ▶</button><span class="muted sc"></span></div></div>`;
}
function bindStep(flow, id){
  const el=$("#"+id); if(!el) return;
  const draw=()=>{ const i=+el.dataset.i, st=flow.steps[i];
    el.querySelector(".chips").innerHTML = st.tokens.map((t,k)=>`<span class="chipw ${st.hl.includes(k)?"on":""}">${esc(t)}</span>`).join("");
    el.querySelector(".stepnote").innerHTML = st.note;
    el.querySelector(".sc").textContent = `${i+1} / ${flow.steps.length}`;
    el.querySelector('[data-act="prev"]').disabled = i===0;
    el.querySelector('[data-act="next"]').disabled = i===flow.steps.length-1; };
  el.querySelector('[data-act="prev"]').onclick=()=>{ el.dataset.i=Math.max(0,+el.dataset.i-1); draw(); };
  el.querySelector('[data-act="next"]').onclick=()=>{ el.dataset.i=Math.min(flow.steps.length-1,+el.dataset.i+1); draw(); };
  draw();
}
function renderCheckpoint(){
  const items = QZ.recent.splice(0); QZ.cp=false;
  const w = worstConcept(items);
  if (!w){
    page(QZ.title, `<div class="card center"><div class="score">🎉</div><h2>這 8 題全對！</h2><p class="muted">沒有發現弱點，繼續加油。</p><button class="btn" id="go">繼續 →</button></div>`, QZ.back);
    $("#go").onclick=renderQuiz; return;
  }
  const C=CN[w.code], G=ALLG.find(g=>g.id===C.g), flow=G&&G.flows[0];
  page(QZ.title, `<div class="card"><div class="sub">🔍 弱點分析（剛剛 8 題）</div><h2>最需要加強：${C.name}</h2><p class="muted">這個觀念錯了 ${w.miss} 次</p>
    <div class="note" style="font-size:16px">${C.tip}</div>${flow?stepWidget(flow,"cpflow"):""}
    <p>接下來加練 3–4 題同一個觀念，<b>全部答對</b>才回到原本的題目。</p><button class="btn" id="go">開始加練</button></div>`, QZ.back);
  if (flow) bindStep(flow,"cpflow");

  };
}

  body += `<button class="btn" onclick="location.hash='${QZ.back}'">完成</button>`;
  page(QZ.title+"・結果", body, QZ.back);

function examReads(n){
  // 閱讀題組整組出，湊剛好 n 題（題組大小 2–5，隨機找組合）
  const groups=Object.values(READ);
  for (let k=0;k<300;k++){
    let sum=0, pickG=[];
    for (const g of shuffle(groups)){ if (sum+g.qs.length<=n){ pickG.push(g); sum+=g.qs.length; } if (sum===n) break; }
    if (sum===n) return pickG.flatMap(g=>g.qs);
  }
  return groups.flatMap(g=>g.qs).slice(0,n);
}

    const qs=[...tag(lis,"listen"),
      ...tag(pick(QS.filter(q=>q.set==="mc"),D.exam.mc),"mc"),
      ...tag(examReads(D.exam.read),"read"),
      ...tag(pick(QS.filter(q=>q.set==="hand"),D.exam.hand),"hand")];
    startQuiz({title:"段考模擬", qs, exam:true, checkpoint:false, back:"#/exam"});
  };
}

/* ───────── 老師講義（原題＋答案）───────── */
function qBody(q){
  if (q.t==="mc") return `${blankify(q.q)}<div class="sub" style="margin-top:4px">${q.o.map((o,i)=>`(${"ABCD"[i]}) ${o}`).join("　")}</div>`;
  if (q.t==="order") return q.zh;
  return blankify(q.q);
}
// 老師講義（kind="teacher"）和習作（kind="workbook"）共用同一個畫面
const SECK = {teacher:{icon:"📝", name:"老師講義", src:"老師講義"}, workbook:{icon:"📒", name:"習作", src:"習作"}};
function vTeacher(secId, mode, kind="teacher"){
  const K=SECK[kind], base=`#/${LS.id}/${kind}`;
  const T=LS[kind]||[]; if(!T.length) return route("#/");
  if (!secId){
    page(`${K.name}（附答案）`, `<p class="sub">照${K.name}的大題順序。每一大題可以先<b>自己作答</b>（答錯會進錯題本和弱點統計），或直接<b>看答案和解析</b>。</p>
      <div class="tiles">${T.map(s=>tile(K.icon,s.title,`${s.page}・${s.ids.length} 題`,`${base}/${s.id}`)).join("")}</div>`, "#/");
    return;
  }
  const s=T.find(x=>x.id===secId); if(!s) return route(base);
  const qs=s.ids.map(id=>QBY[id]).filter(Boolean);
  if (mode==="do") return startQuiz({title:s.title, qs, checkpoint:true, back:`${base}/${s.id}`});
  page(s.title, `<div class="row"><button class="btn" onclick="location.hash='${base}/${s.id}/do'">✏ 自己作答（${qs.length} 題）</button>
      <button class="btn ghost" id="all">👀 全部顯示答案</button></div>
    <p class="sub">${s.page}。點每一題的「看答案」可以只看那一題。</p>
    <div class="card">${qs.map((q,i)=>`<div class="line"><b class="sp">${i+1}</b><div style="flex:1">
      <div>${qBody(q)}</div>
      <button class="btn ghost small ans-btn">看答案</button>
      <div class="ans" style="display:none"><div class="fb ok">✔ <b>${q.t==="mc"?`(${"ABCD"[q.a]}) `:""}${ansText(q)}</b>${q.t==="order"&&q.alt.length?`<span class="eg">也可以：${q.alt.map(esc).join("／")}</span>`:""}${q.t==="fill"&&q.a.length>1?`<span class="eg">也接受：${q.a.slice(1).map(esc).join("／")}</span>`:""}${q.x?`<span class="eg">💡 ${q.x}</span>`:""}</div>${q.t==="order"?explainHTML(q.en, q.tsec==="best"?q.zh:""):""}</div>
    </div></div>`).join("")}</div>`, base);
  app.querySelectorAll(".ans-btn").forEach(b=>b.onclick=()=>{ b.nextElementSibling.style.display="block"; b.remove(); });
  $("#all").onclick=()=>{ app.querySelectorAll(".ans").forEach(a=>a.style.display="block"); app.querySelectorAll(".ans-btn").forEach(b=>b.remove()); };
}

/* ───────── 路由 ───────── */
function route(h){
  if (h!==undefined && location.hash!==h){ location.hash=h; return; }
  const p=(location.hash||"#/").slice(2).split("/");
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  logEv({k:"view", page: p[0]==="quiz" ? (QZ ? "作答："+QZ.title : "作答") : (location.hash||"#/").slice(1) || "/"});
  if (p[0]==="quiz") return renderQuiz();
  QZ=null;
  if (!p[0]) return vHome();
  if (p[0]==="weak") return p[1]?vWeakOne(p[1]):vWeak();
  if (p[0]==="wrong") return vWrong();
  if (p[0]==="exam") return vExam();
  if (LBY[p[0]]){
    LS = LBY[p[0]];
    if (!p[1]) return vHome();
    if (p[1]==="spell") return spellRound(null, "#/");
    if (p[1]==="words"){
      if (p[2]===undefined) return vWords();
      if (p[3]==="learn") return vWordLearn(p[2], p[4]);
      if (p[3]==="spell") return spellRound(p[2]==="all"?null:secsOf()[+p[2]], `#/${LS.id}/words/${p[2]}`);
      return vWordSec(p[2]);
    }
    if (p[1]==="text") return p[2]?vText(p[2]):vTextList();
    if (p[1]==="grammar") return vGrammarList();
    if (p[1]==="g") return vGrammar(p[2]);
    if (p[1]==="handout") return vHandout();
    if (p[1]==="teacher") return vTeacher(p[2], p[3]);
    if (p[1]==="workbook") return vTeacher(p[2], p[3], "workbook");
    if (p[1]==="do") return vDo(p[2]);
    if (p[1]==="quiz") return vQuiz();
    if (p[1]==="listen") return vListen();
    if (p[1]==="ls") return vLs(p[2]);
  }
  vHome();
}
window.addEventListener("hashchange", ()=>route());
route();

if ("serviceWorker" in navigator && /^https:|localhost|127\.0\.0\.1/.test(location.href)){
  navigator.serviceWorker.register("sw.js").then(r=>r.update()).catch(()=>{});
  // 分頁一直開著時，切題目只換 # 後面、頁面不會重新載入 → 定期向伺服器比對版本，有新版就提示更新
  const checkUpdate = async ()=>{
    try{
      const t = await (await fetch("./?v="+Date.now(), {cache:"no-store"})).text();
      const m = t.match(/const BUILD = "([^"]*)"/);
      if (m && m[1]!==BUILD && !document.getElementById("upd")){
        document.body.insertAdjacentHTML("afterbegin", `<div id="upd" style="position:fixed;left:16px;right:16px;bottom:16px;z-index:99;background:var(--accent);color:#fff;border-radius:12px;padding:12px 16px;box-shadow:var(--sh-2);display:flex;gap:8px;align-items:center;justify-content:space-between">
          <span>🔄 有新版本（${m[1]}）</span><button class="btn" style="background:#fff;color:var(--accent);margin:0" onclick="location.reload()">點這裡更新</button></div>`);
      }
    }catch(e){}
  };
  setTimeout(checkUpdate, 3000); setInterval(checkUpdate, 5*60*1000);
  document.addEventListener("visibilitychange", ()=>{ if (document.visibilityState==="visible") checkUpdate(); });
  // 新版接手時自動重新載入一次，手機不用開兩次才換新版
  let reloaded=false;
  navigator.serviceWorker.addEventListener("controllerchange", ()=>{ if(!reloaded && navigator.serviceWorker.controller){ reloaded=true; location.reload(); } });
}
</script>
</body>
