helpless right now.", "exz": "誰能幫我？我現在覺得好無助。", "pl": "", "plr": "none", "der": ["help＋less（沒有）", "helpful 有幫助的"], "note": "", "tex": "Look at you. You two are so helpless!", "posq": true, "no": 27, "blue": true, "cap": 0}, {"sec": "故事後半：不放棄", "w": "finally", "pos": "adv.", "zh": "終於", "ex": "We finally saw light at the end of the forest.", "exz": "我們終於在森林盡頭看到光。", "pl": "", "plr": "none", "der": ["final adj. 最後的", "＝at last"], "note": "", "tex": "Fred gave it another try, and he finally jumped out of the hole.", "posq": true, "no": 17, "blue": false, "cap": 22}, {"sec": "故事後半：不放棄", "w": "arrive", "pos": "v.", "zh": "抵達", "ex": "When can we arrive at the zoo? I can't wait!", "exz": "我們什麼時候能到動物園？我等不及了！", "pl": "arrived", "plr": "ed", "der": ["arrive at＋小地點", "arrive in＋大地方", "＝get to"], "note": "", "tex": "He arrived at the party just in time.", "posq": true, "no": 18, "blue": false, "cap": 8}, {"sec": "故事後半：不放棄", "w": "surprised", "pos": "adj.", "zh": "感到驚訝的", "ex": "Don't be surprised. I got a gift for you.", "exz": "別驚訝。我幫你買了禮物。", "pl": "", "plr": "none", "der": ["surprise n. 驚喜", "be surprised at… 對……感到驚訝"], "note": "", "tex": "All the other animals were surprised.", "posq": true, "no": 19, "blue": false, "cap": 14}, {"sec": "故事後半：不放棄", "w": "snake", "pos": "n.", "zh": "蛇", "ex": "There was a snake in the garden, but now it's gone.", "exz": "花園裡本來有一條蛇，但現在不見了。", "pl": "", "plr": "none", "der": [], "note": "", "tex": "\"How did you get out of that deep hole?\" the snake asked.", "posq": true, "no": 20, "blue": false, "cap": 5}, {"sec": "故事後半：不放棄", "w": "type", "pos": "v.", "zh": "打字", "ex": "Many people don't write with pens anymore. They type words on a cellphone.", "exz": "很多人不再用筆寫字，而是在手機上打字。", "pl": "typed", "plr": "ed", "der": ["type n. 類型"], "note": "", "tex": "Fred said nothing and typed a message on his cellphone.", "posq": true, "no": 21, "blue": false, "cap": 0}, {"sec": "故事後半：不放棄", "w": "message", "pos": "n.", "zh": "訊息", "ex": "I got a message from Rita yesterday.", "exz": "我昨天收到 Rita 的訊息。", "pl": "", "plr": "none", "der": ["leave a message 留言"], "note": "", "tex": "Fred said nothing and typed a message on his cellphone.", "posq": true, "no": 28, "blue": true, "cap": 3}, {"sec": "故事後半：不放棄", "w": "cellphone", "pos": "n.", "zh": "手機", "ex": "Mary uses her cellphone for long hours every day.", "exz": "Mary 每天用手機好幾個小時。", "pl": "", "plr": "none", "der": [], "note": "", "tex": "…typed a message on his cellphone.", "posq": true, "no": 22, "blue": false, "cap": 3}, {"sec": "故事後半：不放棄", "w": "deaf", "pos": "adj.", "zh": "耳聾的", "ex": "The boy is deaf in one ear.", "exz": "那個男孩一隻耳朵聽不見。", "pl": "", "plr": "none", "der": [], "note": "", "tex": "I am deaf. I can't hear you.", "posq": true, "no": 29, "blue": true, "cap": 0}, {"sec": "故事後半：不放棄", "w": "hear", "pos": "v.", "zh": "聽見", "ex": "Leo: Hello. This is Leo. Can you hear me? Amy: Yes.", "exz": "Leo：喂，我是 Leo。你聽得到我嗎？Amy：聽得到。", "pl": "heard", "plr": "irr", "der": ["hear 自然聽到", "listen to 專心聽"], "note": "", "tex": "I can't hear you.", "posq": true, "no": 23, "blue": false, "cap": 27}, {"sec": "動物（Word Power）", "w": "bat", "pos": "n.", "zh": "蝙蝠", "ex": "In the evenings, bats fly up and out of the holes.", "exz": "傍晚時，蝙蝠從洞裡飛出來。", "pl": "", "plr": "none", "der": [], "note": "", "tex": "", "posq": true, "no": 30, "blue": false, "cap": 2}, {"sec": "動物（Word Power）", "w": "fox", "pos": "n.", "zh": "狐狸", "ex": "There are five foxes in the zoo.", "exz": "動物園裡有五隻狐狸。", "pl": "", "plr": "none", "der": ["foxes（複數，字尾 x 加 es）"], "note": "", "tex": "", "posq": true, "no": 31, "blue": false, "cap": 3}, {"sec": "動物（Word Power）", "w": "rat", "pos": "n.", "zh": "老鼠", "ex": "I saw a big rat in the street.", "exz": "我在街上看到一隻大老鼠。", "pl": "", "plr": "none", "der": ["mouse 小老鼠"], "note": "", "tex": "", "posq": true, "no": 32, "blue": false, "cap": 1}, {"sec": "動物（Word Power）", "w": "hen", "pos": "n.", "zh": "母雞", "ex": "Are there any hens in the zoo?", "exz": "動物園裡有母雞嗎？", "pl": "", "plr": "none", "der": ["chicken 雞；雞肉"], "note": "", "tex": "", "posq": true, "no": 33, "blue": false, "cap": 0}, {"sec": "動物（Word Power）", "w": "bee", "pos": "n.", "zh": "蜜蜂", "ex": "A bee is flying around the flowers.", "exz": "一隻蜜蜂繞著花飛。", "pl": "", "plr": "none", "der": [], "note": "", "tex": "", "posq": true, "cap": 0}, {"sec": "動物（Word Power）", "w": "ant", "pos": "n.", "zh": "螞蟻", "ex": "The ants are helpful.", "exz": "螞蟻很有幫助。", "pl": "", "plr": "none", "der": [], "note": "an＋母音開頭：an ant", "tex": "", "posq": true, "cap": 0}, {"sec": "動物（Word Power）", "w": "sheep", "pos": "n.", "zh": "綿羊", "ex": "There are ten sheep on the farm.", "exz": "農場上有十隻綿羊。", "pl": "", "plr": "none", "der": [], "note": "單複數同形：one sheep、ten sheep", "tex": "", "posq": true, "cap": 4}, {"sec": "片語", "w": "go by", "pos": "phr.", "zh": "經過", "ex": "Taylor and Fred were crying for help when a rabbit went by.", "exz": "當兔子經過時，Taylor 和 Fred 正在呼救。", "pl": "went by", "plr": "irr", "der": [], "note": "", "tex": "…a rabbit went by.", "posq": false, "cap": 0}, {"sec": "片語", "w": "pass by", "pos": "phr.", "zh": "經過", "ex": "Oh, no. The bus just passed by in front of me.", "exz": "噢不，公車剛剛從我面前開過去。", "pl": "passed by", "plr": "ed", "der": [], "note": "", "tex": "Two spiders passed by and said…", "posq": false, "no": 12, "blue": false, "cap": 2}, {"sec": "片語", "w": "over and over", "pos": "phr.", "zh": "一遍又一遍", "ex": "Taylor and Fred jumped over and over again.", "exz": "Taylor 和 Fred 一次又一次地跳。", "pl": "", "plr": "none", "der": [], "note": "", "tex": "Taylor and Fred jumped over and over again.", "posq": false, "cap": 0}, {"sec": "片語", "w": "give up", "pos": "phr.", "zh": "放棄", "ex": "Don't give up. You can do it!", "exz": "別放棄，你做得到！", "pl": "gave up", "plr": "irr", "der": ["give up＋V-ing 放棄做……"], "note": "", "tex": "It's too difficult. Just give up.", "posq": false, "cap": 17}, {"sec": "片語", "w": "in time", "pos": "phr.", "zh": "及時", "ex": "He arrived at the party just in time.", "exz": "他剛好及時抵達派對。", "pl": "", "plr": "none", "der": ["on time 準時"], "note": "", "tex": "He arrived at the party just in time.", "posq": false, "cap": 0}, {"sec": "片語", "w": "cheer… on", "pos": "phr.", "zh": "鼓勵……", "ex": "You cheered me on when I was in the hole.", "exz": "我在洞裡時，你們為我加油。", "pl": "cheered… on", "plr": "ed", "der": [], "note": "", "tex": "You cheered me on when I was in the hole.", "posq": false, "cap": 0}, {"sec": "片語", "w": "fall into", "pos": "phr.", "zh": "掉進", "ex": "Don't fall into that hole.", "exz": "別掉進那個洞。", "pl": "fell into", "plr": "irr", "der": [], "note": "", "tex": "Suddenly, they fell into a deep hole.", "posq": false, "cap": 2}, {"sec": "片語", "w": "get out of", "pos": "phr.", "zh": "從……出來", "ex": "How did you get out of that deep hole?", "exz": "你是怎麼從那個深洞出來的？", "pl": "got out of", "plr": "irr", "der": [], "note": "", "tex": "\"How did you get out of that deep hole?\" the snake asked.", "posq": false, "cap": 2}], "texts": [{"id": "r1", "title": "Reading〈All Animals Were Going to the Party〉", "src": "課本 p.43–50", "lines": [{"sp": "", "en": "It was the Lion King's birthday.", "zh": "那天是獅子王的生日。", "hl": false, "note": ""}, {"sp": "", "en": "The party was at half past eight.", "zh": "派對在八點半。", "hl": true, "note": "half past eight＝八點半（過了 30 分）。"}, {"sp": "", "en": "All animals were going to the birthday party.", "zh": "所有動物都正要去參加生日派對。", "hl": true, "note": "were going：過去進行式，那時候正在做的事。"}, {"sp": "", "en": "Taylor the Toad and Fred the Frog were on the way.", "zh": "蟾蜍 Taylor 和青蛙 Fred 正在路上。", "hl": false, "note": "on the way 在路上。"}, {"sp": "", "en": "It was raining. The road was wet and full of mud.", "zh": "那時正在下雨。路又濕又滿是泥巴。", "hl": true, "note": "It was raining 過去進行式；be full of… 充滿……。"}, {"sp": "", "en": "Taylor and Fred were taking selfies on the way.", "zh": "Taylor 和 Fred 在路上自拍。", "hl": false, "note": "take a selfie 自拍 → were taking selfies。"}, {"sp": "", "en": "Suddenly, they fell into a deep hole.", "zh": "突然，他們掉進一個很深的洞。", "hl": true, "note": "fall → fell；fall into 掉進。"}, {"sp": "", "en": "While Taylor and Fred were crying for help, a rabbit went by.", "zh": "當 Taylor 和 Fred 正在呼救時，一隻兔子經過。", "hl": true, "note": "while＋長動作（過去進行式），短動作（went by）用過去簡單式。"}, {"sp": "", "en": "The rabbit stood beside the hole and said, \"Oh, dear. You don't jump like me.", "zh": "兔子站在洞旁邊說：「噢，天啊。你們跳得沒有我好。", "hl": false, "note": "stand → stood；beside 在……旁邊。"}, {"sp": "", "en": "You can't get to the party before it starts. It's too difficult. Just give up.\" And he jumped away.", "zh": "你們不可能在派對開始前到。太難了。放棄吧。」然後牠就跳走了。", "hl": true, "note": "before＋完整句子；give up 放棄。"}, {"sp": "", "en": "Taylor and Fred jumped over and over again.", "zh": "Taylor 和 Fred 一次又一次地跳。", "hl": false, "note": "over and over 一遍又一遍。"}, {"sp": "", "en": "Later, a butterfly flew by. She laughed, \"Oh, dear. You don't fly like me.", "zh": "後來，一隻蝴蝶飛過。她笑著說：「噢，天啊。你們飛不像我。", "hl": false, "note": "fly → flew。"}, {"sp": "", "en": "You can't get to the party before it starts. It's not possible.\" And she flew away.", "zh": "你們不可能在派對開始前到。不可能的。」然後她就飛走了。", "hl": false, "note": ""}, {"sp": "", "en": "Two spiders passed by and said, \"Oh, dear. You don't climb like us.", "zh": "兩隻蜘蛛經過說：「噢，天啊。你們爬得沒有我們好。", "hl": false, "note": "pass by 經過。"}, {"sp": "", "en": "You can't get to the party before it starts. Don't try anymore, or you could fall down to the bottom and die.\" And they went away.", "zh": "你們不可能在派對開始前到。別再試了，不然你們可能會摔到底下死掉。」然後牠們就走了。", "hl": false, "note": "祈使句, or…＝否則……。"}, {"sp": "", "en": "At first, Taylor did not listen to them.", "zh": "一開始，Taylor 沒有聽牠們的話。", "hl": false, "note": ""}, {"sp": "", "en": "But, after she tried many times, she believed them and gave up.", "zh": "但是試了很多次以後，她相信了牠們，放棄了。", "hl": true, "note": "after＋先發生的事（試了很多次），後面是後發生的事（放棄）。"}, {"sp": "", "en": "Fred was also tired, but he was still trying.", "zh": "Fred 也很累，但他還在努力。", "hl": true, "note": "was still trying 過去進行式：還在試。"}, {"sp": "", "en": "Many other animals saw them. \"Look at you. You two are so helpless! You can't get to the party before it starts,\" they all said.", "zh": "很多其他動物看到他們。「看看你們。你們兩個太無助了！你們不可能在派對開始前到。」牠們都這麼說。", "hl": false, "note": ""}, {"sp": "", "en": "Fred gave it another try, and he finally jumped out of the hole.", "zh": "Fred 再試了一次，終於跳出了洞。", "hl": true, "note": "give it another try 再試一次；finally 終於。"}, {"sp": "", "en": "He arrived at the party just in time.", "zh": "他剛好及時抵達派對。", "hl": true, "note": "arrive at＋地點；in time 及時。"}, {"sp": "", "en": "All the other animals were surprised.", "zh": "其他所有動物都很驚訝。", "hl": false, "note": ""}, {"sp": "", "en": "\"How did you get out of that deep hole?\" the snake asked. \"Where is your friend?\" the rabbit asked.", "zh": "「你是怎麼從那個深洞出來的？」蛇問。「你的朋友在哪裡？」兔子問。", "hl": false, "note": ""}, {"sp": "", "en": "Fred said nothing and typed a message on his cellphone.", "zh": "Fred 什麼也沒說，在手機上打了一則訊息。", "hl": false, "note": ""}, {"sp": "", "en": "The message said, \"I am deaf. I can't hear you. You cheered me on when I was in the hole.", "zh": "訊息寫著：「我耳朵聽不見。我聽不到你們說的話。我在洞裡的時候，你們在為我加油。", "hl": true, "note": "Fred 聽不見，以為大家在幫他加油，所以沒有放棄。cheer… on 鼓勵。"}, {"sp": "", "en": "I didn't give up because of you. Thank you. But, my friend is still there. Who can help her?\"", "zh": "因為你們，我沒有放棄。謝謝你們。但是，我的朋友還在那裡。誰能幫幫她？」", "hl": false, "note": "because of＋名詞（you）。"}]}, {"id": "o1", "title": "Oral Practice（故事裡的心情）", "src": "課本 p.53", "lines": [{"sp": "Fred", "en": "Oh, no. I hurt my arms. Where are we now?", "zh": "噢不，我的手臂受傷了。我們現在在哪裡？", "hl": false, "note": "confused 困惑的。"}, {"sp": "Taylor", "en": "Oh, no. We fell into the big hole. What can we do now, Fred? I am so scared.", "zh": "噢不，我們掉進大洞裡了。Fred，我們現在該怎麼辦？我好害怕。", "hl": false, "note": "panicked 驚慌的。"}, {"sp": "Rabbit", "en": "Oh dear, you two are in big trouble! You can't get to the party before it starts.", "zh": "噢天啊，你們兩個麻煩大了！你們不可能在派對開始前到。", "hl": false, "note": "mocking 嘲笑的。"}, {"sp": "Taylor", "en": "I can't do this. It's difficult. I give up.", "zh": "我做不到。太難了。我放棄。", "hl": false, "note": "depressed 沮喪的。"}, {"sp": "Fred", "en": "I can do this! I can get to the party before it starts!", "zh": "我做得到！我可以在派對開始前到！", "hl": false, "note": "energetic 有活力的。"}]}, {"id": "t1", "title": "Practice: Tell the Time（時間的說法）", "src": "課本 p.58", "lines": [{"sp": "2:30", "en": "It's two thirty. = It's half past two.", "zh": "兩點半。", "hl": true, "note": "30 分＝half past。"}, {"sp": "7:45", "en": "It's seven forty-five. = It's a quarter to eight.", "zh": "七點四十五分＝差十五分八點。", "hl": true, "note": "45 分＝差 15 分到下一點 → a quarter to。"}, {"sp": "5:15", "en": "It's five fifteen. = It's a quarter after five.", "zh": "五點十五分。", "hl": true, "note": "15 分＝a quarter past／after。"}, {"sp": "8:50", "en": "It's eight fifty. = It's ten to nine.", "zh": "八點五十分＝差十分九點。", "hl": true, "note": "50 分＝差 10 分 → ten to nine。"}]}], "grammar": [{"id": "past-prog", "notype": true, "name": "過去進行式 was／were＋V-ing", "icon": "⏳", "c": ["PAST-PROG"], "intro": "說「過去某個時間<b>正在做</b>的事」：主詞＋<b>was／were＋V-ing</b>。和現在進行式（am／is／are＋V-ing）一樣，只是 be 動詞換成過去式。常一起出現的時間：<b>then、at that time、at six last night</b>。", "table": [["主詞", "be 動詞", "V-ing"], ["I／He／She／It／單數", "was", "singing・dancing・having snacks"], ["We／You／They／複數", "were", "taking selfies・crying for help"], ["問句", "What was／were＋主詞＋doing…?", "What were you doing at seven last night?"]], "flows": [{"title": "現在進行式 → 過去進行式", "steps": [{"tokens": ["It", "is", "raining", "now", "."], "hl": [1, 2], "note": "現在正在下雨：is＋raining"}, {"tokens": ["It", "was", "raining", "then", "."], "hl": [1, 2], "note": "那時候正在下雨：is 改成 <b>was</b>，V-ing 不變"}, {"tokens": ["Taylor", "and", "Fred", "were", "taking", "selfies", "."], "hl": [3, 4], "note": "兩個人＝複數 → <b>were</b>＋taking"}]}, {"title": "問「那時候在做什麼」", "steps": [{"tokens": ["What", "was", "Ted", "doing", "at", "nine", "?"], "hl": [0, 1, 3], "note": "What＋was＋主詞＋<b>doing</b>…？"}, {"tokens": ["He", "was", "reading", "then", "."], "hl": [1, 2], "note": "回答：was＋V-ing（reading），then 可省略"}]}, {"title": "🔴 V-ing 的拼法", "steps": [{"tokens": ["dance", "→", "dancing"], "hl": [2], "note": "字尾 e：去 e 加 ing"}, {"tokens": ["swim", "→", "swimming"], "hl": [2], "note": "短母音＋一個子音：重複字尾再加 ing"}, {"tokens": ["die", "→", "dying"], "hl": [2], "note": "字尾 ie：改成 y 加 ing"}]}], "tutor": [{"say": "「What were you doing at six last night?」最好的回答？", "ch": [{"t": "I watched TV.", "ok": false, "re": "問「正在做什麼」→ 回答也要用進行式。"}, {"t": "I was watching TV.", "ok": true, "re": "對！was＋watching。"}, {"t": "I am watching TV.", "ok": false, "re": "last night 是過去 → am 要改 was。"}]}, {"say": "「Lisa and her friends ___ TV at five.」", "ch": [{"t": "was watching", "ok": false, "re": "Lisa and her friends 是複數 → were。"}, {"t": "were watching", "ok": true, "re": "沒錯！複數主詞用 were。"}, {"t": "were watch", "ok": false, "re": "be 動詞後面要接 V-ing。"}]}, {"say": "「He ___ a book then.」（read）", "ch": [{"t": "was read", "ok": false, "re": "was 後面要 V-ing。"}, {"t": "was reading", "ok": true, "re": "對！was＋reading。"}, {"t": "reading", "ok": false, "re": "🔴 不能少 be 動詞。"}]}]}, {"id": "when-while", "notype": true, "name": "when 和 while", "icon": "🔗", "c": ["WHEN-WHILE", "PAST-PROG"], "intro": "一個<b>長動作</b>（正在做，用過去進行式）被一個<b>短動作</b>（一下子，用過去簡單式）打斷。<b>when＋短動作</b>、<b>while＋長動作</b>。子句放句首加逗號，放中間不加逗號。", "table": [["寫法", "例句"], ["When＋短動作, 長動作.", "When a rabbit went by, they were crying for help."], ["長動作＋when＋短動作.", "They were crying for help when a rabbit went by."], ["While＋長動作, 短動作.", "While Susan was waiting for a bus, a man hit her."], ["短動作＋while＋長動作.", "A man hit Susan while she was waiting for a bus."]], "flows": [{"title": "同一件事四種寫法", "steps": [{"tokens": ["I", "was", "having", "breakfast", "when", "Ken", "arrived", "."], "hl": [4, 6], "note": "when 後面接<b>短動作</b>（arrived）"}, {"tokens": ["When", "Ken", "arrived", ",", "I", "was", "having", "breakfast", "."], "hl": [0, 3], "note": "When 放句首：子句後面加逗號"}, {"tokens": ["Ken", "arrived", "while", "I", "was", "having", "breakfast", "."], "hl": [2, 4, 5], "note": "while 後面接<b>長動作</b>（was having）"}, {"tokens": ["While", "I", "was", "having", "breakfast", ",", "Ken", "arrived", "."], "hl": [0, 5], "note": "While 放句首：加逗號"}]}, {"title": "兩個都是一般過去式", "steps": [{"tokens": ["When", "Fred", "arrived", "at", "the", "party", ",", "everyone", "was", "surprised", "."], "hl": [0, 2], "note": "when 也可以接一般過去式：Fred 一到，大家就很驚訝"}, {"tokens": ["When", "he", "fell", "down", ",", "he", "cried", "."], "hl": [0, 2, 6], "note": "跌倒（短）→ 哭（短）：兩個都用過去簡單式"}]}], "tutor": [{"say": "「___ Mom was cooking, Dad came home.」", "ch": [{"t": "When", "ok": false, "re": "Mom was cooking 是長動作 → while 比較好。"}, {"t": "While", "ok": true, "re": "對！while＋長動作（過去進行式）。"}, {"t": "Before", "ok": false, "re": "這裡不是先後順序，是「正在…的時候」。"}]}, {"say": "「Emily called ___ Tina was listening to music.」", "ch": [{"t": "while", "ok": true, "re": "沒錯！Tina 正在聽音樂（長動作）→ while。"}, {"t": "so", "ok": false, "re": "前後不是因果。"}, {"t": "because", "ok": false, "re": "前後不是因果。"}]}, {"say": "「When the phone rang, I ___ a shower.」", "ch": [{"t": "take", "ok": false, "re": "正在洗澡（長動作）→ 過去進行式。"}, {"t": "was taking", "ok": true, "re": "對！電話響（短）打斷洗澡（長）。"}, {"t": "am taking", "ok": false, "re": "rang 是過去 → was taking。"}]}]}, {"id": "before-after", "notype": true, "name": "before 和 after：誰先誰後", "icon": "↔️", "c": ["BEF-AFT"], "intro": "before＝在……<b>之前</b>、after＝在……<b>之後</b>，後面都接<b>完整句子</b>。訣竅：<b>先發生</b>的事跟著 after、<b>後發生</b>的事跟著 before。兩件事都是過去，就都用過去式。", "table": [["寫法", "例句（先打掃，後爸爸回家）"], ["Before＋後發生的事, 先發生的事.", "Before her dad came home, she cleaned the house."], ["先發生的事＋before＋後發生的事.", "She cleaned the house before her dad came home."], ["After＋先發生的事, 後發生的事.", "After she cleaned the house, her dad came home."], ["後發生的事＋after＋先發生的事.", "Her dad came home after she cleaned the house."]], "flows": [{"title": "同一件事用 before 和 after", "steps": [{"tokens": ["After", "he", "finished", "his", "homework", ",", "he", "went", "to", "the", "party", "."], "hl": [0, 2], "note": "先寫完功課 → After 接先發生的事"}, {"tokens": ["He", "went", "to", "the", "party", "after", "he", "finished", "his", "homework", "."], "hl": [5], "note": "after 放中間：不加逗號"}, {"tokens": ["He", "finished", "his", "homework", "before", "he", "went", "to", "the", "party", "."], "hl": [4, 7], "note": "換成 before：before 接後發生的事（去派對）"}]}], "tutor": [{"say": "（他先坐下，再看書）「He read the book ___ he sat down.」", "ch": [{"t": "before", "ok": false, "re": "坐下是先發生的事 → after。"}, {"t": "after", "ok": true, "re": "對！after 後面接先發生的事（坐下）。"}]}, {"say": "「Claire usually drinks milk ___ she goes to bed.」（喝牛奶在睡覺之前）", "ch": [{"t": "after", "ok": false, "re": "睡覺是後發生的事 → before。"}, {"t": "before", "ok": true, "re": "對！before＋後發生的事。"}, {"t": "so", "ok": false, "re": "不是因果。"}]}]}, {"id": "tell-time", "notype": true, "name": "時間的說法", "icon": "🕗", "c": ["TIME-TELL"], "intro": "除了直接唸數字（two thirty），英文常用<b>past／after</b>（過了幾分）和 <b>to</b>（差幾分到下一點）。30 分＝<b>half</b>、15 分＝<b>a quarter</b>。過了 30 分以後，通常改說「差幾分到下一點」。", "table": [["時間", "數字說法", "past／to 說法"], ["5:00", "five o'clock", "—"], ["4:30", "four thirty", "half past four"], ["5:15", "five fifteen", "a quarter past／after five"], ["7:45", "seven forty-five", "a quarter to eight"], ["8:50", "eight fifty", "ten to nine"], ["8:05", "eight oh five", "five past／after eight"]], "flows": [{"title": "過了幾分 → past／after", "steps": [{"tokens": ["It's", "half", "past", "two", "."], "hl": [1, 2], "note": "2:30：過了兩點 30 分（half）"}, {"tokens": ["It's", "a", "quarter", "after", "five", "."], "hl": [1, 2, 3], "note": "5:15：過了五點 15 分（a quarter）"}]}, {"title": "差幾分到 → to", "steps": [{"tokens": ["It's", "a", "quarter", "to", "eight", "."], "hl": [1, 2, 3, 4], "note": "7:45：差 15 分就八點 → 說的是<b>下一點</b> eight"}, {"tokens": ["It's", "ten", "to", "nine", "."], "hl": [1, 2, 3], "note": "8:50：差 10 分九點"}]}], "tutor": [{"say": "7:45 怎麼說？", "ch": [{"t": "a quarter past seven", "ok": false, "re": "a quarter past seven 是 7:15。"}, {"t": "a quarter to eight", "ok": true, "re": "對！差 15 分到八點。"}, {"t": "half past seven", "ok": false, "re": "half past seven 是 7:30。"}]}, {"say": "「ten to nine」是幾點？", "ch": [{"t": "9:10", "ok": false, "re": "to＝差幾分到 → 還沒到九點。"}, {"t": "8:50", "ok": true, "re": "沒錯！差 10 分九點。"}]}]}], "questions": [{"id": "L3:mc01", "t": "mc", "set": "mc", "c": ["PAST-PROG"], "q": "A: What were you doing at nine last night?<br>B: I ___ my homework.", "o": ["do", "did", "was doing", "am doing"], "a": 2, "x": "問「那時候正在做什麼」→ 過去進行式 was doing。", "L": "L3"}, {"id": "L3:mc02", "t": "mc", "set": "mc", "c": ["PAST-PROG"], "q": "Taylor and Fred ___ selfies on the way.", "o": ["was taking", "were taking", "are taking", "were take"], "a": 1, "x": "兩個人＝複數 → were＋taking。", "L": "L3"}, {"id": "L3:mc03", "t": "mc", "set": "mc", "c": ["WHEN-WHILE"], "q": "___ Mom was cooking, Dad came home.", "o": ["While", "Because", "Before", "So"], "a": 0, "x": "Mom was cooking 是長動作 → While。", "L": "L3"}, {"id": "L3:mc04", "t": "mc", "set": "mc", "c": ["WHEN-WHILE", "PAST-PROG"], "q": "When the phone rang, I ___ a shower.", "o": ["take", "took", "was taking", "am taking"], "a": 2, "x": "電話響（短動作）打斷洗澡（長動作）→ was taking。", "L": "L3"}, {"id": "L3:mc05", "t": "mc", "set": "mc", "c": ["BEF-AFT"], "q": "Kevin brushes his teeth ___ he goes to bed.", "o": ["after", "before", "so", "because"], "a": 1, "x": "先刷牙、後睡覺 → before＋後發生的事。", "L": "L3"}, {"id": "L3:mc06", "t": "mc", "set": "mc", "c": ["BEF-AFT"], "q": "___ she finished her homework, she watched TV.", "o": ["Before", "After", "While", "Because"], "a": 1, "x": "先寫完功課才看電視 → After＋先發生的事。", "L": "L3"}, {"id": "L3:mc07", "t": "mc", "set": "mc", "c": ["TIME-TELL"], "q": "The party was at 8:30. That's ___.", "o": ["eight thirteen", "half past eight", "a quarter to eight", "half past nine"], "a": 1, "x": "30 分＝half past。", "L": "L3"}, {"id": "L3:mc08", "t": "mc", "set": "mc", "c": ["TIME-TELL"], "q": "A: What time is it?<br>B: It's a quarter to eight. (＝___)", "o": ["7:15", "7:45", "8:15", "8:45"], "a": 1, "x": "差 15 分到八點＝7:45。", "L": "L3"}, {"id": "L3:mc09", "t": "mc", "set": "mc", "c": ["PAST-IRR"], "q": "Suddenly, they ___ into a deep hole.", "o": ["fall", "falled", "fell", "felt"], "a": 2, "x": "fall → fell（felt 是 feel 的過去式）。", "L": "L3"}, {"id": "L3:mc10", "t": "mc", "set": "mc", "c": ["V-ZH"], "q": "The water is very ___. Don't swim here.", "o": ["wet", "deep", "possible", "tired"], "a": 1, "x": "不能游泳 → 水很深 deep。", "L": "L3"}, {"id": "L3:mc11", "t": "mc", "set": "mc", "c": ["V-ZH"], "q": "I can't ___ you. Can you speak louder?", "o": ["hear", "type", "laugh", "climb"], "a": 0, "x": "請你大聲一點 → 聽不見 hear。", "L": "L3"}, {"id": "L3:mc12", "t": "mc", "set": "mc", "c": ["V-ZH"], "q": "Fred didn't say anything. He ___ a message on his cellphone.", "o": ["laughed", "typed", "climbed", "died"], "a": 1, "x": "在手機上打訊息 → typed。", "L": "L3"}, {"id": "L3:mc13", "t": "mc", "set": "mc", "c": ["PHR"], "q": "Don't ___. You can do it!", "o": ["give up", "go by", "pass away", "get out"], "a": 0, "x": "你做得到 → 別放棄 give up。", "L": "L3"}, {"id": "L3:mc14", "t": "mc", "set": "mc", "c": ["PHR"], "q": "We got to the station just ___, so we didn't miss the train.", "o": ["in time", "over and over", "on the way", "at first"], "a": 0, "x": "沒錯過火車 → 及時 in time。", "L": "L3"}, {"id": "L3:mc15", "t": "mc", "set": "mc", "c": ["V-ZH", "SUFFIX"], "q": "Nobody could help me. I felt so ___.", "o": ["helpful", "helpless", "careful", "colorful"], "a": 1, "x": "沒人能幫我 → 無助的 helpless（-less＝沒有）。", "L": "L3"}, {"id": "L3:mc16", "t": "mc", "set": "mc", "c": ["PAST-PROG"], "q": "A: What was Lisa doing then?<br>B: She ___ her dog.", "o": ["feeds", "was feeding", "were feeding", "is feeding"], "a": 1, "x": "Lisa 單數 → was feeding。", "L": "L3"}, {"id": "L3:mc17", "t": "mc", "set": "mc", "c": ["V-ZH"], "q": "All the other animals were ___ when Fred arrived at the party.", "o": ["surprised", "deaf", "wet", "deep"], "a": 0, "x": "大家沒想到他出得來 → 驚訝的 surprised。", "L": "L3"}, {"id": "L3:mc18", "t": "mc", "set": "mc", "c": ["WHEN-WHILE"], "q": "Emily called ___ Tina was listening to music.", "o": ["while", "so", "because", "after"], "a": 0, "x": "Tina 正在聽音樂（長動作）→ while。", "L": "L3"}, {"id": "L3:mc19", "t": "mc", "set": "mc", "c": ["PAST- d loved it. It was just out of this world. Teresa, Jeremy's little sister, sang and danced with the guests. She really had a good voice. Jeremy's father, Mr. Brown, was a magician. He put on a magic show. It was wonderful. And what about the birthday boy? He enjoyed the party and was happy to get many gifts. On his big day, he got a new cellphone, a pair of shoes, and many great picture books. Jeremy really had a good time with everyone.）（guest 賓客、pasta 義大利麵、voice 嗓音、magician 魔術師、put on 上演） What do we know about Jeremy?", "o": ["His magic show was great.", "He cooked some chicken pasta.", "He sang and danced at the party.", "He got many gifts from his family and friends."], "a": 3, "x": "變魔術的是爸爸、煮麵的是媽媽、唱歌跳舞的是妹妹；Jeremy 收到很多禮物。", "L": "L3", "tsec": "wk-read"}], "reading": [{"id": "L3:r1", "title": "閱讀（一）A Rainy Afternoon", "tree": "", "p": "Last Saturday afternoon, it was raining hard. Mia was reading a comic book in her room, and her little brother Sam was playing computer games. Suddenly, the lights went out. \"Mom!\" Sam cried. Mom was cooking in the kitchen, so she came out with a candle. While they were waiting in the dark, Dad told them a funny story about his school days. Everyone laughed. After the lights came back, Sam said, \"Can Dad tell us <b>another one</b>?\"", "qs": [{"id": "L3:r1a", "t": "mc", "set": "read", "c": ["PAST-PROG"], "q": "What was Mom doing when the lights went out?", "o": ["She was reading.", "She was cooking.", "She was playing games.", "She was telling a story."], "a": 1, "x": "Mom was cooking in the kitchen。", "L": "L3"}, {"id": "L3:r1b", "t": "mc", "set": "read", "c": ["V-ZH"], "q": "What does <b>another one</b> mean?", "o": ["Another candle.", "Another funny story.", "Another comic book.", "Another game."], "a": 1, "x": "前面 Dad 講了一個好笑的故事 → 再講一個故事。", "L": "L3"}, {"id": "L3:r1c", "t": "mc", "set": "read", "c": ["BEF-AFT"], "q": "Which happened FIRST?", "o": ["Dad told a story.", "The lights came back.", "The lights went out.", "Everyone plr": "none", "der": [], "note": "", "tex": "Understanding the Canadian accent was not easy.", "posq": true, "no": 39, "blue": true, "cap": 0}, {"sec": "閱讀：打工度假心得", "w": "leave", "pos": "v.", "zh": "留下；離開", "ex": "Please leave me alone.", "exz": "請讓我一個人靜一靜。", "pl": "left", "plr": "irr", "der": ["leave＝離開：leave home", "leave A with B 讓 A 只剩下 B"], "note": "", "tex": "The long working hours also left me with little time…", "posq": true, "no": 29, "blue": false, "cap": 33}, {"sec": "閱讀：打工度假心得", "w": "surf", "pos": "v.", "zh": "衝浪", "ex": "It's summer. Let's go surfing!", "exz": "夏天到了，我們去衝浪吧！", "pl": "surfed", "plr": "ed", "der": ["go surfing 去衝浪", "surf the Internet 上網"], "note": "", "tex": "…to enjoy surfing, sailing, or camping.", "posq": true, "no": 30, "blue": false, "cap": 0}, {"sec": "閱讀：打工度假心得", "w": "sail", "pos": "v.", "zh": "帆船；航行", "ex": "Ted likes to go sailing on weekends.", "exz": "Ted 週末喜歡去玩帆船。", "pl": "sailed", "plr": "ed", "der": ["go sailing 去玩帆船"], "note": "", "tex": "…to enjoy surfing, sailing, or camping.", "posq": true, "no": 31, "blue": false, "cap": 2}, {"sec": "閱讀：打工度假心得", "w": "begin", "pos": "v.", "zh": "開始", "ex": "The show begins at seven.", "exz": "表演七點開始。", "pl": "began", "plr": "irr", "der": ["＝start", "begin ↔ end"], "note": "", "tex": "…my working holiday in Canada didn't begin well…", "posq": true, "no": 33, "blue": false, "cap": 10}, {"sec": "閱讀：打工度假心得", "w": "end", "pos": "v.", "zh": "結束", "ex": "World War II ended in 1945.", "exz": "第二次世界大戰在 1945 年結束。", "pl": "ended", "plr": "ed", "der": ["end n. 結尾"], "note": "", "tex": "…and didn't end as I hoped.", "posq": true, "no": 34, "blue": false, "cap": 18}, {"sec": "閱讀：打工度假心得", "w": "hope", "pos": "v.", "zh": "希望", "ex": "It's good news, I hope.", "exz": "我希望是好消息。", "pl": "hoped", "plr": "ed", "der": ["hope＋to V"], "note": "", "tex": "…and didn't end as I hoped.", "posq": true, "no": 35, "blue": false, "cap": 31}, {"sec": "閱讀：打工度假心得", "w": "unhappy", "pos": "adj.", "zh": "不快樂的", "ex": "Nancy is an unhappy mother.", "exz": "Nancy 是個不快樂的媽媽。", "pl": "", "plr": "none", "der": ["un-＝不：un＋happy"], "note": "母音開頭 → an unhappy", "tex": "I had an unhappy experience during my time there.", "posq": true, "no": 36, "blue": false, "cap": 9}, {"sec": "片語", "w": "work as", "pos": "phr.", "zh": "以……身分工作", "ex": "My mom works as a nurse.", "exz": "我媽媽是護理師。", "pl": "worked as", "plr": "ed", "der": [], "note": "", "tex": "I worked as a waiter…", "posq": false, "cap": 1}, {"sec": "片語", "w": "go on a working holiday", "pos": "phr.", "zh": "去打工度假", "ex": "Mandy went on a working holiday in the UK.", "exz": "Mandy 去英國打工度假。", "pl": "went on a working holiday", "plr": "irr", "der": [], "note": "", "tex": "I went on a working holiday to Australia.", "posq": false, "cap": 0}, {"sec": "片語", "w": "make progress", "pos": "phr.", "zh": "進步", "ex": "I made progress by practicing.", "exz": "我靠練習進步了。", "pl": "made progress", "plr": "irr", "der": [], "note": "", "tex": "…but I made progress by practicing.", "posq": false, "cap": 0}, {"sec": "片語", "w": "in short", "pos": "phr.", "zh": "總之", "ex": "In short, it was a great trip.", "exz": "總之，那是一趟很棒的旅行。", "pl": "", "plr": "none", "der": [], "note": "", "tex": "In short, my working holiday in Canada didn't begin well…", "posq": false, "cap": 0}, {"sec": "片語", "w": "long time no see", "pos": "phr.", "zh": "好久不見", "ex": "Long time no see! How are you?", "exz": "好久不見！你好嗎？", "pl": "", "plr": "none", "der": [], "note": "", "tex": "G'day, Emily. Long time no see.", "posq": false, "cap": 0}, {"sec": "片語", "w": "Give me a break!", "pos": "phr.", "zh": "饒了我吧！", "ex": "I am tired. Give me a break!", "exz": "我很累，饒了我吧！", "pl": "", "plr": "none", "der": [], "note": "", "tex": "Oh, give me a break!", "posq": false, "cap": 0}, {"sec": "片語", "w": "No kidding!", "pos": "phr.", "zh": "不是開玩笑的！", "ex": "No kidding! That actress is my mom's friend.", "exz": "不是開玩笑的！那個女演員是我媽媽的朋友。", "pl": "", "plr": "none", "der": [], "note": "", "tex": "No kidding!", "posq": false, "cap": 0}], "texts": [{"id": "d1", "title": "Dialogue（Ian is visiting his cousin, Emily.）", "src": "課本 p.63–64", "lines": [{"sp": "Ian", "en": "G'day, Emily. Long time no see.", "zh": "嗨，Emily。好久不見。", "hl": false, "note": "G'day 是澳洲英語的 Good day（你好）。"}, {"sp": "Emily", "en": "Ian! What a surprise! What are you up to these days?", "zh": "Ian！真是驚喜！你最近在忙什麼？", "hl": false, "note": "What are you up to? 你在忙什麼？"}, {"sp": "Ian", "en": "I went on a working holiday to Australia.", "zh": "我去澳洲打工度假了。", "hl": true, "note": "go → went；go on a working holiday 去打工度假。"}, {"sp": "Emily", "en": "Cool. What kind of job did you do?", "zh": "酷。你做什麼樣的工作？", "hl": false, "note": ""}, {"sp": "Ian", "en": "I worked as a waiter in a hotel restaurant near the Great Barrier Reef.", "zh": "我在大堡礁附近的飯店餐廳當服務生。", "hl": true, "note": "work as＋職業。"}, {"sp": "Emily", "en": "The Great Barrier Reef? How was your life there?", "zh": "大堡礁？你在那裡的生活怎麼樣？", "hl": false, "note": ""}, {"sp": "Ian", "en": "Living there was an amazing experience. I enjoyed it a lot.", "zh": "住在那裡是很棒的經驗。我非常喜歡。", "hl": true, "note": "Living there 動名詞當主詞 → 單數 was。"}, {"sp": "Ian", "en": "The air is fresh, and the water is clear.", "zh": "空氣很新鮮，水很清澈。", "hl": false, "note": ""}, {"sp": "Ian", "en": "There are colorful coral reefs, cute sea turtles, and beautiful beaches.", "zh": "那裡有色彩繽紛的珊瑚礁、可愛的海龜和美麗的海灘。", "hl": false, "note": ""}, {"sp": "Emily", "en": "Wow. That's wonderful. I want to take a working holiday too when I am old enough.", "zh": "哇，太棒了。等我年紀夠大，我也想去打工度假。", "hl": true, "note": "want＋to V。"}, {"sp": "Emily", "en": "What should I do to prepare?", "zh": "我應該做什麼準備？", "hl": false, "note": "should＋原形 do。"}, {"sp": "Ian", "en": "First, you should keep practicing English.", "zh": "首先，你應該持續練習英文。", "hl": true, "note": "keep＋V-ing。"}, {"sp": "Emily", "en": "Oh, give me a break!", "zh": "噢，饒了我吧！", "hl": false, "note": ""}, {"sp": "Ian", "en": "No kidding! It is important to learn English well before starting a working holiday.", "zh": "不是開玩笑的！在開始打工度假前把英文學好很重要。", "hl": true, "note": "It is＋形容詞＋to V；before＋V-ing。"}]}, {"id": "w1", "title": "Word Power（Working Holiday Jobs in Australia）", "src": "課本 p.66", "lines": [{"sp": "1", "en": "a fruit farm worker", "zh": "水果農場工人", "hl": false, "note": ""}, {"sp": "2", "en": "a waiter", "zh": "男服務生", "hl": false, "note": ""}, {"sp": "3", "en": "a waitress", "zh": "女服務生", "hl": false, "note": ""}, {"sp": "4", "en": "a factory worker", "zh": "工廠工人", "hl": false, "note": ""}, {"sp": "5", "en": "a salesman", "zh": "推銷員", "hl": false, "note": ""}, {"sp": "6", "en": "a fisherman", "zh": "漁夫", "hl": false, "note": ""}]}, {"id": "r1", "title": "Reading（hanna_a 的 IG：日本）", "src": "課本 p.67", "lines": [{"sp": "hanna_a", "en": "My working holiday in Japan was amazing!", "zh": "我在日本的打工度假太棒了！", "hl": false, "note": ""}, {"sp": "hanna_a", "en": "It was fun to visit new places, try delicious foods, and meet friendly people.", "zh": "去新的地方、嘗試美食、認識友善的人都很好玩。", "hl": true, "note": "It was＋形容詞＋to V（三個動作都是原形）。"}, {"sp": "hanna_a", "en": "I also learned about Japanese culture when I worked there as a waitress.", "zh": "我在那裡當女服務生時，也學到了日本文化。", "hl": false, "note": "learn about 學習關於……；work as 以……身分工作。"}, {"sp": "hanna_a", "en": "Sometimes, speaking Japanese was hard, but I made progress by practicing.", "zh": "有時候說日文很難，但我靠練習進步了。", "hl": true, "note": "speaking Japanese 動名詞當主詞；by＋V-ing 藉由……。"}, {"sp": "hanna_a", "en": "It was wonderful to learn and grow every day.", "zh": "每天學習和成長很美好。", "hl": true, "note": ""}]}, {"id": "r2", "title": "Reading（timtheone 的 IG：加拿大）", "src": "課本 p.67", "lines": [{"sp": "timtheone", "en": "Working as a clerk in Canada was often hard.", "zh": "在加拿大當店員常常很辛苦。", "hl": true, "note": "Working… 動名詞當主詞 → was。"}, {"sp": "timtheone", "en": "Understanding the Canadian accent was not easy. Some people even spoke French!", "zh": "聽懂加拿大口音不容易。有些人甚至說法語！", "hl": false, "note": ""}, {"sp": "timtheone", "en": "The long working hours also left me with little time to enjoy surfing, sailing, or camping.", "zh": "長時間工作也讓我沒什麼時間享受衝浪、帆船或露營。", "hl": false, "note": "leave → left；enjoy＋V-ing。"}, {"sp": "timtheone", "en": "In short, my working holiday in Canada didn't begin well and didn't end as I hoped.", "zh": "總之，我在加拿大的打工度假開始得不順利，結束得也不如我所希望的。", "hl": true, "note": "begin ↔ end；as I hoped 如我所願。"}, {"sp": "timtheone", "en": "I had an unhappy experience during my time there.", "zh": "我在那裡的時光是一段不快樂的經驗。", "hl": false, "note": ""}]}, {"id": "o1", "title": "Oral Practice（應徵打工度假的工作）", "src": "課本 p.65", "lines": [{"sp": "A", "en": "Hello, what can I do for you?", "zh": "你好，有什麼需要幫忙的嗎？", "hl": false, "note": ""}, {"sp": "B", "en": "I'm looking for a job.", "zh": "我在找工作。", "hl": false, "note": ""}, {"sp": "A", "en": "What kind of job are you looking for?", "zh": "你在找什麼樣的工作？", "hl": false, "note": ""}, {"sp": "B", "en": "I'm not sure, but I can only work 30 hours a week.", "zh": "我不確定，但我一週只能工作 30 小時。", "hl": false, "note": ""}, {"sp": "A", "en": "How about a tour guide? This job is good for you.", "zh": "導遊怎麼樣？這份工作適合你。", "hl": false, "note": ""}, {"sp": "B", "en": "How much do I get an hour?", "zh": "一小時多少錢？", "hl": false, "note": ""}, {"sp": "A", "en": "Twenty-four Australian dollars an hour.", "zh": "一小時 24 澳幣。", "hl": false, "note": ""}, {"sp": "B", "en": "That's great.", "zh": "太好了。", "hl": false, "note": ""}]}], "grammar": [{"id": "to-v", "name": "接 to V 還是 V-ing？", "icon": "➡️", "c": ["TO-V", "V-ING", "BOTH"], "intro": "有些動詞後面還要再接一個動作，第二個動作要變成 <b>to＋原形</b> 或 <b>V-ing</b>，要看前面是哪個動詞：<b>want／need／plan／hope／ask＋to V</b>；<b>enjoy／keep／practice／finish＋V-ing</b>；<b>begin／start／like／love</b> 兩種都可以。🔴 第一個動詞照時態變，第二個不變。", "table": [["後面接", "動詞", "例句"], ["to V", "want、need、plan、hope、ask", "I want <b>to clean</b> the beach.／I plan <b>to arrive</b> in Taipei at four."], ["V-ing", "enjoy、keep、practice、finish", "He enjoys <b>cooking</b>.／She finished <b>doing</b> her homework last night."], ["兩種都可", "begin、start、like、love", "They began <b>to play</b>／<b>playing</b> rep.", "zh": "穿越", "ex": "They went across mountains and through valleys.", "exz": "他們翻山越谷。", "pl": "", "plr": "none", "der": [], "note": "", "tex": "They went across mountains and through valleys.", "posq": false, "cap": 15}, {"sec": "Review 與 Reading Corner", "w": "valley", "pos": "n.", "zh": "山谷", "ex": "There is a river in the valley.", "exz": "山谷裡有一條河。", "pl": "", "plr": "none", "der": [], "note": "", "tex": "…and through valleys.", "posq": true, "cap": 0}], "texts": [{"id": "v1", "title": "Build Your Vocabulary（獅子王的生日）", "src": "課本 p.77", "lines": [{"sp": "", "en": "Yesterday was the Lion King's birthday.", "zh": "昨天是獅子王的生日。", "hl": false, "note": ""}, {"sp": "", "en": "Before his birthday party, everyone was busy preparing for it.", "zh": "在他的生日派對之前，大家都忙著準備。", "hl": true, "note": "be busy＋V-ing 忙著做……。"}, {"sp": "", "en": "The butterflies were picking flowers in the garden. The flowers were gifts for the Lion King.", "zh": "蝴蝶們正在花園裡摘花。花是要送給獅子王的禮物。", "hl": false, "note": "were picking 過去進行式。"}, {"sp": "", "en": "The ants were collecting fruit for the party.", "zh": "螞蟻們正在為派對收集水果。", "hl": false, "note": ""}, {"sp": "", "en": "The fox was practicing some songs because she would be singing on stage at the party.", "zh": "狐狸正在練習幾首歌，因為她會在派對上登臺唱歌。", "hl": true, "note": ""}, {"sp": "", "en": "Everybody spent a lot of time preparing for the party, and the Lion King had a wonderful time.", "zh": "大家花了很多時間準備派對，獅子王度過了很棒的時光。", "hl": true, "note": "spend＋時間＋V-ing。"}]}, {"id": "g1", "title": "Grow Your Grammar（過去簡單式、過去進行式與時間）", "src": "課本 p.77–78", "lines": [{"sp": "9:00", "en": "Sue started swimming at 9:00 a.m.", "zh": "Sue 早上九點開始游泳。", "hl": false, "note": "start＋V-ing。"}, {"sp": "9:30", "en": "Sue was swimming at half past nine in the morning.", "zh": "早上九點半 Sue 正在游泳。", "hl": true, "note": "那個時間點正在做 → was swimming。"}, {"sp": "10:45", "en": "Sue finished swimming at a quarter to eleven in the morning.", "zh": "Sue 在早上十點四十五分游完。", "hl": false, "note": "a quarter to eleven＝10:45。"}, {"sp": "", "en": "I was having breakfast when Ken arrived.", "zh": "Ken 到的時候我正在吃早餐。", "hl": true, "note": ""}, {"sp": "", "en": "While I was having breakfast, Ken arrived.", "zh": "當我正在吃早餐時，Ken 到了。", "hl": true, "note": ""}, {"sp": "", "en": "My brother cleaned the house before Dad came home.", "zh": "我哥哥在爸爸回家前打掃了房子。", "hl": false, "note": ""}, {"sp": "", "en": "Dad came home after my brother cleaned the house.", "zh": "爸爸在我哥哥打掃完房子後回到家。", "hl": false, "note": ""}, {"sp": "", "en": "Playing the violin is fun. = It is fun to play the violin.", "zh": "拉小提琴很有趣。", "hl": true, "note": ""}]}, {"id": "j1", "title": "Read and Fill In（Josh 在澳洲）", "src": "課本 p.78", "lines": [{"sp": "", "en": "Josh spent a whole year in Australia last year.", "zh": "Josh 去年在澳洲待了一整年。", "hl": false, "note": ""}, {"sp": "", "en": "He worked as a waiter from Monday to Friday. On Sundays, he went to the beach.", "zh": "他週一到週五當服務生。每到週日，他就去海邊。", "hl": false, "note": ""}, {"sp": "", "en": "He enjoyed going surfing and waiting for good waves.", "zh": "他喜歡去衝浪和等待好浪。", "hl": true, "note": "enjoy＋V-ing。"}, {"sp": "", "en": "He wanted to win a trophy in the surfing competition, so he practiced a lot.", "zh": "他想在衝浪比賽贏得獎盃，所以他練習了很多。", "hl": true, "note": "want＋to V。"}, {"sp": "", "en": "He had a good time in Australia.", "zh": "他在澳洲過得很愉快。", "hl": false, "note": ""}]}, {"id": "p1", "title": "Power Up Your Reading（Working Holiday Around the World 海報）", "src": "課本 p.79", "lines": [{"sp": "Japan", "en": "Quota: 5,000｜Age: 18–30｜Fee: Free｜Visa: 1 year", "zh": "日本：名額 5,000、18–30 歲、免費、簽證一年", "hl": false, "note": ""}, {"sp": "Australia", "en": "Quota: Unlimited｜Age: 18–30｜Fee: 510 AUD｜Visa: 1–3 years", "zh": "澳洲：名額無限制、18–30 歲、510 澳幣、簽證一到三年", "hl": false, "note": ""}, {"sp": "England", "en": "Quota: 1,000｜Age: 18–30｜Fee: 940 GBP｜Visa: 2 years", "zh": "英國：名額 1,000、18–30 歲、940 英鎊、簽證兩年", "hl": false, "note": ""}, {"sp": "Canada", "en": "Quota: 1,200｜Age: 18–35｜Fee: 261 CAD｜Visa: 1 year", "zh": "加拿大：名額 1,200、18–35 歲、261 加幣、簽證一年", "hl": false, "note": ""}, {"sp": "USA", "en": "Quota: Unlimited｜Age: 18–28｜Fee: 160 USD｜Visa: 3–4 months (summer time)", "zh": "美國：名額無限制、18–28 歲、160 美元、簽證三到四個月（暑假）", "hl": false, "note": ""}, {"sp": "", "en": "1 AUD = 21 TWD／1 GBP = 38 TWD／1 CAD = 24 TWD／1 USD = 31 TWD", "zh": "匯率：1 澳幣＝21 台幣、1 英鎊＝38 台幣、1 加幣＝24 台幣、1 美元＝31 台幣", "hl": false, "note": ""}, {"sp": "", "en": "Want to start a new life? Want to make foreign friends? Want to learn a new language? Want to work hard and play hard?", "zh": "想展開新生活？想交外國朋友？想學新語言？想努力工作也盡情玩？", "hl": false, "note": ""}]}, {"id": "c1", "title": "Reading Corner II（黃家騎單車環遊世界）", "src": "課本 p.81", "lines": [{"sp": "", "en": "Many people in Taiwan enjoy cycling.", "zh": "台灣很多人喜歡騎自行車。", "hl": false, "note": "enjoy＋V-ing。"}, {"sp": "", "en": "On weekends, bike lovers ride bicycles on roads or bike paths.", "zh": "週末時，單車愛好者在道路或自行車道上騎車。", "hl": false, "note": ""}, {"sp": "", "en": "Cycling is good for our health, but sometimes it is very challenging.", "zh": "騎自行車對健康有益，但有時候很有挑戰性。", "hl": true, "note": "Cycling 動名詞當主詞；it 指 cycling。"}, {"sp": "", "en": "Here is a great story about a difficult cycling trip.", "zh": "這裡有一個關於艱難單車旅行的精彩故事。", "hl": false, "note": ""}, {"sp": "", "en": "The Huang family loved cycling and they had a dream. They wanted to travel around the world by bike.", "zh": "黃家人熱愛騎自行車，他們有一個夢想。他們想騎單車環遊世界。", "hl": true, "note": "want＋to V；by bike 騎單車。"}, {"sp": "", "en": "Before they put their dream into action, the Huang family spent many years planning the trip and saving money.", "zh": "在把夢想付諸行動之前，黃家花了很多年規劃旅程和存錢。", "hl": true, "note": "spend＋時間＋V-ing。"}, {"sp": "", "en": "They worked very hard for their dream.", "zh": "他們為了夢想非常努力。", "hl": false, "note": ""}, {"sp": "", "en": "In July of 2002, the Huang family began their trip. They rode 25,000 kilometers.", "zh": "2002 年 7 月，黃家開始了他們的旅程。他們騎了 25,000 公里。", "hl": false, "note": "begin → began；ride → rode。"}, {"sp": "", "en": "They went across mountains and through valleys. They experienced many difficult things on the trip.", "zh": "他們翻山越谷。他們在旅途中經歷了很多困難。", "hl": false, "note": ""}, {"sp": "", "en": "Finally, the Huang family arrived back home in August of 2003. They spent about a year on this trip.", "zh": "最後，黃家在 2003 年 8 月回到家。他們在這趟旅程上花了大約一年。", "hl": false, "note": ""}, {"sp": "", "en": "This story is amazing. Next time, when you see bike lovers on roads or bike paths, would you want to join them for a ride?", "zh": "這個故事很了不起。下次你在路上或自行車道上看到單車愛好者時，你會想加入他們一起騎嗎？", "hl": false, "note": ""}]}, {"id": "x1", "title": "易混淆字：work／job、study／learn", "src": "課本 p.83", "lines": [{"sp": "work", "en": "A large part of my work is answering phone calls from customers.", "zh": "我的工作有一大部分是接聽客戶的電話。", "hl": true, "note": "work 不可數名詞：泛指工作的表現、情況；也可當動詞。"}, {"sp": "job", "en": "Lillian got a job as a teacher in a junior high school.", "zh": "Lillian 在一所國中找到教職工作。", "hl": true, "note": "job 可數名詞：指某種特定的工作、職位（a job）。"}, {"sp": "study", "en": "Tim studied history in England when he was in college.", "zh": "Tim 大學時在英國攻讀歷史。", "hl": false, "note": "study＝研讀某學科，通常在學校。"}, {"sp": "learn", "en": "I will learn to drive when I turn 18.", "zh": "當我 18 歲時我將要去學開車。", "hl": false, "note": "learn＝透過學習獲得知識或技能。"}]}], "grammar": [{"id": "r2-tense", "name": "總整理：過去簡單式 vs 過去進行式", "icon": "🕰️", "c": ["PAST-PROG", "WHEN-WHILE", "BEF-AFT", "TIME-TELL"], "intro": "<b>過去簡單式</b>＝那件事做了（一下子、做完了）；<b>過去進行式</b>＝那個時間點<b>正在做</b>。看到 <b>at＋時間點、then、at that time、while</b> → 多半是進行式；看到 <b>when＋短動作、before／after</b> → 兩邊多半是過去簡單式。", "table": [["線索", "時態", "例句"], ["at half past nine／then", "過去進行式", "Sue was swimming at half past nine."], ["started／finished（做了）", "過去簡單式", "Sue started swimming at 9:00. She finished at a quarter to eleven."], ["while＋長動作", "過去進行式", "While I was having breakfast, Ken arrived."], ["before／after", "兩邊都過去簡單式", "My brother cleaned the house before Dad came home."]], "flows": [{"title": "一個人的早上", "steps": [{"tokens": ["Sue", "started", "swimming", "at", "9:00", "."], "hl": [1, 2], "note": "開始游（一下子）→ 過去簡單式 started"}, {"tokens": ["Sue", "was", "swimming", "at", "half", "past", "nine", "."], "hl": [1, 2], "note": "九點半那個時間點正在游 → was swimming"}, {"tokens": ["Sue", "finished", "swimming", "at", "a", "quarter", "to", "eleven", "."], "hl": [1, 2], "note": "游完（一下子）→ finished；10:45＝a quarter to eleven"}]}], "tutor": [{"say": "「At half past nine, Sue ___ in the pool.」", "ch": [{"t": "swims", "ok": false, "re": "at＋過去時間點 → 過去進行式。"}, {"t": "was swimming", "ok": true, "re": "對！那個時間點正在游。"}, {"t": "swam", "ok": false, "re": "swam 是游了（完成），這裡要「正在」。"}]}, {"say": "「My brother cleaned the house ___ Dad came home.」（先打掃，爸爸後回家）", "ch": [{"t": "before", "ok": true, "re": "對！before＋後發生的事。"}, {"t": "after", "ok": false, "re": "爸爸是後回來的 → before。"}]}]}, {"id": "r2-verb", "name": "總整理：to V 還是 V-ing？", "icon": "📊", "c": ["TO-V", "V-ING", "BOTH", "GER-SUBJ", "IT-TO"], "intro": "課本 p.78 的表：<b>want、need、ask</b> 只接 to V；<b>enjoy、practice、keep</b> 只接 V-ing；<b>begin、start</b> 兩種都可以。動作當主詞用 V-ing（單數），也可以改成 It is… to V。", "table": [["動詞", "to＋V", "V-ing"], ["want／need／ask", "✓", "✗"], ["enjoy／practice／keep", "✗", "✓"], ["begin／start", "✓", "✓"], ["動作當主詞", "It is fun to play the violin.", "Playing the violin is fun."]], "flows": [{"title": "Josh 的一年", "steps": [{"tokens": ["He", "enjoyed", "going", "surfing", "."], "hl": [1, 2], "note": "enjoy＋V-ing"}, {"tokens": ["He", "wanted", "to", "win", "a", "trophy", "."], "hl": [1, 2, 3], "note": "want＋to V"}, {"tokens": ["Surfing", "was", "his", "favorite", "thing", "."], "hl": [0, 1], "note": "動名詞當主詞 → was"}]}], "tutor": [{"say": "「He enjoyed ___ (go) surfing.」", "ch": [{"t": "to go", "ok": false, "re": "enjoy 只接 V-ing。"}, {"t": "going", "ok": true, "re": "對！enjoy＋V-ing。"}]}, {"say": "「He wanted ___ (win) a trophy.」", "ch": [{"t": "to win", "ok": true, "re": "對！want＋to V。"}, {"t": "winning", "ok": false, "re": "want 只接 to V。"}]}]}], "questions": [{"id": "R2:mc01", "t": "mc", "set": "mc", "c": ["PAST-PROG", "TIME-TELL"], "q": "A: Wha function confetti(){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const box=document.createElement("div"); box.className="confetti";
  const cs=["#ff8a3d","#e84393","#22a35a","#2f80ed","#f5a524","#7c6cf0"];
  for (let i=0;i<40;i++){ const e=document.createElement("i"); e.style.left=Math.random()*100+"vw"; e.style.background=cs[i%cs.length]; e.style.animationDelay=Math.random()*0.3+"s"; box.appendChild(e); }

let AC=null;
function beep(ok){ try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); const o=AC.createOscillator(), g=AC.createGain(); o.connect(g); g.connect(AC.destination); o.frequency.value=ok?880:220; o.type=ok?"triangle":"sawtooth"; g.gain.setValueAtTime(.06,AC.currentTime); g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+.25); o.start(); o.stop(AC.currentTime+.26); }catch(e){} }

// 每答一題：答對加 10 XP、累積連對；段考模擬不在這裡處理
function gameAnswer(ok){
  if (!QZ || QZ.exam) return;
  QZ.streak = ok ? (QZ.streak||0)+1 : 0;
  QZ.maxStreak = Math.max(QZ.maxStreak||0, QZ.streak);
  beep(ok);
  if (!ok) return;
  addXP(10); award("first");
  if (QZ.streak>=5) award("streak5");
  if (QZ.streak>=10) award("streak10");
  if (QZ.streak>=3 && QZ.streak%3===0){ toast(`🔥 連對 ${QZ.streak} 題！`); confetti(); }
}
// 一回合結束：記每課最佳答對率（給首頁星星）、發徽章；回傳結果卡上方的表情＋星星
function gameResult(n, ok){
  const r = n ? ok/n : 0;
  if (QZ.exam){ addXP(30); award("exam"); return `<div class="bigemo">🏅</div>`; }
  const byL = {};
  QZ.res.forEach(x=>{ const L=x.q.L||(LS&&LS.id); if(!L) return; const b=byL[L]||(byL[L]={n:0,ok:0}); b.n++; if(x.ok) b.ok++; });
  Object.entries(byL).forEach(([L,b])=>{ if (b.n>=5) S.best[L]=Math.max(S.best[L]||0, b.ok/b.n); });
  save();
  if (n>=5 && ok===n) award("perfect");
  if (/^錯題本/.test(QZ.title) && !Object.keys(S.wrong).length) award("clean");
  if (r>=.8) confetti();
  return `<div class="bigemo">${r===1?"🏆":r>=.8?"🌟":r>=.6?"👍":"💪"}</div><div>${starsHTML(starsOf(r))}${QZ.maxStreak?`　<span class="muted">最長連對 ${QZ.maxStreak} 題</span>`:""}</div>`;
}

async function flushLog(leaving){

      flushing = false; if (LQ.length && !leaving) return flushLog();

function speak(text, opt={}){
  return new Promise(res=>{
    if (!("speechSynthesis" in window)) return res();
    const u = new SpeechSynthesisUtterance(text);
    u.lang="en-US"; if (VOICE) u.voice=VOICE;
    u.rate = opt.rate || 0.85; u.pitch = opt.pitch || 1;
    u.onend = res; u.onerror = res;
    speechSynthesis.speak(u);
  });
}
async function speakTalk(script){
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  for (const part of script.split("|")){
    const m = part.match(/^(W|M|Q):\s*(.*)$/);
    if (!m){ await speak(part); continue; }
    const pitch = m[1]==="W" ? 1.3 : m[1]==="M" ? 0.75 : 1;
    await speak((m[1]==="Q" ? "Question. " : "") + m[2], {pitch});
    await new Promise(r=>setTimeout(r,350));
  }
}

/* ───────── 家庭樹：關係計算 ───────── */
function famMap(F){ const m={}; F.people.forEach(p=>m[p.id]=p); return m; }
function siblings(m, id){ const p=m[id]; if(!p.par.length) return [];
  return Object.values(m).filter(q=>q.id!==id && q.par.some(x=>p.par.includes(x))).map(q=>q.id); }
function rel(F, a, b){ // a 是 b 的什麼人
  const m = famMap(F), A=m[a], B=m[b]; if(!A||!B||a===b) return null;
  const g = (mw,fw)=> A.sex==="m"?mw:fw;
  if (A.sp===b) return g("husband","wife");
  if (B.par.includes(a)) return g("father","mother");
  if (A.par.includes(b)) return g("son","daughter");
  if (siblings(m,a).includes(b)) return g("brother","sister");
  if (B.par.some(p=>m[p].par.includes(a))) return g("grandfather","grandmother");
  if (A.par.some(p=>m[p].par.includes(b))) return g("grandson","granddaughter");
  const bParSibs = B.par.flatMap(p=>siblings(m,p));
  if (bParSibs.includes(a) || bParSibs.some(s=>m[s].sp===a)) return g("uncle","aunt");
  if (A.par.some(p=>bParSibs.includes(p))) return "cousin";
  // uncle／aunt 的反方向（課外字，只顯示不出題）
  if (A.par.some(p=>siblings(m,p).includes(b) || siblings(m,p).some(s=>m[s].sp===b))) return g("nephew","niece");
  return null;
}
const EXTRA = {nephew:"姪子／外甥", niece:"姪女／外甥女"};
const REL_M = ["father","son","brother","husband","grandfather","grandson","uncle","cousin"];
const REL_F = ["mother","daughter","sister","wife","grandmother","granddaughter","aunt","cousin"];

function treeSVG(F, sel=[]){
  const m=famMap(F), W=66, H=120, R=23, ox=6, oy=30;
  const X=p=>ox+p.x*W+W/2, Y=p=>oy+p.y*H;
  const maxx=Math.max(...F.people.map(p=>p.x)), maxy=Math.max(...F.people.map(p=>p.y));
  let s=`<svg viewBox="0 0 ${ox*2+(maxx+1)*W} ${oy+maxy*H+80}" role="img" aria-label="${esc(F.title)}">`;
  const done=new Set();
  F.people.forEach(p=>{ if(p.sp && !done.has(p.sp)){ done.add(p.id); const q=m[p.sp];
    s+=`<line x1="${X(p)}" y1="${Y(p)}" x2="${X(q)}" y2="${Y(q)}" stroke="var(--ink-3)" stroke-width="2"/>`; }});
  const groups={};
  F.people.forEach(p=>{ if(p.par.length){ const k=p.par.slice().sort().join("+"); (groups[k]=groups[k]||[]).push(p);} });
  Object.entries(groups).forEach(([k,kids])=>{
    const [a,b]=k.split("+").map(i=>m[i]); const mx=(X(a)+X(b))/2, py=Y(a), by=py+H*0.55;
    const xs=kids.map(X); const x1=Math.min(...xs,mx), x2=Math.max(...xs,mx);
    s+=`<g stroke="var(--ink-3)" stroke-width="1.5" opacity=".7"><line x1="${mx}" y1="${py}" x2="${mx}" y2="${by}"/><line x1="${x1}" y1="${by}" x2="${x2}" y2="${by}"/>`;
    kids.forEach(c=>s+=`<line x1="${X(c)}" y1="${by}" x2="${X(c)}" y2="${Y(c)-R}"/>`); s+=`</g>`;
  });
  F.people.forEach(p=>{
    const on = sel.indexOf(p.id);
    const fill = on===0 ? "var(--accent)" : on===1 ? "var(--accent-line)" : "var(--surface-2)";
    s+=`<g class="pn" data-p="${p.id}"><circle cx="${X(p)}" cy="${Y(p)}" r="${R}" fill="${fill}" stroke="${on>=0?"var(--accent)":"var(--line)"}" stroke-width="${on>=0?2.5:1.5}"/>`+
       `<text x="${X(p)}" y="${Y(p)+6}" text-anchor="middle" font-size="18">${p.sex==="m"?"👦":"👧"}</text>`+
       `<text x="${X(p)}" y="${Y(p)+R+19}" text-anchor="middle" font-size="19" font-weight="700" fill="currentColor">${p.id}</text>`+
       `<text x="${X(p)}" y="${Y(p)+R+37}" text-anchor="middle" font-size="15" fill="var(--ink-3)">${p.age}</text></g>`;
  });
  return s+"</svg>";
}
function famQuestions(F, n){
  const ids=F.people.map(p=>p.id), out=[], seen=new Set();
  let guard=0;
  while(out.length<n && guard++<500){
    const a=ids[Math.floor(Math.random()*ids.length)], b=ids[Math.floor(Math.random()*ids.length)];
    const r=rel(F,a,b); if(!r || EXTRA[r]) continue;
    const kind=["word","flip","who"][Math.floor(Math.random()*3)];
    const key=kind+a+b; if(seen.has(key)) continue; seen.add(key);
    const A=famMap(F)[a], pool=(A.sex==="m"?REL_M:REL_F).filter(x=>x!==r);
    if(kind==="word"){
      const o=shuffle([r,...pick(pool,3)]);
      out.push({id:`fam:${F.id}:w:${a}:${b}`,t:"mc",c:["FAM-WORD"],tree:F.id,q:`${a} is ${b}'s ___.`,o,a:o.indexOf(r),
        x:`看家庭樹：${a} 是 ${b} 的 <b>${r}</b>。`});
    } else if(kind==="flip"){
      const r2=rel(F,b,a); if(!r2 || EXTRA[r2]) continue;
      const B=famMap(F)[b]; const pool2=(B.sex==="m"?REL_M:REL_F).filter(x=>x!==r2);
      const o=shuffle([r2,...pick(pool2,3)]);
      out.push({id:`fam:${F.id}:f:${a}:${b}`,t:"mc",c:["FAM-FLIP"],tree:F.id,q:`${a} is ${b}'s ${r}.<br>So ${b} is ${a}'s ___.`,o,a:o.indexOf(r2),
        x:`換 ${b} 當主詞：${b} 是${B.sex==="m"?"男生":"女生"} → <b>${r2}</b>。`});
    } else {
      const ans=ids.filter(i=>rel(F,i,b)===r); if(ans.length!==1) continue;
      const o=shuffle([a,...pick(ids.filter(i=>i!==a&&i!==b),3)]);
      out.push({id:`fam:${F.id}:h:${a}:${b}`,t:"mc",c:["FAM-WORD","WH"],tree:F.id,q:`Who is ${b}'s ${r}?`,o,a:o.indexOf(a),
        x:`${b}'s ${r} 是 <b>${a}</b>。`});
    }
  }
  return out;
}

// 產生看起來很像的錯誤拼法：只用學生常犯的錯，三個選項盡量各來自不同錯法
//   母音混淆（a/e、e/i、o/u、ou/o、ea/ee…）、相鄰字母對調、漏掉不發音或重複的字母、該重複沒重複／不該重複卻重複
function misspell(word){
  const parts=word.split(" "); let k=0; parts.forEach((p,i)=>{ if(p.replace(/[^a-z]/gi,"").length>parts[k].replace(/[^a-z]/gi,"").length) k=i; });
  const base=parts[k], low=base.toLowerCase(), V="aeiou";
  const real=new Set(ALLW.map(x=>x.w.toLowerCase()).concat(ALLW.map(x=>(x.pl||"").toLowerCase())));
  // 剛好是別的真實單字的不要用（會讓孩子以為是別的字）
  const REALWORDS=new Set("jug jig wire wash mast babe lest gust west best rest list lost dose rose nose pore poir most deed wall pour boy peck sacred sill mess ware mod mis wes pas het sel wel por bay buy guy toy way ego age ape ate cay cow cue few fee fey foe dew sew mew new now how who whey wry try dry fry pry ran ron rum gun nun sun bun men man pin pen pan pun pit pat pet put but bat bet bit hat hot hut hit sit set sat dad bed bad bid bud mad mud cub cab cob arm aim art ram rim ham hem him hum mood mode made mile meal mail sale sole seal tell till toll will wail weal wool hall hell hill hull fill fell fall full bell ball bill bull read reed rood seed said sued feed food fold field yield".split(" "));
  const ok=x=>x && x.toLowerCase()!==low && !/(.)\1\1/.test(x) && !/[aeiou]{3}/.test(x) && !real.has(x.toLowerCase()) && !REALWORDS.has(x.toLowerCase());
  const cats={vowel:[], swap:[], drop:[], dbl:[]};
  const add=(c,x)=>{ if(ok(x) && !cats[c].includes(x)) cats[c].push(x); };
  // ① 母音混淆（不改第一個字母和最後一個字母）
  const pairs=[["ou","o"],["o","ou"],["ea","ee"],["ee","ea"],["ai","ay"],["er","ar"],["or","er"],["y","ie"],["a","e"],["e","a"],["e","i"],["i","e"],["o","u"],["u","o"],["i","y"]];
  pairs.forEach(([a,b])=>{ let at=low.indexOf(a,1); while(at>0 && at+a.length<low.length){ add("vowel", base.slice(0,at)+b+base.slice(at+a.length)); at=low.indexOf(a,at+1); } });
  // ② 相鄰兩個字母對調（中間字母）
  for (let n=1;n<base.length-2;n++) if (low[n]!==low[n+1] && /[a-z]/.test(low[n]+low[n+1])) add("swap", base.slice(0,n)+base[n+1]+base[n]+base.slice(n+2));
  // ③ 漏字母：不發音或容易漏的字母（重複字母的其中一個、e、h、b、w、u、gh）
  for (let n=1;n<base.length;n++){ const c=low[n];
    if (c===low[n-1] || (base.length>=5 && "ehbwu".includes(c) && n<base.length-1)) add("drop", base.slice(0,n)+base.slice(n+1)); }
  if (low.includes("gh")) add("drop", base.replace(/gh/i,""));
  // ④ 子音重複錯（該重複沒重複已在 ③；這裡是不該重複卻重複：中間子音或短字字尾）
  for (let n=1;n<base.length;n++){ const c=low[n];
    if ("lmnprstgc".includes(c) && c!==low[n-1] && c!==low[n+1] && (n<base.length-1 || base.length<=3)) add("dbl", base.slice(0,n+1)+base[n]+base.slice(n+1)); }
  // 短字（3–4 個字母）湊不滿時：母音換掉（含第一個字母）、尾巴多一個 e 或 h、前兩個或最後兩個字母對調
  if (Object.values(cats).flat().length<3){
    for (let n=0;n<base.length;n++){ if (V.includes(low[n]) || low[n]==="y") ["a","e","i","o","u","y"].forEach(v=>{ if(v!==low[n]) add("vowel", base.slice(0,n)+v+base.slice(n+1)); }); }
    add("dbl", base+"e"); add("dbl", base+"h"); add("swap", base[1]+base[0]+base.slice(2));
    if (base.length>=3) add("swap", base.slice(0,-2)+base.slice(-1)+base.slice(-2,-1));
  }
  const order=shuffle(Object.keys(cats)).filter(c=>cats[c].length), out=[];
  order.forEach(c=>{ if(out.length<3) out.push(pick(cats[c],1)[0]); });
  const rest=shuffle(Object.values(cats).flat().filter(x=>!out.includes(x)));
  while (out.length<3 && rest.length) out.push(rest.pop());
  return out.map(x=>{ const t=parts.slice(); t[k]=x; return t.join(" "); });
}
function zhQ(w){ return {id:"ze:"+w.w, t:"fill", c:["V-SP"], q:`${w.zh}（${w.pos}）→ ___`, a:[w.w], x:`${w.w}：${w.zh}`}; }

const noTypeOk = q => !(QZ && QZ.noType) || (q.t==="fill" ? !!q.o : !["spell","verb"].includes(q.t));
function poolFor(code){

/* ───────── 作答紀錄＋錯題本 ───────── */
function record(q, okByConcept){ // okByConcept: {code: bool}
  for (const [c,ok] of Object.entries(okByConcept)){
    const s = S.stats[c] || (S.stats[c]={n:0,w:0}); s.n++; if(!ok) s.w++;
  }
  // 大小寫標點（MECH）只提醒、另外記統計，不影響這題的對錯
  const allOk = Object.entries(okByConcept).filter(([c])=>c!=="MECH").every(([,v])=>v);
  if (!allOk){ S.wrong[q.id] = {q, s:0}; }
  else if (S.wrong[q.id]){ S.wrong[q.id].s++; if (S.wrong[q.id].s>=2){ delete S.wrong[q.id]; if (!(QZ && QZ.exam)) toast("🎓 這題從錯題本畢業了！"); } }
  save(); return allOk;
}

// 解析改成「一步一步看」播放器（10/24，共用 _共用\stepplay.js，build 時內嵌）：
// 你寫的／正確答案對照（.ya）、大小寫提醒（.fb）、句子解析色塊（.sxbox）不切步、一直顯示；中間的說明文字放進 .sp-x 逐步播放
function stepFb(fb){
  if (!fb || !window.StepPlay) return;
  const FIX = ".ya, .sxbox, .fb", kids = [...fb.childNodes];
  const fixed = n => n.nodeType===1 && n.matches(FIX), blank = n => n.nodeType===3 && !n.nodeValue.trim();
  let a = 0, b = kids.length;
  while (a<b && (fixed(kids[a]) || blank(kids[a]))) a++;
  while (b>a && (fixed(kids[b-1]) || blank(kids[b-1]))) b--;
  const mid = kids.slice(a, b);
  if (!mid.some(n => (n.textContent||"").trim() || (n.nodeType===1 && n.querySelector("svg,img")))) return;   // 沒有說明文字：不放空的播放器
  const sp = document.createElement("div"); sp.className = "sp-x";
  fb.insertBefore(sp, mid[0]);
  mid.forEach(n => { if (fixed(n)) n.classList.add("sp-atom"); sp.appendChild(n); });   // 夾在中間的固定區塊整塊出現、不拆
  fb.querySelectorAll(".sxbox").forEach(x => x.classList.add("sp-skip"));
  StepPlay.enhance(sp);
}

// 學生答案和正確答案逐字母比對：錯的字母標紅、漏掉的字母用紅色底線格補上
function diffHTML(got, want){
  got=String(got||""); want=String(want||"");
  if (loose(got)===loose(want)) return `<span style="color:var(--ok);font-weight:600">${esc(got)}</span>`;
  const a=got, b=want, n=a.length, m=b.length;
  // LCS 對齊（字很短，直接 DP）
  const dp=Array.from({length:n+1},()=>Array(m+1).fill(0));
  for (let i=n-1;i>=0;i--) for (let j=m-1;j>=0;j--)
    dp[i][j] = a[i].toLowerCase()===b[j].toLowerCase() ? dp[i+1][j+1]+1 : Math.max(dp[i+1][j], dp[i][j+1]);
  let i=0, j=0, out="";
  while (i<n || j<m){
    if (i<n && j<m && a[i].toLowerCase()===b[j].toLowerCase()){ out+=esc(a[i]); i++; j++; }
    else if (j<m && (i>=n || dp[i][j+1]>=dp[i+1][j])){ out+=`<span class="dmiss">${esc(b[j])}</span>`; j++; }   // 漏掉的字母
    else { out+=`<span class="dbad">${esc(a[i])}</span>`; i++; }                                              // 多打或打錯的字母
  }
  return `<span class="dword">${out}</span>`;
}
// 比對時忽略空格、大小寫和標點；撇號只有「所有格」題才算（girls'、its／it's 是考點）
const squash = (s, keepApos) => String(s||"").toLowerCase().replace(/[’‘`]/g,"'")
  .replace(keepApos ? /[\s.,!?;:"“”]/g : /[\s.,!?;:"“”']/g, "");
const same = (a, b, keepApos) => squash(a, keepApos) === squash(b, keepApos);
// 學生答案＋正確答案：兩行大字對照，答對答錯都顯示
function yourAnswer(got, want, ok){

  const mine = !g ? '<span class="muted">（沒有作答）</span>' : ok ? `<span class="ya-ok">${esc(g)}</span>` : diffHTML(g, want);
  const note = ok && g && norm(g)!==norm(want) ? `<div class="ya-note">✔ 算對（空格、標點、大小寫不影響）。標準寫法看上面的「正確答案」。</div>` : "";
  return `<div class="ya ${ok?"is-ok":"is-ng"}"><div class="ya-row"><span class="ya-lab">你寫的</span><span class="ya-val">${mine}</span></div>
    <div class="ya-row"><span class="ya-lab">正確答案</span><span class="ya-val"><b>${esc(want)}</b></span></div>${note}</div>`;
}
function blankify(s){ return s.replace(/___/g,'<span class="blank">&nbsp;</span>'); }
// 填空：每個字一格。答案（第一個標準答案）有幾個字就給幾格；題目裡獨立的 ___ 換成格子（a___n 這種首字母提示不動）
const FILL_RE = /(?<![A-Za-z])___(?![A-Za-z])/g;
function fillN(q){ return q.a[0].trim().replace(/[.?!]$/,"").split(/\s+/).filter(Boolean).length; }
function fillLayout(q, cell){
  const n=fillN(q); let s=q.q.replace(/（兩格用空格隔開）/g,""), i=0;
  const k=(s.match(FILL_RE)||[]).length;
  if (k===n) s=s.replace(FILL_RE, ()=>cell(i++));
  else if (k===1) s=s.replace(FILL_RE, ()=>Array.from({length:n},()=>cell(i++)).join(""));
  s=blankify(s);
  const rest = i<n ? `<div class="wrow">${Array.from({length:n-i},()=>cell(i++)).join("")}</div>` : "";
  return {html:s+rest, n};
}
function fillHTML(q){
  const {html, n}=fillLayout(q, i=>`<input class="wbox" data-i="${i}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="第 ${i+1} 個字">`);
  return `<div class="q">${html}</div><div class="sub">共 ${n} 個字，一格寫一個字${n>1?"（按空白鍵跳到下一格）":""}</div>`;

function wireBoxes(box){

    else if (e.key==="Backspace" && !b.value && bx[i-1]){ e.preventDefault(); bx[i-1].focus(); }

    const isSub=i=>{ const l=toks[i].t.toLowerCase(), nx=toks[i+1]?toks[i+1].t:"";
      if (l==="when"||l==="while") return true;
      if (l==="before"||l==="after") return SUBJW(nx.toLowerCase()) || /^[A-Z]/.test(nx);
      return false; };

    const s0 = toks.length>1 && ["and","but","so"].includes(toks[0].t.toLowerCase()) && toks[0].p==="," ? 1 : 0;
    const lead = toks.length>s0 && !/\?$/.test(s) && (isSub(s0) || toks[s0].t.toLowerCase()==="because") ? toks.findIndex((x,k)=>k>s0 && x.p===",") : -1;
    const parts=[]; let cur=[];
    toks.forEach((x,i)=>{ const l=x.t.toLowerCase();
      if (i<=s0 && lead>0){ parts.push([{t:x.t,cj:1}]); return; }
      if (((l==="and"||l==="but"||l==="so") && i>0 && toks[i-1].p===",") || (l==="because" && i>0) || (i>0 && i!==lead+1 && isSub(i) && !/\?$/.test(s))){ parts.push(cur); parts.push([{t:x.t,cj:1}]); cur=[]; }
      else cur.push(x);
      if (i===lead){ parts.push(cur); cur=[]; } });

    html += `<div class="sx"><div class="sx-type"><b>${tn}</b>　<span class="sub">${tr}</span></div>
      <div class="sx-row">${chips.map(c=>`<span class="sx-chip ${ROLE[c.role][1]}"><span>${esc(c.t)}</span><small>${ROLE[c.role][0]}</small></span>`).join("")}</div></div>`;
  });

  const seen=new Set(), words=[];

  en.split(/\s+/).forEach(raw=>{ let t=raw.toLowerCase().replace(/[,.?!]/g,"").replace(/’/g,"'").replace(/'s$|'$/,"");
    const e=wmap()[t]; if (e && !seen.has(e.w.w) && !["a","an","the"].includes(t)){ seen.add(e.w.w); words.push({w:e.w, pl:e.pl, form:t}); } });

  if (/\b(am|is|are|'m|'s|'re) from\b/.test(lower)) phr.push(["be from","來自……","I'm from a warm family."]);
  if (/about \d/.test(lower)) phr.push(["about＋數字","大約",""]);
  if (/, too[.!?]?$/.test(lower)) notes.add("句尾的 , too＝也（前面加逗號）");
  if (/\b(an)\s/i.test(en)) notes.add("an＋母音開頭的字（看緊接在後面那個字的發音）");
  if (/\b(these|those)\b/i.test(en)) notes.add("these／those 是複數：be 動詞用 are，回答換成 they");
  if (/\b(this|that)\b/i.test(en) && /\?$/.test(en.trim())) notes.add("this／that 的回答換成 it");
  html += zh ? `<div class="sx-sec"><b>中文</b>　${zh}</div>` : "";
  if (words.length) html += `<div class="sx-sec"><b>單字</b><div class="row" style="margin-top:4px">${words.map(({w,pl})=>
      `<span class="badge">${esc(pl?w.pl:w.w)}${pl?`（${esc(w.w)} 的${FORM}）`:""}　${w.pos}　${esc(w.zh)}</span>`).join("")}</div></div>`;
  if (phr.length) html += `<div class="sx-sec"><b>片語</b>${phr.map(p=>`<div>・<b>${esc(p[0])}</b>　${p[1]}${p[2]?`<span class="muted">　${esc(p[2])}</span>`:""}</div>`).join("")}</div>`;
  if (notes.size) html += `<div class="sx-sec"><b>文法重點</b>${[...notes].map(x=>`<div>・${esc(x)}</div>`).join("")}</div>`;
  return `<details class="sxbox" open><summary>🔍 句子解析</summary>${html}</details>`;
}
function fillSentence(q){ // 手寫題：把答案填回句子，給句子解析用
  const parts=q.q.split("<br>"); if (parts.length<2) return null;

  const ws=q.a[0].split(" "), n=(parts[1].match(/___/g)||[]).length;
  let k=0; const en = n>1 ? parts[1].replace(/___/g, ()=>ws[k++]||"") : parts[1].replace("___", q.a[0]);
  return {en: en.replace(/（[^）]*）/g,"").trim(), zh: parts[0]};
}

// 填空題的點選版（文法單元 noType）：兩格的題目選項用「／」分開，依序填進兩個空格

    <div class="sub">點一個答案${n>1?"（依序填進兩個空格）":""}。</div><div class="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}">(${"ABCD"[i]}) ${esc(show(o))}</button>`).join("")}</div>`;

// 排句子答錯時，說明「這個位置應該放哪一種字」（不直接講答案）
function roleOf(token){
  const t=String(token||"").replace(/[,.?!]/g,""), lo=t.toLowerCase().replace(/’/g,"'");
  if (["am","is","are","isn't","aren't","was","were","wasn't","weren't"].includes(lo)) return "be 動詞";
  if (["did","didn't","do","does","don't","doesn't","can","could"].includes(lo)) return "助動詞（did／do…）";
  if (["who","what","how","why","where","when","who's","what's"].includes(lo)) return "疑問詞";
  if (["because","so"].includes(lo)) return "連接詞（because／so）";
  if (/^(i'm|he's|she's|it's|that's|you're|we're|they're)$/.test(lo)) return "主詞＋be 動詞（縮寫）";
  if (["i","you","he","she","it","we","they","this","that","these","those"].includes(lo)) return "主詞（代名詞）";
  if (["my","your","his","her","its","our","their"].includes(lo) || /'s$|s'$/.test(lo)) return "所有格（誰的）";
  if (["a","an","the"].includes(lo)) return "冠詞（a／an／the）";
  if (["and","but","or"].includes(lo)) return "連接詞";
  if (lo==="not") return "not（否定）";
  if (lo==="too") return "too（也）";
  if (/^\d/.test(lo)) return "數字";
  const e=wmap()[lo];
  if (e) return {"n.":"名詞","adj.":"形容詞","v.":"動詞","adv.":"副詞","conj.":"連接詞","pron.":"代名詞"}[e.w.pos] || "字";
  if (/^[A-Z]/.test(t)) return "人名或專有名詞";
  return "字";
}
function confReason(c, d){
  const lc=String(c||"").toLowerCase(), ld=String(d).toLowerCase();
  if (["is","are","am","isn't","aren't"].includes(ld)) return `干擾卡「<b>${esc(d)}</b>」不對：be 動詞要跟主詞搭配（I → am；he、she、it、單數名詞 → is；you、we、they、複數名詞 → are）。`;
  if (["a","an"].includes(ld)) return `干擾卡「<b>${esc(d)}</b>」不對：看<b>緊接在後面那個字</b>的發音，母音開頭用 an，子音開頭用 a。`;
  if (["he","his","she","her","they","their"].includes(ld)) return `干擾卡「<b>${esc(d)}</b>」不對：當主詞（後面接 be 動詞）用 he／she／they；後面接名詞要用所有格 his／her／their。`;
  if (["who","what"].includes(ld)) return `干擾卡「<b>${esc(d)}</b>」不對：問「人」用 Who，問「東西、名字」用 What，問「原因」用 Why。`;
  if (["was","were","wasn't","weren't"].includes(ld)) return `干擾卡「<b>${esc(d)}</b>」不對：I、he、she、it、單數名詞 → was；you、we、they、複數名詞 → were。`;
  if (["because","so"].includes(ld)) return `干擾卡「<b>${esc(d)}</b>」不對：because 接<b>原因</b>，so 接<b>結果</b>；一句裡只能用一個。`;
  if (["does","do","don't"].includes(ld)) return `干擾卡「<b>${esc(d)}</b>」不對：句子講的是過去的事（yesterday、last、ago），助動詞要用 did／didn't。`;
  return `干擾卡「<b>${esc(d)}</b>」不對：注意單複數和特殊複數的拼法（children、women、men 不加 s；兩個以上要用複數）。`;
}

function worstConcept(items){
  const miss={};
  items.forEach(r=>Object.entries(r.okByConcept).forEach(([c,ok])=>{ if(!ok) miss[c]=(miss[c]||0)+1; }));
  const rate=c=>{const s=S.stats[c]; return s&&s.n? s.w/s.n : 0;};
  const arr=Object.keys(miss).sort((a,b)=>miss[b]-miss[a] || rate(b)-rate(a));
  return arr.length ? {code:arr[0], miss:miss[arr[0]]} : null;
}
function stepWidget(flow, id){
  return `<div class="card" id="${id}" data-i="0"><b>${flow.title}</b><div class="chips"></div><div class="stepnote"></div>
    <div class="row"><button class="btn ghost small" data-act="prev">◀ 上一步</button><button class="btn small" data-act="next">下一步 ▶</button><span class="muted sc"></span></div></div>`;
}
function bindStep(flow, id){
  const el=$("#"+id); if(!el) return;
  const draw=()=>{ const i=+el.dataset.i, st=flow.steps[i];
    el.querySelector(".chips").innerHTML = st.tokens.map((t,k)=>`<span class="chipw ${st.hl.includes(k)?"on":""}">${esc(t)}</span>`).join("");
    el.querySelector(".stepnote").innerHTML = st.note;
    el.querySelector(".sc").textContent = `${i+1} / ${flow.steps.length}`;
    el.querySelector('[data-act="prev"]').disabled = i===0;
    el.querySelector('[data-act="next"]').disabled = i===flow.steps.length-1; };
  el.querySelector('[data-act="prev"]').onclick=()=>{ el.dataset.i=Math.max(0,+el.dataset.i-1); draw(); };
  el.querySelector('[data-act="next"]').onclick=()=>{ el.dataset.i=Math.min(flow.steps.length-1,+el.dataset.i+1); draw(); };
  draw();
}
function renderCheckpoint(){
  const items = QZ.recent.splice(0); QZ.cp=false;
  const w = worstConcept(items);
  if (!w){
    page(QZ.title, `<div class="card center"><div class="score">🎉</div><h2>這 8 題全對！</h2><p class="muted">沒有發現弱點，繼續加油。</p><button class="btn" id="go">繼續 →</button></div>`, QZ.back);
    $("#go").onclick=renderQuiz; return;
  }
  const C=CN[w.code], G=ALLG.find(g=>g.id===C.g), flow=G&&G.flows[0];
  page(QZ.title, `<div class="card"><div class="sub">🔍 弱點分析（剛剛 8 題）</div><h2>最需要加強：${C.name}</h2><p class="muted">這個觀念錯了 ${w.miss} 次</p>
    <div class="note" style="font-size:16px">${C.tip}</div>${flow?stepWidget(flow,"cpflow"):""}
    <p>接下來加練 3–4 題同一個觀念，<b>全部答對</b>才回到原本的題目。</p><button class="btn" id="go">開始加練</button></div>`, QZ.back);
  if (flow) bindStep(flow,"cpflow");

    const used=new Set(items.map(r=>r.q.id));

  };
}

  const add=x=>{ if (x && x!==p && x!==b+"" && !realW.has(x) && /^[a-z]+$/.test(x) && !/(.)\1\1/.test(x) && !out.includes(x)) out.push(x); };

    swam:"swimmed",won:"winned",told:"telled",sold:"selled",made:"maked",said:"sayed",had:"haved",got:"getted",gave:"gived",
    came:"comed",became:"becomed",knew:"knowed",flew:"flied",drew:"drawed",threw:"throwed",wore:"weared",rode:"rided",
    wrote:"writed",chose:"choosed",broke:"breaked",froze:"freezed",rose:"rised",met:"meeted",lost:"losed",meant:"meaned",
    slept:"sleeped",stood:"standed",fed:"feeded",found:"finded",built:"builded",fell:"falled",drank:"drinked",sang:"singed",
    took:"taked",swept:"sweeped",could:"canned",hit:"hitted",hurt:"hurted",let:"letted",put:"putted",read:"readed",
    heard:"heared",kept:"keeped",left:"leaved",understood:"understanded",began:"beginned",grew:"growed",felt:"feeled",spent:"spended"};

function spellKey(sec){ return `${LS.id}|${sec||"all"}`; }
function spellProgress(sec){

function examReads(n, ids){

}

 * 原始檔：D:\Zettelkasten\20_教學\_共用\stepplay.js。各站產生器 build 時把整支內嵌進網頁，🔴 改這支、不要改產出的 html。

 *   StepPlay.watch("選擇器, 選擇器")   之後這些元素一出現或內容一換，就自動做成播放器（給手寫頁、各站引擎用）
