<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>社會段考原題</title>
<meta name="theme-color" content="#4f46e5">
<link rel="icon" href="icon-192.png">
<style>
/* 設計基準同英文站與歷史頁：8px 網格｜灰階分層｜Indigo 唯一強調色 */
:root{
  --accent:#4f46e5; --accent-ink:#4338ca; --accent-soft:#eef2ff; --accent-line:rgba(79,70,229,.18);
  --bg:#f7f7f8; --surface:#ffffff; --surface-2:#f4f4f5; --line:#e4e4e7;
  --ink:#18181b; --ink-2:#52525b; --ink-3:#a1a1aa;
  --ok:#15803d; --ok-soft:#f0fdf4; --ng:#b91c1c; --ng-soft:#fef2f2; --warn:#a16207; --warn-soft:#fefce8;
  --r-sm:8px; --r-md:12px; --r-lg:16px;
  --sh-1:0 1px 2px rgba(24,24,27,.04),0 1px 3px rgba(24,24,27,.06);
  --ease:cubic-bezier(.2,.8,.2,1); --pad:16px;
}
@media (prefers-color-scheme: dark){
  :root{ --accent:#818cf8; --accent-ink:#a5b4fc; --accent-soft:rgba(129,140,248,.14); --accent-line:rgba(129,140,248,.28);
    --bg:#0c0c0e; --surface:#18181b; --surface-2:#232328; --line:#2e2e34;
    --ink:#f4f4f5; --ink-2:#a1a1aa; --ink-3:#71717a;
    --ok:#4ade80; --ok-soft:rgba(74,222,128,.10); --ng:#f87171; --ng-soft:rgba(248,113,113,.10); --warn:#facc15; --warn-soft:rgba(250,204,21,.10);
    --sh-1:0 1px 2px rgba(0,0,0,.4); }
}
@media (min-width:600px){ :root{ --pad:24px; } }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;-webkit-font-smoothing:antialiased}
#app{max-width:720px;margin:0 auto;padding:0 16px 96px}
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;margin:0 -16px 8px;padding:16px;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
header.top h1{font-size:20px;font-weight:700;letter-spacing:-.01em;margin:0;flex:1;line-height:1.3}
header.top .back{width:40px;height:40px;flex:none;border:0;border-radius:50%;background:var(--surface);color:var(--ink);font-size:18px;cursor:pointer;box-shadow:var(--sh-1)}
header.top .home{flex:none;border:0;border-radius:999px;padding:8px 14px;background:var(--surface);color:var(--accent-ink);font:inherit;font-size:14px;font-weight:600;cursor:pointer;box-shadow:var(--sh-1);white-space:nowrap}
header.top .back:active,header.top .home:active{transform:scale(.94)}
h2{font-size:13px;font-weight:600;letter-spacing:.06em;color:var(--ink-3);margin:32px 0 16px}
h3{font-size:16px;font-weight:600;margin:24px 0 8px}
p{margin:8px 0 16px}
.sub{color:var(--ink-2);font-size:14px}
.muted{color:var(--ink-3);font-size:14px}
b{font-weight:600}
.card{background:var(--surface);border-radius:var(--r-lg);padding:var(--pad);margin:16px 0;box-shadow:var(--sh-1)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;border:0;border-radius:var(--r-lg);padding:16px;background:var(--surface);color:var(--ink);box-shadow:var(--sh-1);cursor:pointer;font:inherit;min-height:112px;transition:transform .2s var(--ease)}
.tile:active{transform:scale(.97)}
.tile .ic{font-size:24px}
.tile b{font-size:15px;line-height:1.3}
.tile small{color:var(--ink-3);font-size:12px;line-height:1.4}
.tile.done{border:2px solid var(--ok)}
.btn{display:inline-block;width:100%;margin:8px 0 0;padding:14px 16px;border:0;border-radius:var(--r-md);background:var(--accent);color:#fff;font:inherit;font-weight:600;font-size:16px;cursor:pointer;transition:transform .15s var(--ease)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:var(--surface);color:var(--accent);border:1px solid var(--accent-line)}
.btn.sm{width:auto;padding:8px 14px;font-size:14px;margin:4px 8px 4px 0}
.row{display:flex;gap:8px;align-items:center}
.prog{height:4px;background:var(--line);border-radius:2px;margin:8px 0 16px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent)}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink);font-weight:600;margin-right:6px}
.tag.g{background:#dcfce7;color:#166534}.tag.h{background:#fef3c7;color:#92400e}.tag.c{background:#dbeafe;color:#1e40af}
@media (prefers-color-scheme: dark){ .tag.g{background:rgba(74,222,128,.15);color:#4ade80}.tag.h{background:rgba(250,204,21,.15);color:#facc15}.tag.c{background:rgba(96,165,250,.15);color:#93c5fd} }
.pas{background:var(--surface-2);border-left:3px solid var(--accent);padding:10px 12px;border-radius:0 var(--r-sm) var(--r-sm) 0;font-size:15px;margin:0 0 12px;color:var(--ink-2);line-height:1.6}
.fig{display:block;max-width:100%;max-height:60vh;margin:8px auto 12px;border-radius:var(--r-sm);background:#fff;padding:4px}
.q{margin:0 0 12px;font-size:17px;line-height:1.65}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);color:var(--ink);font:inherit;font-size:16px;cursor:pointer;line-height:1.5}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ng{border-color:var(--ng);background:var(--ng-soft)}
.opt:disabled{cursor:default;opacity:.85}
.verdict{font-size:22px;font-weight:700;margin:16px 0 8px}
.verdict.ok{color:var(--ok)} .verdict.ng{color:var(--ng)}
.ex{background:var(--surface-2);border-radius:var(--r-sm);padding:12px;font-size:15px;margin:8px 0;line-height:1.65}
.ex .src{display:block;font-size:12px;color:var(--ink-3);margin-top:6px}
.warn{background:var(--warn-soft);color:var(--warn);font-size:14px;padding:8px 12px;border-radius:var(--r-sm);margin:8px 0;line-height:1.5}
.warn::before{content:"⚠️ "}
.big{font-size:40px;font-weight:700;text-align:center;margin:8px 0}
.list{padding-left:20px;margin:8px 0}
details.rv{border-top:1px solid var(--line);padding:10px 0}
details.rv summary{cursor:pointer;font-size:15px;line-height:1.5;list-style:none}
details.rv summary::-webkit-details-marker{display:none}
details.rv summary .n{color:var(--ink-3);font-size:13px;margin-right:6px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const D = {"app": "n8v5", "papers": [{"y": "112", "title": "112 學年", "note": "答案是學校公布的解答。"}, {"y": "113", "title": "113 學年", "note": "答案是學校公布的解答；第 25、48 題的解答有疑問，解析裡會說明。"}, {"y": "114", "title": "114 學年", "note": "學校沒有公布解答，答案是 AI 判讀的；第 2、48 題不確定，考前可以問老師。"}], "subj": [["地理", 1, 17], ["歷史", 18, 34], ["公民", 35, 50]], "questions": [{"id": "112_01", "y": "112", "n": 1, "s": "地理", "q": "中國的省級行政區，劃分為四類，其中「在少數民族聚居的地方，考量族群與文化的完整性而設置者」，指的是下列何種行政區劃？", "o": ["省", "直轄市", "特別行政區", "自治區"], "a": 3, "ex": "自治區是為少數民族設的，像西藏、新疆、內蒙古、寧夏、廣西共五個。省是一般行政區，直轄市是大城市，特別行政區是香港、澳門。", "fig": [], "pas": null, "warn": null}, {"id": "112_02", "y": "112", "n": 2, "s": "地理", "q": "中國的河川大多為「西向東流」，此種流向主要受下列何項因素影響？", "o": ["緯度較低", "地勢高低", "距海遠近", "季風風向"], "a": 1, "ex": "中國地勢西高東低，分成三級階梯，水往低處流，所以大河都往東流入太平洋。", "fig": [], "pas": null, "warn": null}, {"id": "112_03", "y": "112", "n": 3, "s": "地理", "q": "「中國 1970 年代起，陸續實施相關的計畫生育政策，一胎化減緩了人口成長速度，但每年增加的人口數量仍相當龐大。」請問：造成這種現象的原因為何？", "o": ["社會增加率下降", "自然增加率上升", "人口總數眾多", "糧食產量提高"], "a": 2, "ex": "一胎化讓成長「速度」變慢，但人口「總數」太大（十幾億），就算成長率低，每年新增的人數還是很多。", "fig": [], "pas": null, "warn": null}, {"id": "112_04", "y": "112", "n": 4, "s": "地理", "q": "「中國在 2020 年人口普查結果顯示，新生兒性別比為 111.3。」請問：此資料可以顯示出下列哪一項事實？", "o": ["男性新生兒人數較多", "女性新生兒壽命較長", "男性新生兒死亡數較多", "女性新生兒人數較多"], "a": 0, "ex": "性別比＝每 100 個女生對應幾個男生。111.3 表示每 100 個女嬰就有 111 個男嬰，男嬰比較多（一胎化加上重男輕女的結果）。", "fig": [], "pas": null, "warn": null}, {"id": "112_05", "y": "112", "n": 5, "s": "地理", "q": "下圖為中國人口分布圖。請問：依據此圖可以表達下列哪一種現象？", "o": ["東半部人口外移", "中國人口增加快速", "一胎化政策對中國的影響", "中國人口分布不均"], "a": 3, "ex": "圖上的點東南半部密、西北半部稀，分界線大致是黑河—騰衝線。這張圖只看得出「分布不均」，看不出增加或外移。", "fig": ["112_q5"], "pas": null, "warn": null}, {"id": "112_06", "y": "112", "n": 6, "s": "地理", "q": "下圖為中國一月等溫線圖。請問：下列從丁到甲何種地理現象的變化是「正確的」？", "o": ["年降水量漸多", "年溫差漸大", "年均溫漸高", "西南季風漸強"], "a": 1, "ex": "丁在南方、甲在北方。一月（冬天）越往北越冷，但七月南北都熱，所以越往北「年溫差」越大。往北降水減少、年均溫降低、西南季風也越弱。", "fig": ["112_q6"], "pas": null, "warn": null}, {"id": "112_07", "y": "112", "n": 7, "s": "地理", "q": "中國是由 55 個民族所組成。請問：少數民族中人口數最多的是哪一族群？", "o": ["漢族", "壯族", "維吾爾族", "蒙古族"], "a": 1, "ex": "漢族是主體民族，占九成以上，不算「少數」民族。少數民族裡人口最多的是壯族（主要在廣西壯族自治區）。", "fig": [], "pas": null, "warn": null}, {"id": "112_08", "y": "112", "n": 8, "s": "地理", "q": "中國在 2015 年結束了一胎化的政策，並加以鼓勵生育，其最主要為解決哪些問題？甲、高齡化；乙、提高人口素質；丙、勞動力短缺；丁、城鄉人口流動", "o": ["甲乙", "丙丁", "乙丙", "甲丙"], "a": 3, "ex": "一胎化幾十年後，小孩少、老人多（高齡化），年輕勞動力不夠（勞動力短缺），所以開放二胎鼓勵生育。人口素質和城鄉流動跟生幾個沒直接關係。", "fig": [], "pas": null, "warn": null}, {"id": "112_09", "y": "112", "n": 9, "s": "地理", "q": "請問：下列對「青藏高原」的描述，何者「錯誤」？", "o": ["有世界屋脊之稱", "日夜溫差大", "交通工具為駱駝", "氣候、植被隨高度呈垂直變化"], "a": 2, "ex": "青藏高原的交通工具是犛牛（高原之舟）；駱駝是沙漠之舟，在西北的沙漠。高原平均海拔 4000 公尺以上叫世界屋脊，空氣稀薄所以日夜溫差大。", "fig": [], "pas": null, "warn": null}, {"id": "112_10", "y": "112", "n": 10, "s": "地理", "q": "晉仁的家鄉地形是風力堆積而成，土層鬆散易受流水侵蝕，導致地表千溝萬壑。請問：晉仁家鄉是在哪一地形區？", "o": ["青藏高原", "東南丘陵", "黃土高原", "四川盆地"], "a": 2, "ex": "風吹來的黃土堆積、土質鬆散、被雨水沖成千溝萬壑，這三個關鍵字都指黃土高原。", "fig": [], "pas": null, "warn": null}, {"id": "112_11", "y": "112", "n": 11, "s": "地理", "q": "中國部分農民為了增加糧食，在洞庭湖實施「圍湖造田」進行開墾與湖爭地，導致哪條河流水患增加？", "o": ["黃河", "長江", "珠江", "淮河"], "a": 1, "ex": "洞庭湖在長江中游，是長江的天然蓄水池。湖被填去種田，湖變小，洪水來時裝不下，長江就更容易氾濫。", "fig": [], "pas": null, "warn": null}, {"id": "112_12", "y": "112", "n": 12, "s": "地理", "q": "中國東南沿海居民外移，也將華人文化擴散到世界，福建、廣東是兩大僑鄉。請問：造成居民外移的原因？", "o": ["山多田少，糧食不足", "地震頻繁，居無定所", "溫帶氣候，生長期短", "乾旱缺水，收成不穩"], "a": 0, "ex": "福建、廣東是東南丘陵，山多平地少，養不起那麼多人，所以明清以來大量移民到東南亞和臺灣。這裡是副熱帶、雨多，不是溫帶也不缺水。", "fig": [], "pas": null, "warn": null}, {"id": "112_13", "y": "112", "n": 13, "s": "地理", "q": "請依據下圖中國氣候類型分布圖回答。請問：甲區為哪一種氣候類型？", "o": ["草原氣候", "高地氣候", "季風氣候", "沙漠氣候"], "a": 2, "ex": "甲在東南半部，夏天吹東南季風帶來雨水，是季風氣候。丁是青藏高原的高地氣候，乙、丙是西北內陸的乾燥氣候（草原、沙漠）。", "fig": ["112_q13"], "pas": null, "warn": null}, {"id": "112_14", "y": "112", "n": 14, "s": "地理", "q": "（同上圖）請問：哪一區的畜牧方式為「逐水草而居的游牧」？", "o": ["甲", "乙", "丙", "丁"], "a": 2, "ex": "丙在西北內陸，離海遠、雨少，種不了田，只能放牧；草吃完就搬家，叫逐水草而居。", "fig": ["112_q13"], "pas": null, "warn": null}, {"id": "112_15", "y": "112", "n": 15, "s": "地理", "q": "請依據下圖中國農、牧業分布圖回答。請問：哪一區居民的主食主要為麵食？", "o": ["甲", "乙", "丙", "丁"], "a": 0, "ex": "甲是秦嶺、淮河以北的華北、東北，雨少天冷種小麥，吃麵食；乙是南方，雨多種稻米。丙、丁是西部牧區。", "fig": ["112_q15"], "pas": null, "warn": null}, {"id": "112_16", "y": "112", "n": 16, "s": "地理", "q": "（同上圖）請問：乙區冬季季風主要風向？", "o": ["↗", "↖", "↘", "↙"], "a": 3, "ex": "冬天蒙古高壓把冷空氣往外吹，北方吹西北風，到了南方（乙）變成東北季風。「東北季風」是從東北吹向西南，箭頭畫成 ↙。", "fig": ["112_q15"], "pas": null, "warn": null}, {"id": "112_17", "y": "112", "n": 17, "s": "地理", "q": "（同上圖）請問：下列何者為甲、乙的分界線？", "o": ["秦嶺、淮河", "北回歸線", "500mm 等雨量線", "黑河、騰衝"], "a": 0, "ex": "甲（北方旱作、麵食）和乙（南方水田、稻米）的分界就是秦嶺、淮河，它同時也是一月 0°C 等溫線、800 mm 等雨量線。黑河—騰衝線是人口分界。", "fig": ["112_q15"], "pas": null, "warn": null}, {"id": "112_18", "y": "112", "n": 18, "s": "歷史", "q": "玉欣參觀臺北國立故宮博物院，館內珍藏許多古物，其中毛公鼎、肉形石、翠玉白菜被喻為民間版的「故宮三寶」。毛公鼎腹內刻有 500 字銘文，內容敘述周宣王冊封毛公的經過，毛公感念周王，因而鑄鼎紀事，傳給子孫永遠紀念。請問：周王在冊封毛公的儀式中，除了給予爵位封號以外，還一併給予毛公下列何者，為封建體制中的典型例子？", "o": ["樂器", "珠寶", "服飾", "土地"], "a": 3, "ex": "封建就是「分封」：天子把土地和土地上的人民分給諸侯，諸侯替天子守衛那塊地。", "fig": [], "pas": null, "warn": null}, {"id": "112_19", "y": "112", "n": 19, "s": "歷史", "q": "周人滅商之後，有鑑於前朝滅亡的教訓，發展出「酒誥」、「天命靡常，唯德是輔」的觀念。意思是勸說周王不可酗酒，上天不會無條件地支持某一個統治者。如果周王表現不好，天命就會轉移。因此西周特別強調以制度來維繫其統治。請問：該朝代透過冊封繼承人的儀式確立世襲的身分，使政權得以順利移轉的是下列哪一個制度？", "o": ["封建制度", "井田制度", "禮樂制度", "宗法制度"], "a": 3, "ex": "宗法制度用血緣決定誰繼承：嫡長子當大宗，其他兒子是小宗。「確立世襲身分、政權順利移轉」就是宗法。封建是分土地，井田是田制，禮樂是規範行為。", "fig": [], "pas": null, "warn": null}, {"id": "112_20", "y": "112", "n": 20, "s": "歷史", "q": "西元 1975 年在今湖北省雲夢縣睡虎地發現的「秦墓竹簡」中，出土一些法律文書，其中一份資料記錄某甲平民的戶籍狀況。戶籍記載包括房屋、財產、人口、奴婢、牲畜等，鉅細靡遺。請問：由上述內容可以推論，當時政府推動戶籍制度的作用為何？（甲）建立封建制度（乙）民間講學資料（丙）作為徵兵依據（丁）作為課稅依據（戊）建立中央集權", "o": ["甲丙丁", "丙丁戊", "乙丙丁", "乙丁戊"], "a": 1, "ex": "政府把每家的人口、財產記清楚，就能徵兵（丙）、收稅（丁），而且直接管到每一個人，不用透過諸侯（戊），這叫編戶齊民。封建是周代的事，講學是民間的事，都跟戶籍無關。", "fig": [], "pas": null, "warn": null}, {"id": "112_21", "y": "112", "n": 21, "s": "歷史", "q": "圖 1 與圖 2 是兩個不同時期的政治體制。請問，在這兩種不同的政治體制下，地方長官如何產生？", "o": ["圖 1 由天子分封，不得世襲；圖 2 是由地方選舉產生", "圖 1 是天子分封，諸侯世襲；圖 2 是皇帝分封，官位世襲", "圖 1 是諸侯派任，不得世襲；圖 2 是郡守派任，不得世襲", "圖 1 是天子分封，諸侯世襲；圖 2 是天子任命，不得世襲"], "a": 3, "ex": "圖 1 封建：周天子分封諸侯，諸侯的位子可以傳給兒子（世襲）。圖 2 郡縣：秦始皇派官員去管郡、縣，做不好就換人，不能世襲。", "fig": ["112_q21"], "pas": null, "warn": null}, {"id": "112_22", "y": "112", "n": 22, "s": "歷史", "q": "「出身決定一切命運」的局面轉變了。由於封建的式微，部分貴族只能靠講學來維持生活，加上各國競爭激烈，爭相拉攏人才，開始重用有能力的、非權貴的平民百姓，平民終於可以展現自己的才能，為國君服務。請問：這種轉變主要是發生在哪一時代？", "o": ["西周", "東周", "漢代", "隋代"], "a": 1, "ex": "封建崩壞、貴族沒落靠講學（孔子就是）、各國搶人才、平民崛起，全是東周（春秋戰國）的特色。", "fig": [], "pas": null, "warn": null}, {"id": "112_23", "y": "112", "n": 23, "s": "歷史", "q": "經過春秋戰國數百年的征戰兼併之後，秦王政最終統一天下，成為中國歷史上第一個皇帝，自稱「始皇帝」。他的作為為當時及後世帶來深遠的影響。請問：下列敘述何者較符合秦始皇當時的實際狀況？", "o": ["名義上統一天下，但現實中並無相關配合的制度與措施", "由中央政府派任官員管理地方，並統一文字與度量衡", "為穩固國家權力，積極分封宗族子弟，以保衛國家", "因連年戰亂，實行道家思想，與民休息，避免過度擾民"], "a": 1, "ex": "秦始皇廢封建、行郡縣（中央派官員管地方），統一文字、貨幣、度量衡，用的是法家，不是道家。與民休息是漢初的事。", "fig": [], "pas": null, "warn": null}, {"id": "112_24", "y": "112", "n": 24, "s": "歷史", "q": "中國農業社會與北方草原民族常有互動，隨著北方草原民族持續南遷的形式不同，胡漢關係備受挑戰。西元 311 年，北方匈奴人南下爆發「永嘉之禍」，逼迫原來在黃河流域的北方人士避難南遷，造成深遠影響，請問以下敘述何者錯誤？", "o": ["加速南方經濟的開發", "北魏孝文帝積極推動胡化運動", "中國經濟重心逐漸南移", "南北方的民族文化得以融合交流"], "a": 1, "ex": "北魏孝文帝推的是「漢化」（鮮卑人學漢人），不是胡化。其他三項都是永嘉之禍、北人南遷帶來的影響。", "fig": [], "pas": null, "warn": null}, {"id": "112_25", "y": "112", "n": 25, "s": "歷史", "q": "玉成在一本介紹魏晉南北朝歷史的書中，看到一幅插圖如下。這幅圖最可能是在說明下列哪一段史實？", "o": ["匈奴人的南下", "東晉的南遷", "北魏的漢化", "西晉的建立"], "a": 2, "ex": "圖上從平城（今大同）遷到洛陽，旁邊還寫著改姓氏、禁鮮卑語，就是北魏孝文帝的漢化政策。", "fig": ["112_q25"], "pas": null, "warn": null}, {"id": "112_26", "y": "112", "n": 26, "s": "歷史", "q": "伊慈蒐集唐朝歷史的相關資料時發現一場重要的戰役。西元 751 年（唐玄宗天寶 10 年），阿拉伯（大食）軍隊與唐朝軍隊大戰於中亞的怛羅斯，因大唐的葛邏祿部背叛唐朝，導致唐軍失利。請問：這場戰役後造成哪一項中國的發明西傳？", "o": ["火藥", "造紙術", "印刷術", "指南針"], "a": 1, "ex": "怛羅斯之戰唐軍戰敗，會造紙的工匠被俘，造紙術就傳到阿拉伯世界，後來再傳到歐洲。", "fig": [], "pas": null, "warn": null}, {"id": "112_27", "y": "112", "n": 27, "s": "歷史", "q": "資料一：政府授權中正官在地方上進行品評，依據士人的才能、德行與家世背景來區分品級。但之後品評只重家世，結果造成「上品無寒門、下品無世族」的現象。資料二：政府透過開科取士的方式來選拔人才，其中包含進士、明經等科別，有能力者都可以報考，為平民晉升開啟大門。資料三：朝廷要求地方官員定期向中央推舉符合「孝順」和「廉能」標準的人才，經朝廷檢定後給予錄用或升遷。請問：依據三則資料出現時間的先後順序排列，順序應該為何？", "o": ["資料三 → 資料二 → 資料一", "資料二 → 資料三 → 資料一", "資料三 → 資料一 → 資料二", "資料一 → 資料三 → 資料二"], "a": 2, "ex": "資料三是漢代察舉（推舉孝廉），資料一是魏晉的九品官人法（中正官品評），資料二是隋唐科舉（開科考試）。順序：漢 → 魏晉 → 隋唐。", "fig": [], "pas": null, "warn": null}, {"id": "112_28", "y": "112", "n": 28, "s": "歷史", "q": "（承上題）資料二的選才方式導致世族的勢力趨於沒落，無法長期掌握政治勢力。請問：資料二的選才方式開始於哪一個朝代？", "o": ["秦代", "漢代", "曹魏", "隋代"], "a": 3, "ex": "科舉從隋文帝開始，唐代發揚光大。平民靠考試就能當官，世族壟斷官位的局面慢慢被打破。", "fig": [], "pas": null, "warn": null}, {"id": "112_29", "y": "112", "n": 29, "s": "歷史", "q": "下圖為漢代開通的交通路線，請讀圖後回答。請問：此路的開通與哪一史事關係最為密切？", "o": ["秦始皇統一天下", "玄奘西行取經求法", "張騫經營西域", "唐代大食怛羅斯之役"], "a": 2, "ex": "從長安往西穿過西域的路就是絲路，漢武帝派張騫出使西域才打通的。玄奘、怛羅斯都是唐代的事，在絲路開通之後。", "fig": ["112_q29"], "pas": null, "warn": null}, {"id": "112_30", "y": "112", "n": 30, "s": "歷史", "q": "（同上圖）當時這條交通路線商旅往來愈來愈頻繁，最受西方商旅喜愛的商品是哪一項？", "o": ["茶葉", "瓷器", "紙張", "絲織品"], "a": 3, "ex": "這條路就是因為絲綢賣到羅馬太受歡迎才被叫做「絲路」。", "fig": ["112_q29"], "pas": null, "warn": null}, {"id": "112_31", "y": "112", "n": 31, "s": "歷史", "q": "（同上圖）當時這條交通路線可到達圖中甲地，請問甲地當時屬於哪一國家的領域？", "o": ["大秦", "安息", "身毒", "大月氏"], "a": 0, "ex": "甲在最西邊的地中海東岸，是大秦（羅馬帝國）。安息在今天的伊朗，身毒是印度，大月氏在中亞。", "fig": ["112_q29"], "pas": null, "warn": null}, {"id": "112_32", "y": "112", "n": 32, "s": "歷史", "q": "請根據附圖回答：有關圖中的箭頭標示，我們可以有以下哪種解讀？", "o": ["這是唐文化傳播的路徑", "這是唐朝商人的貿易路徑", "這是唐朝對外戰爭的路線", "這是唐朝人口遷徙的方向"], "a": 0, "ex": "箭頭從長安指向新羅、日本、安南，這三個都是學唐朝文化最積極的國家，所以是唐文化外傳的路線。", "fig": ["112_q32"], "pas": null, "warn": null}, {"id": "112_33", "y": "112", "n": 33, "s": "歷史", "q": "西元七世紀時，日本孝德天皇（645–654 年在位）在唐朝時多次派人前往中國，學習中國文化與佛法。導致中國的飲茶、佛教、書法因而東傳。此外，日本文字的創作亦受到中國文字的影響。請問：日本效法唐代文化的「唐化運動」稱為什麼？", "o": ["永貞革新", "貞觀之治", "大化革新", "開元之治"], "a": 2, "ex": "645 年日本孝德天皇仿唐朝制度改革，叫大化革新。貞觀、開元是唐朝自己的盛世，永貞革新是唐朝中期的政治改革。", "fig": [], "pas": null, "warn": null}, {"id": "112_34", "y": "112", "n": 34, "s": "歷史", "q": "柏霖在「傳說對決」排位賽中，負責打「上路」到歷史上的「君子國」，他必須找熟悉地形的當地人同行，下列哪一位選手是他適合選擇的隊友？", "o": ["新羅人：金秀明", "日本人：大野原", "大食人：諾可西", "吐蕃人：棄宗弄贊"], "a": 0, "ex": "「君子國」是唐朝人對新羅（今韓國）的美稱，因為新羅全面學習唐文化。", "fig": [], "pas": null, "warn": null}, {"id": "112_35", "y": "112", "n": 35, "s": "公民", "q": "下列畫線部分者，何者是中華民國國民？（甲）爸媽離婚、就讀國小的「小喬」；父親是澳洲人，母親是本國人（乙）4 歲的「裘莉」就讀天母某幼稚園，跟隨來台工作的美籍父母親，已三年（丙）來台經商六年的「約翰」，最後愛上台灣，所以四年前全家移民到台灣，已有我國投票權（丁）阿根廷的漢克娶了泰雅族的美麗，現一起住在台東已多年，年前收養了族裡的小男孩「巴里」。正確的是？", "o": ["甲乙丙", "甲丙丁", "乙丙丁", "甲乙丙丁"], "a": 1, "ex": "我國國籍以血統（屬人主義）為主：小喬媽媽是本國人，有國籍；巴里是泰雅族小孩，本來就是國民；約翰已經歸化、能投票。只有裘莉，父母都是美國人、只是來工作，沒有我國國籍。", "fig": [], "pas": null, "warn": null}, {"id": "112_36", "y": "112", "n": 36, "s": "公民", "q": "小明是國二生，正在複習公民，有關我國的領土管轄權，有部分不是很清楚；於是請教就讀高一的哥哥，哥哥某部分說錯了，請問是哪一項？", "o": ["我國領海主權是基線向外延伸 12 海浬", "我國科學家可以在基線至 200 海浬內做研究、探勘資源", "他國民航機經由合法授權可以飛越我國領空", "我國民航機停靠於他國領土內，即不受本國保護"], "a": 3, "ex": "我國的飛機、人民到了外國，仍然是我國國民，我國政府還是會依法保護（例如透過大使館）。領海 12 浬、經濟海域 200 浬、領空需授權才能飛越，這三項都對。", "fig": [], "pas": null, "warn": null}, {"id": "112_37", "y": "112", "n": 37, "s": "公民", "q": "蔡英文總統於今年三月時應邀出訪我國邦交國瓜地馬拉與貝里斯，並於途中過境美國紐約和洛杉磯；總統出訪從事外交，雖然處處受到對岸的打壓，但也堅決自由民主的立場不變。請問我國之所以常常受中國的脅迫，乃因國家組成的何項因素無法彰顯？", "o": ["領土", "人民", "主權", "政府"], "a": 2, "ex": "能不能自己決定內政、和別國平等往來，靠的是「主權」。對岸的打壓就是讓我國對外的主權（獨立性）無法彰顯。", "fig": [], "pas": null, "warn": null}, {"id": "112_38", "y": "112", "n": 38, "s": "公民", "q": "總統出訪我國的邦交國，在嚴峻的局勢下，仍努力推動兩國的經濟、教育、醫療等互助交流。此舉是為了展現國家存在的何項目？", "o": ["保障基本人權", "伸張社會正義", "維持社會秩序", "保衛國家安全"], "a": 3, "ex": "拓展外交、多交朋友，是為了在國際上有人支持我們，讓國家更安全，這是國家「保衛國家安全」的功能。", "fig": [], "pas": null, "warn": null}, {"id": "112_39", "y": "112", "n": 39, "s": "公民", "q": "因禽流感及飼料高漲，造成「蛋荒」；農委會針對蛋荒，決定進口蛋。近期爆發了進口蛋標錯保存期限，且檢驗出部分蛋含有對人體有害物質，且 7、8 月市場上蛋的需求減緩，目前估計將有 5402 噸的蛋，因汙損過期將銷毀，預估損失近 2 億元！無論是雞農、早餐店、糕餅店等業者皆對此事件感到相當的不滿，故在野黨要求農委會部長，應當為此事下台負責任。依題意，請問農委會部長該負何項責任？", "o": ["道德責任", "法律責任", "政治責任", "科技責任"], "a": 2, "ex": "官員因為政策做不好被要求下台，這是「政治責任」。法律責任是違法被告、被判刑才算。", "fig": [], "pas": null, "warn": null}, {"id": "112_40", "y": "112", "n": 40, "s": "公民", "q": "台灣被國外媒體形容行人地獄，全因車子經過斑馬線不禮讓行人，造成許多車禍，連帶家庭破裂！政府在面臨民眾、外媒的撻伐於今年祭出重罰，期盼透過罰則，提升保護行人安危！請問依畫線部分（祭出重罰，透過罰則保護行人），是屬於民主政治的何項特色？", "o": ["法治政治", "民意政治", "政黨政治", "責任政治"], "a": 0, "ex": "政府用「法律的罰則」來管理人民的行為、保護人民，就是法治政治。", "fig": [], "pas": null, "warn": null}, {"id": "112_41", "y": "112", "n": 41, "s": "公民", "q": "民主國家存在目的保障人民的權利，且維護人民的基本生存權，所以政府在制定政策時，當以民意為依歸；那麼執政黨該如何廣納民意？（甲）不定期選舉，讓政黨輪替（乙）舉辦公民投票（丙）實施問卷調查（丁）透過公聽會，邀請民眾、學者專家與民意代表等蒐集意見。上述方式正確的是：", "o": ["甲乙丙丁", "乙丙丁", "甲乙丁", "甲丙丁"], "a": 1, "ex": "甲錯在「不定期」：民主國家的選舉一定是「定期」舉行的。公投、問卷、公聽會都是蒐集民意的方式。", "fig": [], "pas": null, "warn": null}, {"id": "112_42", "y": "112", "n": 42, "s": "公民", "q": "阿富汗自塔利班（Taliban）2021 年 8 月重新掌權後，明令婦女和女孩，沒有男性家人陪同，不能前往公園、市集和健身房，禁止女性受中高等教育。下列關於阿富汗的統治權描述，何者是「錯誤的」？", "o": ["塔利班頒布的法令是為鞏固自己的權力", "透過統治與宗教，控制人民思想", "法律淪為統治者的工具", "法律由統治者或少數人直接決定，有一定標準"], "a": 3, "ex": "這是「人治」：法律由統治者說了算，想改就改，「沒有」一定的標準。前三項都是人治的特色。", "fig": [], "pas": null, "warn": null}, {"id": "112_43", "y": "112", "n": 43, "s": "公民", "q": "總統於 2022 年 3 月提出選舉投票權的法定年齡由 20 歲下修至 18 歲，在立法院三讀通過後，仍需經由公民投票，而且有效同意票需要選舉人總數的二分之一，才能正式修憲。依題意，呈現民主政治的哪兩項特色？", "o": ["民意政治、責任政治", "民意政治、法治政治", "政黨政治、政治責任", "法治政治、政黨政治"], "a": 1, "ex": "交給全民公投決定＝民意政治；一定要照憲法規定的程序（立法院通過、公投、過半）才能修＝法治政治。", "fig": [], "pas": null, "warn": null}, {"id": "112_44", "y": "112", "n": 44, "s": "公民", "q": "芮莉在公司和建誠因工作任務分配，兩人吵架；建誠回到家在臉書上，和朋友聊到此事，直接用非常不雅的言詞來形容芮莉，且散播她的私生活不檢點。結果隔天上班大多數同仁都知道此事，而且對芮莉產生不佳觀感。芮莉心有不甘，直接到警察局提告！請問下列哪一機關才能判建誠犯了妨害名譽罪？", "o": ["司法機關", "行政機關", "立法機關", "監察機關"], "a": 0, "ex": "只有法院（司法機關）能判一個人有沒有罪。警察屬於行政機關，只能受理、調查，不能判罪。", "fig": [], "pas": null, "warn": null}, {"id": "112_45", "y": "112", "n": 45, "s": "公民", "q": "政府制定法律嚴懲酒駕，只要酒測值超標，會處以刑罰、罰金、吊扣駕照等；但酒駕事件仍頻頻發生，甚至因酒駕而撞死人。依畫線部分（處以刑罰、罰金、吊扣駕照），是屬於下列何者的意涵？", "o": ["權力", "權利", "公權力", "控制力"], "a": 2, "ex": "政府依法律處罰人民、人民必須服從，這種帶有強制力的力量叫「公權力」。", "fig": [], "pas": null, "warn": null}, {"id": "112_46", "y": "112", "n": 46, "s": "公民", "q": "明年我國將舉行總統大選，候選人紛紛採取競選行動到處拜訪演講，甚至到美國訪問，希望取得人民支持。我國總統也於今年拜訪部分邦交國，可知其領導地位的重要性。請問我國的主權，是屬於何者？", "o": ["總統", "全體國民", "立法委員", "行政院"], "a": 1, "ex": "主權在民：主權屬於全體國民，總統只是人民選出來替大家做事的人。", "fig": [], "pas": null, "warn": null}, {"id": "112_47", "y": "112", "n": 47, "s": "公民", "q": "英國首相強森因道德問題被迫辭職後，特拉斯即由保守黨黨員選出為新任黨魁（首相），她承諾改善嚴重經濟衰退與人民生活。由上文中，可以了解英國是屬於何種統治制度？", "o": ["人治", "法治", "黨治", "由國王統治"], "a": 1, "ex": "首相做錯事要辭職、新首相照既定程序選出來，一切照規矩走，不是誰說了算，這就是法治。英國國王只是象徵，不管事。", "fig": [], "pas": "補充資料：2022 年 7 月英國首相強森辭職後，9 月 5 日特拉斯在執政黨保守黨的黨魁選舉中勝出，成為新任黨魁，並接受女王邀請組閣，正式成為新一任首相。9 月 23 日特拉斯內閣公布 1970 年代以來最大規模的減稅措施，結果招致一片反對聲，並引發英鎊匯率創歷史新低。", "warn": null}, {"id": "112_48", "y": "112", "n": 48, "s": "公民", "q": "英國保守黨的對手工黨，抨擊特拉斯提出減稅政策所造成英國經濟嚴重狀況，簡直是雪上加霜！之後特拉斯承認自己錯誤，甚至採用工黨所提出的政策。依題意，判斷英國出現何種政治現象？", "o": ["實施無限政府", "證實國王無能", "產生政黨輪替", "維持政黨政治"], "a": 3, "ex": "在野黨（工黨）監督批評、執政黨（保守黨）修正政策，這就是政黨政治的正常運作。執政黨沒有換人，所以不是政黨輪替。", "fig": [], "pas": "補充資料：2022 年 7 月英國首相強森辭職後，9 月 5 日特拉斯在執政黨保守黨的黨魁選舉中勝出，成為新任黨魁，並接受女王邀請組閣，正式成為新一任首相。9 月 23 日特拉斯內閣公布 1970 年代以來最大規模的減稅措施，結果招致一片反對聲，並引發英鎊匯率創歷史新低。", "warn": null}, {"id": "112_49", "y": "112", "n": 49, "s": "公民", "q": "我國和大部分的歐美民主國家，其執政者取得執政權，大都經由人民選舉，但為了避免授權後政府濫權，所以幾乎所有民主國家都會明確將政府的職權和運作方式作明確規範在憲法中。請問是以何項，作為建構政府體制的原則？", "o": ["均權制度", "權能區分", "分權制衡", "地方分權"], "a": 2, "ex": "把政府的權力分給幾個機關、互相牽制，不讓任何一個機關獨大，叫分權制衡（三權或五權分立）。", "fig": [], "pas": null, "warn": null}, {"id": "112_50", "y": "112", "n": 50, "s": "公民", "q": "歐美國家幾乎都實施三權分立，而國父於研究西方國家的憲法後，發現改成五權分立，可以補救三權分立的缺失。其中將何權由行政權獨立出來，可以避免濫用私人？", "o": ["考試權", "司法權", "立法權", "監察權"], "a": 0, "ex": "考試權從行政權獨立出來，公務員要靠考試進用，行政首長就不能隨便安插自己人。監察權是從立法權獨立出來的。", "fig": [], "pas": null, "warn": null}, {"id": "113_01", "y": "113", "n": 1, "s": "地理", "q": "根據中國的緯度位置，中國缺乏下列哪種氣候？", "o": ["寒帶", "溫帶", "熱帶", "副熱帶"], "a": 0, "ex": "中國最北到北緯 53 度左右，沒有到北極圈（66.5 度），所以沒有寒帶；最南的海南島在北回歸線以南，有熱帶。", "fig": [], "pas": null, "warn": null}, {"id": "113_02", "y": "113", "n": 2, "s": "地理", "q": "圖（一）為中國五大地形面積比例圖，由圖可見中國地形以戊、丁為主體，請問戊、丁分別代表什麼地形？", "o": ["盆地、平原", "山地、高原", "高原、丘陵", "山地、丘陵"], "a": 1, "ex": "中國山地約占三分之一最多（戊 33%），其次是高原（丁 26%），所以說中國是「山地高原為主」的國家。", "fig": ["113_q2"], "pas": null, "warn": null}, {"id": "113_03", "y": "113", "n": 3, "s": "地理", "q": "依地形高度中國地形可分為三級階梯，請問東部地形階梯主要以下列哪兩種地形為主？", "o": ["甲、丙", "甲、丁", "乙、丙", "乙、丁"], "a": 1, "ex": "東部第三階梯以平原和丘陵為主。甲的等高線 100～500 公尺、小起伏＝丘陵；丁只有 20 公尺線、很平＝平原。乙 1000 公尺以上又平坦＝高原，丙中間低四周高＝盆地，這兩個是第二階梯。", "fig": ["113_q3"], "pas": null, "warn": null}, {"id": "113_04", "y": "113", "n": 4, "s": "地理", "q": "下列為中國三個城市的年降水量圖，請問：根據中國降水特性，將這三個城市由西北向東南排列，其順序應為：", "o": ["甲丙乙", "乙丙甲", "甲乙丙", "丙甲乙"], "a": 3, "ex": "中國降水由東南向西北遞減，所以由西北往東南排就是雨量由少到多：丙（34 mm）→ 甲（316 mm）→ 乙（1736 mm）。", "fig": ["113_q4"], "pas": null, "warn": null}, {"id": "113_05", "y": "113", "n": 5, "s": "地理", "q": "中國某一地形區因為土壤性質疏鬆容易受到河水侵蝕，導致地勢高低不平，請問此地形區為下列何者？", "o": ["青藏高原", "內蒙古高原", "黃土高原", "雲貴高原"], "a": 2, "ex": "土質疏鬆、被流水切得高低不平（千溝萬壑）＝黃土高原。", "fig": [], "pas": null, "warn": null}, {"id": "113_06", "y": "113", "n": 6, "s": "地理", "q": "中國人口以「黑河—騰衝」一線為界，呈現分布不均的現象，造成分布不均的原因和下列何者關係較大？", "o": ["西部多平原、丘陵", "西部氣候濕潤，溫差小", "東部地形崎嶇，交通不便", "東部農業發達，糧食產量豐富"], "a": 3, "ex": "東南半部地形平、雨水多，農業發達養得起人，所以人口密；西部是高原、沙漠，又乾又冷，人就少。前三項的敘述剛好說反了。", "fig": [], "pas": null, "warn": null}, {"id": "113_07", "y": "113", "n": 7, "s": "地理", "q": "根據下表判斷，何者為溫帶沙漠氣候？", "o": ["甲", "乙", "丙", "丁"], "a": 1, "ex": "溫帶沙漠要「冬天冷」（最冷月低於 0°C）又「很乾」（年雨量 250 mm 以下）。乙 −15.2°C、185 mm 兩個都符合。甲 355 mm 是溫帶草原，丙 622 mm 不夠乾，丁最冷月 5.6°C 是副熱帶。", "fig": ["113_q7"], "pas": null, "warn": null}, {"id": "113_08", "y": "113", "n": 8, "s": "地理", "q": "右圖為亞洲某一季節的季節風向成因示意圖，根據圖中所示，下列關於此季節的描述何者正確？", "o": ["此時為中國主要雨季", "亞洲此季節的風來自蒙古", "高壓中心在太平洋及印度洋", "中國北部此時的主要風向為 ↖"], "a": 1, "ex": "高氣壓在陸地、低氣壓在海上，風從陸地吹向海，這是冬天：蒙古高壓吹出乾冷的風。雨季是夏天；高壓在陸地不在海上；北方冬天吹西北風，箭頭是 ↘ 不是 ↖。", "fig": ["113_q8"], "pas": null, "warn": null}, {"id": "113_09", "y": "113", "n": 9, "s": "地理", "q": "中國傳統產業呈現「東耕西牧」的特色，請問此特色主要和什麼因素關係最大？", "o": ["緯度高低", "政府政策", "人口分布", "降水多寡"], "a": 3, "ex": "東邊雨多能種田，西邊雨少只能放牧，分界大約是 400 mm 等雨量線，所以關鍵是降水。", "fig": [], "pas": null, "warn": null}, {"id": "113_10", "y": "113", "n": 10, "s": "地理", "q": "中國為世界人口第二大國，近年來吸引許多國際資金紛紛進軍中國，請問中國產業發展有何優勢吸引外國投資？（甲）原料（乙）勞力（丙）市場（丁）政策", "o": ["甲乙", "乙丙", "丙丁", "甲丁"], "a": 1, "ex": "人口多＝勞力多又便宜，也＝很大的消費市場，這兩個是外資最看重的。", "fig": [], "pas": null, "warn": null}, {"id": "113_11", "y": "113", "n": 11, "s": "地理", "q": "一胎化造成的影響不包括下列何者？", "o": ["人口增加減緩", "老年人口比例上升", "性別比失衡", "人口素質偏低"], "a": 3, "ex": "一胎化的影響是成長變慢、高齡化、男多女少。小孩少，家裡反而把資源集中在一個小孩身上，人口素質不會偏低。", "fig": [], "pas": null, "warn": null}, {"id": "113_12", "y": "113", "n": 12, "s": "地理", "q": "秦嶺、淮河為中國地理重要的分界線，請問下列何者以秦嶺、淮河為界？", "o": ["溫帶和副熱帶氣候", "季風和乾燥氣候", "農業和畜牧業", "人口稠密和人口稀疏區"], "a": 0, "ex": "秦嶺淮河＝一月 0°C 等溫線＝溫帶與副熱帶的分界（也是 800 mm 等雨量線、稻麥分界）。季風與乾燥氣候的分界是 400 mm 線，農牧分界也差不多在那裡；人口分界是黑河—騰衝線。", "fig": [], "pas": null, "warn": null}, {"id": "113_13", "y": "113", "n": 13, "s": "地理", "q": "在新加坡的牛車水可以看到新加坡最古老的道教廟宇「天福宮」，為新加坡媽祖廟，興建於大清道光 20 年（1840 年），是由福建移民薛佛記與陳篤生等集資籌建，天福宮除了主祀媽祖之外，配祀關聖帝君、至聖先師（當地稱「孔子公」）與觀世音菩薩。請問移民將原鄉文化帶到移居地的現象稱為：", "o": ["文化認同", "文化整合", "文化擴散", "文化融合"], "a": 2, "ex": "文化從一個地方傳到另一個地方，叫文化擴散。福建移民把媽祖信仰帶到新加坡就是例子。", "fig": [], "pas": null, "warn": null}, {"id": "113_14", "y": "113", "n": 14, "s": "地理", "q": "中國西南部地區氣候多雨潮濕，並且地形崎嶇，為配合自然環境特色，發展出的傳統民居為下列何者？", "o": ["騎樓", "蒙古包", "窯洞", "干欄式建築"], "a": 3, "ex": "干欄式建築把房子架高，底下通風，可以防潮、防蟲、防野獸，適合又濕又熱、地面不平的西南。窯洞在乾燥的黃土高原，蒙古包在草原。", "fig": [], "pas": null, "warn": null}, {"id": "113_15", "y": "113", "n": 15, "s": "地理", "q": "根據圖（二）回答：明清時期，部分中國人移居東南亞或渡海到臺灣開墾，這些移民主要來自圖（二）中的哪一地區？", "o": ["甲", "乙", "丙", "丁"], "a": 3, "ex": "丁是東南沿海的福建、廣東，山多田少，明清以來大量移民到臺灣和東南亞，所以叫僑鄉。", "fig": ["113_q15"], "pas": null, "warn": null}, {"id": "113_16", "y": "113", "n": 16, "s": "地理", "q": "圖（二）中哪一地區為人口稠密的精華區？", "o": ["ㄅ", "A", "丙", "C"], "a": 2, "ex": "丙在東部沿海，平原多、雨水夠、農業發達，是人口最密的精華區。ㄅ、A、C 都在西部高原、盆地。", "fig": ["113_q15"], "pas": null, "warn": null}, {"id": "113_17", "y": "113", "n": 17, "s": "地理", "q": "請問右圖之植被分布現象和哪一地區的氣候特色較相符？", "o": ["A", "B", "C", "D"], "a": 2, "ex": "圖上植被隨高度一層一層變（闊葉林 → 針葉林 → 草原），是高地氣候的特徵，也就是 C 青藏高原。", "fig": ["113_q15", "113_q17"], "pas": null, "warn": null}, {"id": "113_18", "y": "113", "n": 18, "s": "歷史", "q": "西元前 11 世紀周人滅商，勢力持續向外擴展，使得管轄的土地與人口在短時間內急速增加，為了長治久安，因此周朝統治者，設計出一套有效的政治制度管理各地。請問：上述政治制度的內容，最有可能是下列何者？", "o": ["在領地內設置郡、縣，官員由國君直接任免", "實施科舉制度，促進社會各階層人才的流動", "將百姓編入戶籍，並以法律規範人民的義務", "透過分封儀式，依據身分等級，授予土地、人民、財物，以護衛王朝"], "a": 3, "ex": "周朝管理新征服的土地用的是封建：把土地、人民分給親戚和功臣，叫他們替王室守衛。郡縣是秦、科舉是隋唐、編戶齊民是戰國以後。", "fig": [], "pas": null, "warn": null}, {"id": "113_19", "y": "113", "n": 19, "s": "歷史", "q": "宇綸上課時不小心睡著了，一覺醒來，發現自己跨越時空生活在東周，他希望自己有朝一日能獲得朝廷冊封，衣錦返鄉。請問：下列哪一項「不應該」是他努力的方式？", "o": ["鼓吹國君加強貴族勢力", "追隨商鞅變法成為推動者", "接受教育以學說打動國君", "參加軍隊建立軍功"], "a": 0, "ex": "東周是貴族沒落、平民崛起的時代，想出頭要靠軍功、學說（講學遊說）、變法。幫貴族壯大是在走回頭路。", "fig": [], "pas": null, "warn": null}, {"id": "113_20", "y": "113", "n": 20, "s": "歷史", "q": "史家錢穆認為：「西周的封建，乃是一種侵略性的武裝移民與軍事占領。」請問：西周封建式的擴張方向，主要是向附圖中哪一方向？", "o": ["甲", "乙", "丙", "丁"], "a": 3, "ex": "周人原本住在西邊的渭水流域，滅商之後把親戚分封到東方（商朝舊地）鎮守，所以是向東擴張，圖中的丁。", "fig": ["113_q20"], "pas": null, "warn": null}, {"id": "113_21", "y": "113", "n": 21, "s": "歷史", "q": "上歷史課時老師用了右邊兩張圖的變化來說明歷史上某位君主的改革，請根據圖的內容判斷，最有可能符合圖片描述的是下列哪位皇帝？", "o": ["唐太宗", "秦始皇", "漢武帝", "北魏孝文帝"], "a": 1, "ex": "圖（一）是許多諸侯國並立，圖（二）同一片土地變成一個個「郡」。把封建國家統一改成郡縣的是秦始皇。", "fig": ["113_q21"], "pas": null, "warn": null}, {"id": "113_22", "y": "113", "n": 22, "s": "歷史", "q": "一個高度集權的國家，除了仰賴強而有力的賦稅制度維持運行之外，還必需仰賴環環相扣的人才選拔協助帝國的運作。請問：上表中關於各朝代人才選拔的制度，何者錯誤？", "o": ["甲", "乙", "丙", "丁"], "a": 2, "ex": "魏晉南北朝用的是九品官人法，由中正官看家世品評，結果「上品無寒門」，平民很難當官；表上寫「平民任官」是錯的。西周世襲、漢代察舉孝廉、隋唐科舉都對。", "fig": ["113_q22"], "pas": null, "warn": null}, {"id": "113_23", "y": "113", "n": 23, "s": "歷史", "q": "社會動盪不安的魏晉南北朝時期，世族仍然維持其崇高的地位，不受局勢變動的影響。請問主因為何？", "o": ["皇帝尊崇儒學，擴張書香世家勢力", "朝廷薦舉孝廉，形成許多世族門閥", "行九品官人之法，人才評選重視家世", "科舉考試公平，造成新的世族勢力"], "a": 2, "ex": "九品官人法只看家世，世族的子弟自動拿到高品、當大官，地位當然穩。察舉是漢代，科舉是隋唐以後。", "fig": [], "pas": null, "warn": null}, {"id": "113_24", "y": "113", "n": 24, "s": "歷史", "q": "老師上歷史課時，在黑板上整理出如右表，希望能幫助同學更好的認識兩個朝代的政治制度。請問：表格中的甲、乙應分別為哪個朝代？", "o": ["商代、周代", "西周、東周", "西周、秦代", "東周、漢代"], "a": 2, "ex": "甲：天子只是名義上的共主，諸侯在自己國內自主、人民向諸侯納稅＝西周封建。乙：皇帝集權、郡縣長官由朝廷任免、人民直接向皇帝納稅服役＝秦代郡縣。", "fig": ["113_q24"], "pas": null, "warn": null}, {"id": "113_25", "y": "113", "n": 25, "s": "歷史", "q": "佛教在中國擁有廣大的信眾，是因為佛教在傳入中國後進行了很多的轉化，至隋唐達於鼎盛時期。請針對下列佛教的敘述，選出錯誤的選項？", "o": ["屬於本土性宗教", "戰亂時成人民的寄託", "玄奘遠赴印度取經", "商鞅對佛教的發展有大貢獻"], "a": 0, "ex": "佛教是西元前 6 世紀在印度創立、西漢末才傳進中國的，不是本土宗教。注意：D 也是錯的（商鞅是戰國法家，和佛教無關），這題其實有兩個錯誤選項，學校公布的答案是 A。", "fig": [], "pas": null, "warn": "學校解答是 A，但 D 的敘述也不對，這題出得有瑕疵；考試時以老師說的為準。"}, {"id": "113_26", "y": "113", "n": 26, "s": "歷史", "q": "漢代外交官張騫曾奉漢武帝之命出使西域，請問其出使西域的路線為右列哪一條？", "o": ["甲", "乙", "丙", "丁"], "a": 1, "ex": "張騫從長安出發，經河西走廊（敦煌）進入西域（今新疆），往西北走，是乙。甲往北是匈奴地盤，丙、丁往西南是後來的路線。", "fig": ["113_q26"], "pas": null, "warn": null}, {"id": "113_27", "y": "113", "n": 27, "s": "歷史", "q": "（承上題）請問：張騫出使西域的最大貢獻為何？", "o": ["成功驅逐匈奴", "使西域各國都願服從漢朝", "溝通中西交通與促進文化交流", "認識西域地理環境，並使匈奴成功漢化"], "a": 2, "ex": "張騫沒有打敗匈奴，也沒讓西域全部歸順，但他帶回西域的情報、打通了絲路，從此東西方的商品和文化開始交流。", "fig": [], "pas": null, "warn": null}, {"id": "113_28", "y": "113", "n": 28, "s": "歷史", "q": "甲：隋文帝的皇后為獨孤氏，唐高祖的母親也是獨孤氏。乙：一些唐朝名人為追求突厥式生活的熱情，竟能忍受不舒適的帳篷生活。請問：隋唐時代，在胡漢的議題上大多採取何種態度？", "o": ["井水不犯河水", "畫地自限", "看不到看不到", "平等開放"], "a": 3, "ex": "獨孤氏是鮮卑姓，隋唐皇室本身就有胡人血統；唐朝人還流行住帳篷，可見對胡人文化是平等接納、開放的。", "fig": [], "pas": null, "warn": null}, {"id": "113_29", "y": "113", "n": 29, "s": "歷史", "q": "某帝認為：「鮮卑人作為統治者，必須漢化，國家才能長治久安。……如果我們要將朝廷基業傳之子孫百世，那麼一定要變革，各位不可以不遵行朝廷頒布的法度。」又說：「自古以來，各種經典記載中，哪有不先正名就能夠推行制度的？現在我要廢除所有的北方語言，從正確的發音開始。」請問：某帝為下列何人？", "o": ["唐太宗", "秦始皇", "漢武帝", "北魏孝文帝"], "a": 3, "ex": "「鮮卑人」加上「廢除北方語言、改說漢語」，就是北魏孝文帝的漢化政策。", "fig": [], "pas": null, "warn": null}, {"id": "113_30", "y": "113", "n": 30, "s": "歷史", "q": "學者提到：「過去歷史研究的主體，往往偏重於統治者的歷史，比較忽略人民的歷史，其實，人民才是我們應該關心的主體。」請問：下列哪個主題最接近這位學者主張的研究方向？", "o": ["西周的封建制度", "曹魏的九品官人法", "秦始皇實施郡縣制度", "隋唐「漢戴胡帽，胡戴漢帽」"], "a": 3, "ex": "「漢戴胡帽、胡戴漢帽」講的是老百姓的穿著和生活，是人民的歷史；其他三個都是統治者的制度。", "fig": [], "pas": null, "warn": null}, {"id": "113_31", "y": "113", "n": 31, "s": "歷史", "q": "中共國家主席習近平曾在 2014 年提出「一帶一路」政策，全名稱為「絲綢之路經濟帶和 21 世紀海上絲綢之路」。其中「絲綢之路」早在漢代已經開通。請問：若要寫出呈現該路線特色的介紹詞句，下列何者最合適？", "o": ["走近黃河源頭，探訪生命源頭禁區", "主宰文明進程，東西文化進行交流", "豪情塞上威風鼓，黃土高原信天游", "天蒼蒼野茫茫，風吹草低見牛羊"], "a": 1, "ex": "絲路最大的意義是東西方文化、商品的交流。其他三句講的是黃河、黃土高原、蒙古草原。", "fig": [], "pas": null, "warn": null}, {"id": "113_32", "y": "113", "n": 32, "s": "歷史", "q": "定為參加一場校外研討會，研討會的流程表如右。請問：他參加的研討會主題為何？", "o": ["農業和草原民族的互動", "胡、漢文化的融合過程", "漢代絲路貿易的發展", "唐代和親的外交策略"], "a": 0, "ex": "流程表裡有孝文帝漢化、長城修築、張騫出使、文成公主，四個主題跨漢到唐，共同點是農業民族和草原民族（匈奴、鮮卑、吐蕃）的打打和和。只講融合、只講漢代絲路或只講唐代和親都太窄。", "fig": ["113_q32"], "pas": null, "warn": null}, {"id": "113_33", "y": "113", "n": 33, "s": "歷史", "q": "《資治通鑑卷 193》：四夷君長詣闕請上為天可汗，上曰：「我為天子，又下行可汗事乎？」群臣及四夷皆稱萬歲。是後以璽書賜西北君長，皆稱天可汗。請問：文中所指的大唐天子為何人？", "o": ["秦始皇", "漢武帝", "唐高祖", "唐太宗"], "a": 3, "ex": "被西北各族尊為「天可汗」的是唐太宗（滅東突厥之後）。", "fig": [], "pas": null, "warn": null}, {"id": "113_34", "y": "113", "n": 34, "s": "歷史", "q": "老師講完隋唐時期文化的外傳概況後，要同學以簡單的幾句話表達這個時期受影響國家的特色。威凱：「日本全力模仿中國的文字、曆法、儒學和佛教，因而有『君子國』之稱。」鈞閎：「日本展開唐化運動，史稱『大化革新』。」宗澤：「文成公主嫁到大食，宣揚佛教思想，並將農業技術等帶入大食。」秉勳：「唐朝軍隊與大食交戰於怛羅斯，唐軍戰敗，造紙術西傳。」上述哪幾位同學的說法較為正確？", "o": ["威凱、鈞閎", "鈞閎、秉勳", "宗澤、秉勳", "威凱、秉勳"], "a": 1, "ex": "君子國是新羅不是日本（威凱錯）；文成公主嫁的是吐蕃不是大食（宗澤錯）。大化革新和怛羅斯之戰造紙術西傳都對。", "fig": [], "pas": null, "warn": null}, {"id": "113_35", "y": "113", "n": 35, "s": "公民", "q": "以下為上公民課時一群同學在討論關於「民主政治」的觀念，請問下列誰的說法最正確？", "o": ["小志：政府官員都是經由政黨推派產生", "小同：政府施政符合民意即可，無須依據法律", "小道：政府權力愈大對人民愈好", "小合：政府的權力須受到限制"], "a": 3, "ex": "民主政治的核心是「限制政府的權力」，用憲法和法律把政府關進籠子裡。官員很多是考試進用的；施政一定要依法；權力太大反而會侵害人民。", "fig": [], "pas": null, "warn": null}, {"id": "113_36", "y": "113", "n": 36, "s": "公民", "q": "請問有關我國廣義法律的敘述，下列何者最正確？", "o": ["《中華民國憲法》：位階最高，法條內容最多", "命令：此法條內容最少，亦可稱規則、標準等", "法律：由各行政機關制定、修正", "《公寓大廈管理條例》其效力相當於法律層級"], "a": 3, "ex": "「條例」是立法院通過的，就是法律。憲法位階最高但條文最少（只定原則）；命令是行政機關訂的，數量最多；法律由立法院制定，不是行政機關。", "fig": [], "pas": null, "warn": null}, {"id": "113_37", "y": "113", "n": 37, "s": "公民", "q": "公民老師上課介紹「人治」社會與「法治」社會的特色，之後請同學發表看法，請問下列哪位同學所言錯誤？", "o": ["小琴：人治社會如君主專制的國家即是", "小棋：法治社會裡政府決定一切", "小書：人治社會裡統治者不用守法", "小畫：法治社會裡會以法律保障人民權利"], "a": 1, "ex": "法治社會是「法律」決定一切，政府也要守法；政府決定一切那是人治。", "fig": [], "pas": null, "warn": null}, {"id": "113_38", "y": "113", "n": 38, "s": "公民", "q": "根據新北市警政新聞報導：警方篩選易肇事及易違規路口，建置 27 處多功能科技執法設備，採用 AI 人工智慧進行影像分析，自動辨識違規行為，於 113 年 7 月 1 日正式執法。請問警察機關這樣的作法，主要是為了達成國家的何種功能？", "o": ["提升國家競爭力", "維護社會秩序", "保衛國家安全", "照顧人民基本生活"], "a": 1, "ex": "警察抓交通違規、維持治安，是「維護社會秩序」。保衛國家安全是指國防、外交，對付外國威脅。", "fig": [], "pas": null, "warn": null}, {"id": "113_39", "y": "113", "n": 39, "s": "公民", "q": "有關國家與政府的區別的敘述，請問下列何者說法最正確？", "o": ["捷倫：國家的主權屬於總統所有", "一霖：政府不會因政權轉移或者制度變遷而改變", "光翰：國家的功能需依賴政府執行公權力才能發揮", "慧梅：政府對外具有獨立性及最高性"], "a": 2, "ex": "國家是抽象的，要靠政府行使公權力才能做事。主權屬全體國民不是總統；政府會因選舉、政變而換；對外獨立、對內最高的是「主權」，是國家的特性不是政府的。", "fig": [], "pas": null, "warn": null}, {"id": "113_40", "y": "113", "n": 40, "s": "公民", "q": "請問下列關於憲法與法律的敘述，何者正確？（甲）法律規定了人民的權利及義務；（乙）此二者皆具有強制力；（丙）憲法不容易修改代表其具有最高性；（丁）法律是在補充憲法的不足", "o": ["甲乙", "甲丙", "乙丁", "乙丙"], "a": 2, "ex": "憲法和法律都有強制力（乙）；憲法只定原則，細節由法律補充（丁）。甲：人民的基本權利義務是「憲法」規定的；丙：不容易修改是「固定性」，最高性是指它位階最高、其他法律不能牴觸它。", "fig": [], "pas": null, "warn": null}, {"id": "113_41", "y": "113", "n": 41, "s": "公民", "q": "在民主國家，通常會有（甲）個以上的政黨輪流執政，大選中獲勝的政黨稱為（乙），落敗的政黨稱為（丙），且能不斷輪流執政此狀況稱為（丁）。請選出下列何者正確？", "o": ["甲：3 個", "乙：在野黨", "丙：執政黨", "丁：政黨輪替"], "a": 3, "ex": "甲是 2 個以上；贏的叫執政黨（乙）、輸的叫在野黨（丙）；換黨執政叫政黨輪替（丁）。", "fig": [], "pas": null, "warn": null}, {"id": "113_42", "y": "113", "n": 42, "s": "公民", "q": "以色列哈瑪斯戰爭於 2023 年 10 月 7 日爆發！巴勒斯坦伊斯蘭主義運動組織哈瑪斯於此日朝以色列發射飛彈；以色列也不甘示弱宣戰，雙方激烈駁火！此兩方長期以來一直為了爭奪約旦河西岸及加薩走廊此兩地區而衝突不斷，引發國際關注。請問以上敘述，說明了以色列和巴勒斯坦發生了何項爭議？", "o": ["政府、領土", "領土、人民", "政府、主權", "領土、主權"], "a": 3, "ex": "爭的是「約旦河西岸、加薩走廊」這兩塊地＝領土；爭誰有權管這塊地＝主權。", "fig": [], "pas": null, "warn": null}, {"id": "113_43", "y": "113", "n": 43, "s": "公民", "q": "請問有關國家的敘述，下列何者正確？（甲）要成為我國國民，我國《國籍法》規定以屬地主義為主；（乙）領海是指領陸向外延伸 30 浬；（丙）國家擁有主權對外能與其他國家建立平等的國際關係；（丁）國家存在的目的會隨時代而改變", "o": ["甲乙", "乙丙", "丙丁", "甲丁"], "a": 2, "ex": "甲錯：我國國籍以屬人主義（血統）為主。乙錯：領海是 12 浬。丙對：主權讓國家對外平等獨立。丁對：古代國家只管打仗收稅，現代還要管福利、環保，目的會變。", "fig": [], "pas": null, "warn": null}, {"id": "113_44", "y": "113", "n": 44, "s": "公民", "q": "我國憲法於民國 35 年由制憲國民大會制定並經 7 次修憲，且其法條為廣義法律裡條文最（甲），代表我國憲法具有何種特性（乙）？請選出下列何者最正確？", "o": ["甲：最少；乙：最高性", "甲：最少；乙：原則性", "甲：最多；乙：固定性", "甲：最多；乙：原則性"], "a": 1, "ex": "憲法只寫大原則，細節交給法律，所以條文最少，這個特性叫「原則性」。", "fig": [], "pas": null, "warn": null}, {"id": "113_45", "y": "113", "n": 45, "s": "公民", "q": "幾位同學在下課時討論一則新聞報導，請問下列哪位同學的理解最正確？", "o": ["小梅：《原住民族狩獵管理辦法》為狹義法律", "小蘭：《原住民族基本法》由行政機關制定", "小竹：《原住民族狩獵管理辦法》與《原住民族教育法施行細則》兩者法律位階相同", "小菊：《原住民族狩獵管理辦法》及《原住民族基本法》兩者法律位階相同"], "a": 2, "ex": "看名字判斷：「法、律、條例、通則」是法律（立法院），「辦法、細則、規則、標準」是命令（行政機關）。辦法和施行細則都是命令，位階相同；基本法是法律，比辦法高。", "fig": [], "pas": "新聞：林務局一連兩天針對修正《原住民族狩獵管理辦法》舉辦座談會與說明會，其中有原民團體提出修正條文第 3 條中規定，狩獵範圍要依照《原住民族基本法》所定的原住民族地區內，且非屬依法禁止獵捕動物或捕捉魚類的區域，但實際狩獵範圍常常和國家公園法產生衝突，希望能訂定相關條文做協調。", "warn": null}, {"id": "113_46", "y": "113", "n": 46, "s": "公民", "q": "承上題，林務局針對修正《原住民族狩獵管理辦法》，舉辦座談會與說明會是何種民主政治的展現？", "o": ["責任政治", "民意政治", "法治政治", "政黨政治"], "a": 1, "ex": "政府開座談會、說明會，聽人民的意見再修法，就是民意政治。", "fig": [], "pas": "新聞：林務局一連兩天針對修正《原住民族狩獵管理辦法》舉辦座談會與說明會，其中有原民團體提出修正條文第 3 條中規定，狩獵範圍要依照《原住民族基本法》所定的原住民族地區內，且非屬依法禁止獵捕動物或捕捉魚類的區域，但實際狩獵範圍常常和國家公園法產生衝突，希望能訂定相關條文做協調。", "warn": null}, {"id": "113_47", "y": "113", "n": 47, "s": "公民", "q": "我國政府在新冠疫情嚴重期間，曾提供以下方案讓需要的民眾提出申請：因疫情請假或無法工作影響生計致生活陷困（符合嚴重特殊傳染性肺炎防治及紓困振興特別條例第 3 條第 5 項規定），補助 1 至 3 萬元。請問此是國家存在的何種功能？", "o": ["維護社會秩序", "重視社會福利", "提升國家競爭力", "提供人民安全的保障"], "a": 1, "ex": "政府發錢幫助生活困難的人，是照顧人民基本生活的「社會福利」功能。", "fig": [], "pas": null, "warn": null}, {"id": "113_48", "y": "113", "n": 48, "s": "公民", "q": "下列關於民主法治國家的敘述，哪些正確？（甲）政府須依法律行使職權；（乙）須以憲法限制人民權利；（丙）需透過定期選舉使政府執政具有合法性；（丁）民主國家中，政府的施政須向人民負責但無須向國會負責", "o": ["甲乙", "甲丙", "乙丁", "甲乙丙"], "a": 1, "ex": "甲對：依法行政。丙對：定期選舉給政府正當性。乙錯：憲法是用來限制「政府」、保障人民，不是限制人民。丁錯：政府也要向國會（立法院）負責，接受質詢和監督。注意：學校公布的解答是 C（乙丁），但乙、丁兩句和課本講的相反，這裡用 B。", "fig": [], "pas": null, "warn": "學校公布的解答是 C（乙丁），但那兩句和課本相反，這裡用 B（甲丙）；考前請拿這題問老師。"}, {"id": "113_49", "y": "113", "n": 49, "s": "公民", "q": "關於《公民投票法》的制定過程，其是由（甲）機關三讀通過後，（乙）公布的法律。請問下列何者正確？", "o": ["甲：司法院；乙：總統", "甲：司法院；乙：行政院長", "甲：立法院；乙：總統", "甲：立法院；乙：立法院長"], "a": 2, "ex": "法律一律由立法院三讀通過，再由總統公布。", "fig": [], "pas": "史上首次憲法修正案公民複決「18 歲公民權」於民國 111 年 11 月 26 日與九合一選舉同時投票。由於《公民投票法》早已將公民投票權年齡修訂為 18 歲，可參與公投決定國家政策的制定或修改，故此次修憲案的提出是希望能修改《憲法》，將選舉、罷免的投票年齡降為 18 歲。", "warn": null}, {"id": "113_50", "y": "113", "n": 50, "s": "公民", "q": "關於我國《憲法》的修正程序，下列敘述何者錯誤？", "o": ["司法機關提出修正案", "公告 6 個月", "公民投票複決", "有效同意票超過選舉人總額的半數"], "a": 0, "ex": "修憲案是由「立法院」提出（立委四分之一提議、四分之三出席、四分之三同意），不是司法機關。然後公告半年、公民複決、同意票要過選舉人總額一半。", "fig": [], "pas": "史上首次憲法修正案公民複決「18 歲公民權」於民國 111 年 11 月 26 日與九合一選舉同時投票。由於《公民投票法》早已將公民投票權年齡修訂為 18 歲，可參與公投決定國家政策的制定或修改，故此次修憲案的提出是希望能修改《憲法》，將選舉、罷免的投票年齡降為 18 歲。", "warn": null}, {"id": "114_01", "y": "114", "n": 1, "s": "地理", "q": "下圖為中國某地區為了適應環境而發展出來的防禦建築物，並在 2008 年 7 月正式列為世界文化遺產，請問此種建築多分布於何種地形？", "o": ["平原", "丘陵", "盆地", "高原"], "a": 1, "ex": "圖是福建土樓，客家人為了防盜匪蓋的圓形集合住宅，分布在閩西、粵東的丘陵山區。", "fig": ["114_q1"], "pas": null, "warn": null}, {"id": "114_02", "y": "114", "n": 2, "s": "地理", "q": "請根據下表判斷何者為副熱帶季風氣候？", "o": ["甲", "乙", "丙", "丁"], "a": 2, "ex": "副熱帶季風：最冷月在 0°C 以上、雨量多。甲、乙最冷月在 0°C 以下是溫帶；丁最冷月 19.2°C、雨 1823 mm 是熱帶季風。只剩丙（3.8°C）符合，雖然 675 mm 偏少，不太典型。", "fig": ["114_q2"], "pas": null, "warn": "AI 判讀為 C；丙的雨量偏少、數據不夠典型，若老師的答案不同以老師為準。"}, {"id": "114_03", "y": "114", "n": 3, "s": "地理", "q": "秦嶺、淮河為中國地理重要的分界線，請問下列何者關於秦嶺、淮河的敘述正確？", "o": ["年降水量 500mm 等雨量線通過", "最暖月 0°C 等溫線通過", "溫帶和熱帶的分界", "南稻北麥的分界線"], "a": 3, "ex": "秦嶺淮河＝800 mm 等雨量線（不是 500）、一月（最冷月）0°C 等溫線（不是最暖月）、溫帶與副熱帶的分界（不是熱帶）、稻麥分界。", "fig": [], "pas": null, "warn": null}, {"id": "114_04", "y": "114", "n": 4, "s": "地理", "q": "下圖為中國地區某季節的地面天氣圖，請問下列選項和此季節的關聯性最小？", "o": ["此時氣溫主要受緯度影響", "氣候溫暖是作物主要的生長季節", "沿海地區可能有颱風發生", "是主要的降水季節"], "a": 0, "ex": "圖中吹東南、西南季風，陸地是低氣壓，這是夏天。夏天全中國都熱、南北溫差小；「氣溫主要受緯度影響、南北差很大」是冬天的特色。", "fig": ["114_q4"], "pas": null, "warn": null}, {"id": "114_05", "y": "114", "n": 5, "s": "地理", "q": "中國有四個省級單位，其中哪一個是為了少數民族所設立的？", "o": ["省", "直轄市", "自治區", "特別行政區"], "a": 2, "ex": "自治區是為少數民族設的，像新疆維吾爾、西藏、內蒙古、寧夏回族、廣西壯族。", "fig": [], "pas": null, "warn": null}, {"id": "114_06", "y": "114", "n": 6, "s": "地理", "q": "下圖為中國三個城市的年降水量圖，根據中國降水分布特性，請問：由東南向西北排列，其順序應為：", "o": ["甲丙乙", "乙甲丙", "甲乙丙", "丙甲乙"], "a": 1, "ex": "降水由東南向西北遞減，所以由多排到少：乙（1736 mm）→ 甲（316 mm）→ 丙（34 mm）。", "fig": ["114_q6"], "pas": null, "warn": null}, {"id": "114_07", "y": "114", "n": 7, "s": "地理", "q": "依照地形高度的差異，中國地形可分為三級階梯，中部次高地形階梯主要以下列哪兩種地形為主？", "o": ["甲、丙", "甲、丁", "乙、丙", "乙、丁"], "a": 2, "ex": "第二階梯以高原和盆地為主。乙中間低、四周高＝盆地；丙高處平坦＝高原。甲是丘陵、丁是平原，屬於第三階梯。", "fig": ["114_q7"], "pas": null, "warn": null}, {"id": "114_08", "y": "114", "n": 8, "s": "地理", "q": "下圖為中國人口分布圖。由圖中可知中國人口主要分布於黑河和騰衝連線的東南半部，西半部人口稀疏，請問造成此種現象的原因和何者關係最小？", "o": ["傳統產業", "政府政策", "地勢高低", "降水多寡"], "a": 1, "ex": "東密西疏是自然環境造成的：西部地勢高、雨水少，傳統農業做不起來。和政府政策關係最小，政府反而在推西部大開發想把人拉過去。", "fig": ["114_q8"], "pas": null, "warn": null}, {"id": "114_09", "y": "114", "n": 9, "s": "地理", "q": "中國近年來「高聘金」、「光棍村」等社會現象，反映出男女性別嚴重失衡的狀況，出現此種現象的主要原因最可能是下列何者？", "o": ["適婚女性多嫁到其他國家", "生育率普遍降低", "政府實施一胎化", "不婚主義盛行"], "a": 2, "ex": "一胎化加上重男輕女，只能生一個就想生男的，造成男多女少，男生找不到老婆。", "fig": [], "pas": null, "warn": null}, {"id": "114_10", "y": "114", "n": 10, "s": "地理", "q": "承上題，下表為中國在不同時期所實施的人口政策，請問何者是為了改善「高聘金」、「光棍村」等社會現象？", "o": ["甲", "乙", "丙", "丁"], "a": 3, "ex": "「男孩女孩一樣好」是在扭轉重男輕女、改善性別失衡的宣導。鼓勵生育、一胎化、開放二胎都是在調整人口「數量」。", "fig": ["114_q10"], "pas": null, "warn": null}, {"id": "114_11", "y": "114", "n": 11, "s": "地理", "q": "上海（北緯 31 度）、拉薩（北緯 29 度），兩者緯度接近，但是最暖月月均溫卻有明顯差異，請問造成此種現象的主要原因為何？", "o": ["經度位置", "地勢高低", "距海遠近", "盛行風向"], "a": 1, "ex": "拉薩在青藏高原上，海拔 3600 公尺，每升高 1000 公尺氣溫降 6°C，所以夏天也涼。", "fig": [], "pas": null, "warn": null}, {"id": "114_12", "y": "114", "n": 12, "s": "地理", "q": "阿福參加中國蒙古特色之旅，體驗當地文化，請問下列的敘述何者最不可能發生？", "o": ["換上穿脫方便的袍子", "肉食愛好者的天堂，少見本地蔬菜", "為了防風沙，居住在高架的干欄式建築", "騎乘駱駝欣賞大漠風光"], "a": 2, "ex": "干欄式建築是南方濕熱地區為了防潮、防蟲才架高的，蒙古乾燥，住的是蒙古包。袍子、肉食、駱駝都是草原、沙漠的生活。", "fig": [], "pas": null, "warn": null}, {"id": "114_13", "y": "114", "n": 13, "s": "地理", "q": "下圖分別為中國地區西元 1970 年及西元 2020 年的人口金字塔圖，由圖中的資訊可以知道由西元 1970 年到 2020 年的人口結構有什麼變化？", "o": ["扶養比下降，壯年人口負擔減輕", "出生率降低導致人口總數減少", "所得較低，人口外流嚴重", "加工業興起，社會增加率快速上升"], "a": 0, "ex": "幼年人口從 40.3% 降到 18.0%，壯年人口從 55.7% 升到 68.5%，被扶養的人變少、扶養比下降。金字塔只畫比例，看不出總數有沒有減少，B 錯。", "fig": ["114_q13"], "pas": null, "warn": null}, {"id": "114_14", "y": "114", "n": 14, "s": "地理", "q": "根據圖（一）回答：某地最暖月月均溫低於 20°C，氣候、植被呈垂直變化，請問以上敘述的氣候特徵最可能出現在圖中何處？", "o": ["F", "L", "I", "M"], "a": 3, "ex": "植被垂直變化、最暖月不到 20°C 是高地氣候。M 在橫斷山脈，高山深谷，就是這種氣候。", "fig": ["114_q14"], "pas": null, "warn": null}, {"id": "114_15", "y": "114", "n": 15, "s": "地理", "q": "天福宮為新加坡現存最早的媽祖廟；印尼最大的唐人街位於雅加達的草埔（Glodok），其中最知名的建築物金德院是當地最早的華人寺廟之一，這些廟宇反映早期華人移民東南亞時，將原鄉生活方式帶至新居地，請問這些華人祖先主要是來自圖中何處？", "o": ["E", "B", "G", "K"], "a": 3, "ex": "早期移民東南亞的華人多來自閩粵沿海，K 在武夷山以東的福建。", "fig": ["114_q14"], "pas": null, "warn": null}, {"id": "114_16", "y": "114", "n": 16, "s": "地理", "q": "右圖這種特殊的建築，房中常設置炕作為禦寒的睡床，請問此種建築最可能出現在圖中何處？", "o": ["F", "B", "G", "I"], "a": 0, "ex": "圖是窯洞，挖進黃土裡冬暖夏涼，分布在黃土高原，也就是圖中的 F。", "fig": ["114_q14", "114_q16"], "pas": null, "warn": null}, {"id": "114_17", "y": "114", "n": 17, "s": "地理", "q": "可可西里是高原野生動物的樂園，擁有大量的藏羚羊、野犛牛、野驢、雪豹等珍稀物種。2004 年的電影《可可西里》以真實事件為背景，描繪了巡山隊員與盜獵者搏鬥的場景，極大提升了公眾對可可西里生態保護的關注。請問可可西里位於圖中的哪一地區？", "o": ["C", "D", "E", "F"], "a": 0, "ex": "可可西里在青藏高原北部（崑崙山以南），藏羚羊、野犛牛都是高原動物；圖中 C 是青藏高原。", "fig": ["114_q14"], "pas": null, "warn": null}, {"id": "114_18", "y": "114", "n": 18, "s": "歷史", "q": "俊凱參觀博物館，看見一篇簡介：「毛公鼎，是西周宣王年間毛公後代、宣王的叔父毛公瘖為紀念宣王對自己的任命，以及告誡子孫所鑄造的青銅鼎，腹內刻有 500 字銘文，字數為舉世銘文青銅器中最多。是西周散文代表作，其書法也是銘文中最高等級，故有『青銅三寶』、『故宮三寶』之譽。」請問：以下有關西周的敘述何者是錯誤的？", "o": ["實行封建，將宗親與功臣分封到各地，拱衛王室", "強調宗法，依照血緣親疏，確立政治地位的尊卑", "禮樂制度下，鼎是祭祀、喪葬等儀式的重要器物", "周人首領曾受商王分封，隨著實力日益強盛，逐漸向西擴張，取代商朝成為黃河流域主要政權"], "a": 3, "ex": "周人原本住在西邊的渭水流域，是向「東」擴張滅掉商朝，不是向西。封建、宗法、禮樂三句都對。", "fig": ["114_q18"], "pas": null, "warn": null}, {"id": "114_19", "y": "114", "n": 19, "s": "歷史", "q": "下圖為封建與郡縣制度示意圖。下列有關圖中的說明，何者正確？", "o": ["圖一由周天子分封，將土地賜予諸侯；圖二是由地方選舉產生，並集中權力於中央", "圖一是周天子派諸侯擔任下屬，得以世襲；圖二是郡守派任下屬擔任，由中央直接統治地方", "圖一是天子分封土地給諸侯，身分得以世襲；圖二是秦始皇派任官員，與皇帝有血緣關係，不得世襲", "圖一是周天子分封諸侯，諸侯得以世襲；圖二是皇帝派任官員，將郡縣制推行到全國，強化中央集權"], "a": 3, "ex": "封建＝天子分封、諸侯世襲；郡縣＝皇帝派官、不世襲、中央集權。A 錯在「選舉」，B 錯在「下屬」和「郡守派任」，C 錯在「與皇帝有血緣」。", "fig": ["114_q19"], "pas": null, "warn": null}, {"id": "114_20", "y": "114", "n": 20, "s": "歷史", "q": "隨著 AI 技術的發展，現代求職網站運用「智能履歷分析系統」，可透過關鍵字辨識，推薦具備特定條件的人才。古代中國也有各自的任用官員的標準與選擇方式。請問：從秦漢到隋唐選才方式的演變，下列何者正確？", "o": ["熟悉法令規章的人才 → 察舉 → 科舉考試 → 九品官人法", "熟悉法令規章的人才 → 察舉 → 九品官人法 → 科舉考試", "察舉 → 熟悉法令規章的人才 → 九品官人法 → 科舉考試", "熟悉法令規章的人才 → 九品官人法 → 科舉考試 → 察舉"], "a": 1, "ex": "秦重用懂法令的官吏 → 漢察舉 → 魏晉九品官人法 → 隋唐科舉。", "fig": [], "pas": null, "warn": null}, {"id": "114_21", "y": "114", "n": 21, "s": "歷史", "q": "「十年寒窗無人問，一舉成名天下知」，中國的科舉制度實施了一千多年，不失為一種公平的選才方式。請問：關於科舉制度的實施與影響，下列何者錯誤？", "o": ["使世族得以長期壟斷官職，有土地和減免賦稅的特權", "實施的背景是為了抑制世家大族的政治社會利益", "隋朝開始實施科舉制度，成為選拔官員的重要管道", "平民因此得以參加政府運作，促進社會階級的流動"], "a": 0, "ex": "世族長期壟斷官職是「九品官人法」造成的；科舉剛好相反，是用考試打破世族壟斷，讓平民有機會。", "fig": [], "pas": null, "warn": null}, {"id": "114_22", "y": "114", "n": 22, "s": "歷史", "q": "東漢末年天下大亂，曹魏時期為了解決戰亂徵才困難的狀況而制定了新政策，在各郡設置中正官，挑選各地賢能者，根據才學、德行與家世背景表現來拔擢人才，但也因此出現了許多特殊的社會現象。下列哪一段敘述最適合描述此時期的社會現象？", "o": ["貴族沒落，平民崛起，布衣可為卿相", "國際競爭激烈，各國富國強兵", "察舉孝子廉吏，由中央查核任官", "上品無寒門，下品無世族"], "a": 3, "ex": "中正官品評＝九品官人法，後來只看家世，造成「上品無寒門，下品無世族」。A 是戰國，B 是春秋戰國，C 是漢代察舉。", "fig": [], "pas": null, "warn": null}, {"id": "114_23", "y": "114", "n": 23, "s": "歷史", "q": "附圖是一張歷史發展圖表，由表中的曲線分布來加以判斷，此圖表的名稱應該是下列何者？", "o": ["封建制度興衰示意圖", "社會階層流動示意圖", "世族興衰趨勢示意圖", "科舉考試名額示意圖"], "a": 2, "ex": "曲線在東漢開始升、魏晉南北朝最高、隋唐以後掉下來，這是世族的興衰：察舉讓大家族興起，九品官人法讓他們最盛，科舉之後沒落。", "fig": ["114_q23"], "pas": null, "warn": null}, {"id": "114_24", "y": "114", "n": 24, "s": "歷史", "q": "欣瑜在一集電視專題報導節目中，看見主持人介紹著名壁畫〈酒神的狂女邁那得斯〉，內容如下：「現存於義大利羅馬的壁畫〈酒神的狂女邁那得斯〉繪於西元前 1 世紀，圖中邁那得斯身著來自中國的絲綢，輕盈飄逸。該壁畫除了顯示絲綢在當地十分風靡，也體現隨著中國對域外的探索日趨積極，而這條路徑上往來的行商與旅人也牽起中西物質、文化交流。」根據內文判斷，如果她繼續觀看此專題節目，最可能看見下列哪段關於該路徑的敘述？", "o": ["西周實施分封制，並設立絲路以推廣禮樂制度，促進對外文化傳播", "秦始皇焚書坑儒、阻絕對外交通，直到魏晉時才首次出使西域開通絲路", "漢武帝開啟與西域的交流，唐代社會則呈現多元融合與胡風時尚流行", "魏晉南北朝強調胡漢融合，社會平等開放，促使中西文化交流日益興盛"], "a": 2, "ex": "這條路是絲路：漢武帝派張騫通西域開通，到唐代胡風大流行。A、B 的年代錯；D 的「社會平等」錯，魏晉南北朝門第分得很嚴。", "fig": [], "pas": null, "warn": null}, {"id": "114_25", "y": "114", "n": 25, "s": "歷史", "q": "西元 311 年發生的「永嘉之禍」是中國歷史上重要的事件，因為朝廷的腐敗，讓外族有機可乘，造成國家的敗亡。請問：這個事件應該處於附圖中的哪一個時間點？", "o": ["甲", "乙", "丙", "丁"], "a": 2, "ex": "永嘉之禍（311 年）發生在西晉末年，之後西晉滅亡、東晉南渡。圖上丙剛好在西晉和東晉的交界。", "fig": ["114_q25"], "pas": null, "warn": null}, {"id": "114_26", "y": "114", "n": 26, "s": "歷史", "q": "下圖為某一時期胡人遷徙圖：中國對境外民族遷徙至邊境和內地者，通稱為「胡」，圖中胡人內徙對日後中國政治社會發展有何影響？", "o": ["引發犬戎之禍，周王室因此東遷", "開始修築長城，試圖阻隔胡漢衝突", "北方中原人士相繼南遷，造成人口南移", "徵調南方人到北方平亂，造成南方人口流失"], "a": 2, "ex": "匈奴、鮮卑、羯、氐、羌搬進北方之後，爆發永嘉之禍，北方人大量逃到長江流域，人口南移、江南開發。犬戎是西周的事，長城是東周、秦的事。", "fig": ["114_q26"], "pas": null, "warn": null}, {"id": "114_27", "y": "114", "n": 27, "s": "歷史", "q": "老師為了今日授課的主題，在黑板上畫了一幅形勢圖，由附圖中判斷，老師講述的內容可能是下列何者？", "o": ["東周群雄並起的局勢", "北魏的漢化政策", "經濟中心的北移", "永嘉之禍的南侵"], "a": 1, "ex": "圖上北魏從平城（舊都）遷到洛陽（新都），這是孝文帝漢化政策的一步。", "fig": ["114_q27"], "pas": null, "warn": null}, {"id": "114_28", "y": "114", "n": 28, "s": "歷史", "q": "欣慧讀到一本傳記中提到：「他是東周時期的改革家，受到君主的重用後，積極為國家謀求富國強兵之法，在改革的過程中，試圖以家戶為單位，將人民納入地方戶籍管理。此外，獎勵耕織，又頒布法令，要求貴族與平民都應遵守。在他的改革下，使國家日趨富強。」請問：依據上述說明，此本傳記最有可能為何？", "o": ["《劉邦傳》", "《商鞅傳》", "《嬴政傳》", "《孔子傳》"], "a": 1, "ex": "戰國時秦孝公用商鞅變法：編戶籍、獎勵耕織、法令一體遵守（連太子犯法也罰）。", "fig": [], "pas": null, "warn": null}, {"id": "114_29", "y": "114", "n": 29, "s": "歷史", "q": "由傳記中提及的內容可知，這位改革家試圖將人民納入戶籍管理，其背後的目的可能為何？", "o": ["藉此打擊不法分子", "迫使人民失去人身自由", "擴大國家所屬版圖", "便於掌控賦稅及勞動力"], "a": 3, "ex": "編戶齊民是為了把每個人記清楚，方便收稅、徵調勞役和兵役。", "fig": [], "pas": null, "warn": null}, {"id": "114_30", "y": "114", "n": 30, "s": "歷史", "q": "佛教不是中國的本土宗教，隨著與西域頻繁接觸，便傳到中國來。在政權交替和戰亂中，人們尋求心靈慰藉，傳播速度明顯提升。以下為佛教傳播路線圖。請問：從圖中可以觀察出，佛教起源於何處？", "o": ["阿拉伯", "朝鮮", "印度", "中國"], "a": 2, "ex": "問號的位置在印度半島，所有箭頭都從那裡出發，佛教就是從印度向外傳的。", "fig": ["114_q30"], "pas": null, "warn": null}, {"id": "114_31", "y": "114", "n": 31, "s": "歷史", "q": "筱雯閱讀一本介紹日本歷史發展的書籍，內容如下：「日本曾多次派人前往中國學習。西元 645 年，孝德天皇頒布《改新之詔》，決定效法中國體制成立中央集權，並把崇神敬佛觀念、建築、文字、律令等文化帶回日本，對日後發展產生深遠影響。」請問：日本的改革運動歷史上被稱為什麼？", "o": ["明治維新", "大正革新", "大化革新", "昭和革新"], "a": 2, "ex": "645 年孝德天皇仿唐制的改革叫大化革新。明治維新是 19 世紀學西方的事。", "fig": [], "pas": null, "warn": null}, {"id": "114_32", "y": "114", "n": 32, "s": "歷史", "q": "玄奘為尋求更完整的佛教經典，西行求法。一路經新疆、阿富汗、喀什米爾，總共在外 19 年，帶回 657 部佛經，並將所得經典翻譯成漢文，豐富了中國的佛教思想。請問：玄奘所處的時代背景應為下列何者？", "o": ["周天子勢力衰微，中央全力鬆綁", "張騫出使西域，歐亞交通暢通", "秦始皇修築長城，陸上貿易安全", "唐朝風氣開放，宗教交流頻繁"], "a": 3, "ex": "玄奘是唐太宗時代的人，唐朝風氣開放、宗教交流頻繁。", "fig": [], "pas": null, "warn": null}, {"id": "114_33", "y": "114", "n": 33, "s": "歷史", "q": "請根據附圖回答：有關圖中的箭頭標示，我們可以有以下何種解讀？", "o": ["唐文化傳播的路徑", "唐朝人口遷徙的方向", "唐朝對外戰爭的路線", "唐朝商人的貿易路徑"], "a": 0, "ex": "箭頭從長安指向新羅、日本、安南，這些都是學唐朝文化的國家，表示唐文化向外傳播。", "fig": ["114_q33"], "pas": null, "warn": null}, {"id": "114_34", "y": "114", "n": 34, "s": "歷史", "q": "承上題，唐代與周邊國家交流頻繁，請問：下列哪一項物品是唐朝的輸出品？", "o": ["葡萄酒", "胡旋舞", "琵琶", "造紙術"], "a": 3, "ex": "造紙術是中國的發明，唐代經怛羅斯之戰傳到阿拉伯。葡萄酒、胡旋舞、琵琶都是從西域傳「進來」的。", "fig": ["114_q33"], "pas": null, "warn": null}, {"id": "114_35", "y": "114", "n": 35, "s": "公民", "q": "武仁熱愛永春拳，他代表武術館去參加分組比賽；在比賽過程中，他發現有幾個外國人，其中有人不具本國籍。請你選出底部畫線者，何人沒有我國國籍？", "o": ["「喬丹」於今年首次投公投票，隨澳籍父親來台開餐館 7 年", "「李恭」14 歲，原住在日本，父母離婚後，隨母親回到鹿港娘家住", "「岳動現」8 歲，隨泰籍的父母親來台工作三年；其爸媽愛上台灣美食，今年才要申請移民", "「蔡思」13 歲，父母原為美國籍，但在他 6 歲時，父母就都有我國身分證"], "a": 2, "ex": "岳動現父母都是泰國籍、只是來工作、還沒申請歸化，他沒有我國國籍。喬丹能投公投表示有國籍；李恭媽媽是鹿港人，依血統取得；蔡思未成年時父母歸化，可以一起取得。", "fig": [], "pas": null, "warn": null}, {"id": "114_36", "y": "114", "n": 36, "s": "公民", "q": "釣魚臺列嶼由五個無人島與三個岩礁組成，其中最大島亦稱釣魚臺，面積 4.3838 平方公里。目前全都無人居住，但卻是我國、日本與中華人民共和國紛爭的重要之地。請問釣魚台列嶼歸屬於何國，其最主要決定關鍵在於何項國家組成要素？", "o": ["人民", "領土", "政府", "主權"], "a": 3, "ex": "一塊地歸誰，看的是哪一國對它擁有「主權」（管轄權）。", "fig": [], "pas": null, "warn": null}, {"id": "114_37", "y": "114", "n": 37, "s": "公民", "q": "項飛自幼家住機場邊，熱愛飛機模型，長大立志要成空軍，駕馭戰鬥機翱翔於空中，保家衛國！他了解他國戰鬥機飛行至我國領空，必須即刻採取防衛。請依下圖代號，選出正確的領空是指何處向上延伸 100 公里的範圍？", "o": ["甲＋乙", "乙＋丙", "甲＋乙＋丙", "乙＋丙＋丁"], "a": 0, "ex": "領空＝領陸（甲）和領海（乙，12 浬內）的上空。丙（12～200 浬）是經濟海域，丁是公海，它們的上空不是領空。", "fig": ["114_q37"], "pas": null, "warn": null}, {"id": "114_38", "y": "114", "n": 38, "s": "公民", "q": "民主國家政府的施政，應該以民意為依歸，符合人民需求，始能持續執政。而人民也可以透過某些方式向政府傳達民意，請問下列哪些是合法的傳達方式？（甲）對於電力不足，經常跳電，陳情電力分配不公要求改善（乙）關於如何處理廢水處理後，其再利用價值，參加公聽會（丙）直接開卡車到立法院前，撒冥紙傾倒小碎石，要求立法保障司機工作權（丁）到總統府前示威遊行，表達購屋之難。正確的是：", "o": ["甲乙丙", "乙丙丁", "甲丙丁", "甲乙丁"], "a": 3, "ex": "陳情、公聽會、依法申請的示威遊行都合法；撒冥紙、倒碎石是違法行為。", "fig": [], "pas": null, "warn": null}, {"id": "114_39", "y": "114", "n": 39, "s": "公民", "q": "賈勇因失業半年多，這晚經過公園，看見一名少婦背著名牌包、手戴名錶，尾隨其後；趁其進入暗巷後，搶奪其皮包和手錶，婦人大叫「搶劫」！有居民聽到，立即報警，結果賈勇於 2 小時後落網。請問警察在我們國家擔任何種重要功能？", "o": ["保障安全", "伸張正義", "保障人權", "維護秩序"], "a": 3, "ex": "警察打擊犯罪、維持治安，是「維護秩序」。「保障安全」通常指國防抵禦外敵。", "fig": [], "pas": null, "warn": null}, {"id": "114_40", "y": "114", "n": 40, "s": "公民", "q": "曾正義騎機車經過老街，遠遠看見有人搶走了坐輪椅的身障者所販售的彩券，立即騎車狂追該名搶匪且將他制伏，並報警處理。該販賣者到警局時指證該名搶匪，且非常感謝曾正義見義勇為的精神。曾正義雖然不是警察，但可以逮住搶匪，將他綁住。請問上述畫線部分，曾正義並未妨害搶匪的自由；其下列何項自由權最相關？", "o": ["秘密通訊自由", "表現自由", "人身自由", "結社自由"], "a": 2, "ex": "抓人、綁人牽涉的是「人身自由」。法律規定現行犯任何人都可以逮捕，所以曾正義沒有妨害他的人身自由。", "fig": [], "pas": null, "warn": null}, {"id": "114_41", "y": "114", "n": 41, "s": "公民", "q": "有四位國一生，正在複習法律效力的高低，他們各自舉出一例，其效力由低至高排列；但只有一人舉例是正確，請你選出來。", "o": ["梅根：條例 ＜ 細則 ＜ 憲法", "玉如：辦法 ＜ 通則 ＜ 憲法增修條文", "夏奇：通則 ＜ 條例 ＜ 憲法", "王倫：綱要 ＜ 憲法增修條文 ＜ 標準"], "a": 1, "ex": "辦法是命令、通則是法律、憲法增修條文是憲法，由低到高排對了。梅根：條例是法律、細則是命令，順序顛倒；夏奇：通則和條例都是法律，同一層；王倫：標準是命令，不能排在憲法上面。", "fig": [], "pas": null, "warn": null}, {"id": "114_42", "y": "114", "n": 42, "s": "公民", "q": "我國憲法用來約束政府權力，以及保障人民權利，不能輕易更動，其修改程序較為複雜與困難。此代表我國憲法的何項特性？目前憲法由何機構提出修改？", "o": ["最高性、憲法法庭", "原則性、國民大會", "固定性、立法院", "最高性、司法院"], "a": 2, "ex": "不容易修改＝固定性。現在修憲案由立法院提出，再交公民複決（國民大會已經廢除）。", "fig": [], "pas": null, "warn": null}, {"id": "114_43", "y": "114", "n": 43, "s": "公民", "q": "我國於今年 8 月 23 日實施公投，其公投主文為「您是否同意第三核能發電廠經主管機關同意確認無安全疑慮後，繼續運轉？」，雖然投票結果是未通過，但至少人民表達對此事的認同度。我國制定公民投票法是落實憲法中人民的何種權利？", "o": ["複決權與創制權", "請願權與訴願權", "選舉權與罷免權", "罷免權與複決權"], "a": 0, "ex": "公投可以由人民提出法案（創制）或對法案表決（複決），公民投票法就是在落實創制、複決權。選舉罷免是對「人」，公投是對「事」。", "fig": [], "pas": null, "warn": null}, {"id": "114_44", "y": "114", "n": 44, "s": "公民", "q": "曹勝的父母親期盼他長大成人後，能到公家機關上班，他自己也希望成為家喻戶曉的人，能為民喉舌！請問曹勝可以採取何種合法方式成為公職人員？（甲）進入豪門，結交高官，走後門（乙）出來參加競選，選舉獲勝（丙）參加考試院舉辦的考試（丁）關說總統，為他安插要職。正確的是：", "o": ["甲乙", "乙丙", "乙丙丁", "甲乙丙丁"], "a": 1, "ex": "當公職只有兩條合法的路：選舉（民選公職）或國家考試（考試院）。走後門、關說都不合法。", "fig": [], "pas": null, "warn": null}, {"id": "114_45", "y": "114", "n": 45, "s": "公民", "q": "朱雀家附近的超商，最近遭搶劫兩次；里長立馬跟公所申請經費，甚至自行募款；六個月後在朱雀附近的巷弄全都加裝 360 度的監視器。其中一座正在朱雀家客廳對面，讓朱雀全家感受到被監視，甚至全天候被錄影的感覺。請問公所加裝的監視器鏡頭朝向住家，明顯侵犯了居民的何種權利？", "o": ["文化權", "財產權", "生存權", "隱私權"], "a": 3, "ex": "鏡頭對著家裡、全天錄影，侵犯的是隱私權。", "fig": [], "pas": null, "warn": null}, {"id": "114_46", "y": "114", "n": 46, "s": "公民", "q": "請問簡丹號召一群與他政治理念相似者，成立了「辯護千鈞黨」，是屬於憲法保障人民的何項權利？該團體是依何法成立？", "o": ["參政權、人民團體法", "平等權、刑法", "結社自由、政黨法", "集會自由、政黨法"], "a": 2, "ex": "組政黨是「結社自由」（集會是臨時聚在一起，結社是成立長期的團體），政黨依《政黨法》成立。", "fig": [], "pas": "文章：簡丹自國中即經常和父親收看政論節目，高中時也常和同學朋友討論一些國家政策的影響。大學時更是常常去參加政論節目，而且於政府平台上留言。大四畢業後考上律師，28 歲時即號召政治理念相似者，成立了「辯護千鈞黨」；除了為民眾處理訴訟事件外，更立志要成為立法院的一員，為人民謀福利，認真監督國家重要的官員。", "warn": null}, {"id": "114_47", "y": "114", "n": 47, "s": "公民", "q": "檢種為了減重，每天下班後都騎 YouBike 去健身中心運動。但他多次收到轎車違停罰單，他家根本沒有轎車，他也去相關機構申訴，但仍舊收到罰單。他打電話去問簡丹該如何處理。如果你是簡丹，依照法律程序，你會建議檢種實施的權利救濟方式是？", "o": ["提出請願", "提出行政訴訟", "提出刑事訴訟", "請他直接繳罰單"], "a": 1, "ex": "罰單是行政處分，向行政機關申訴沒用之後，就去行政法院提行政訴訟。請願沒有法律拘束力；刑事訴訟是告犯罪用的。", "fig": [], "pas": "文章：簡丹自國中即經常和父親收看政論節目，高中時也常和同學朋友討論一些國家政策的影響。大學時更是常常去參加政論節目，而且於政府平台上留言。大四畢業後考上律師，28 歲時即號召政治理念相似者，成立了「辯護千鈞黨」；除了為民眾處理訴訟事件外，更立志要成為立法院的一員，為人民謀福利，認真監督國家重要的官員。", "warn": null}, {"id": "114_48", "y": "114", "n": 48, "s": "公民", "q": "藉由文章內容我們可以瞭解國家與政府有何差異，請問下列四位的敘述，何者是錯誤的？", "o": ["國家擁有公權力，捍衛自己領土完整", "多數民主國家主權在民，可以決定領導人選", "政府權力來自人民授權，代為處理公共事務，權非永恆", "國家對內可以自主決定所有政策"], "a": 0, "ex": "公權力是「政府」代表國家行使的，國家擁有的是「主權」。B 主權在民、C 政府權力來自人民且會換、D 主權對內最高，這三句都對。這題四句都很像課本用語，AI 判讀為 A。", "fig": [], "pas": "文章：簡丹自國中即經常和父親收看政論節目，高中時也常和同學朋友討論一些國家政策的影響。大學時更是常常去參加政論節目，而且於政府平台上留言。大四畢業後考上律師，28 歲時即號召政治理念相似者，成立了「辯護千鈞黨」；除了為民眾處理訴訟事件外，更立志要成為立法院的一員，為人民謀福利，認真監督國家重要的官員。", "warn": "AI 判讀為 A，但四句都接近課本用語，不是很確定；考前請問老師。"}, {"id": "114_49", "y": "114", "n": 49, "s": "公民", "q": "前烏克蘭總統亞努科維奇，因試圖暴力鎮壓示威群眾失敗，隨即逃亡俄國。因此被判叛國罪遭烏克蘭政府剝奪頭銜及通緝。請問烏克蘭前總統被判叛國罪，是屬於何項民主國家的政治特色？", "o": ["政黨政治", "法律責任", "政治責任", "政黨輪替"], "a": 1, "ex": "被「判罪」是違法受司法制裁，屬於法律責任。被議會罷免、下台才是政治責任。", "fig": [], "pas": "補充資料：亞努科維奇是前烏克蘭親俄派政治人物，曾任烏克蘭第四任總統並兩度出任總理，現因叛國罪遭剝奪總統頭銜及通緝。2013 年末，他在俄國壓力下違背競選承諾、拒絕和歐盟簽訂協定，引發大規模政治危機。在試圖暴力鎮壓示威失敗後，他於 2014 年 2 月 21 日逃亡至俄羅斯，並隨即被烏克蘭議會投票罷免。之後普丁藉他之名派兵占領克里米亞半島，爆發俄烏戰爭。", "warn": null}, {"id": "114_50", "y": "114", "n": 50, "s": "公民", "q": "現任烏克蘭總統澤連斯基於 2019 年 4 月當選，從俄烏戰爭爆發至今，誓與所有烏克蘭軍民同一陣線外，且多次到他國拜訪尋求協助。期間也與美國總統川普協談，希望透過美國調停俄烏戰爭。其所為在在顯示他希望國家安然無恙；請問國家功能中保障安全最主要依靠什麼？（甲）拓展外交，獲得協助（乙）強而有力不退縮的軍隊（丙）廣大的領土範圍，及堅固的城牆（丁）提升人民文化水準，積極推動移民政策。正確的是：", "o": ["甲乙", "乙丙", "甲乙丙", "甲乙丙丁"], "a": 0, "ex": "保障國家安全靠外交和國防。現代戰爭裡城牆、領土大小不是關鍵；文化水準和移民政策跟國家安全沒直接關係。", "fig": [], "pas": "補充資料：亞努科維奇是前烏克蘭親俄派政治人物，曾任烏克蘭第四任總統並兩度出任總理，現因叛國罪遭剝奪總統頭銜及通緝。2013 年末，他在俄國壓力下違背競選承諾、拒絕和歐盟簽訂協定，引發大規模政治危機。在試圖暴力鎮壓示威失敗後，他於 2014 年 2 月 21 日逃亡至俄羅斯，並隨即被烏克蘭議會投票罷免。之後普丁藉他之名派兵占領克里米亞半島，爆發俄烏戰爭。", "warn": null}]};

const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,8);
let DEV = "", SID = uid();
try { DEV = localStorage.getItem("n8v5-dev") || ""; if (!DEV){ DEV = uid().slice(-6); localStorage.setItem("n8v5-dev", DEV); } } catch(e){ DEV = "nostore"; }
const LOGQ = "n8v5-socexam-logq"; let LQ = [];
try { LQ = JSON.parse(localStorage.getItem(LOGQ)||"[]") || []; } catch(e){}
function saveLQ(){ try{ localStorage.setItem(LOGQ, JSON.stringify(LQ)); }catch(e){} }
function logEv(ev){
  LQ.push(Object.assign({id:uid(), ts:Date.now(), dev:DEV, sid:SID, v:BUILD}, ev));
  if (LQ.length > 2000) LQ = LQ.slice(-2000);
  saveLQ(); clearTimeout(logEv.t); logEv.t = setTimeout(flushLog, 3000);
}
let flushing = false;
async function flushLog(leaving){
  if (!LOG_URL || flushing || !LQ.length || navigator.onLine === false) return;
  flushing = true;
  const batch = LQ.slice(0, leaving ? 30 : 200);
  try {
    const r = await fetch(LOG_URL, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify({app:D.app, events:batch}), redirect:"follow", keepalive:!!leaving});
    const j = await r.json();
    if (j && j.ok){ const done = new Set(batch.map(e=>e.id)); LQ = LQ.filter(e=>!done.has(e.id)); saveLQ(); flushing=false; if (LQ.length && !leaving) return flushLog(); }
  } catch(e){}
  flushing = false;
}
window.addEventListener("online", ()=>flushLog());
document.addEventListener("visibilitychange", ()=>{ if (document.visibilityState==="hidden") flushLog(true); });
setTimeout(()=>flushLog(), 2000);

/* ───────── 小工具 ───────── */
const $ = (s,el=document)=>el.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const app = $("#app");
const Q = Object.fromEntries(D.questions.map(q=>[q.id,q]));
const SUBJ = D.subj;                       // [["地理",1,17],["歷史",18,34],["公民",35,50]]
const TAGC = {"地理":"g","歷史":"h","公民":"c"};
const paperOf = y => D.papers.find(p=>p.y===y);
const qsOf = (y, s) => D.questions.filter(q=>q.y===y && (!s || s==="all" || q.s===s));
const srcOf = q => `${q.y} 學年 第 ${q.n} 題`;
const tagOf = q => `<span class="tag ${TAGC[q.s]||""}">${q.s}</span>`;
function page(title, body, back){
  const home = back===undefined ? `<button class="home" onclick="location.href='./'">↩ 回英文站</button>` : `<button class="home" onclick="location.hash='#/'">🏠 首頁</button>`;
  app.innerHTML = `<header class="top">${back!==undefined?`<button class="back" onclick="location.hash='${back}'">←</button>`:""}<h1>${title}</h1>${home}</header>${body}`;
  window.scrollTo(0,0);
}
const tile = (ic,name,desc,href,cls="") => `<button class="tile ${cls}" onclick="location.hash='${href}'"><span class="ic">${ic}</span><b>${name}</b><small>${desc}</small></button>`;
const scoreTxt = k => { const r=S.done[k]; return r? `上次 ${r.ok}/${r.n}` : ""; };

/* ═════════ 首頁 ═════════ */
function vHome(){
  const nW = Object.keys(S.wrong).filter(id=>S.wrong[id]>0 && Q[id]).length;
  page("社會段考原題", `<p class="sub">112～114 學年八年級第一次段考，地理・歷史・公民三科，三年共 150 題。一次寫一份考卷，或挑一科跨年度練；答錯馬上看解析，錯的會進錯題本。</p>
  <h2>一份一份寫</h2><div class="tiles">
    ${D.papers.map(p=>{ const r=S.done[p.y+"/all"]; return tile("📄", p.title+" 第一次段考", (r?`整份做過：${r.ok}/${r.n}。`:"50 題，地理・歷史・公民。")+p.note, `#/p/${p.y}`, r?"done":""); }).join("")}
  </div>
  <h2>挑一科跨年度練</h2><div class="tiles">
    ${SUBJ.map(([s])=>{ const n=D.questions.filter(q=>q.s===s).length; return tile({"地理":"🗺","歷史":"🏛","公民":"⚖️"}[s]||"📘", s+" 隨機 10 題", `三年共 ${n} 題，每次隨機抽 10 題`, `#/s/${s}`); }).join("")}
    ${tile("📕","錯題本",`${nW} 題（答對就離開錯題本）`,"#/wrong")}
  </div>
  <h2>看解析</h2><div class="tiles">
    ${D.papers.map(p=>tile("🔍", p.title+" 全部解析", "50 題逐題看答案和解析", `#/review/${p.y}`)).join("")}
    ${tile("↩","回英文站","回八上英文首頁","#/back")}
  </div>
  <p class="muted" style="font-size:12px;margin-top:24px">版本 ${BUILD}。進度存在這支手機裡。題目來自三年的段考考卷，圖表是從考卷裁下來的。</p>`);
}

/* ═════════ 一份考卷 ═════════ */
function vPaper(y){
  const p = paperOf(y); if (!p) return route("#/");
  const secBtn = (s, label) => { const k=`${y}/${s}`; const r=S.done[k]; const n=qsOf(y,s).length;
    return `<button class="btn ${s==="all"?"":"ghost"}" onclick="location.hash='#/q/${y}/${s}'">${label}（${n} 題）${r?`　上次 ${r.ok}/${r.n}`:""}</button>`; };
  page(p.title+" 第一次段考", `<div class="card"><p class="sub" style="margin-top:0">${esc(p.note)}</p>
    ${secBtn("all","整份 50 題照順序寫")}
    ${SUBJ.map(([s])=>secBtn(s, "只寫"+s)).join("")}
    <button class="btn ghost" onclick="location.hash='#/review/${y}'">不寫題，直接看全部解析</button></div>`, "#/");
}

/* ═════════ 寫題（即答即回饋）═════════ */
let QZ = null;
function startQuiz(opt){ QZ = Object.assign({i:0, ok:0, wrong:[], picked:null, qt:Date.now()}, opt); vQuizQ(); }
function figHTML(q){ return (q.fig||[]).map(f=>`<img class="fig" src="fig/soc_${f}.webp" alt="題目附圖" loading="lazy">`).join(""); }
function vQuizQ(){
  const qs=QZ.qs, i=QZ.i, q=qs[i];
  if (i>=qs.length) return vQuizEnd();
  const picked = QZ.picked;
  const prev = i>0 ? qs[i-1] : null;
  const showPas = q.pas && !(prev && prev.pas===q.pas);   // 題組文章只在第一題完整顯示，後面縮成可點開
  page(QZ.title, `<div class="sub">${i+1} / ${qs.length}<span class="muted" style="float:right;font-size:12px">${tagOf(q)}${esc(srcOf(q))}</span></div><div class="prog"><i style="width:${i/qs.length*100}%"></i></div>
  <div class="card">
  ${q.pas? (showPas? `<div class="pas">${esc(q.pas)}</div>` : `<details class="pas" style="padding:8px 12px"><summary style="cursor:pointer">📎 同一篇文章（點開再看一次）</summary><div style="margin-top:8px">${esc(q.pas)}</div></details>`) : ""}
  ${figHTML(q)}
  <p class="q">${esc(q.q)}</p>
  ${q.o.map((o,k)=>`<button class="opt ${picked===null?"":k===q.a?"ok":k===picked?"ng":""}" ${picked===null?"":"disabled"} onclick="pickOpt(${k})">(${"ABCD"[k]}) ${esc(o)}</button>`).join("")}
  ${picked===null?"":`<div class="verdict ${picked===q.a?"ok":"ng"}">${picked===q.a?"✅ 答對":"❌ 答錯，正確答案是 ("+"ABCD"[q.a]+")"}</div>
  ${q.warn?`<div class="warn">${esc(q.warn)}</div>`:""}
  <div class="ex">${esc(q.ex)}<span class="src">來源：${esc(srcOf(q))}・${esc(q.s)}${q.y==="114"?"（無官方解答）":""}</span></div>
  <button class="btn" onclick="QZ.i++;QZ.picked=null;QZ.qt=Date.now();vQuizQ()">${i+1<qs.length?"下一題 →":"看結果"}</button>`}
  </div>`, QZ.back);
}
function pickOpt(k){
  const q=QZ.qs[QZ.i]; if (QZ.picked!==null) return;
  QZ.picked=k; const ok = k===q.a;
  if (ok){ QZ.ok++; S.right[q.id]=(S.right[q.id]||0)+1; if (S.wrong[q.id]) S.wrong[q.id]=0; }
  else { QZ.wrong.push(q.id); S.wrong[q.id]=(S.wrong[q.id]||0)+1; }
  save();
  logAns({sec:QZ.title, qid:q.id, t:"mc", q:q.q, given:"ABCD"[k]+" "+q.o[k], ans:"ABCD"[q.a]+" "+q.o[q.a], ok:ok?1:0, ms:Date.now()-QZ.qt, from:srcOf(q)+" "+q.s});
  vQuizQ();
}
function vQuizEnd(){
  const n=QZ.qs.length;
  if (QZ.key){ S.done[QZ.key]={ok:QZ.ok, n, ts:Date.now()}; save(); }
  const bySubj = SUBJ.map(([s])=>{ const qs=QZ.qs.filter(q=>q.s===s); if(!qs.length) return ""; const ok=qs.filter(q=>!QZ.wrong.includes(q.id)).length; return `<span class="tag ${TAGC[s]}">${s} ${ok}/${qs.length}</span>`; }).join("");
  page(QZ.title, `<div class="card"><div class="big">${QZ.ok} / ${n}</div><p class="sub" style="text-align:center">${QZ.ok===n?"全對！":QZ.ok>=n*0.7?"不錯，錯的再看一次就穩了":"沒關係，錯的題目都進錯題本了，明天再練"}</p><p style="text-align:center;margin:0">${bySubj}</p></div>
  ${QZ.wrong.length?`<h2>這次錯的 ${QZ.wrong.length} 題</h2>${QZ.wrong.map(id=>{const q=Q[id];return `<div class="card"><div class="muted" style="font-size:12px">${tagOf(q)}${esc(srcOf(q))}</div>${figHTML(q)}<p style="margin:8px 0">${esc(q.q)}</p><div class="ex"><b>正確：(${"ABCD"[q.a]}) ${esc(q.o[q.a])}</b><br>${esc(q.ex)}</div></div>`;}).join("")}`:""}
  ${QZ.wrong.length?`<button class="btn" onclick="startQuiz({title:'再練剛才錯的', qs:${JSON.stringify(QZ.wrong)}.map(id=>Q[id]), back:'${QZ.back}'})">再練剛才錯的 ${QZ.wrong.length} 題</button>`:""}
  <button class="btn ghost" onclick="location.hash='${QZ.back}'">回上一頁</button>`, QZ.back);
}
function vQuizStart(y, s){
  const qs = qsOf(y, s); if (!qs.length) return route("#/");
  startQuiz({title:`${paperOf(y).title} ${s==="all"?"整份":s}`, qs, back:`#/p/${y}`, key:`${y}/${s}`});
}
function vSubj(s){
  const pool = D.questions.filter(q=>q.s===s); if (!pool.length) return route("#/");
  startQuiz({title:`${s} 隨機 10 題`, qs:shuffle(pool).slice(0,10), back:"#/"});
}
/* ═════════ 錯題本 ═════════ */
function vWrong(){
  const ids = Object.keys(S.wrong).filter(id=>S.wrong[id]>0 && Q[id]);
  page("錯題本", `<div class="card"><p class="sub" style="margin-top:0">${ids.length?`現在有 ${ids.length} 題。答對一次就離開錯題本。`:"錯題本是空的，去寫題吧。"}</p>${ids.length?`<button class="btn" id="go">練這 ${ids.length} 題</button>`:""}</div>
  ${ids.map(id=>`<div class="card" style="padding:12px 16px"><div class="muted" style="font-size:12px">${tagOf(Q[id])}${esc(srcOf(Q[id]))}・錯 ${S.wrong[id]} 次</div><div class="sub">${esc(Q[id].q)}</div></div>`).join("")}`, "#/");
  const b=$("#go"); if (b) b.onclick=()=>startQuiz({title:"錯題本", qs:shuffle(ids).map(id=>Q[id]), back:"#/wrong"});
}
/* ═════════ 全部解析 ═════════ */
function vReview(y){
  const p = paperOf(y); if (!p) return route("#/");
  const qs = qsOf(y);
  let lastPas = null;
  page(p.title+" 全部解析", `<p class="sub">${esc(p.note)} 點題目展開答案和解析。</p><div class="card" style="padding:4px 16px">
  ${qs.map(q=>{ const pas = q.pas && q.pas!==lastPas ? `<div class="pas" style="margin:8px 0">${esc(q.pas)}</div>` : ""; lastPas=q.pas;
    return `${pas}<details class="rv"><summary><span class="n">${q.n}.</span>${tagOf(q)}${esc(q.q)}</summary>${figHTML(q)}<ol class="list" type="A">${q.o.map((o,k)=>`<li style="${k===q.a?"color:var(--ok);font-weight:600":""}">${esc(o)}</li>`).join("")}</ol>${q.warn?`<div class="warn">${esc(q.warn)}</div>`:""}<div class="ex"><b>答案：(${"ABCD"[q.a]})</b>　${esc(q.ex)}</div></details>`; }).join("")}
  </div>`, "#/");
}

/* ═════════ 路由 ═════════ */
function route(h){
  if (h!==undefined && location.hash!==h){ location.hash=h; return; }
  const p=(location.hash||"#/").slice(2).split("/").map(decodeURIComponent);
  logEv({k:"view", page:"socexam/"+((location.hash||"#/").slice(2)||"home")});
  if (p[0]==="p") return vPaper(p[1]);
  if (p[0]==="q") return vQuizStart(p[1], p[2]||"all");
  if (p[0]==="s") return vSubj(p[1]);
  if (p[0]==="wrong") return vWrong();
  if (p[0]==="review") return vReview(p[1]);
  if (p[0]==="back") { location.href="./"; return; }
  vHome();
}
window.addEventListener("hashchange", ()=>route());
route();
</script>
</body>
</html>
